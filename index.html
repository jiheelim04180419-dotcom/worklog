// ─── Firebase Realtime Database helpers ────────────────────────────────────
let _fbUrl = null;

function getFbUrl() {
try { return localStorage.getItem(“wm_fb_url”) || null; } catch { return null; }
}
function setFbUrl(url) {
_fbUrl = url;
try { localStorage.setItem(“wm_fb_url”, url); } catch {}
}

async function fbGet(path) {
const base = _fbUrl || getFbUrl();
if (!base) return null;
try {
const r = await fetch(base + “/” + path + “.json”);
if (!r.ok) return null;
return await r.json();
} catch { return null; }
}

async function fbSet(path, value) {
const base = _fbUrl || getFbUrl();
if (!base) return false;
try {
const r = await fetch(base + “/” + path + “.json”, {
method: “PUT”,
headers: { “Content-Type”: “application/json” },
body: JSON.stringify(value),
});
return r.ok;
} catch { return false; }
}

// ─── Local storage fallback (for session + offline) ────────────────────────
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function lsDel(k)     { try { localStorage.removeItem(k); } catch {} }

async function sessionGet()    { return lsGet(“wm_session”, null); }
async function sessionSave(v)  { lsSave(“wm_session”, v); }
async function sessionRemove() { lsDel(“wm_session”); }

// Legacy window.storage compat (for loading old local data)
async function legacyGet(key) {
try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; } catch { return null; }
}

// Haversine distance (km) between two named locations, with road factor
function geoKm(a, b) {
const c1 = LOCATION_COORDS[a], c2 = LOCATION_COORDS[b];
if (!c1 || !c2) return null;
const R = 6371, toR = Math.PI / 180;
const dLat = (c2[0] - c1[0]) * toR;
const dLon = (c2[1] - c1[1]) * toR;
const h = Math.sin(dLat/2)**2 + Math.cos(c1[0]*toR)*Math.cos(c2[0]*toR)*Math.sin(dLon/2)**2;
return Math.round(2 * R * Math.asin(Math.sqrt(h)) * 1.28); // road factor 1.28
}

// Allowance formula (applied to total km — round trip or one-way for 출장)
function calcTravelAllowance(km) {
if (!km || km <= 0) return 0;
const deducted = Math.max(0, km - 50);
const m = deducted / 50;
const dec = m % 1;
const units = Math.floor(m) + (dec < 0.4 ? 0 : dec < 0.8 ? 0.5 : 1);
const before = units * 16;
return Math.max(before, before > 0 ? 10 : 0);
}

const ANNUAL_LEAVE_DAYS  = 20;

// Get the CURRENT leave year: most recent anniversary → next anniversary
function getCurrentLeaveYear(leaveStartDate) {
if (!leaveStartDate) return null;
const start = new Date(leaveStartDate + “T00:00:00”);
const now   = new Date();
let yearStart = new Date(start);
// advance year-by-year until next anniversary is in the future
while (true) {
const next = new Date(yearStart);
next.setFullYear(next.getFullYear() + 1);
if (next > now) break;
yearStart = next;
}
const yearEnd = new Date(yearStart);
yearEnd.setFullYear(yearEnd.getFullYear() + 1);
return { start: yearStart, end: yearEnd };
}

// Normalize old leave format → new format
function normLeave(lv, joinDate) {
const base = joinDate || today;
if (!lv) return { leaveStartDate: base, usedDays: 0, noLeave: false, rateHistory: [{ from: base, dailyRate: 0 }], usageRecords: [] };
const usageRecords = Array.isArray(lv.usageRecords) ? lv.usageRecords : [];

// Only count current leave year records
const yr = getCurrentLeaveYear(lv.leaveStartDate || base);
const yrStart = yr ? yr.start.toISOString().slice(0, 10) : “0000-01-01”;
const yrEnd   = yr ? yr.end.toISOString().slice(0, 10)   : “9999-12-31”;

const useRecs   = usageRecords.filter(r => (r.type||“use”) === “use” && r.date >= yrStart && r.date <= yrEnd);
const grantRecs = usageRecords.filter(r => r.type === “grant” && r.date >= yrStart && r.date <= yrEnd);
const usedDays  = Math.round(useRecs.reduce((s, r) => s + (+(r.days)||0), 0) * 100) / 100;
const grantDays = Math.round(grantRecs.reduce((s, r) => s + (+(r.days)||0), 0) * 100) / 100;

if (lv.leaveStartDate !== undefined || lv.noLeave) return { …lv, usedDays, grantDays, usageRecords };
return { leaveStartDate: base, usedDays, grantDays: 0, noLeave: false, rateHistory: [{ from: base, dailyRate: 0 }], usageRecords };

setState(s => ({ …s, rateHistory: […s.rateHistory, { from: today, dailyRate: s.rateHistory.at(-1)?.dailyRate || 0 }] }));

function DataBackup({ users, leaves, logs, persist }) {
const [expanded, setExpanded]         = useState(false);
const [importText, setImportText]     = useState(””);
const [importStatus, setImportStatus] = useState(””);
const [copied, setCopied]             = useState(false);

const exportData = () => {
const data = JSON.stringify({ users, leaves, logs, exportedAt: new Date().toISOString() }, null, 2);
const ta = document.createElement(“textarea”);
ta.value = data; document.body.appendChild(ta); ta.select();
document.execCommand(“copy”); document.body.removeChild(ta);
setCopied(true); setTimeout(() => setCopied(false), 2000);
};

const importData = () => {
try {
const parsed = JSON.parse(importText.trim());
if (!parsed.users || !parsed.leaves) { setImportStatus(“❌ 올바른 백업 데이터가 아닙니다.”); return; }
persist(parsed.users, parsed.logs || [], parsed.leaves);
setImportStatus(“✅ 복원 완료!”); setImportText(””);
setTimeout(() => setImportStatus(””), 2000);
} catch { setImportStatus(“❌ JSON 형식이 올바르지 않습니다.”); }
};

const fbUrl = getFbUrl();

return (
<div style={styles.backupBox}>
<div style={styles.backupHeader} onClick={() => setExpanded(p => !p)}>
<span style={styles.backupTitle}>💾 데이터 백업 / 복원</span>
<span style={{ fontSize: 12, color: “#888” }}>{expanded ? “▲” : “▼”}</span>
</div>
{expanded && (
<div style={{ paddingTop: 12 }}>
{fbUrl && (
<div style={{ background: “#f0f9f4”, border: “1.5px solid #34c98b”, borderRadius: 10, padding: “10px 14px”, marginBottom: 14 }}>
<p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: “#1a6644” }}>🔥 Firebase 연결됨 — 실시간 동기화 중</p>
<p style={{ margin: “2px 0 0”, fontSize: 10, color: “#888”, wordBreak: “break-all” }}>{fbUrl}</p>
<button style={{ marginTop: 8, fontSize: 11, color: “#f77”, background: “none”, border: “1px solid #f77”, borderRadius: 6, padding: “3px 8px”, cursor: “pointer”, fontFamily: “inherit” }}
onClick={() => { try { localStorage.removeItem(“wm_fb_url”); } catch {} window.location.reload(); }}>
Firebase 재설정
</button>
</div>
)}
<p style={styles.backupDesc}>코드 업데이트 후 데이터 복원용 백업이에요.</p>

{copied ? “✅ 클립보드에 복사됨!” : “📋 현재 데이터 복사 (백업)”}

)}
</div>
);

// ─── OSRM driving distance (meters) between two [lat,lng] points ──────────
async function fetchDrivingKm(coord1, coord2) {
try {
const url = `https://router.project-osrm.org/route/v1/driving/${coord1[1]},${coord1[0]};${coord2[1]},${coord2[0]}?overview=false`;
const res  = await fetch(url);
const data = await res.json();
if (data.code === “Ok”) return Math.round(data.routes[0].distance / 1000);
return null;
} catch { return null; }
}

async function geocodePlace(query) {
try {
const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + ", NSW, Australia")}&format=json&limit=1`;
const res  = await fetch(url, { headers: { “Accept-Language”: “en” } });
const data = await res.json();
if (data.length > 0) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
return null;
} catch { return null; }
}

const DAY_KO = [“일”,“월”,“화”,“수”,“목”,“금”,“토”];
function dayStr(dateStr) {
const d = new Date(dateStr + “T00:00:00”);
return dateStr.slice(5) + “(” + DAY_KO[d.getDay()] + “)”;
}
// Returns YYYY-MM-DD in LOCAL time (avoids UTC timezone shift)
function localDateStr(d) {
const y = d.getFullYear();
const m = String(d.getMonth()+1).padStart(2,“0”);
const dd = String(d.getDate()).padStart(2,“0”);
return y + “-” + m + “-” + dd;
}

function App() {
const [ready, setReady]       = useState(false);
const [session, setSession]   = useState(null);
const [users, setUsers]       = useState(SEED_USERS);
const [logs, setLogs]         = useState([]);
const [leaves, setLeaves]     = useState(SEED_LEAVES);
const [companies, setCompanies] = useState(SEED_COMPANIES);
const [tab, setTab]           = useState(“home”);

const [fbConfigured, setFbConfigured] = useState(false);
const pollRef = useRef(null);

const loadFromFb = async () => {
const [u, l, lv, co] = await Promise.all([
fbGet(“users”), fbGet(“logs”), fbGet(“leaves”), fbGet(“companies”),
]);
if (u)  setUsers(Array.isArray(u) ? u : Object.values(u));
if (l)  setLogs(Array.isArray(l) ? l : Object.values(l));
if (lv) setLeaves(lv);
if (co) setCompanies(Array.isArray(co) ? co : Object.values(co));
return !!(u || l || lv);
};

useEffect(() => {
(async () => {
const fbUrl = getFbUrl();
if (fbUrl) {
_fbUrl = fbUrl;
setFbConfigured(true);
await loadFromFb();
pollRef.current = setInterval(loadFromFb, 30000);
} else {
const u  = await legacyGet(“wm_users”)  || SEED_USERS;
const l  = await legacyGet(“wm_logs”)   || [];
const lv = await legacyGet(“wm_leaves”) || SEED_LEAVES;
setUsers(u); setLogs(l); setLeaves(lv);
}
setSession(await sessionGet());
setReady(true);
})();
return () => { if (pollRef.current) clearInterval(pollRef.current); };
}, []);

const saveFb = useCallback(async (u, l, lv, co) => {
const base = _fbUrl || getFbUrl();
if (!base) return;
if (u)  fbSet(“users”,    u);
if (l)  fbSet(“logs”,     l);
if (lv) fbSet(“leaves”,   lv);
if (co) fbSet(“companies”, co);
}, []);

const persist = useCallback(async (u, l, lv, co) => {
if (u)  { setUsers(u);      saveFb(u, null, null, null); }
if (l)  { setLogs(l);       saveFb(null, l, null, null); }
if (lv) { setLeaves(lv);    saveFb(null, null, lv, null); }
if (co) { setCompanies(co); saveFb(null, null, null, co); }
}, [saveFb]);

const updateLeaveUsage = useCallback((userId, joinDate, records) => {
setLeaves(prev => {
const lv = normLeave(prev[userId] || {}, joinDate);
const usedDays = Math.round(records.reduce((s, r) => s + (+(r.days) || 0), 0) * 100) / 100;
const next = { …prev, [userId]: { …lv, usageRecords: records, usedDays } };
saveFb(null, null, next);
return next;
});
}, [saveFb]);

const login = async (user) => {
await sessionSave(user);
setSession(user);
setTab(“home”);
};

const logout = async () => {
await sessionRemove();
setSession(null);
};

if (!ready) return (

);
}

class ErrorBoundary extends React.Component {
constructor(p) { super(p); this.state = { err: null }; }
static getDerivedStateFromError(e) { return { err: e }; }
render() {
if (this.state.err) {
return React.createElement(“pre”, {style:{color:“red”,padding:“20px”,fontSize:“11px”,whiteSpace:“pre-wrap”,fontFamily:“monospace”}},
“렌더 오류: “ + this.state.err.message + “\n” + (this.state.err.stack||””));
}
return this.props.children;
}
}
ReactDOM.createRoot(document.getElementById(“root”)).render(
React.createElement(ErrorBoundary, null, React.createElement(App))
);
</script>

<script>
var attempts = 0;
function runApp() {
  attempts++;
  if (attempts > 30) { document.getElementById("loadmsg").style.color="red"; document.getElementById("loadmsg").textContent="로딩 실패"; return; }
  if (typeof Babel === "undefined") { setTimeout(runApp, 1000); return; }
  try {
    var src = document.getElementById("src").textContent;
    var out = Babel.transform(src, { presets: ["react"] });
    eval(out.code);
    document.getElementById("loading").style.display = "none";
    document.getElementById("root").style.display = "block";
  } catch(e) {
    document.getElementById("loadmsg").style.color = "red";
    document.getElementById("loadmsg").textContent = "오류: " + e.message;
    console.error(e);
  }
}
window.onload = function() { setTimeout(runApp, 500); };
</script>
