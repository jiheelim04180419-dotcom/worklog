                  </div>
                  {isSuperAdmin && <button onClick={() => removeDeduction(d.id)}
                    style={{ background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,cursor:"pointer",color:"#EF4444",fontSize:16,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontFamily:"inherit" }}>×</button>}
                </div>
              ))}
              {/* 로컬 공제항목 저장 버튼 */}
              {deductions.length > 0 && (
                <button onClick={() => {
                  // 항목명 + 숫자값(0/음수 허용)만 통과. 빈칸·NaN 만 제외.
                  const validDeds = deductions.filter(d => d.desc && d.amount !== '' && d.amount !== null && d.amount !== undefined && !isNaN(parseFloat(d.amount)));
                  if (validDeds.length === 0) {
                    alert("저장하려면 항목명과 금액을 모두 입력해주세요. (금액은 0 도 가능)");
                    return;
                  }
                  // 정산완료 잠금 체크 (각 entry의 date 기준)
                  for (const d of validDeds) {
                    const dDate = d.date || wpStart;
                    const lockInfo = isLogLocked(selId, dDate, leaves);
                    if (lockInfo && !isAdmin) {
                      alert(`🔒 ${lockInfo.periodStart} 기간은 정산완료되어 공제 항목을 추가할 수 없어요.`);
                      return;
                    }
                    if (lockInfo && isAdmin && !confirm(`⚠️ ${lockInfo.periodStart} 기간은 정산완료된 기간이에요.\n공제 항목(${dDate})을 추가할까요?`)) return;
                  }
                  const lv0 = leaves[selId] || {};
                  const existing = Array.isArray(lv0.savedDeductions) ? lv0.savedDeductions : Object.values(lv0.savedDeductions||{});
                  const newEntries = validDeds.map(d => ({
                    id: Date.now() + Math.random(),
                    date: d.date || wpStart,
                    desc: d.desc,
                    amount: parseFloat(d.amount)
                  }));
                  persist(null, null, {...leaves, [selId]: {...lv0, savedDeductions: [...existing, ...newEntries]}});
                  setDeductions([]);
                  alert(`✅ 공제항목 ${validDeds.length}개 저장됐어요`);
                }} style={{ width:"100%",background:"#FFF7ED",color:"#C2410C",border:"1.5px solid #FED7AA",borderRadius:8,padding:"8px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:8 }}>
                  💾 공제항목 저장 ({deductions.filter(d=>d.desc&&d.amount!==''&&d.amount!==null&&d.amount!==undefined&&!isNaN(parseFloat(d.amount))).length}/{deductions.length}개)
                </button>
              )}

              {/* Firebase 저장 공제 항목 */}
              {getSavedDeductions(selId).map(d => (
                <div key={d.id} style={{ display:"flex",gap:6,alignItems:"center",marginBottom:8,background:d.addedBy&&d.addedBy!=='admin'&&d.addedBy===user?.id?"#F0FDF4":"#FFF7F7",borderRadius:8,padding:"6px 10px" }}>
                  <div style={{ flex:1 }}>
                    <p style={{ margin:0,fontSize:11,color:"#555" }}>{auD(d.date)} · {d.desc}</p>
                    {!isSuperAdmin && d.addedBy && d.addedBy!==user?.id && (
                      <p style={{ margin:"2px 0 0",fontSize:10,color:"#aaa" }}>관리자 등록</p>
                    )}
                  </div>
                  {isSuperAdmin ? (
                    <div style={{ position:"relative",width:90 }}>
                      <span style={{ position:"absolute",left:6,top:"50%",transform:"translateY(-50%)",fontSize:11,color:"#888",pointerEvents:"none" }}>$</span>
                      <input
                        type="number"
                        step={0.01}
                        defaultValue={d.amount}
                        onBlur={e => {
                          const v = parseFloat(e.target.value);
                          if (isNaN(v) || v === parseFloat(d.amount)) return;
                          updateSavedDeduction(selId, d.id, 'amount', v);
                        }}
                        onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                        style={{ width:"100%",padding:"4px 6px 4px 16px",border:"1px solid #FECACA",borderRadius:6,fontSize:13,fontWeight:700,color:"#EF4444",textAlign:"right",fontFamily:"inherit",background:"#fff",boxSizing:"border-box" }}
                      />
                    </div>
                  ) : (
                    <span style={{ fontSize:13,fontWeight:700,color:"#EF4444" }}>{fA(d.amount)}</span>
                  )}
                  {(isSuperAdmin || (!isSuperAdmin && d.addedBy === user?.id)) && (
                    <button onClick={()=>removeSavedDeduction(selId,d.id)}
                      style={{ background:"none",border:"none",cursor:"pointer",color:"#f77",fontSize:14,padding:"2px",fontFamily:"inherit" }}>×</button>
                  )}
                </div>
              ))}
              {totalDeductions > 0 && (
                <div style={{ borderTop:"1.5px dashed #FECACA",paddingTop:10,marginTop:4 }}>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6 }}>
                    <span style={{ fontSize:13,fontWeight:600,color:"#EF4444" }}>총 공제액</span>
                    <span style={{ fontSize:14,fontWeight:800,color:"#EF4444" }}>− {fA(totalDeductions)}</span>
                  </div>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",background:"#F9FAFB",borderRadius:10,padding:"10px 12px" }}>
                    <span style={{ fontSize:14,fontWeight:700,color:C.text }}>공제 후 금액</span>
                    <span style={{ fontSize:18,fontWeight:900,color:C.text }}>{fA(Math.max(0, wage.gross - totalDeductions))}</span>
                  </div>
                </div>
              )}
            </div>

          </>)}

          {wage && (wage.dailyRate > 0 || wage.hasFlatPay) && (<>
            {/* Tax + Super */}
            {(wage.fixedNet > 0 || wage.fixedTax > 0 || wage.fixedSuper > 0) && (
              <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
                <p style={S.sectionTitle}>📌 지급액</p>
                {wage.fixedNet > 0 && <div style={S.row}><span style={{ fontSize:13,color:C.text }}>Net Pay</span><span style={{ fontSize:13,fontWeight:700,color:"#10B981" }}>{fA(wage.fixedNet)}</span></div>}
                {wage.fixedTax > 0 && <div style={S.row}><span style={{ fontSize:13,color:C.text }}>Tax</span><span style={{ fontSize:13,fontWeight:700,color:"#EF4444" }}>{fA(wage.fixedTax)}</span></div>}
                {wage.fixedSuper > 0 && <div style={S.row}><span style={{ fontSize:13,color:C.text }}>Super</span><span style={{ fontSize:13,fontWeight:700,color:"#F59E0B" }}>{fA(wage.fixedSuper)}</span></div>}
                {!wage.fixedNet && !wage.fixedTax && !wage.fixedSuper && (
                  <p style={{ fontSize:12,color:"#aaa",textAlign:"center",margin:"4px 0" }}>⚙️ 설정 탭에서 지급액을 입력하세요</p>
                )}
              </div>
            )}

            {/* Cash / Keep */}
            {(!wage.isContractor || wage.hasFlatPay) && (<>
              {/* Keep / Cash - 변동분 관리 */}
              {(() => {
                // 변동분 계산
                const allDeductions = totalDeductions + savedTotal(selId);
                const variable = (wage.isContractor && !wage.hasFlatPay)
                  ? 0  // 순수 인보이스: 고정급여 없음, 변동분 없음
                  : wage.hasFlatPay
                  ? wage.gross - wage.fixedTotal - allDeductions
                  : wage.excessPartH * wage.partHourlyRate
                  + wage.excessOtH   * wage.otHourlyRate
                  - wage.deficitH    * wage.partHourlyRate
                  + wage.travel
                  - allDeductions;
                const rawCash = parseFloat(partialCash);
                const availForCash = Math.max(0, wage.keepBalance);
                const cashAmt = isNaN(rawCash) || rawCash < 0 ? 0 : Math.min(rawCash, availForCash);
                const cashOut = cashAmt * 0.75;
                const keepAmt = Math.max(0, variable) - cashAmt;
                return (
                  <div style={{ background:"#fff",borderRadius:14,padding:"16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
                    {/* 변동분 */}
                    <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6 }}>
                      <p style={{ ...S.sectionTitle,margin:0 }}>변동분</p>
                      <p style={{ margin:0,fontSize:24,fontWeight:900,color:variable>=0?"#3B82F6":"#EF4444" }}>{fA(variable)}</p>
                    </div>
                    {wage.keepBalance !== 0 && (
                      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",
                        background:wage.keepBalance>0?"#F0FDF4":"#FEF2F2",
                        border:`1px solid ${wage.keepBalance>0?"#BBF7D0":"#FECACA"}`,
                        borderRadius:10,padding:"8px 12px",marginBottom:10 }}>
                        <div>
                          <p style={{ margin:0,fontSize:11,fontWeight:600,color:wage.keepBalance>0?"#166534":"#DC2626" }}>🏦 누적 킵 잔액 (이번 입금 포함)</p>
                          <p style={{ margin:0,fontSize:10,color:"#555" }}>이번 기간 입금까지 반영된 누적 킵 잔액</p>
                        </div>
                        <span style={{ fontSize:16,fontWeight:800,color:wage.keepBalance>0?"#10B981":"#EF4444" }}>{fA(wage.keepBalance)}</span>
                      </div>
                    )}
                    {isSuperAdmin && wage.keepBalance > 0 && (
                      <KeepCashWithdraw selId={selId} leaves={leaves} persist={persist}
                        balance={wage.keepBalance} fA={fA} isAdmin={isAdmin} />
                    )}
                    {/* 내역 */}
                    <div style={{ background:"#F9FAFB",borderRadius:10,padding:"10px 12px",marginBottom:10,fontSize:12 }}>
                      {wage.hasFlatPay ? (<>
                        {/* hasFlatPay: Gross - 고정지급액 */}
                        <div style={{ display:"flex",justifyContent:"space-between",marginBottom:4 }}><span style={{ color:"#555" }}>Gross</span><span style={{ fontWeight:600,color:"#10B981" }}>+{fA(wage.gross)}</span></div>
                        {wage.fixedNet > 0 && <div style={{ display:"flex",justifyContent:"space-between",marginBottom:4 }}><span style={{ color:"#555" }}>고정 Net Pay</span><span style={{ fontWeight:600,color:"#EF4444" }}>-{fA(wage.fixedNet)}</span></div>}
                        {wage.fixedTax > 0 && <div style={{ display:"flex",justifyContent:"space-between",marginBottom:4 }}><span style={{ color:"#555" }}>고정 Tax</span><span style={{ fontWeight:600,color:"#EF4444" }}>-{fA(wage.fixedTax)}</span></div>}
                        {wage.fixedSuper > 0 && <div style={{ display:"flex",justifyContent:"space-between",marginBottom:4 }}><span style={{ color:"#555" }}>고정 Super</span><span style={{ fontWeight:600,color:"#EF4444" }}>-{fA(wage.fixedSuper)}</span></div>}
                      </>) : (<>
                        {/* 연차직원: 초과/부족/트래블 */}
                        {wage.excessPartH > 0 && <div style={{ display:"flex",justifyContent:"space-between",marginBottom:4 }}><span style={{ color:"#555" }}>초과 파트 {wage.excessPartH.toFixed(1)}h</span><span style={{ fontWeight:600,color:"#10B981" }}>+{fA(wage.excessPartH*wage.partHourlyRate)}</span></div>}
                        {wage.excessOtH > 0 && <div style={{ display:"flex",justifyContent:"space-between",marginBottom:4 }}><span style={{ color:"#555" }}>초과 OT {wage.excessOtH.toFixed(1)}h</span><span style={{ fontWeight:600,color:"#10B981" }}>+{fA(wage.excessOtH*wage.otHourlyRate)}</span></div>}
                        {wage.deficitH > 0 && <div style={{ display:"flex",justifyContent:"space-between",marginBottom:4 }}><span style={{ color:"#555" }}>부족 {wage.deficitH.toFixed(1)}h</span><span style={{ fontWeight:600,color:"#EF4444" }}>-{fA(wage.deficitH*wage.partHourlyRate)}</span></div>}
                        {wage.travel > 0 && <div style={{ display:"flex",justifyContent:"space-between",marginBottom:4 }}><span style={{ color:"#555" }}>트래블 얼라운스</span><span style={{ fontWeight:600,color:"#10B981" }}>+{fA(wage.travel)}</span></div>}
                      </>)}
                      {getSavedDeductions(selId).map(d => (
                      <div key={d.id} style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4 }}>
                        <span style={{ color:"#555" }}>{auD(d.date)} · {d.desc}</span>
                        <span style={{ fontWeight:600,color:parseFloat(d.amount)<0?"#10B981":"#EF4444" }}>{parseFloat(d.amount)<0?"+":"-"}{fA(Math.abs(parseFloat(d.amount)))}</span>
                      </div>
                    ))}
                    {totalDeductions !== 0 && <div style={{ display:"flex",justifyContent:"space-between",marginBottom:4 }}><span style={{ color:"#555" }}>기타 공제</span><span style={{ fontWeight:600,color:"#EF4444" }}>-{fA(totalDeductions)}</span></div>}
                      <div style={{ borderTop:"1px solid #E5E7EB",paddingTop:6,marginTop:4,display:"flex",justifyContent:"space-between",fontWeight:700 }}>
                        <span style={{ color:"#111" }}>변동분</span>
                        <span style={{ color:variable>=0?"#10B981":"#EF4444" }}>{variable>=0?"+":""}{fA(variable)}</span>
                      </div>
                    </div>
                    

                    {/* 킵 합산 표시 - 전액킵일 때 */}
                    {cashAmt === 0 && wage.keepBalance !== 0 && (
                      <div style={{ background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10,padding:"10px 12px",marginBottom:10 }}>
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4 }}>
                          <span style={{ color:"#555" }}>이전 누적 킵</span>
                          <span style={{ fontWeight:600,color:(wage.keepBalance-getPeriodDeposits(selId,periodStart))>0?"#10B981":"#EF4444" }}>{fA(wage.keepBalance-getPeriodDeposits(selId,periodStart))}</span>
                        </div>
                        {getPeriodDeposits(selId,periodStart)!==0 && <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4 }}>
                          <span style={{ color:"#555" }}>💰 이번 기간 입금</span>
                          <span style={{ fontWeight:600,color:"#10B981" }}>+{fA(getPeriodDeposits(selId,periodStart))}</span>
                        </div>}
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6 }}>
                          <span style={{ color:"#555" }}>이번 변동분</span>
                          <span style={{ fontWeight:600,color:variable>=0?"#10B981":"#EF4444" }}>{variable>=0?"+":""}{fA(variable)}</span>
                        </div>
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:800,borderTop:"1px solid #BBF7D0",paddingTop:6 }}>
                          <span>정산 후 총 킵 잔액</span>
                          <span style={{ color:(wage.keepBalance+variable)>=0?"#10B981":"#EF4444" }}>{fA(wage.keepBalance + (skipVariable ? (parseFloat(directKeep)||0) : variable))}</span>
                        </div>
                      </div>
                    )}
                    {/* 출금 금액 입력 - 슈퍼관리자만 */}
                    {isSuperAdmin && <p style={{ margin:"0 0 6px",fontSize:12,fontWeight:600,color:"#555" }}>
                      💵 캐시 출금 금액 (킵 잔액에서 차감)
                    </p>}
                    {isSuperAdmin && wage.keepBalance < 0 && (
                      <KeepDepositLog selId={selId} leaves={leaves} persist={persist}
                        getKeepBalance={getKeepBalance} fA={fA}
                        wpStart={wpStart} wpEnd={wpEnd} isAdmin={isAdmin}/>
                    )}
                    {isSuperAdmin && wage.keepBalance > 0 && (<div style={{ display:"flex",gap:6,marginBottom:12 }}>
                      <div style={{ flex:1,position:"relative" }}>
                        <span style={{ position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"#888",fontSize:13,pointerEvents:"none" }}>$</span>
                        <input type="number" placeholder="0.00 (전액 킵)" value={partialCash} min={0} step={0.01}
                          onChange={e => setPartialCash(e.target.value)}
                          style={{ ...styles.input,paddingLeft:22,fontSize:14,fontWeight:700 }}/>
                      </div>
                      <button onClick={() => setPartialCash(String(Math.max(0, wage.keepBalance).toFixed(2)))}
                        style={{ padding:"0 12px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"#F3F4F6",color:"#555",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>
                        전액
                      </button>
                      <button onClick={() => setPartialCash("")}
                        style={{ padding:"0 12px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"#F3F4F6",color:"#555",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>
                        전액킵
                      </button>
                    </div>)}

                    {/* 결과 */}
                    <div style={{ background:"#F9FAFB",borderRadius:10,padding:"12px 14px" }}>
                      {cashAmt > 0 && (<>
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5 }}>
                          <span style={{ color:"#555" }}>캐시 출금 ({fA(cashAmt)} × 75%)</span>
                          <span style={{ fontWeight:800,color:"#EF4444" }}>{fA(cashOut)}</span>
                        </div>
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:cashAmt < variable ? 8 : 0,color:"#aaa" }}>
                          <span>25% 공제</span>
                          <span>- {fA(cashAmt * 0.25)}</span>
                        </div>
                      </>)}
                      {keepAmt > 0 && (
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:13,borderTop:cashAmt>0?"1px solid #E5E7EB":"none",paddingTop:cashAmt>0?8:0 }}>
                          <span style={{ color:"#555" }}>🏦 킵 잔액</span>
                          <span style={{ fontWeight:800,color:"#10B981" }}>{fA(keepAmt)}</span>
                        </div>
                      )}
                      {cashAmt === 0 && keepAmt === 0 && (
                        <p style={{ margin:0,fontSize:12,color:"#aaa",textAlign:"center" }}>변동분이 없어요</p>
                      )}
                    </div>
                    {/* 정산완료 */}
                    {isSuperAdmin && (<>
                      {variable < 0 && (
                        <div style={{ marginTop:12,background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10,padding:"10px 12px" }}>
                          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6 }}>
                          <p style={{ margin:0,fontSize:12,fontWeight:600,color:"#166534" }}>🏦 이번 기간 킵으로 추가할 금액</p>
                          <label style={{ display:"flex",alignItems:"center",gap:4,fontSize:11,cursor:"pointer" }}>
                            <input type="checkbox" checked={skipVariable} onChange={e=>{ setSkipVariable(e.target.checked); setDirectKeep(""); }} style={{ accentColor:"#166534" }}/>
                            <span style={{ color:skipVariable?"#166534":"#888",fontWeight:skipVariable?700:400 }}>변동분 제외</span>
                          </label>
                        </div>
                          <div style={{ position:"relative" }}>
                            <span style={{ position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"#888",fontSize:13,pointerEvents:"none" }}>$</span>
                            <input type="number" placeholder="0.00" step={0.01} value={directKeep}
                              onChange={e=>setDirectKeep(e.target.value)}
                              style={{ ...styles.input,paddingLeft:22,fontSize:14,fontWeight:700,background:"#fff",width:"100%",boxSizing:"border-box" }}/>
                          </div>
                          <p style={{ margin:"4px 0 0",fontSize:11,color:"#555" }}>변동분은 자동 반영 + 추가 조정 금액 (선택사항)</p>
                        </div>
                      )}
                      <button onClick={() => saveCarryover(selId)}
                        style={{ width:"100%",background:"#111",color:"#fff",border:"none",borderRadius:12,padding:13,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginTop:12 }}>
                        💾 정산 완료 {(() => { const tot = skipVariable
              ? wage.keepBalance + (parseFloat(directKeep)||0)
              : wage.keepBalance + (variable < 0 ? variable + (parseFloat(directKeep)||0) : Math.max(0,variable) - Math.min(parseFloat(partialCash)||0, Math.max(0,variable))); return tot !== wage.keepBalance ? `→ 킵 ${fA(tot)}` : ""; })()}{cashAmt > 0 ? ` (캐시 ${fA(cashOut)})` : ""}
                      </button>
                    </>)}
                  </div>
                );
              })()}
        </>)}
      </>)}
    </>)}


        {/* ── LOG VIEW ── */}
        {subView === "log" && (
          <div>
            {wage && wage.periodLogs.length === 0 ? (
              <EmptyState msg="이 기간 근무일지가 없습니다." />
            ) : wage && wage.periodLogs.map(l => {
              const wt = l.workType || "fulltime";
              const wtColor = wt==="overtime"?"#F59E0B":wt==="parttime"?"#8B5CF6":wt==="dayoff"?"#9CA3AF":wt==="publicholiday"?"#F97316":"#10B981";
              const wtLabel = wt==="fulltime"?"풀타임":wt==="overtime"?"오버타임":wt==="parttime"?"파트타임":wt==="dayoff"?"휴무":wt==="publicholiday"?"공휴일":wt;
              return (
                <div key={l.id} style={{ background:"#fff",borderRadius:12,padding:"12px 14px",marginBottom:8,borderLeft:"3px solid "+selColor,boxShadow:"0 1px 4px #0000000a" }}>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start" }}>
                    <div style={{ flex:1,minWidth:0 }}>
                      <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:4 }}>
                        <span style={{ fontSize:13,fontWeight:700,color:C.text }}>{dayStr(l.date)}</span>
                        <span style={{ fontSize:10,fontWeight:700,color:"#fff",background:wtColor,borderRadius:6,padding:"2px 7px" }}>{wtLabel}</span>
                      </div>
                      {l.content && <p style={{ margin:"0 0 4px",fontSize:12,color:C.sub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{l.content}</p>}
                      {l.travel && (l.travel.allowance > 0 || l.travel.hasDinner) && (
                        <p style={{ margin:0,fontSize:11,color:"#3B82F6",fontWeight:600 }}>
                          🚗 {fA((l.travel.allowance||0)+(l.travel.hasDinner?25:0))}
                          {(l.travel.stops||[]).filter(Boolean).length > 0 && " · "+(l.travel.stops||[]).filter(Boolean).join(" → ")}
                        </p>
                      )}
                    </div>
                    <div style={{ textAlign:"right",flexShrink:0,marginLeft:10 }}>
                      <p style={{ margin:0,fontSize:16,fontWeight:800,color:selColor }}>{fmt(l.hours)}h</p>
                      {wt==="overtime" && <p style={{ margin:"2px 0 0",fontSize:11,color:"#F59E0B",fontWeight:600 }}>+OT {fmt(calcHours(l.otStart||"16:30",l.otEnd||"16:30"))}h</p>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── SETTINGS VIEW ── */}
        {subView === "settings" && isSuperAdmin && (
          <div style={{ background:"#fff",borderRadius:14,padding:"16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
            <p style={{ margin:"0 0 16px",fontSize:15,fontWeight:700,color:C.text }}>⚙️ {selEmp.name} 급여 설정</p>
            {!(leaves[selId] || {}).noLeave && (
              <ReqHistoryEditor selId={selId} leaves={leaves} persist={persist} periodStart={periodStart} isSuperAdmin={isSuperAdmin} />
            )}
            {(leaves[selId] || {}).noLeave && !(leaves[selId] || {}).hasFlatPay && (
              <div style={{ background:"#FEF3C7",borderRadius:10,padding:"10px 12px",marginBottom:14 }}>
                <p style={{ margin:0,fontSize:12,color:"#92400E" }}>📄 인보이스 직원 — 기준일/고정지급 설정 없음</p>
              </div>
            )}
            {(!(leaves[selId] || {}).noLeave || (leaves[selId] || {}).hasFlatPay) && (
              <div>
                <label style={styles.label}>고정 지급액 이력 (기간별)</label>
                <p style={{ margin:"-8px 0 10px",fontSize:11,color:C.sub,lineHeight:1.5 }}>
                  기간마다 다른 고정지급액을 설정할 수 있어요.<br/>
                  Gross - 고정(Net+Tax+Super) - 공제 = Keep/Cash 변동분
                </p>
                <FixedPayHistoryEditor lv={leaves[selId]||{}} selId={selId} persist={persist} leaves={leaves} isSuperAdmin={isSuperAdmin}/>
                
                {((leaves[selId]||{}).fixedNet||0) + ((leaves[selId]||{}).fixedTax||0) + ((leaves[selId]||{}).fixedSuper||0) > 0 && (
                  <div style={{ background:"#F9FAFB",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#555" }}>
                    합계: {fA(((leaves[selId]||{}).fixedNet||0) + ((leaves[selId]||{}).fixedTax||0) + ((leaves[selId]||{}).fixedSuper||0))}
                  </div>
                )}
              </div>
            )}

            <div style={{ background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:"10px 12px",marginTop:14 }}>
              <p style={{ margin:0,fontSize:12,color:"#1D4ED8" }}>💡 일당은 <strong>일급 탭</strong>에서 변경하세요</p>
            </div>
            <FYGrossSummary userId={selId} lv={leaves[selId]||{}} logs={logs} users={users} isAdmin={isAdmin} getDailyRate={getDailyRate} fA={fA}/>
            <TSSMinCalculator userId={selId} lv={leaves[selId]||{}} users={users} getDailyRate={getDailyRate} fA={fA}/>
            {getKeepBalance(selId) !== 0 && (
              <div style={{ background:getKeepBalance(selId)>0?"#F0FDF4":"#FEF2F2",border:`1px solid ${getKeepBalance(selId)>0?"#BBF7D0":"#FECACA"}`,borderRadius:10,padding:"10px 12px",marginTop:10 }}>
                <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center" }}>
                  <div>
                    <p style={{ margin:0,fontSize:12,fontWeight:700,color:getKeepBalance(selId)>0?"#166534":"#DC2626" }}>🏦 누적 킵 잔액 (이번 입금 포함)</p>
                    <p style={{ margin:"2px 0 0",fontSize:18,fontWeight:800,color:getKeepBalance(selId)>0?"#10B981":"#EF4444" }}>{fA(getKeepBalance(selId))}</p>
                  </div>
                  <button onClick={() => {
                    const lv = leaves[selId]||{};
                    persist(null,null,{...leaves,[selId]:{...lv,keepBalance:0,keepBalanceHistory:[]}});
                  }} style={{ fontSize:11,background:"#FEF2F2",color:"#EF4444",border:"1px solid #FECACA",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontFamily:"inherit",fontWeight:600 }}>
                    초기화
                  </button>
                  <KeeepBalanceManualEditor selId={selId} persist={persist} leaves={leaves} periodStart={periodStart} fA={fA} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin}/>
                </div>
              </div>
            )}
          </div>
        )}
      </>)}
    </div>
  );
}

// ─── Invoice Button + In-App PDF Preview ─────────────────────────────────
const inv = {
  info:       { fontSize: 11, color: "#444", lineHeight: 1.6, margin: 0 },
  sectionHdr: { background: "#1a4fa8", color: "#fff", fontWeight: 700, padding: "4px 8px", fontSize: 11, marginBottom: 6 },
  smallTable: { borderCollapse: "collapse", fontSize: 11 },
  th:         { border: "1px solid #aaa", padding: "4px 12px", background: "#1a4fa8", color: "#fff", fontWeight: 700, textAlign: "center" },
  td:         { border: "1px solid #aaa", padding: "4px 12px", textAlign: "center" },
  th2:        { background: "#1a4fa8", color: "#fff", padding: "5px 8px", fontWeight: 700 },
  tdRow:      { borderBottom: "1px solid #e0e6f0", padding: "4px 8px" },
};
function InvoiceButton({ u, s, periodLogs, startDate, endDate, leaveData, onInvoiceSent, companies }) {
  const [show, setShow]       = useState(false);
  // 디덕션은 정산 단계에서 저장된 savedDeductions 를 그대로 가져옴
  // (인쇄 시에는 이미 계산이 끝난 상태라서 별도 수정 UI 없음)
  const savedDeductionsForPeriod = (() => {
    const all = (leaveData && leaveData.savedDeductions) || [];
    const arr = Array.isArray(all) ? all : Object.values(all);
    return arr
      .filter(d => d && d.date && startDate && endDate && d.date >= startDate && d.date <= endDate)
      .map(d => ({ desc: d.desc || "Deduction", amount: parseFloat(d.amount) || 0 }))
      .filter(d => d.amount > 0);
  })();
  const totalDeducted = savedDeductionsForPeriod.reduce((s,d) => s + d.amount, 0);
  const ci         = (leaveData && leaveData.contractorInfo) || {};
  // dailyRate: contractorRateHistory(startDate 시점 기준)가 우선, 없으면 ci.dailyRate
  const dailyRate  = (() => {
    const hist = leaveData?.contractorRateHistory;
    const arr = Array.isArray(hist) ? hist : (hist ? Object.values(hist) : []);
    if (arr.length > 0) {
      const applicable = arr
        .filter(r => r && r.from && r.dailyRate && (!startDate || r.from <= startDate))
        .sort((a, b) => (b.from||'').localeCompare(a.from||''))[0];
      if (applicable) return parseFloat(applicable.dailyRate) || 0;
    }
    return parseFloat(ci.dailyRate) || 0;
  })();
  const ptRate     = dailyRate > 0 ? dailyRate / 9 : 0;
  const otRate     = dailyRate > 0 ? dailyRate / 8 : 0;
  const workDesc   = ci.workDesc || "Work";
  const invoiceNum = ci.invoiceNum || "10001";
  // wage.stats 안에 실제 카운트가 있음
  const fullDays    = (s.stats && s.stats.fullDays) || 0;
  const partHours   = (s.stats && s.stats.partHours) || 0;
  const otHours     = (s.stats && s.stats.otHours) || 0;
  const travelTotal = (s.stats && s.stats.travelTotal) || 0;
  // Work amount = 풀타임 일급 + 오버타임 + 파트타임 합산 (one consolidated row)
  const fullAmt    = fullDays * dailyRate;
  const otAmt      = otHours * otRate;
  const ptAmt      = partHours * ptRate;
  const workAmt    = fullAmt + otAmt + ptAmt;
  // Work description: "wall and floor tiling 6D7H" 식으로
  const workDescFull = `${workDesc}${fullDays?` ${fullDays}D`:""}${otHours?` ${otHours}H`:""}${partHours?` (PT ${fmt(partHours)}h)`:""}`.trim();
  const subtotal   = workAmt + travelTotal - totalDeducted;
  // 영문 이름: ci.nameEn → u.nameEn (직원 편집 폼에서 입력) → u.id → u.name
  const displayName  = ci.nameEn || u.nameEn || u.id || u.name || "";
  // Bill To: 회사 정보 (selectedCompanyId 우선, 없으면 첫 번째 회사로 자동 매칭)
  const selCo = (companies || []).find(c => c.id === ci.selectedCompanyId) || (companies || [])[0];
  const billToName    = (selCo && selCo.name)    || ci.billToName    || "";
  const billToAddress = (selCo && selCo.address) || ci.billToAddress || "";
  const billToEmail   = (selCo && selCo.email)   || ci.billToEmail   || "";
  const contactEmail = ci.email  || billToEmail || "";
  // 기간 라벨: 27.04~10.05 2026 형태
  const fmtPeriod = (sd, ed) => {
    if (!sd || !ed) return "";
    const [y1,m1,d1] = sd.split('-'); const [y2,m2,d2] = ed.split('-');
    return `${d1}.${m1}~${d2}.${m2} ${y2}`;
  };
  const periodLabel = fmtPeriod(startDate, endDate);

  const buildHTML = () => {
    // 행 정의: DESCRIPTION | Amount
    // Travel allowance / Deduction 모두 같은 Amount 칸에 들어감 (별도 컬럼 없음)
    const rows = [];
    // Work (fulltime + overtime + parttime 합산) — 항상 표시
    rows.push({ desc: workDescFull || workDesc, amount: workAmt });
    // Travel allowance — 있으면 같은 Amount 칸에
    if (travelTotal > 0) {
      rows.push({ desc: "Travel allowance", amount: travelTotal });
    }
    // 정산 단계에서 저장된 디덕션들 → 합계 1줄 "Deduction" 으로 통합
    // (개별 설명은 정산 화면에서 체크용으로만 사용. 인보이스에는 노출 X)
    if (totalDeducted > 0) {
      rows.push({ desc: "Deduction", amount: -totalDeducted });
    }
    // 빈 줄로 패딩 (최소 6줄)
    const MIN_ROWS = 6;
    while (rows.length < MIN_ROWS) rows.push({ desc: "", amount: "" });

    const fmtMoney = v => {
      if (v === "" || v === null || v === undefined) return "";
      const n = parseFloat(v);
      if (isNaN(n)) return "";
      const isNeg = n < 0;
      const abs = Math.abs(n).toLocaleString('en-AU', {minimumFractionDigits:2, maximumFractionDigits:2});
      return (isNeg ? "-$" : "$") + abs;
    };
    const addrHTML = (a) => (a||"").split(/[,\n]/).map(l=>l.trim()).filter(Boolean).map(l=>`<div>${l}</div>`).join("");

    // Subtotal: 한 컬럼만
    const totalSum = workAmt + travelTotal - totalDeducted;

    return `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>INV-${invoiceNum}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;padding:30px 36px;color:#2A2A2A;background:#fff}
.invoice-title{font-size:38px;font-weight:300;letter-spacing:4px;color:#7A7A7A;text-align:right;margin-bottom:18px}
.top{display:flex;justify-content:space-between;margin-bottom:32px}
.bill-to-label{font-size:11px;color:#9A9A9A;border-bottom:1px solid #C8C8C8;padding-bottom:3px;margin-bottom:10px;display:inline-block}
.bill-to-co{font-size:12px;color:#5A5A5A;margin-bottom:14px}
.bill-to-addr{font-size:11px;color:#7A7A7A;line-height:1.5}
.meta-block{font-size:11px;color:#5A5A5A;line-height:1.7;text-align:left;min-width:240px}
.meta-block .lbl{color:#9A9A9A;letter-spacing:0.5px}
.meta-block .val{font-weight:700;color:#2A2A2A}
.from{margin-top:18px}
.from .name{font-weight:700;font-size:12px;color:#2A2A2A}
.from .row{color:#5A5A5A}
hr{border:none;border-top:1px solid #C8C8C8;margin:6px 0 22px}
table.items{width:100%;border-collapse:collapse;margin-top:8px}
table.items thead th{font-size:11px;font-weight:700;color:#2A2A2A;text-align:left;padding:8px 12px;background:#E1E5EA}
table.items thead th.num{text-align:right}
table.items tbody tr{border-bottom:1px solid #fff}
table.items tbody tr:nth-child(odd){background:#F1F3F6}
table.items tbody tr:nth-child(even){background:#fff}
table.items tbody td{padding:9px 12px;font-size:11px;color:#3A3A3A;vertical-align:middle}
table.items tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
.totals-row{font-weight:700}
.totals-row td{padding-top:14px;padding-bottom:6px;border-top:1px solid #C8C8C8}
.total-final td{font-weight:800;font-size:13px;padding-top:8px;padding-bottom:8px;border-top:1px solid #C8C8C8}
.muted{color:#9A9A9A}
@media print{body{padding:14mm 16mm}}
</style></head><body>

<div class="invoice-title">INVOICE</div>

<div class="top">
  <div style="flex:1;padding-right:24px">
    <div class="bill-to-label">Billed to</div>
    <div class="bill-to-co">${billToName||""}</div>
    <div class="bill-to-addr">${addrHTML(billToAddress)}</div>
  </div>
  <div class="meta-block">
    <div><span class="lbl">INVOICE NO.</span> <span class="val">${invoiceNum}</span></div>
    <div><span class="lbl">DATE</span> <span class="val">${periodLabel||today}</span></div>
    <div class="from">
      <div class="name">${displayName}</div>
      ${ci.abn?`<div class="row">ABN ${ci.abn}</div>`:""}
      ${ci.email?`<div class="row">${ci.email}</div>`:""}
      ${ci.phone?`<div class="row">${ci.phone}</div>`:""}
    </div>
  </div>
</div>

<hr/>

<table class="items">
  <thead>
    <tr>
      <th style="width:70%">DESCRIPTION</th>
      <th class="num" style="width:30%">Amount</th>
    </tr>
  </thead>
  <tbody>
    ${rows.map(r => {
      return `<tr>
        <td>${r.desc||"&nbsp;"}</td>
        <td class="num"><strong>${fmtMoney(r.amount)}</strong></td>
      </tr>`;
    }).join("")}
    <tr class="totals-row">
      <td><strong>Subtotal</strong></td>
      <td class="num"><strong>${fmtMoney(totalSum)}</strong></td>
    </tr>
    <tr>
      <td><strong>GST</strong></td>
      <td class="num">$0.00</td>
    </tr>
    <tr class="total-final">
      <td>TOTAL</td>
      <td class="num">${fmtMoney(totalSum)}</td>
    </tr>
  </tbody>
</table>

</body></html>`;
  };

  const html    = buildHTML();
  const iframeRef = useRef(null);

  const buildPlainText = () => {
    const lines = [
      `INVOICE  #${invoiceNum}  DATE: ${periodLabel||today}`,
      `FROM: ${displayName}`,
      ci.abn?`ABN: ${ci.abn}`:"",
      ci.email?ci.email:"",
      "",
      `BILL TO: ${billToName||""}`,
      billToAddress||"",
      "",
      "DESCRIPTION                                       AMOUNT",
      "─────────────────────────────────────────────────────",
    ];
    const addRow = (desc, amount) => {
      const amtStr = amount !== "" && amount !== undefined && amount !== null
        ? (parseFloat(amount) < 0 ? "-$" : "$") + Math.abs(parseFloat(amount)).toFixed(2)
        : "";
      lines.push(`${(desc||"").padEnd(46)} ${String(amtStr).padStart(10)}`);
    };
    if (workAmt) addRow(workDescFull, workAmt);
    if (travelTotal > 0) addRow("Travel allowance", travelTotal);
    if (totalDeducted > 0) addRow("Deduction", -totalDeducted);
    lines.push("─────────────────────────────────────────────────────");
    lines.push(`${"TOTAL".padEnd(46)} $${subtotal.toFixed(2)}`);
    if(contactEmail)lines.push(`\nQuestions? ${contactEmail}`);
    return lines.filter(l=>l!=="").join("\n");
  };

  const sendEmail = () => {
    const subject=encodeURIComponent(`Invoice #${invoiceNum} - ${displayName} - ${startDate} to ${endDate}`);
    const body=encodeURIComponent(buildPlainText());
    const to=billToEmail||"";
    window.location.href=`mailto:${to}?subject=${subject}&body=${body}`;
    if(onInvoiceSent)onInvoiceSent();
  };

  const shareInvoice = async () => {
    const filename="invoice_"+invoiceNum+"_"+(ci.nameEn||u.name||"")+".html";
    try{const file=new File([html],filename,{type:"text/html"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Invoice #"+invoiceNum});if(onInvoiceSent)onInvoiceSent();return;}}catch(e){}
    sendEmail();
  };

  // 인쇄 / PDF 저장 — invoice 앱과 같은 흐름. iframe 컨텐츠를 브라우저 인쇄로
  const printInvoice = () => {
    const f = iframeRef.current;
    if (!f) return;
    try {
      if (f.contentDocument) f.contentDocument.title = `INV-${invoiceNum}`;
    } catch(e) {}
    f.contentWindow.focus();
    f.contentWindow.print();
  };

  const fmtCell=(v)=>{if(v===""||v===0)return"–";const n=parseFloat(v);return isNaN(n)?String(v):n.toFixed(2);};

  if (!show) return (
    <button style={styles.invoiceBtn} onClick={() => setShow(true)}>📄 PDF 인보이스</button>
  );

  return (
    <div style={{ position:"fixed",inset:0,background:"#fff",zIndex:500,display:"flex",flexDirection:"column" }}>
      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",borderBottom:"1px solid #eee",background:"#fff",flexShrink:0,gap:6 }}>
        <button style={styles.iconBtn} onClick={() => setShow(false)}>{Icon.x}</button>
        <span style={{ fontWeight:700,fontSize:14,flex:1,textAlign:"center" }}>인보이스 #{invoiceNum}</span>
        <div style={{ display:"flex",gap:6,flexShrink:0 }}>
          <button style={{ background:"#10B981",color:"#fff",border:"none",borderRadius:8,padding:"8px 12px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap" }}
            onClick={printInvoice}>🖨️ 인쇄/PDF</button>
          <button style={{ background:"#1a4fa8",color:"#fff",border:"none",borderRadius:8,padding:"8px 12px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap" }}
            onClick={shareInvoice}>📤 공유</button>
        </div>
      </div>
      <div style={{ padding:"7px 14px",background:"#f0f5ff",borderBottom:"1px solid #c5d8ff",fontSize:11,color:"#3b5fc0",flexShrink:0 }}>
        🖨️ <strong>인쇄/PDF</strong>: 인쇄창 → "PDF로 저장" 선택 &nbsp;·&nbsp; 📤 <strong>공유</strong>: 이메일/파일 앱으로
      </div>
      {savedDeductionsForPeriod.length > 0 && (
        <div style={{ padding:"6px 14px",background:"#f8f4ff",borderBottom:"1px solid #e0d6ff",flexShrink:0,fontSize:11,color:"#5a3e9b" }}>
          ➖ 정산 시 입력된 디덕션 {savedDeductionsForPeriod.length}건 — 인보이스에 자동 반영됨 (수정은 정산 화면에서)
        </div>
      )}
      <iframe ref={iframeRef} srcDoc={html} style={{ flex:1,border:"none",width:"100%" }} title="invoice" />
    </div>
  );
}

function PayStat({ emoji, label, val, color, logs = [], renderDetail }) {
  const [open, setOpen] = useState(false);
  const hasDetail = logs.length > 0;
  return (
    <div style={{ ...styles.payStatCell, borderLeft: `3px solid ${color}`, cursor: hasDetail ? "pointer" : "default" }}
      onClick={() => hasDetail && setOpen(p => !p)}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <span style={{ fontSize: 16 }}>{emoji}</span>
        {hasDetail && <span style={{ fontSize: 10, color: color, opacity: 0.7 }}>{open ? "▲" : "▼"}</span>}
      </div>
      <span style={{ fontSize: 15, fontWeight: 700, color }}>{val}</span>
      <span style={{ fontSize: 11, color: C.sub }}>{label}</span>
      {open && hasDetail && (
        <div style={{ marginTop: 8, borderTop: `1px solid ${color}22`, paddingTop: 6 }}>
          {logs.map((l, i) => (
            <p key={i} style={{ margin: "3px 0", fontSize: 11, color: C.text, lineHeight: 1.4 }}>
              · {renderDetail(l)}
            </p>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Rate Tab (일급 관리) ──────────────────────────────────────────────────
function RateTab({ users, leaves, persist, isSuperAdmin }) {
  const [filterUser, setFilterUser] = useState("all");
  const allEmps = users.filter(u => u.role === "employee");
  const emps    = filterUser !== "all" ? allEmps.filter(u => u.id === filterUser) : allEmps;
  const saveRates = (userId, joinDate, newRates) => {
    const lv = leaves[userId] || {};
    persist(null, null, { ...leaves, [userId]: { ...lv, rateHistory: newRates, contractorRateHistory: undefined } });
  };
  const saveContractorRates = (userId, newRates) => {
    const lv = leaves[userId] || {};
    persist(null, null, { ...leaves, [userId]: { ...lv, contractorRateHistory: newRates } });
  };
  return (
    <div style={styles.page}>
      <div style={styles.pageHeader}><h2 style={styles.pageTitle}>💰 일급 관리</h2></div>

      <div style={styles.filterRow}>

          <option value="all">전체 직원</option>
          {allEmps.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
        </select>
      </div>
      {emps.map(u => {
        const lv = normLeave(leaves[u.id] || {}, u.joinDate);
        const isContractor = lv.noLeave;
        const rawRates = isContractor?(lv.contractorRateHistory||[]):((lv.rateHistory&&lv.rateHistory.some(r=>r.dailyRate&&+r.dailyRate>0))?lv.rateHistory:(lv.contractorRateHistory||[]));
        const rates = rawRates.filter(r=>r.dailyRate!==undefined&&r.dailyRate!=="").slice().sort((a,b)=>(a.from||"")<(b.from||"")?-1:1);
        return (<RateCard key={u.id} user={u} rates={rates} isContractor={isContractor} isSuperAdmin={isSuperAdmin}
          onSave={(newRates) => isContractor ? saveContractorRates(u.id, newRates) : saveRates(u.id, u.joinDate, newRates)} />);
      })}
    </div>
  );
}

function RateCard({ user, rates, isContractor, isSuperAdmin, onSave }) {
  const initRates = rates.length > 0 ? rates : [{ from: user.joinDate || today, dailyRate: "" }];
  const [editing, setEditing]       = useState(false);
  const [localRates, setLocalRates] = useState(initRates);
  const add    = () => setLocalRates(r => [...r, { from: today, dailyRate: "" }]);
  const setR   = (i, k, v) => setLocalRates(r => r.map((x, idx) => idx === i ? { ...x, [k]: v } : x));
  const remove = (i) => setLocalRates(r => r.filter((_, idx) => idx !== i));
  const save   = () => { onSave(localRates); setEditing(false); };
  const cancel = () => { setLocalRates(rates); setEditing(false); };
  const sorted = [...rates].sort((a,b)=>(a.from||"")<(b.from||"")?-1:1);
  return (
    <div style={styles.payCard}>
      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10 }}>
        <div style={{ display:"flex",alignItems:"center",gap:8 }}>
          <div style={{ ...styles.logAvatar,width:36,height:36,fontSize:14 }}>{user.name[0]}</div>
          <div>
            <p style={{ margin:0,fontWeight:700,fontSize:14 }}>{user.name}</p>
            <span style={{ fontSize:10,color:"#fff",background:isContractor?"#f7a440":C.primary,borderRadius:4,padding:"1px 6px" }}>{isContractor?"인보이스":"연차적용"}</span>
          </div>
        </div>
        {isSuperAdmin && !editing && <button style={styles.iconBtn} onClick={() => { setLocalRates(rates.length>0?rates:[{from:user.joinDate||today,dailyRate:""}]); setEditing(true); }}>{Icon.edit}</button>}
      </div>
      {editing ? (
        <div>
          {localRates.map((r,i) => (
            <div key={i} style={styles.row2}>
              <div style={{ ...styles.field,flex:1 }}>
                <label style={styles.label}>{i===0?"시작일":"변경일"}</label>
                <input type="date" style={styles.input} value={r.from||""} onChange={e=>setR(i,"from",e.target.value)} />
              </div>
              <div style={{ ...styles.field,flex:1 }}>
                <label style={styles.label}>일당 ($)</label>
                <div style={{ display:"flex",gap:4 }}>
                  <input type="number" style={{ ...styles.input,flex:1 }} value={r.dailyRate||""} onChange={e=>setR(i,"dailyRate",e.target.value)} placeholder="350" min={0} />
                  {i>0&&<button style={{ ...styles.iconBtn,color:"#f77" }} onClick={()=>remove(i)}>{Icon.trash}</button>}
                </div>
              </div>
            </div>
          ))}
          <button style={{ ...styles.btnSecondary,width:"100%",marginBottom:10 }} onClick={add}>+ 일급 변동 추가</button>
          <div style={styles.modalFooter}>
            <button style={styles.btnSecondary} onClick={cancel}>취소</button>
            <button style={styles.btnPrimary} onClick={save}>저장</button>
          </div>
        </div>
      ) : sorted.length > 0 ? (
        <div>
          {sorted.map((r,i,arr) => (
            <div key={i} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:i<arr.length-1?`1px solid ${C.border}`:"none" }}>
              <span style={{ fontSize:12,color:C.sub }}>{r.from} ~ {arr[i+1]?(()=>{const p=arr[i+1].from.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})():"현재"}</span>
              <span style={{ fontSize:15,fontWeight:700,color:C.text }}>${parseFloat(r.dailyRate||0).toFixed(2)}<span style={{ fontSize:11,color:C.sub,fontWeight:400 }}>/일</span></span>
            </div>
          ))}
        </div>
      ) : (
        <p style={{ fontSize:12,color:C.sub,textAlign:"center",padding:12 }}>일급 이력 없음{isSuperAdmin?" — ✏️ 버튼으로 추가하세요":""}</p>
      )}
    </div>
  );
}

// ─── ReqHistoryEditor: 기준일/시간 이력 관리 ─────────────────────────────
function ReqHistoryEditor({ selId, leaves, persist, periodStart, isSuperAdmin }) {
  const lv = leaves[selId] || {};
  const history = lv.reqHistory || [];
  const [newFrom, setNewFrom] = useState(periodStart || today);
  const [newDays, setNewDays] = useState("");
  const [newHours, setNewHours] = useState("");
  const [confirmDel, setConfirmDel] = useState(null);

  const sorted = [...history].sort((a, b) => b.from.localeCompare(a.from));

  const addEntry = () => {
    if (!newFrom || (!newDays && !newHours)) return;
    const entry = { from: newFrom, days: parseInt(newDays) || 0, hours: parseFloat(newHours) || 0 };
    const updated = [...history.filter(h => h.from !== newFrom), entry];
    persist(null, null, { ...leaves, [selId]: { ...lv, reqHistory: updated } });
    setNewDays(""); setNewHours("");
  };

  const delEntry = (from) => {
    persist(null, null, { ...leaves, [selId]: { ...lv, reqHistory: history.filter(h => h.from !== from) } });
    setConfirmDel(null);
  };

  // 현재 기간에 해당하는 기준
  const current = sorted.find(h => h.from <= (periodStart || today)) || sorted[sorted.length - 1];

  return (
    <div>
      <div style={{ marginBottom:14 }}>
        <label style={styles.label}>기준일 이력 (급여기간별 고정)</label>
        {current && (
          <div style={{ background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:"10px 12px",marginBottom:10 }}>
            <p style={{ margin:0,fontSize:12,color:"#1D4ED8",fontWeight:600 }}>
              📌 현재 기간({auD(periodStart)}) 적용 기준: <strong>{current.days}일 {current.hours > 0 ? `${current.hours}h ` : ""}= {current.days * 9 + current.hours}h</strong>
            </p>
          </div>
        )}
        {sorted.length === 0 && (
          <p style={{ fontSize:12,color:"#aaa",textAlign:"center",margin:"8px 0" }}>등록된 기준 이력이 없어요</p>
        )}
        {sorted.map(h => (
          <div key={h.from} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 10px",background:h===current?"#F0FDF4":"#F9FAFB",borderRadius:8,marginBottom:6,border:h===current?"1px solid #BBF7D0":"1px solid #E5E7EB" }}>
            <div>
              <p style={{ margin:0,fontSize:12,fontWeight:600,color:"#111" }}>{h.from} ~</p>
              <p style={{ margin:"2px 0 0",fontSize:13,fontWeight:700,color:h===current?"#10B981":"#555" }}>
                {h.days}일 {h.hours > 0 ? `${h.hours}h ` : ""}= {h.days * 9 + h.hours}h
              </p>
            </div>
            {confirmDel === h.from ? (
              <div style={{ display:"flex",gap:6,alignItems:"center" }}>
                <span style={{ fontSize:11,color:"#f77" }}>삭제?</span>
                <button onClick={() => delEntry(h.from)} style={{ fontSize:11,background:"#f77",color:"#fff",border:"none",borderRadius:6,padding:"3px 8px",cursor:"pointer",fontFamily:"inherit" }}>예</button>
                <button onClick={() => setConfirmDel(null)} style={{ fontSize:11,background:"#eee",color:"#555",border:"none",borderRadius:6,padding:"3px 8px",cursor:"pointer",fontFamily:"inherit" }}>아니오</button>
              </div>
            ) : (
              <button onClick={() => setConfirmDel(h.from)} style={{ background:"none",border:"none",cursor:"pointer",color:"#f77",fontSize:16,padding:"4px" }}>×</button>
            )}
          </div>
        ))}
      </div>

      <div style={{ background:"#F9FAFB",borderRadius:10,padding:"12px 14px",border:"1px dashed #D1D5DB" }}>
        <p style={{ margin:"0 0 10px",fontSize:12,fontWeight:600,color:"#555" }}>+ 새 기준 추가</p>
        <div style={{ ...styles.field,marginBottom:10 }}>
          <label style={styles.label}>적용 시작일</label>
          <input type="date" style={styles.input} value={newFrom} onChange={e => setNewFrom(e.target.value)} />
        </div>
        <div style={{ display:"flex",gap:8,alignItems:"flex-end",marginBottom:10 }}>
          <div style={{ flex:1 }}>
            <label style={{ ...styles.label,fontSize:10 }}>일 (days)</label>
            <input type="number" style={styles.input} value={newDays} min={0} max={14} placeholder="0"
              onChange={e => setNewDays(e.target.value)} />
          </div>
          <span style={{ fontSize:18,color:"#aaa",paddingBottom:12 }}>+</span>
          <div style={{ flex:1 }}>
            <label style={{ ...styles.label,fontSize:10 }}>시간 (hours)</label>
            <input type="number" style={styles.input} value={newHours} min={0} max={8} step={0.5} placeholder="0"
              onChange={e => setNewHours(e.target.value)} />
          </div>
        </div>
        {(newDays || newHours) && (
          <p style={{ margin:"0 0 8px",fontSize:12,color:"#555" }}>
            → {parseInt(newDays)||0}일 {parseFloat(newHours)||0 > 0 ? `${parseFloat(newHours)}h ` : ""}= {(parseInt(newDays)||0)*9 + (parseFloat(newHours)||0)}h
          </p>
        )}
        <button onClick={addEntry}
          style={{ width:"100%",background:"#3b7ff5",color:"#fff",border:"none",borderRadius:10,padding:"11px 0",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>
          저장
        </button>
      </div>
    </div>
  );
}


// ── 미제출 근무일지 계산 ─────────────────────────────────────────────────
function getMissingLogs(users, logs, periodStart, periodEnd) {
  const results = [];
  const start = new Date(periodStart + "T00:00:00");
  const end   = new Date(periodEnd   + "T00:00:00");
  const today = new Date();
  today.setHours(0,0,0,0);

  // 활성 직원만
  const activeEmps = users.filter(u =>
    !u.resignedDate &&
    u.role === "employee" &&
    u.joinDate && new Date(u.joinDate + "T00:00:00") <= end
  );

  for (const emp of activeEmps) {
    const empStart = new Date(Math.max(start, new Date(emp.joinDate + "T00:00:00")));
    const missing = [];
    for (let d = new Date(empStart); d <= end && d <= today; d.setDate(d.getDate()+1)) {
      const dow = d.getDay();
      if (dow === 0 || dow === 6) continue; // 주말 제외
      const ds = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      const hasLog = logs.some(l => l.userId === emp.id && l.date === ds);
      if (!hasLog) missing.push(ds);
    }
    if (missing.length > 0) results.push({ emp, missing });
  }
  return results;
}


// ─── DeductTab: 일괄 공제 입력 ───────────────────────────────────────────
function DeductTab({ users, leaves, wpStart, wpEnd, persist, removeSavedDeduction, getSavedDeductions }) {
  const fA = (n) => new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(n||0);
  const inp = { width:"100%",border:"1.5px solid #e0e6f0",borderRadius:10,padding:"8px 10px",fontSize:13,fontFamily:"inherit",outline:"none",boxSizing:"border-box",background:"#fff" };
  // 기본 날짜 = 오늘 (현재 보고있는 기간 밖이면 wpStart 로 폴백)
  const _defaultRowDate = () => (today >= wpStart && today <= wpEnd) ? today : wpStart;
  const [newRows, setNewRows] = React.useState([{ id: Date.now(), userId:"", date: _defaultRowDate(), desc:"", amount:"" }]);

  const addRow = () => setNewRows(r => [...r, { id: Date.now()+Math.random(), userId:"", date: _defaultRowDate(), desc:"", amount:"" }]);
  const updateRow = (id, field, val) => setNewRows(r => r.map(x => x.id===id ? {...x,[field]:val} : x));
  const removeRow = (id) => setNewRows(r => r.filter(x => x.id!==id));

  const saveAll = () => {
    // 직원/날짜/항목명만 필수, 금액은 미입력이면 0 으로 저장 (영수증 추적용 등)
    const valid = newRows.filter(r => r.userId && r.date && r.desc);
    if (valid.length === 0) return alert("입력된 항목이 없어요 (직원·날짜·항목명 필수)");
    const newLeaves = {};
    Object.keys(leaves).forEach(k => { newLeaves[k] = {...leaves[k]}; });
    valid.forEach(r => {
      const lv = newLeaves[r.userId] || {};
      const prev = Array.isArray(lv.savedDeductions) ? lv.savedDeductions : Object.values(lv.savedDeductions||{});
      newLeaves[r.userId] = {...lv, savedDeductions: [...prev, {
        id: Date.now() + Math.random(),
        date: r.date,
        desc: r.desc,
        amount: r.amount === "" || r.amount == null ? 0 : (parseFloat(r.amount) || 0)
      }]};
    });
    persist(null, null, newLeaves);
    setNewRows([{ id: Date.now(), userId:"", date: _defaultRowDate(), desc:"", amount:"" }]);
    alert(`✅ ${valid.length}건 저장됐어요`);
  };

  // 현재 구간 전체 저장 항목
  const allSaved = users.flatMap(u => (getSavedDeductions(u.id)||[]).map(d => ({...d, userName: u.name, userId: u.id})))
    .sort((a,b) => a.date.localeCompare(b.date));

  return (
    <div style={{ padding:"0 0 20px" }}>
      {/* 기간 표시 */}
      <div style={{ background:"#EFF6FF",borderRadius:10,padding:"8px 14px",marginBottom:14,fontSize:12,color:"#1D4ED8",fontWeight:600 }}>
        📅 {auD(wpStart)} ~ {auD(wpEnd)} 구간 공제 항목
      </div>

      {/* 입력 폼 */}
      <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:12,boxShadow:"0 1px 4px #0000000a" }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12 }}>
          <p style={{ margin:0,fontSize:13,fontWeight:700,color:"#111" }}>➕ 공제 항목 입력</p>
          <button onClick={addRow}
            style={{ fontSize:12,fontWeight:700,background:"#F3F4F6",color:"#555",border:"1px solid #E5E7EB",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontFamily:"inherit" }}>
            + 행 추가
          </button>
        </div>

        {/* 헤더 */}
        <div style={{ display:"grid",gridTemplateColumns:"2fr 1.2fr 2fr 1.2fr 32px",gap:4,marginBottom:6 }}>
          {["직원","날짜","항목명","금액",""].map((h,i) => (
            <p key={i} style={{ margin:0,fontSize:10,fontWeight:600,color:"#888",textAlign:i===3?"right":"left" }}>{h}</p>
          ))}
        </div>

        {newRows.map(row => (
          <div key={row.id} style={{ display:"grid",gridTemplateColumns:"2fr 1.2fr 2fr 1.2fr 32px",gap:4,marginBottom:6,alignItems:"center" }}>
            <select value={row.userId} onChange={e=>updateRow(row.id,"userId",e.target.value)}
              style={inp}>
              <option value="">직원 선택</option>
              {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
            </select>
            <input type="date" value={row.date} min={wpStart} max={wpEnd}
              onChange={e=>updateRow(row.id,"date",e.target.value)}
              style={{...inp,fontSize:11,padding:"6px 6px"}}/>
            <input placeholder="항목명" value={row.desc}
              onChange={e=>updateRow(row.id,"desc",e.target.value)}
              style={inp}/>
            <input type="number" placeholder="0.00" value={row.amount} step={0.01}
              onChange={e=>updateRow(row.id,"amount",e.target.value)}
              style={{...inp,fontSize:12,textAlign:"right"}}/>
            <button onClick={()=>removeRow(row.id)}
              style={{ background:"none",border:"none",cursor:"pointer",color:"#f77",fontSize:16,padding:0,fontFamily:"inherit" }}>×</button>
          </div>
        ))}

        <button onClick={saveAll}
          style={{ width:"100%",marginTop:8,background:"#3b7ff5",color:"#fff",border:"none",borderRadius:10,padding:"11px 0",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>
          💾 저장
        </button>
      </div>

      {/* 저장된 항목 목록 */}
      {allSaved.length > 0 && (
        <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",boxShadow:"0 1px 4px #0000000a" }}>
          <p style={{ margin:"0 0 10px",fontSize:13,fontWeight:700,color:"#111" }}>📋 저장된 공제 항목 ({allSaved.length}건)</p>
          {allSaved.map(d => (
            <div key={d.id} style={{ display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid #F3F4F6" }}>
              <div style={{ flex:1 }}>
                <p style={{ margin:0,fontSize:12,fontWeight:600 }}>{d.userName} · {auD(d.date)}</p>
                <p style={{ margin:0,fontSize:12,color:"#555" }}>{d.desc}</p>
              </div>
              <span style={{ fontSize:13,fontWeight:700,color:parseFloat(d.amount)<0?"#10B981":"#EF4444" }}>
                {parseFloat(d.amount)<0?"+":"-"}{fA(Math.abs(parseFloat(d.amount)))}
              </span>
              <button onClick={()=>removeSavedDeduction(d.userId, d.id)}
                style={{ background:"none",border:"none",cursor:"pointer",color:"#f77",fontSize:16,padding:"0 4px",fontFamily:"inherit" }}>×</button>
            </div>
          ))}
          <div style={{ marginTop:10,display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700 }}>
            <span>합계</span>
            <span style={{ color:"#EF4444" }}>{fA(allSaved.reduce((s,d)=>s+(parseFloat(d.amount)||0),0))}</span>
          </div>
        </div>
      )}
      {allSaved.length === 0 && (
        <p style={{ textAlign:"center",color:"#aaa",fontSize:12,marginTop:20 }}>이 구간에 저장된 공제 항목이 없어요</p>
      )}
    </div>
  );
}



// ─── MgmtTab ───────────────────────────────────────────────────────────────
function getAESTDate() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Australia/Sydney', year:'numeric', month:'2-digit', day:'2-digit'
  }).formatToParts(now);
  return `${parts.find(p=>p.type==='year').value}-${parts.find(p=>p.type==='month').value}-${parts.find(p=>p.type==='day').value}`;
}

function calcMgmtPeriod(dateStr) {
  const BASE = new Date('2026-04-13T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  const diff = Math.floor((target - BASE) / (14*24*60*60*1000));
  const ps = new Date(BASE); ps.setDate(ps.getDate() + diff*14);
  const pe = new Date(ps); pe.setDate(pe.getDate() + 13);
  // ⚠️ toISOString() 은 UTC 변환이라 호주 기준 하루 밀려나옴 — 로컬 포매터 사용.
  const fmt = d => localDateStr(d);
  return { ps: fmt(ps), pe: fmt(pe), diff };
}

function MgmtTab({ fbUrl, fA }) {
  const base = fbUrl || getFbUrl();
  const [members, setMembers] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [showForm, setShowForm] = React.useState(false);
  const [editMember, setEditMember] = React.useState(null);
  const [selMemberId, setSelMemberId] = React.useState(null);
  const [ksConfig, setKsConfig] = React.useState({ d20:'', d27:'' });
  const [ksEditOpen, setKsEditOpen] = React.useState(false);
  const [ksSaving, setKsSaving] = React.useState(false);

  const todayAEST = getAESTDate();
  const { diff: curDiff } = calcMgmtPeriod(todayAEST);
  const [periodDiff, setPeriodDiff] = React.useState(curDiff - 1);

  const BASE = new Date('2026-04-13T00:00:00');
  const psDate = new Date(BASE); psDate.setDate(psDate.getDate() + periodDiff*14);
  const peDate = new Date(psDate); peDate.setDate(peDate.getDate() + 13);
  // ⚠️ toISOString() 은 UTC 로 변환해서 호주 시간 기준 하루 밀려버림 — 로컬 날짜 포매터 사용.
  const fmt = d => localDateStr(d);
  const periodStart = fmt(psDate);
  const periodEnd = fmt(peDate);
  // 오늘이 속한 실제 "현재" 기간 시작 (편집 폼의 자동 분할 기준)
  const todayPsDate = new Date(BASE); todayPsDate.setDate(todayPsDate.getDate() + curDiff*14);
  const todayPeriodStart = fmt(todayPsDate);

  // 기간에 날짜 포함 여부
  const periodHasDay = (day) => {
    const [sy,sm] = periodStart.split('-').map(Number);
    const [ey,em] = periodEnd.split('-').map(Number);
    let y=sy, m=sm;
    while(y<ey||(y===ey&&m<=em)){
      const d=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      if(d>=periodStart&&d<=periodEnd) return true;
      m++; if(m>12){m=1;y++;}
    }
    return false;
  };
  const has20 = periodHasDay(20);
  const has27 = periodHasDay(27);

  const mFetch = async (path) => {
    if (!base) return null;
    try { const r = await fetch(base+'/mgmt/'+path+'.json'); return r.ok ? r.json() : null; } catch { return null; }
  };
  const mSet = async (path, val) => {
    if (!base) return false;
    try { const r = await fetch(base+'/mgmt/'+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)}); return r.ok; } catch { return false; }
  };
  const mPush = async (path, val) => {
    if (!base) return false;
    try { const r = await fetch(base+'/mgmt/'+path+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)}); return r.ok; } catch { return false; }
  };
  const mDel = async (path) => {
    if (!base) return false;
    try { const r = await fetch(base+'/mgmt/'+path+'.json',{method:'DELETE'}); return r.ok; } catch { return false; }
  };

  const load = async () => {
    const [m, ks] = await Promise.all([mFetch('members'), mFetch('kyleSaraConfig')]);
    if (m) setMembers(Object.entries(m).map(([id,v])=>({...v,id})));
    if (ks) setKsConfig({ d20: ks.d20||'', d27: ks.d27||'' });
    setLoading(false);
  };
  React.useEffect(() => { load(); }, []);

  const saveMember = async (m) => {
    if (!base) { alert('Firebase URL 없음'); return; }
    const {id,...data} = m;
    const ok = id ? await mSet('members/'+id, data) : await mPush('members', data);
    if (ok) { await load(); setShowForm(false); setEditMember(null); }
    else alert('저장 실패');
  };
  const delMember = async (id) => {
    if (!confirm('삭제할까요?')) return;
    await mDel('members/'+id); await load();
  };

  const saveKsConfig = async () => {
    setKsSaving(true);
    const ok = await mSet('kyleSaraConfig', ksConfig);
    setKsSaving(false);
    if (ok) setKsEditOpen(false);
    else alert('저장 실패');
  };

  // 멤버별 금액 계산
  // 기간에 맞는 이력 항목 가져오기
  const getHistoryEntry = (history, ps) => {
    if (!history || !history.length) return null;
    const sorted = [...history].sort((a,b) => b.from.localeCompare(a.from));
    return sorted.find(h => h.from <= ps) || sorted[sorted.length-1];
  };

  // GST 적용 여부 — 기간별 이력의 invoiceGst 플래그가 우선. 없으면 type / 최상위 invoiceGst 폴백.
  const gstAppliesFor = (m, entry) => {
    if (entry && entry.invoiceGst !== undefined) return !!entry.invoiceGst;
    if (m.invoiceGst !== undefined) return !!m.invoiceGst;
    return m.type === 'invoice_gst';
  };

  // 기간별 type 결정 — entry 에 저장된 type 이 우선, 없으면 전역 m.type 폴백.
  // (직원이 월급 → 인보이스+GST 같은 형식 변경을 한 시점부터만 새 type 적용)
  const effectiveType = (m, entry) => (entry && entry.type) || m.type;

  const calcAmt = (m) => {
    // 이력이 있으면 이력 기반, 없으면 현재 값 사용
    const hist = Array.isArray(m.history) ? m.history : Object.values(m.history||{});
    const entry = hist.length > 0 ? getHistoryEntry(hist, periodStart) : null;

    const inv = parseFloat((entry||m).invoiceAmount)||0;
    const gstOn = gstAppliesFor(m, entry);
    const invGst = gstOn ? inv*0.1 : 0;
    const invTotal = inv + invGst;
    const t = effectiveType(m, entry);

    if (t==='monthly') {
      const net = parseFloat((entry||m).salary)||0;
      const tax = parseFloat((entry||m).tax)||0;
      const sup = parseFloat((entry||m).super)||0;
      return { net, tax, sup, inv, invGst, invTotal, total: net+invTotal, _type: t };
    }
    // 'invoice' 와 'invoice_gst' 모두 동일 — GST 는 invoiceGst 플래그(기간별)로 결정
    return { inv, gst: invGst, invGst, invTotal, total: invTotal, _type: t };
  };

  // 카일/사라 찾기
  const kyleMember = members.find(m=>m.name&&(m.name.includes('카일')||m.name.toLowerCase().includes('kyle')));
  const saraMember = members.find(m=>m.name&&(m.name.includes('사라')||m.name.toLowerCase().includes('sara')));

  // 카일/사라 공제 계산 — 기간별 invoiceGst 플래그를 존중하여 GST 적용 여부 결정
  const d20amt = has20 ? (parseFloat(ksConfig.d20)||0) : 0;
  const d27amt = has27 ? (parseFloat(ksConfig.d27)||0) : 0;
  const totalDeduct = d20amt + d27amt;
  const deductEach = totalDeduct / 2;
  const ksFinal = (mem) => {
    if (!mem) return 0;
    const hist = Array.isArray(mem.history) ? mem.history : Object.values(mem.history||{});
    const entry = hist.length > 0 ? getHistoryEntry(hist, periodStart) : null;
    const base = parseFloat((entry||mem).invoiceAmount)||0;
    const afterDeduct = base - deductEach;
    return gstAppliesFor(mem, entry) ? afterDeduct * 1.1 : afterDeduct;
  };
  const kyleFinal = ksFinal(kyleMember);
  const saraFinal = ksFinal(saraMember);

  const isKyleOrSara = (m) => m.id === kyleMember?.id || m.id === saraMember?.id;

  const totalExpected = members.reduce((s,m) => {
    if (isKyleOrSara(m)) return s; // 카일/사라는 별도 계산
    return s + calcAmt(m).total;
  }, 0) + kyleFinal + saraFinal;

  const COLORS = ['#4F46E5','#059669','#D97706','#DC2626','#7C3AED','#0891B2'];
  const typeLabel = {monthly:'월급',invoice:'인보이스',invoice_gst:'인보이스+GST'};
  const periodLabel = periodDiff===curDiff?'현재 기간':periodDiff===curDiff-1?'이전 기간':`${curDiff-periodDiff}기간 전`;

  if (loading) return <div style={{textAlign:'center',padding:'60px 0',color:'#6B7280'}}>⏳ 로딩 중...</div>;

  return (
    <div style={{paddingBottom:80}}>
      {/* 헤더 */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'16px 2px 12px'}}>
        <div>
          <p style={{margin:0,fontSize:16,fontWeight:800,color:'#111827'}}>⭐ 운영진 급여</p>
          <p style={{margin:'2px 0 0',fontSize:11,color:'#6B7280'}}>호주 시드니 시간 기준</p>
        </div>
        <button onClick={()=>{setEditMember(null);setShowForm(true);}}
          style={{background:'#4F46E5',color:'#fff',border:'none',borderRadius:9,padding:'8px 14px',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 2px 6px rgba(79,70,229,0.25)'}}>
          + 멤버
        </button>
      </div>

      {/* 기간 네비게이션 */}
      <div style={{background:'#fff',borderRadius:14,padding:'12px 16px',marginBottom:14,border:'1px solid #E5E8F5',display:'flex',alignItems:'center',justifyContent:'space-between',boxShadow:'0 1px 4px rgba(79,70,229,0.06)'}}>
        <button onClick={()=>setPeriodDiff(d=>d-1)}
          style={{background:'#EEF2FF',border:'none',color:'#4F46E5',borderRadius:8,width:34,height:34,fontSize:18,cursor:'pointer',fontWeight:700}}>‹</button>
        <div style={{textAlign:'center'}}>
          <p style={{margin:0,fontSize:13,fontWeight:700,color:'#111827'}}>{auD(periodStart)} ~ {auD(periodEnd)}</p>
          <p style={{margin:'2px 0 0',fontSize:11,color:'#4F46E5',fontWeight:600}}>{periodLabel}</p>
        </div>
        <button onClick={()=>{if(periodDiff<curDiff)setPeriodDiff(d=>d+1);}}
          style={{background:periodDiff>=curDiff?'#F3F4F6':'#EEF2FF',border:'none',color:periodDiff>=curDiff?'#D1D5DB':'#4F46E5',borderRadius:8,width:34,height:34,fontSize:18,cursor:periodDiff>=curDiff?'default':'pointer',fontWeight:700}}>›</button>
      </div>

      {/* 기간 총액 요약 */}
      <div style={{background:'linear-gradient(135deg,#4F46E5,#7C3AED)',borderRadius:14,padding:'16px',marginBottom:14,color:'#fff'}}>
        <p style={{margin:'0 0 4px',fontSize:11,fontWeight:600,opacity:0.7,textTransform:'uppercase',letterSpacing:1}}>이번 포트나잇 예상 총액</p>
        <p style={{margin:0,fontSize:28,fontWeight:900,letterSpacing:'-0.5px'}}>{fA(totalExpected)}</p>
        <p style={{margin:'4px 0 0',fontSize:11,opacity:0.6}}>{members.length}명</p>
      </div>

      {/* 멤버 카드 */}
      {members.length===0 && (
        <div style={{textAlign:'center',padding:'48px 0',color:'#9CA3AF'}}>
          <div style={{fontSize:44,marginBottom:12}}>⭐</div>
          <p style={{fontSize:14}}>멤버를 추가해보세요</p>
        </div>
      )}

      {members.map((m,mi)=>{
        const color = COLORS[mi%COLORS.length];
        const c = calcAmt(m);
        const expanded = selMemberId===m.id;
        const isKS = isKyleOrSara(m);
        const isKyle = m.id===kyleMember?.id;
        const isSara = m.id===saraMember?.id;

        // 카일/사라 최종 금액
        const ksFinal = isKyle ? kyleFinal : isSara ? saraFinal : null;
        // 기간별 GST/금액 상태 (Kyle/Sara 표시용)
        const _hist  = Array.isArray(m.history) ? m.history : Object.values(m.history||{});
        const _entry = _hist.length > 0 ? getHistoryEntry(_hist, periodStart) : null;
        const periodGstOn = gstAppliesFor(m, _entry);
        const periodBase  = parseFloat((_entry||m||{}).invoiceAmount)||0;
        // 기간별 type — entry.type 우선, 없으면 m.type. 월급에서 인보이스+GST 로 바뀐 시점부터 새 라벨 적용.
        const periodType = effectiveType(m, _entry);
        const periodTypeLabel = periodType==='monthly' ? '월급' : (periodGstOn ? '인보이스+GST' : '인보이스');

        return (
          <div key={m.id} style={{background:'#fff',borderRadius:16,marginBottom:10,border:'1px solid #E5E8F5',overflow:'hidden',boxShadow:'0 2px 8px rgba(79,70,229,0.07)'}}>
            <div style={{padding:'16px',cursor:'pointer'}} onClick={()=>setSelMemberId(expanded?null:m.id)}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:44,height:44,borderRadius:12,background:`${color}15`,border:`2px solid ${color}30`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,fontWeight:900,color,flexShrink:0}}>
                  {(m.name||'?')[0]}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2}}>
                    <span style={{fontSize:15,fontWeight:800,color:'#111827'}}>{m.name}</span>
                    <span style={{background:`${color}15`,color,borderRadius:6,padding:'2px 7px',fontSize:10,fontWeight:700}}>{periodTypeLabel}</span>
                  </div>
                  <p style={{margin:0,fontSize:11,color:'#6B7280'}}>{m.role}</p>
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <p style={{margin:0,fontSize:16,fontWeight:900,color:'#111827'}}>
                    {fA(isKS ? (ksFinal??c.total) : c.total)}
                    {!isKS && c.invGst>0 && <span style={{fontSize:9,fontWeight:600,color:'#6B7280',marginLeft:4}}>inc.GST</span>}
                  </p>
                  {!isKS && c.invGst>0 && (
                    <p style={{margin:'2px 0 0',fontSize:11,color:'#6B7280',fontWeight:600}}>
                      {fA(c.total - c.invGst)} <span style={{fontSize:9,fontWeight:500}}>ex.GST</span>
                    </p>
                  )}
                  {isKS && totalDeduct>0 && (
                    <p style={{margin:'2px 0 0',fontSize:10,color:'#DC2626',fontWeight:600}}>
                      공제 -{fA(deductEach)}
                    </p>
                  )}
                </div>
              </div>

              {/* 브레이크다운 */}
              <div style={{marginTop:10,background:'#F8F9FC',borderRadius:10,padding:'10px 12px'}}>
                {periodType==='monthly' && (
                  <div style={{display:'flex',flexWrap:'wrap',gap:10,fontSize:12}}>
                    <span style={{color:'#6B7280'}}>Net Pay <strong style={{color:'#059669'}}>{fA(c.net)}</strong></span>
                    {c.tax>0&&<span style={{color:'#6B7280'}}>Tax <strong style={{color:'#DC2626'}}>{fA(c.tax)}</strong></span>}
                    {c.sup>0&&<span style={{color:'#6B7280'}}>Super <strong style={{color:'#D97706'}}>{fA(c.sup)}</strong></span>}
                    {c.invTotal>0 && (c.invGst>0 ? (<>
                      <span style={{color:'#6B7280'}}>인보이스(ex.GST) <strong style={{color:'#6B7280'}}>{fA(c.inv)}</strong></span>
                      <span style={{color:'#6B7280'}}>GST +10% <strong style={{color:'#D97706'}}>{fA(c.invGst)}</strong></span>
                      <span style={{color:'#6B7280'}}>인보이스(inc.GST) <strong style={{color:'#4F46E5'}}>{fA(c.invTotal)}</strong></span>
                    </>) : (
                      <span style={{color:'#6B7280'}}>인보이스 <strong style={{color:'#4F46E5'}}>{fA(c.invTotal)}</strong></span>
                    ))}
                  </div>
                )}

                {/* 카일/사라 공제 내역 */}
                {isKS && (
                  <div style={{fontSize:12}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                      <span style={{color:'#6B7280'}}>기본 인보이스</span>
                      <span style={{fontWeight:600,color:'#111827'}}>{fA(periodBase)}</span>
                    </div>
                    {d20amt>0&&<div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                      <span style={{color:'#DC2626'}}>20일 공제</span>
                      <span style={{fontWeight:600,color:'#DC2626'}}>-{fA(d20amt/2)}</span>
                    </div>}
                    {d27amt>0&&<div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                      <span style={{color:'#DC2626'}}>27일 공제</span>
                      <span style={{fontWeight:600,color:'#DC2626'}}>-{fA(d27amt/2)}</span>
                    </div>}
                    {periodGstOn&&<div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                      <span style={{color:'#D97706'}}>GST +10%</span>
                      <span style={{fontWeight:600,color:'#D97706'}}>+{fA(((periodBase-deductEach)*0.1))}</span>
                    </div>}
                    <div style={{borderTop:'1px solid #E5E8F5',marginTop:4,paddingTop:6,display:'flex',justifyContent:'space-between'}}>
                      <span style={{fontWeight:700,color:'#111827'}}>최종 인보이스</span>
                      <span style={{fontWeight:800,color:'#4F46E5',fontSize:14}}>{fA(ksFinal)}</span>
                    </div>
                  </div>
                )}

                {!isKS && (periodType==='invoice'||periodType==='invoice_gst') && (
                  periodGstOn ? (
                    <div style={{display:'flex',flexWrap:'wrap',gap:10,fontSize:12}}>
                      <span style={{color:'#6B7280'}}>인보이스(ex.GST) <strong style={{color:'#6B7280'}}>{fA(c.inv)}</strong></span>
                      <span style={{color:'#6B7280'}}>GST +10% <strong style={{color:'#D97706'}}>{fA(c.invGst)}</strong></span>
                      <span style={{color:'#6B7280'}}>인보이스(inc.GST) <strong style={{color:'#4F46E5'}}>{fA(c.invTotal)}</strong></span>
                    </div>
                  ) : (
                    <span style={{fontSize:12,color:'#6B7280'}}>인보이스 <strong style={{color:'#4F46E5'}}>{fA(c.invTotal)}</strong></span>
                  )
                )}
              </div>
            </div>

            {/* 수정/삭제 */}
            {expanded && (
              <div style={{borderTop:'1px solid #F3F4F6',padding:'12px 16px',display:'flex',gap:8}}>
                <button onClick={()=>{setEditMember(m);setShowForm(true);}}
                  style={{flex:1,background:'#EEF2FF',color:'#4F46E5',border:'1px solid #C7D2FE',borderRadius:9,padding:'9px',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
                  ✏️ 수정
                </button>
                <button onClick={()=>delMember(m.id)}
                  style={{background:'#FEF2F2',color:'#DC2626',border:'1px solid #FECACA',borderRadius:9,padding:'9px 14px',fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>
                  🗑
                </button>
              </div>
            )}
          </div>
        );
      })}

      {/* 카일+사라 공제 설정 */}
      {(kyleMember||saraMember) && (
        <div style={{background:'#fff',borderRadius:14,border:'1px solid #E5E8F5',overflow:'hidden',marginTop:4,boxShadow:'0 1px 4px rgba(79,70,229,0.06)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 16px',cursor:'pointer'}} onClick={()=>setKsEditOpen(!ksEditOpen)}>
            <div>
              <p style={{margin:0,fontSize:13,fontWeight:700,color:'#7C3AED'}}>📅 날짜별 공제 설정</p>
              <p style={{margin:'2px 0 0',fontSize:11,color:'#9CA3AF'}}>
                20일: {ksConfig.d20?fA(parseFloat(ksConfig.d20)):'미설정'}
                {has20&&<span style={{color:'#DC2626',fontWeight:700}}> ← 이번 기간!</span>}
                &nbsp;·&nbsp;
                27일: {ksConfig.d27?fA(parseFloat(ksConfig.d27)):'미설정'}
                {has27&&<span style={{color:'#DC2626',fontWeight:700}}> ← 이번 기간!</span>}
              </p>
            </div>
            <span style={{color:'#7C3AED',fontSize:16}}>{ksEditOpen?'▲':'▼'}</span>
          </div>
          {ksEditOpen && (
            <div style={{borderTop:'1px solid #F3F4F6',padding:'14px 16px'}}>
              <div style={{display:'flex',gap:10,marginBottom:12}}>
                <div style={{flex:1}}>
                  <p style={{margin:'0 0 4px',fontSize:11,color:'#6B7280',fontWeight:600}}>20일 공제액</p>
                  <input type="number" value={ksConfig.d20} onChange={e=>setKsConfig(c=>({...c,d20:e.target.value}))}
                    style={{width:'100%',padding:'9px 12px',border:'1.5px solid #E5E8F5',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff',outline:'none'}} placeholder="0.00"/>
                </div>
                <div style={{flex:1}}>
