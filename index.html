// localStorage polyfill for window.storage API
if (!window.storage) {
  window.storage = {
    get: (k) => Promise.resolve(localStorage.getItem(k) ? {value: localStorage.getItem(k)} : null),
    set: (k, v) => { localStorage.setItem(k, v); return Promise.resolve({key:k, value:v}); },
    delete: (k) => { localStorage.removeItem(k); return Promise.resolve({key:k, deleted:true}); },
    list: () => Promise.resolve({keys: Object.keys(localStorage)}),
  };
}

let _fbUrl = null;

function getFbUrl() {
  try { return localStorage.getItem("wm_fb_url") || null; } catch { return null; }
}
function setFbUrl(url) {
  _fbUrl = url;
  try { localStorage.setItem("wm_fb_url", url); } catch {}
}

async function fbGet(path) {
  const base = _fbUrl || getFbUrl();
  if (!base) return null;
  try {
    const r = await fetch(base + "/" + path + ".json");
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function fbSet(path, value) {
  const base = _fbUrl || getFbUrl();
  if (!base) return false;
  try {
    const r = await fetch(base + "/" + path + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(value),
    });
    return r.ok;
  } catch { return false; }
}


function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function lsDel(k)     { try { localStorage.removeItem(k); } catch {} }

async function sessionGet()    { return lsGet("wm_session", null); }
async function sessionSave(v)  { lsSave("wm_session", v); }
async function sessionRemove() { lsDel("wm_session"); }

// Legacy window.storage compat (for loading old local data)
async function legacyGet(key) {
  try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; } catch { return null; }
}

function calcHours(s, e) {
  if (!s || !e) return 0;
  const [sh, sm] = s.split(":").map(Number);
  const [eh, em] = e.split(":").map(Number);
  return Math.max(0, (eh * 60 + em - sh * 60 - sm) / 60);

// Haversine distance (km) between two named locations, with road factor
function geoKm(a, b) {
  const c1 = LOCATION_COORDS[a], c2 = LOCATION_COORDS[b];
  if (!c1 || !c2) return null;
  const R = 6371, toR = Math.PI / 180;
  const dLat = (c2[0] - c1[0]) * toR;
  const dLon = (c2[1] - c1[1]) * toR;
  const h = Math.sin(dLat/2)**2 + Math.cos(c1[0]*toR)*Math.cos(c2[0]*toR)*Math.sin(dLon/2)**2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)) * 1.28); // road factor 1.28
}

// Allowance formula (applied to total km - round trip or one-way for 출장)
function calcTravelAllowance(km) {
  if (!km || km <= 0) return 0;
  const deducted = Math.max(0, km - 50);
  const m = deducted / 50;
  const dec = m % 1;
  const units = Math.floor(m) + (dec < 0.4 ? 0 : dec < 0.8 ? 0.5 : 1);
  const before = units * 16;
  return Math.max(before, before > 0 ? 10 : 0);
}


const ANNUAL_LEAVE_DAYS  = 20;
const HOURS_PER_DAY      = 7.6;
const ANNUAL_LEAVE_HOURS = ANNUAL_LEAVE_DAYS * HOURS_PER_DAY; // 152h

// Get the CURRENT leave year: most recent anniversary → next anniversary
function getCurrentLeaveYear(leaveStartDate) {
  if (!leaveStartDate) return null;
  const start = new Date(leaveStartDate + "T00:00:00");
  const now   = new Date();
  let yearStart = new Date(start);
  // advance year-by-year until next anniversary is in the future
  while (true) {
    const next = new Date(yearStart);
    next.setFullYear(next.getFullYear() + 1);
    if (next > now) break;
    yearStart = next;
  }
  const yearEnd = new Date(yearStart);
  yearEnd.setFullYear(yearEnd.getFullYear() + 1);
  return { start: yearStart, end: yearEnd };
}

// Normalize old leave format → new format
function normLeave(lv, joinDate) {
  const base = joinDate || today;
  if (!lv) return { leaveStartDate: base, usedDays: 0, rateHistory: [{ from: base, dailyRate: 0 }], usageRecords: [] };
  const usageRecords = Array.isArray(lv.usageRecords) ? lv.usageRecords : [];
  // usedDays = sum of usageRecords if records exist, else fall back to stored value
  const usedDays = usageRecords.length > 0
    ? Math.round(usageRecords.reduce((s, r) => s + (+(r.days) || 0), 0) * 100) / 100
    : +(lv.usedDays || (lv.used ? +(lv.used / HOURS_PER_DAY).toFixed(2) : 0)) || 0;
  if (lv.leaveStartDate !== undefined) return { ...lv, usedDays, usageRecords };
  return { leaveStartDate: base, usedDays, rateHistory: [{ from: base, dailyRate: 0 }], usageRecords };
}

// Accrued days in the CURRENT leave year, capped at 20
function calcAccruedDays(leaveStartDate) {
  if (!leaveStartDate) return 0;  const yr = getCurrentLeaveYear(leaveStartDate);
  if (!yr) return 0;
  const now       = new Date();
  const cutoff    = now < yr.end ? now : yr.end;
  const elapsed   = Math.max(0, cutoff - yr.start);
  const yearTotal = yr.end - yr.start;
  return Math.round(Math.min(elapsed / yearTotal, 1) * ANNUAL_LEAVE_DAYS * 100) / 100;
}

// Split CURRENT leave year by daily rate changes → proportional leave days per period
function getLeavePeriods(leaveStartDate, rateHistory) {
  if (!leaveStartDate || !rateHistory || rateHistory.length < 2) return [];
  const yr = getCurrentLeaveYear(leaveStartDate);
  if (!yr) return [];
  const { start, end } = yr;
  const yearTotalMs = end - start;

  // Only rate entries that are relevant (rate in effect covers part of this year)
  const sorted = [...rateHistory]
    .sort((a, b) => a.from.localeCompare(b.from))
    .filter((r, i, arr) => {
      const rEnd = i < arr.length - 1 ? new Date(arr[i+1].from + "T00:00:00") : end;
      return new Date(r.from + "T00:00:00") < end && rEnd > start;
    });

  if (sorted.length < 2) return [];

  const periods = [];
  for (let i = 0; i < sorted.length; i++) {
    const pStart = new Date(Math.max(+new Date(sorted[i].from + "T00:00:00"), +start));
    const pEnd   = i < sorted.length - 1
      ? new Date(Math.min(+new Date(sorted[i+1].from + "T00:00:00"), +end))
      : end;
    if (+pEnd <= +pStart) continue;
    const calDays   = Math.round((pEnd - pStart) / (1000 * 60 * 60 * 24));
    const leaveDays = Math.round(((pEnd - pStart) / yearTotalMs) * ANNUAL_LEAVE_DAYS * 100) / 100;
    periods.push({
      from:       pStart.toISOString().slice(0, 10),
      to:         pEnd.toISOString().slice(0, 10),
      calDays,
      leaveDays,
      leaveHours: Math.round(leaveDays * HOURS_PER_DAY * 100) / 100,
      dailyRate:  sorted[i].dailyRate,
    });
  }
  return periods;
}

// Show current leave year label e.g. "2025-07-01 ~ 2026-07-01"
function leaveYearLabel(leaveStartDate) {
  const yr = getCurrentLeaveYear(leaveStartDate);
  if (!yr) return "";
  return `${yr.start.toISOString().slice(0,10)} ~ ${yr.end.toISOString().slice(0,10)}`;
}

// For ADMIN: how many days/hours have accrued under each rate period UP TO TODAY
function getAccruedByPeriod(leaveStartDate, rateHistory) {
  const yr = getCurrentLeaveYear(leaveStartDate);
  if (!yr || !rateHistory || rateHistory.length < 2) return [];
  const { start, end } = yr;
  const yearTotalMs = end - start;
  const now = new Date();

  const sorted = [...rateHistory]
    .sort((a, b) => a.from.localeCompare(b.from))
    .filter((r, i, arr) => {
      const rEnd = i < arr.length - 1 ? new Date(arr[i+1].from + "T00:00:00") : end;
      return new Date(r.from + "T00:00:00") < end && rEnd > start;
    });

  if (sorted.length < 2) return [];

  return sorted.map((r, i) => {
    const pStart = new Date(Math.max(+new Date(r.from + "T00:00:00"), +start));
    const pEnd   = i < sorted.length - 1
      ? new Date(Math.min(+new Date(sorted[i+1].from + "T00:00:00"), +end))
      : end;
    if (+pEnd <= +pStart) return null;

    // Elapsed portion of this period up to today
    const todayCap     = now < pEnd ? now : pEnd;
    const elapsedMs    = Math.max(0, +todayCap - +pStart);
    const totalPeriodMs = +pEnd - +pStart;

    const calDaysElapsed = Math.round(elapsedMs / (1000*60*60*24));
    const calDaysTotal   = Math.round(totalPeriodMs / (1000*60*60*24));
    const accruedDays    = Math.round((elapsedMs / yearTotalMs) * ANNUAL_LEAVE_DAYS * 100) / 100;
    const accruedHours   = Math.round(accruedDays * HOURS_PER_DAY * 100) / 100;
    const totalDays      = Math.round((totalPeriodMs / yearTotalMs) * ANNUAL_LEAVE_DAYS * 100) / 100;

    return {
      from: pStart.toISOString().slice(0, 10),
      to:   pEnd.toISOString().slice(0, 10),
      calDaysElapsed, calDaysTotal,
      accruedDays, accruedHours,
      totalDays,
      dailyRate: r.dailyRate,
      isActive:   now >= pStart && now < pEnd,
      isComplete: now >= pEnd,
    };
  }).filter(Boolean).filter(p => p.calDaysTotal > 0);
}
// Count fully completed leave years since leaveStartDate
function getCompletedYears(leaveStartDate) {
  if (!leaveStartDate) return 0;
  const start = new Date(leaveStartDate + "T00:00:00");
  if (isNaN(start.getTime())) return 0;
  const now   = new Date();
  let count = 0, curr = new Date(start);
  while (count < 200) {
    const next = new Date(curr);
    next.setFullYear(next.getFullYear() + 1);
    if (next > now) break;
    curr = next; count++;
  }
  return count;
}

export default function App() {
  const [ready, setReady]   = useState(false);
  const [session, setSession] = useState(null);
  const [users, setUsers]   = useState(SEED_USERS);
  const [logs, setLogs]     = useState([]);
  const [leaves, setLeaves] = useState(SEED_LEAVES);
  const [tab, setTab]       = useState("home");

  // Load all data from persistent storage on mount
  const [fbConfigured, setFbConfigured] = useState(false);
  const pollRef = useRef(null);

  const loadFromFb = async () => {
    const [u, l, lv] = await Promise.all([
      fbGet("users"), fbGet("logs"), fbGet("leaves"),
    ]);
    if (u) setUsers(Object.values(u).length ? Object.values(u) : u);
    if (l) setLogs(Array.isArray(l) ? l : Object.values(l));
    if (lv) setLeaves(lv);
    return !!(u || l || lv);
  };

  useEffect(() => {
    (async () => {
      const fbUrl = getFbUrl();
      if (fbUrl) {
        _fbUrl = fbUrl;
        setFbConfigured(true);
        await loadFromFb();
        // Poll every 30s for real-time feel
        pollRef.current = setInterval(loadFromFb, 30000);
      } else {
        // No Firebase - load from legacy window.storage / local fallback
        const u  = await legacyGet("wm_users")  || SEED_USERS;
        const l  = await legacyGet("wm_logs")   || [];
        const lv = await legacyGet("wm_leaves") || SEED_LEAVES;
        setUsers(u); setLogs(l); setLeaves(lv);
      }
      setSession(await sessionGet());
      setReady(true);
    })();
    return () => { if (pollRef.current) clearInterval(pollRef.current); };
  }, []);

  const saveFb = useCallback(async (u, l, lv) => {
    const base = _fbUrl || getFbUrl();
    if (!base) return;
    if (u)  fbSet("users",  u);
    if (l)  fbSet("logs",   l);
    if (lv) fbSet("leaves", lv);
  }, []);

  const persist = useCallback(async (u, l, lv) => {
    if (u)  { setUsers(u);  saveFb(u, null, null); }
    if (l)  { setLogs(l);   saveFb(null, l, null); }
    if (lv) { setLeaves(lv); saveFb(null, null, lv); }
  }, [saveFb]);

  const updateLeaveUsage = useCallback((userId, joinDate, records) => {
    setLeaves(prev => {
      const lv = normLeave(prev[userId] || {}, joinDate);
      const usedDays = Math.round(records.reduce((s, r) => s + (+(r.days) || 0), 0) * 100) / 100;
      const next = { ...prev, [userId]: { ...lv, usageRecords: records, usedDays } };
      saveFb(null, null, next);
      return next;
    });
  }, [saveFb]);

  const login = async (user) => {
    await sessionSave(user);
    setSession(user);
    setTab("home");
  };

  const logout = async () => {
    await sessionRemove();
    setSession(null);
  };

  if (!ready) return (
    <div style={{ minHeight: "100dvh", display: "flex", alignItems: "center", justifyContent: "center", background: "#f4f6fb" }}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 40, marginBottom: 12 }}>📋</div>
        <p style={{ color: "#3b7ff5", fontWeight: 700, fontSize: 16 }}>WorkLog 로딩 중...</p>
      </div>
    </div>
  );

  if (!getFbUrl()) return (
    <FirebaseSetup onDone={async (url) => {
      setFbUrl(url); _fbUrl = url;
      const ok = await loadFromFb();
      if (!ok) { await saveFb(SEED_USERS, [], SEED_LEAVES); }
      pollRef.current = setInterval(loadFromFb, 30000);
      setFbConfigured(true);
    }} />
  );

  const handleTeamCode = async (payload) => {
    const u  = payload.users  || SEED_USERS;
    const lv = payload.leaves || SEED_LEAVES;
    setUsers(u); setLeaves(lv);
    saveFb(u, null, lv);
  };

  if (!session) return <LoginScreen users={users} onLogin={login} onTeamCode={handleTeamCode} />;

  const currentUser = users.find(u => u.id === session.id) || session;
  const isAdmin = currentUser.role === "admin";

  return (
    <div style={styles.app}>
      <Header user={currentUser} onLogout={logout} />
      <div style={styles.content}>
        {tab === "home" && <HomeTab user={currentUser} users={users} logs={logs} leaves={leaves} isAdmin={isAdmin} />}
        {tab === "log" && <LogTab user={currentUser} users={users} logs={logs} leaves={leaves} isAdmin={isAdmin} persist={persist} />}
        {tab === "leave" && <LeaveTab user={currentUser} users={users} leaves={leaves} isAdmin={isAdmin} persist={persist} updateLeaveUsage={updateLeaveUsage} />}
        {isAdmin && tab === "team" && <TeamTab users={users} leaves={leaves} logs={logs} persist={persist} />}
        {tab === "payroll" && <PayrollTab user={currentUser} users={users} logs={logs} leaves={leaves} isAdmin={isAdmin} persist={persist} />}
      </div>
      <BottomNav tab={tab} setTab={setTab} isAdmin={isAdmin} userHasLeave={isAdmin || !normLeave(leaves[currentUser.id], currentUser.joinDate).noLeave} />
    </div>
  );
}


function FirebaseSetup({ onDone }) {
  const [url, setUrl]     = useState("");
  const [testing, setTesting] = useState(false);
  const [err, setErr]     = useState("");

  const test = async () => {
    if (!url.trim()) { setErr("URL을 입력하세요."); return; }
    const clean = url.trim().replace(/\/$/, "");
    setTesting(true); setErr("");
    try {
      const r = await fetch(clean + "/.json");
      if (!r.ok) throw new Error("연결 실패 (HTTP " + r.status + ")");
      setTesting(false);
      onDone(clean);
    } catch(e) {
      setTesting(false);
      setErr("❌ 연결 실패: " + e.message + "\nURL을 다시 확인해주세요.");
    }
  };

  return (
    <div style={{ minHeight:"100dvh", background:"#f4f6fb", display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div style={{ background:"#fff", borderRadius:20, padding:"32px 24px", width:"100%", maxWidth:400, boxShadow:"0 8px 40px #3b7ff520" }}>
        <div style={{ textAlign:"center", marginBottom:24 }}>
          <div style={{ fontSize:44, marginBottom:8 }}>🔥</div>
          <h2 style={{ margin:0, fontSize:22, fontWeight:800, color:"#3b7ff5" }}>Firebase 연결</h2>
          <p style={{ margin:"8px 0 0", fontSize:13, color:"#888" }}>실시간 동기화를 위해 한 번만 설정해요</p>
        </div>

        <div style={{ background:"#f0f5ff", borderRadius:12, padding:14, marginBottom:20, fontSize:12, color:"#3b5fc0", lineHeight:1.7 }}>
          <strong>설정 방법 (5분)</strong><br/>
          1. <a href="https://console.firebase.google.com" target="_blank" rel="noopener" style={{ color:"#3b7ff5" }}>console.firebase.google.com</a> 접속<br/>
          2. 프로젝트 만들기 (Google Analytics 비활성화)<br/>
          3. 왼쪽 "빌드" → "Realtime Database" → "데이터베이스 만들기"<br/>
          4. <strong>테스트 모드</strong>로 시작 → 완료<br/>
          5. 화면 상단 URL 복사 후 아래 붙여넣기<br/>
          <span style={{ color:"#888" }}>예: https://myapp-default-rtdb.firebaseio.com</span>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={{ display:"block", fontSize:11, fontWeight:600, color:"#888", marginBottom:6, textTransform:"uppercase" }}>Firebase Database URL</label>
          <input style={{ width:"100%", boxSizing:"border-box", border:"1.5px solid #e0e6f0", borderRadius:10, padding:"10px 12px", fontSize:13, fontFamily:"inherit", outline:"none" }}
            value={url} onChange={e => setUrl(e.target.value)}
            placeholder="https://yourapp-default-rtdb.firebaseio.com"
            autoCapitalize="none" />
        </div>
        {err && <p style={{ color:"#f77", fontSize:12, marginBottom:10, whiteSpace:"pre-line" }}>{err}</p>}
        <button style={{ width:"100%", background:"#3b7ff5", color:"#fff", border:"none", borderRadius:12, padding:"13px 0", fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}
          onClick={test} disabled={testing}>
          {testing ? "연결 테스트 중..." : "🔗 연결하기"}
        </button>
      </div>
    </div>
  );
}


function LoginScreen({ users, onLogin, onTeamCode }) {
  const [id, setId] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [showCode, setShowCode] = useState(false);
  const [codeInput, setCodeInput] = useState("");
  const [codeErr, setCodeErr] = useState("");

  const submit = () => {
    const user = users.find(u => u.id === id && u.pw === pw);
    if (!user) { setErr("아이디 또는 비밀번호가 올바르지 않습니다."); return; }
    onLogin(user);
  };

  const applyCode = () => {
    try {
      const decoded = decodeURIComponent(escape(atob(codeInput.trim())));
      const payload = JSON.parse(decoded);
      if (!payload.users) { setCodeErr("올바른 팀 코드가 아닙니다."); return; }
      onTeamCode(payload);
      setShowCode(false);
      setCodeErr("");
    } catch { setCodeErr("코드가 올바르지 않습니다. 다시 확인해주세요."); }
  };

  return (
    <div style={styles.loginWrap}>
      <div style={styles.loginBox}>
        <div style={styles.loginLogo}>
          <div style={styles.logoIcon}>📋</div>
          <h1 style={styles.logoTitle}>WorkLog</h1>
          <p style={styles.logoSub}>근무일지 & 연차 관리 시스템</p>
        </div>

        {!showCode ? (
          <>
            <div style={styles.field}>
              <label style={styles.label}>아이디</label>
              <input style={styles.input} value={id} onChange={e => setId(e.target.value)}
                placeholder="아이디 입력" onKeyDown={e => e.key === "Enter" && submit()} autoCapitalize="none" />
            </div>
            <div style={styles.field}>
              <label style={styles.label}>비밀번호</label>
              <input style={styles.input} type="password" value={pw} onChange={e => setPw(e.target.value)}
                placeholder="비밀번호 입력" onKeyDown={e => e.key === "Enter" && submit()} />
            </div>
            {err && <p style={styles.errText}>{err}</p>}
            <button style={styles.btnPrimary} onClick={submit}>로그인</button>
            <button style={{ ...styles.btnSecondary, width: "100%", marginTop: 10 }}
              onClick={() => setShowCode(true)}>🔑 팀 코드로 계정 설정</button>
          </>
        ) : (
          <>
            <p style={{ fontSize: 13, color: C.sub, marginBottom: 12, textAlign: "center" }}>
              관리자에게 받은 팀 코드를 붙여넣으세요
            </p>
            <div style={styles.field}>
              <label style={styles.label}>팀 코드</label>
              <textarea style={{ ...styles.input, height: 80, fontSize: 11, wordBreak: "break-all" }}
                value={codeInput} onChange={e => setCodeInput(e.target.value)}
                placeholder="코드 붙여넣기..." />
            </div>
            {codeErr && <p style={styles.errText}>{codeErr}</p>}
            <button style={styles.btnPrimary} onClick={applyCode}>✅ 적용하기</button>
            <button style={{ ...styles.btnSecondary, width: "100%", marginTop: 10 }}
              onClick={() => setShowCode(false)}>← 돌아가기</button>
          </>
        )}
      </div>
    </div>
  );

                <span style={{ ...styles.statusBadge,
                  background: l.workType === "overtime" ? "#f7a44022" : l.workType === "parttime" ? "#7b5ea722" : l.workType === "dayoff" ? "#88888822" : l.workType === "publicholiday" ? "#e0700022" : "#4f8ef722",
                  color: l.workType === "overtime" ? "#c87800" : l.workType === "parttime" ? "#7b5ea7" : l.workType === "dayoff" ? "#888" : l.workType === "publicholiday" ? "#e07000" : "#3b7ff5"
                }}>

                {confirmDeleteId === l.id ? (
                  <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                    <button style={{ ...styles.confirmYes, fontSize: 10, padding: "2px 6px" }} onClick={() => deleteLog(l.id)}>삭제</button>

      })}

      {showForm && (
        <LogForm
          log={editLog}
          userId={editLog ? editLog.userId : (isAdmin ? (filterUser === "all" ? users.find(u => u.role !== "admin") && users.find(u => u.role !== "admin").id || user.id || user.id : filterUser) : user.id)}

          leaves={leaves}
          isAdmin={isAdmin}
          onSave={(newLog) => {
            const next = editLog ? logs.map(l => l.id === editLog.id ? newLog : l) : [newLog, ...logs];
            persist(null, next, null);
            setShowForm(false);
          }}
          onClose={() => setShowForm(false)}
        />
      )}
    </div>
  );
}


function OsrmLegBox({ from, to, autoKm, overrideVal, onOverride, onReset }) {
  const [loading, setLoading] = useState(false);
  const fetchOsrm = async () => {
    const c1 = LOCATION_COORDS[from], c2 = LOCATION_COORDS[to];
    if (!c1 || !c2) return;
    setLoading(true);
    const km = await fetchDrivingKm(c1, c2);
    setLoading(false);
    if (km) onOverride(km);
  };
  const display = overrideVal !== undefined ? overrideVal : (autoKm || "");
  return (
    <div style={styles.legKmBox}>
      {overrideVal === undefined && autoKm !== null && <span style={styles.legKmAuto}>📐 {autoKm}km</span>}
      <input type="number" style={styles.legKmInput} value={display}
        placeholder={autoKm !== null ? `${autoKm}` : "km"}
        onChange={e => onOverride(e.target.value)} min={0} />
      {LOCATION_COORDS[from] && LOCATION_COORDS[to] && (
        <button style={styles.osrmBtn} onClick={fetchOsrm} disabled={loading} title="실제 도로 거리">{loading ? "…" : "🗺️"}</button>
      )}
      {overrideVal !== undefined && <button style={styles.legKmReset} onClick={onReset}>↺</button>}
    </div>
  );
}

    ? `https://www.google.com/maps/dir/${encodeURIComponent(fromName + ", NSW")}/${encodeURIComponent(toName + ", NSW")}`
    : null;
  return (
    <div style={{ ...styles.legKmBox, borderColor: "#a0c4ff", background: "#f0f6ff", flexDirection: "column", alignItems: "stretch", gap: 8, minWidth: 190, padding: "10px 12px" }}>
      {mapsUrl && (
        <a href={mapsUrl} target="_blank" rel="noopener noreferrer" style={styles.geocodeBtn}>
          🗺️ Google Maps에서 거리 확인
        </a>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <input
          ref={ref}
          type="text"
          inputMode="numeric"
          pattern="[0-9]*"
          style={{ ...styles.legKmInput, flex: 1, textAlign: "left", fontSize: 14, width: "auto", minWidth: 60 }}
          defaultValue={overrideVal || ""}
          placeholder="km 입력"
          onBlur={e => { if (e.target.value) onOverride(e.target.value); }}
          onKeyDown={e => { if (e.key === "Enter" && ref.(current && current.value)) onOverride(ref.current.value); }}
        />
        <span style={{ fontSize: 11, color: C.sub, whiteSpace: "nowrap" }}>km</span>
        {overrideVal !== undefined && <button style={styles.legKmReset} onClick={() => { if (ref.current) ref.current.value = ""; onReset(); }}>↺</button>}
      </div>
      {overrideVal !== undefined && <span style={{ fontSize: 11, color: "#34c98b", fontWeight: 600 }}>✅ {overrideVal}km 저장됨</span>}
    </div>
  );
}

const WORK_TYPES_BASE = [
  { key: "fulltime",  label: "풀타임",     emoji: "✅" },
  { key: "overtime",  label: "오버타임",   emoji: "⏰" },
  { key: "parttime",  label: "파트타임",   emoji: "🕐" },
  { key: "dayoff",    label: "휴무",       emoji: "🌴" },
];
// Public holiday: weekday only, leave-accruing employees only
function getWorkTypes(date, hasLeaveAccrual) {
  const types = [...WORK_TYPES_BASE];
  if (hasLeaveAccrual) {
    const day = new Date((date || today) + "T00:00:00").getDay();
    const isWeekday = day >= 1 && day <= 5;
    if (isWeekday) types.push({ key: "publicholiday", label: "퍼블릭홀리데이", emoji: "🎉" });
  }
  return types;
}



function LogForm({ log, userId, users, leaves, isAdmin, onSave, onClose }) {
  // Detect existing workType from saved log
  const detectType = (l) => {
    if (!l) return "fulltime";
    if (l.workType) return l.workType;
    if (l.status === "연장근무") return "overtime";
    return "fulltime";
  };

  const [workType, setWorkType] = useState(detectType(log));
  const [form, setForm] = useState(() => {
    const wt = detectType(log);
    return {
      id: (log && log.id) || uid(),
      userId: (log && log.userId) || userId,
      date: (log && log.date) || new Date().toISOString().slice(0, 10),
      startTime: wt === "parttime" ? ((log && log.startTime) || "09:00") : FULLTIME_START,
      endTime:   wt === "parttime" ? ((log && log.endTime)   || "13:00") : FULLTIME_END,
      otStart: (log && log.otStart) || FULLTIME_END,
      otEnd:   (log && log.otEnd)   || "18:00",
      content: (log && log.content) || "",
      status:  (log && log.status)  || "정상",
      hours:   (log && log.hours)   || FULLTIME_HOURS,
      workType: wt,
      travel: (log && log.travel) || null,
    };
  });

  // Check if the logged user has leave accrual
  const logUserId = form.userId || userId;
  const targetLeave = normLeave((leaves || {})[logUserId], (users && users.find)(u => u.id === logUserId) && users.find(u => u.id === logUserId).joinDate);
  const hasLeaveAccrual = !targetLeave.noLeave;

  // Dynamic work types based on date and leave accrual
  const WORK_TYPES = getWorkTypes(form.date, hasLeaveAccrual);

  // Recalc hours
  const recalcHours = (f, wt) => {
    if (wt === "fulltime" || wt === "publicholiday") return FULLTIME_HOURS;
    if (wt === "overtime")  return FULLTIME_HOURS + calcHours(f.otStart, f.otEnd);
    if (wt === "parttime")  return calcHours(f.startTime, f.endTime);
    if (wt === "dayoff")    return 0;
    return f.hours;
  };

  const set = (k, v) => {
    setForm(f => {
      const next = { ...f, [k]: v };
      next.hours = recalcHours(next, workType);
      return next;
    });
  };

  const switchType = (wt) => {
    setWorkType(wt);
    setForm(f => {
      const next = { ...f, workType: wt };
      if (wt === "fulltime" || wt === "overtime" || wt === "publicholiday") {
        next.startTime = FULLTIME_START;
        next.endTime   = FULLTIME_END;
      }
      if (wt === "dayoff") { next.startTime = ""; next.endTime = ""; }
      next.hours = recalcHours(next, wt);
      return next;
    });
  };

  
  const [hasTavel, setHasTravel] = useState(!!(log && log.travel));

  // Normalize travel data - handles old formats (from/to/via) and new format (stops)
  const normTravel = (t) => {
    if (!t) return { isBizTrip: false, hasDinner: false, stops: ["Bathurst", ""], kmOverrides: {}, adminConfirmed: false };
    if (t.stops && Array.isArray(t.stops)) return { isBizTrip: false, hasDinner: false, adminConfirmed: false, ...t, kmOverrides: t.kmOverrides || {} };
    // Migrate old format: { from, via[], to/destination }
    const oldFrom = t.from || "Bathurst";
    const oldVia  = Array.isArray(t.via) ? t.via : [];
    const oldTo   = t.to || t.destination || "";
    return { isBizTrip: !!t.isBizTrip, hasDinner: !!t.hasDinner, adminConfirmed: false, stops: [oldFrom, ...oldVia, oldTo], kmOverrides: {} };
  };

  const initTravel = normTravel((log && log.travel));
  const [travel, setTravel] = useState(initTravel);

  // Track which stops are in "custom text" mode (not from dropdown)
  const [stopModes, setStopModes] = useState(() => {
    const m = {};
    (initTravel.stops || []).forEach((s, i) => {
      if (s && !ALL_LOCATIONS.includes(s)) m[i] = "custom";
    });
    return m;
  });
  // Cache geocoded coords for custom stops: { [stopIndex]: [lat, lng] }
  const [customCoords, setCustomCoords] = useState({});

  const getCoord = (stopName, stopIndex) =>
    LOCATION_COORDS[stopName] || customCoords[stopIndex] || null;

  // Compute leg distances and totals
  const getTravelCalc = (t, sm) => {
    const stops = Array.isArray((t && t.stops)) ? t.stops : ["Bathurst", ""];
    const kmOverrides = (t && t.kmOverrides) || {};
    const isBizTrip = !!(t && t.isBizTrip);

    // Outbound legs: each consecutive stop pair
    const legs = stops.slice(0, -1).map((from, i) => {
      const to = stops[i + 1];
      const c1 = getCoord(from, i);
      const c2 = getCoord(to, i + 1);
      const isManual = (!c1 || !c2);
      const autoKm = (!isManual) ? (geoKm(from, to) || null) : null;
      const km = kmOverrides[i] !== undefined ? Number(kmOverrides[i]) : (autoKm || 0);
      return { from, to, autoKm, km, isManual, hasCoords: !!c1 && !!c2 };
    });

    const outboundKm = legs.reduce((s, l) => s + (l.km || 0), 0);

    // Return leg: destination → origin directly
    const origin = stops[0];
    const dest   = stops[stops.length - 1];
    const c1 = getCoord(origin, 0);
    const c2 = getCoord(dest, stops.length - 1);
    const returnIsManual = (!c1 || !c2);
    const returnAutoKm = (!returnIsManual && dest && origin && dest !== origin)
      ? (geoKm(dest, origin) || null) : null;
    const returnOverride = kmOverrides["return"];
    const returnKm = returnOverride !== undefined
      ? Number(returnOverride)
      : (returnAutoKm || (outboundKm > 0 ? outboundKm : 0));

    const totalKm = isBizTrip ? outboundKm : outboundKm + returnKm;
    const allowance = calcTravelAllowance(totalKm);
    const needsConfirm = legs.some((l, i) => l.isManual && kmOverrides[i] !== undefined)
      || (returnIsManual && returnOverride !== undefined);

    return { legs, outboundKm, returnKm, returnAutoKm, returnIsManual, totalKm, allowance, needsConfirm };
  };

  const setTravelField = (patch) => setTravel(t => ({ ...t, ...patch }));

  const setStop = (i, val, isCustom = false) => {
    setTravel(t => { const stops = [...t.stops]; stops[i] = val; return { ...t, stops }; });
    setStopModes(m => isCustom ? { ...m, [i]: "custom" } : (() => { const n = { ...m }; delete n[i]; return n; })());
  };

  const addStop = () => {
    setTravel(t => {
      const stops = [...t.stops];
      stops.splice(stops.length - 1, 0, "");
      return { ...t, stops };
    });
  };

  const removeStop = (i) => {
    setTravel(t => {
      const stops = t.stops.filter((_, j) => j !== i);
      const kmOverrides = { ...t.kmOverrides };
      delete kmOverrides[i];
      return { ...t, stops, kmOverrides };
    });
    setStopModes(m => { const n = { ...m }; delete n[i]; return n; });
  };

  const setKmOverride = (i, val) =>
    setTravel(t => ({ ...t, kmOverrides: { ...t.kmOverrides, [i]: val === "" ? undefined : val } }));

  const [submitErr, setSubmitErr] = useState("");

  const travelCalc = getTravelCalc(travel, stopModes);

  const submit = () => {
    if (hasTavel) {
      const stops = travel.stops || [];
      if (!stops[0] || !stops[stops.length - 1]) {
        setSubmitErr("출발지와 도착지를 입력해주세요."); return;
      }
    }
    setSubmitErr("");
    const saved = { ...form, workType, travel: hasTavel ? { ...travel, ...travelCalc, adminConfirmed: false } : null };
    const statusMap = { fulltime:"풀타임", overtime:"오버타임", parttime:"파트타임", dayoff:"휴무", publicholiday:"퍼블릭홀리데이" };
    saved.status = statusMap[workType] || "풀타임";
    onSave(saved);
  };

  const otHours = workType === "overtime" ? calcHours(form.otStart, form.otEnd) : 0;

  return (
    <div style={styles.modal}>
      <div style={styles.modalBox}>
        <div style={styles.modalHeader}>
          <h3 style={styles.modalTitle}>{log ? "근무일지 수정" : "근무일지 등록"}</h3>
          <button style={styles.iconBtn} onClick={onClose}>{Icon.x}</button>
        </div>

        {/* Employee selector (admin only) */}
        {isAdmin && (
          <div style={styles.field}>
            <label style={styles.label}>직원</label>
            <select style={styles.input} value={form.userId} onChange={e => set("userId", e.target.value)}>
              {users.filter(u => u.role !== "admin").map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
            </select>
          </div>
        )}

        {/* Date */}
        <div style={styles.field}>
          <label style={styles.label}>날짜</label>
          <input type="date" style={styles.input} value={form.date} onChange={e => set("date", e.target.value)} />
        </div>

        {/* Work type toggle */}
        <div style={styles.field}>
          <label style={styles.label}>근무 유형</label>
          <div style={styles.typeRow}>
            {WORK_TYPES.map(wt => (
              <button key={wt.key}
                style={{ ...styles.typeBtn, ...(workType === wt.key ? styles.typeBtnActive : {}) }}
                onClick={() => switchType(wt.key)}>
                {wt.emoji} {wt.label}
              </button>
            ))}
          </div>
        </div>

        {/* Full-time / public holiday: show fixed hours info */}
        {(workType === "fulltime" || workType === "publicholiday") && (
          <div style={styles.timeInfoBox}>
            <span style={styles.timeInfoIcon}>{workType === "publicholiday" ? "🎉" : "🕖"}</span>
            <span>{workType === "publicholiday" ? "퍼블릭홀리데이" : "풀타임"} <strong>{FULLTIME_START} ~ {FULLTIME_END}</strong></span>
            <span style={styles.timeInfoHours}>{fmt(FULLTIME_HOURS)}h</span>
          </div>
        )}

        {/* Day off */}
        {workType === "dayoff" && (
          <div style={{ ...styles.timeInfoBox, background: "#f5f5f5", borderColor: "#ddd" }}>
            <span style={styles.timeInfoIcon}>🌴</span>
            <span style={{ color: "#888" }}>휴무일 - 근무 없음</span>
            <span style={{ ...styles.timeInfoHours, color: "#aaa" }}>0h</span>
          </div>
        )}

        {/* Overtime: fixed base + OT range */}
        {workType === "overtime" && (
          <>
            <div style={styles.timeInfoBox}>
              <span style={styles.timeInfoIcon}>🕖</span>
              <span>기본 <strong>{FULLTIME_START} ~ {FULLTIME_END}</strong></span>              <span style={styles.timeInfoHours}>{fmt(FULLTIME_HOURS)}h</span>
            </div>
            <div style={styles.otSection}>
              <label style={styles.label}>추가 근무 시간</label>
              <div style={styles.row2}>
                <div style={{ ...styles.field, flex: 1, marginBottom: 0 }}>
                  <label style={{ ...styles.label, fontSize: 10 }}>OT 시작</label>
                  <input type="time" style={styles.input} value={form.otStart}
                    onChange={e => set("otStart", e.target.value)} min={FULLTIME_END} />
                </div>
                <div style={{ ...styles.field, flex: 1, marginBottom: 0 }}>
                  <label style={{ ...styles.label, fontSize: 10 }}>OT 종료</label>
                  <input type="time" style={styles.input} value={form.otEnd}
                    onChange={e => set("otEnd", e.target.value)} />
                </div>
              </div>
              {otHours > 0 && (
                <div style={{ ...styles.otBadge }}>+{fmt(otHours)}h 추가 근무</div>
              )}
            </div>
          </>
        )}

        {/* Part-time: custom start/end */}
        {workType === "parttime" && (
          <div style={styles.row2}>
            <div style={{ ...styles.field, flex: 1 }}>
              <label style={styles.label}>출근</label>
              <input type="time" style={styles.input} value={form.startTime}
                onChange={e => set("startTime", e.target.value)} />
            </div>
            <div style={{ ...styles.field, flex: 1 }}>
              <label style={styles.label}>퇴근</label>
              <input type="time" style={styles.input} value={form.endTime}
                onChange={e => set("endTime", e.target.value)} />
            </div>
          </div>
        )}

        {/* Total hours summary - hide for dayoff */}
        {workType !== "dayoff" && (
        <div style={styles.hoursDisplay}>
          총 근무시간: <strong>{fmt(form.hours)}시간</strong>
          {workType === "overtime" && otHours > 0 && (
            <span style={styles.otLabel}> (기본 {fmt(FULLTIME_HOURS)}h + OT {fmt(otHours)}h)</span>
          )}
        </div>
        )}

        {/* Work content */}
        <div style={styles.field}>
          <label style={styles.label}>업무 내용</label>
          <textarea style={{ ...styles.input, height: 72, resize: "vertical" }} value={form.content}
            onChange={e => set("content", e.target.value)} placeholder="오늘의 업무 내용을 입력하세요." />
        </div>

        {/* Travel Allowance toggle */}
        <div style={styles.travelToggleRow}>
          <span style={styles.travelToggleLabel}>🚗 Travel Allowance</span>
          <button style={{ ...styles.toggleBtn, ...(hasTavel ? styles.toggleBtnOn : {}) }}
            onClick={() => setHasTravel(p => !p)}>
            {hasTavel ? "ON" : "OFF"}
          </button>
        </div>

        {hasTavel && (
          <div style={styles.travelBox}>
            {/* Business trip toggle */}
            <div style={styles.bizTripRow}>
              <div>
                <p style={styles.bizTripLabel}>🏨 출장 모드</p>
                <p style={styles.bizTripSub}>ON: 편도 계산 · 저녁식비 포함</p>
              </div>
              <button style={{ ...styles.toggleBtn, ...(travel.isBizTrip ? styles.toggleBtnOn : {}) }}
                onClick={() => setTravelField({ isBizTrip: !travel.isBizTrip })}>
                {travel.isBizTrip ? "ON" : "OFF"}
              </button>
            </div>

            {travel.isBizTrip && (
              <label style={styles.dinnerCheck}>
                <input type="checkbox" checked={travel.hasDinner}
                  onChange={e => setTravelField({ hasDinner: e.target.checked })}
                  style={{ width: 16, height: 16, accentColor: "#34c98b" }} />
                <span>🍽️ 출장 저녁식비 청구</span>
              </label>
            )}

            <div style={styles.divider} />

            {/* Route stops */}
            <label style={{ ...styles.label, marginBottom: 10 }}>경로</label>
            {travel.stops.map((stop, i) => {
              const isFirst = i === 0;
              const isLast  = i === travel.stops.length - 1;
              const isMiddle = !isFirst && !isLast;
              const isCustomMode = stopModes[i] === "custom";
              const leg = travelCalc.legs[i];
              const overrideVal = travel.kmOverrides[i];

              return (
                <div key={i}>
                  <div style={styles.stopRow}>
                    <div style={styles.stopDotCol}>
                      <div style={{ ...styles.stopDot, background: isFirst ? "#4f8ef7" : isLast ? "#f76f6f" : "#ffc347" }} />
                      {!isLast && <div style={styles.stopLine} />}
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                        <label style={{ ...styles.label, fontSize: 10, margin: 0 }}>
                          {isFirst ? "출발지" : isLast ? "도착지" : `경유지 ${i}`}
                        </label>
                        <button style={styles.modeToggle}
                          onClick={() => {
                            if (isCustomMode) {
                              setStop(i, "", false);
                            } else {
                              setStop(i, stop || "", true);
                            }
                          }}>
                          {isCustomMode ? "📋 목록에서 선택" : "✏️ 직접 입력"}
                        </button>
                      </div>

                      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                        {isCustomMode ? (
                          <input
                            style={{ ...styles.input, flex: 1, borderColor: "#ffc347" }}
                            value={stop}
                            onChange={e => setStop(i, e.target.value, true)}
                            placeholder="지명 직접 입력..."
                          />
                        ) : (
                          <select style={{ ...styles.input, flex: 1 }} value={stop}
                            onChange={e => setStop(i, e.target.value, false)}>
                            <option value="">-- 선택 --</option>
                            {ALL_LOCATIONS.map(n => <option key={n} value={n}>{n}</option>)}
                          </select>
                        )}
                        {isMiddle && (
                          <button style={{ ...styles.iconBtn, color: "#f77", flexShrink: 0 }}
                            onClick={() => removeStop(i)}>{Icon.trash}</button>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Leg km row */}
                  {leg && (
                    <div style={styles.legKmRow}>
                      <div style={styles.legKmLine} />
                      {leg.isManual ? (
                        <GeocodeLegBox
                          fromName={travel.stops[i]}
                          toName={travel.stops[i + 1]}
                          overrideVal={travel.kmOverrides[i]}
                          onOverride={(v) => setKmOverride(i, v)}
                          onReset={() => setKmOverride(i, "")}
                        />
                      ) : (
                        // Known stops → auto calc + OSRM option
                        <OsrmLegBox
                          from={leg.from} to={leg.to}
                          autoKm={leg.autoKm}
                          overrideVal={overrideVal}
                          onOverride={(v) => setKmOverride(i, v)}
                          onReset={() => setKmOverride(i, "")}
                        />
                      )}
                      <div style={styles.legKmLine} />
                    </div>
                  )}
                </div>
              );
            })}

            <button style={styles.addViaBtn} onClick={addStop}>+ 경유지 추가</button>

            {/* Return leg: only when not biz trip AND waypoints exist */}
            {!travel.isBizTrip && (travel.stops || []).length > 2 && travelCalc.outboundKm > 0 && (
              <div style={styles.returnLegBox}>
                <div style={styles.returnLegHeader}>
                  <span style={styles.returnLegLabel}>↩️ 귀환 (목적지 → 출발지 직통)</span>
                </div>
                <div style={styles.legKmRow}>
                  <div style={styles.legKmLine} />
                  {travelCalc.returnIsManual ? (
                    <GeocodeLegBox
                      fromName={travel.stops[travel.stops.length - 1]}
                      toName={travel.stops[0]}
                      overrideVal={travel.kmOverrides["return"]}
                      onOverride={(v) => setTravelField({ kmOverrides: { ...travel.kmOverrides, return: v } })}
                      onReset={() => { const o = { ...travel.kmOverrides }; delete o["return"]; setTravelField({ kmOverrides: o }); }}
                    />
                  ) : (
                    <div style={styles.legKmBox}>
                      {travelCalc.returnAutoKm !== null && travel.kmOverrides["return"] === undefined && (
                        <span style={styles.legKmAuto}>📐 {travelCalc.returnAutoKm}km</span>
                      )}
                      <input type="number" style={styles.legKmInput}
                        value={travel.kmOverrides["return"] || ""}
                        placeholder={travelCalc.returnAutoKm !== null ? `${travelCalc.returnAutoKm}` : "km"}
                        onChange={e => setTravelField({ kmOverrides: { ...travel.kmOverrides, return: e.target.value } })}
                        min={0} />
                      {travel.kmOverrides["return"] !== undefined && (
                        <button style={styles.legKmReset}
                          onClick={() => { const o = { ...travel.kmOverrides }; delete o["return"]; setTravelField({ kmOverrides: o }); }}>↺</button>
                      )}
                    </div>
                  )}
                  <div style={styles.legKmLine} />
                </div>
              </div>
            )}

            {/* Summary */}
            {travelCalc.outboundKm > 0 && (
              <div style={styles.allowanceResult}>
                {travelCalc.needsConfirm && (
                  <div style={styles.confirmWarning}>⚠️ 수동 입력 km 포함 - 관리자 확인 필요</div>
                )}
                <div style={styles.allowanceRow}>
                  <span style={styles.allowanceLabel}>편도 (경유 포함)</span>
                  <span style={styles.allowanceValue}>{travelCalc.outboundKm} km</span>
                </div>
                {!travel.isBizTrip && (
                  <div style={styles.allowanceRow}>
                    <span style={styles.allowanceLabel}>↩️ 귀환 (직통)</span>
                    <span style={styles.allowanceValue}>{travelCalc.returnKm} km</span>
                  </div>
                )}
                <div style={{ ...styles.allowanceRow, borderTop: "1px solid #b3f5d4", paddingTop: 8, marginTop: 4 }}>
                  <span style={{ ...styles.allowanceLabel, fontWeight: 700, color: "#1a6644" }}>
                    {travel.isBizTrip ? "편도 합계" : "총 거리"}
                  </span>
                  <span style={styles.allowanceValue}>{travelCalc.totalKm} km</span>
                </div>
                <div style={{ ...styles.allowanceRow, borderTop: "1px solid #b3f5d4", paddingTop: 8, marginTop: 4 }}>

                  </div>

function LeaveTab({ user, users, leaves, isAdmin, persist, updateLeaveUsage }) {
  const [showForm, setShowForm] = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const empList = isAdmin ? users.filter(u => u.role !== "admin") : [user];

  return (
    <div style={styles.page}>
      <div style={styles.pageHeader}>
        <h2 style={styles.pageTitle}>연차 관리</h2>
        {isAdmin && <button style={styles.btnAdd} onClick={() => { setEditTarget(null); setShowForm(true); }}>{Icon.edit} 수정</button>}
      </div>

      {empList.map(u => {
        const lv           = normLeave(leaves[u.id], u.joinDate);
        const yr           = getCurrentLeaveYear(lv.leaveStartDate);
        const accDays      = calcAccruedDays(lv.leaveStartDate);
        const accHours     = Math.round(accDays * HOURS_PER_DAY * 10) / 10;
        const usedDays     = +(lv.usedDays) || 0;
        const remDays      = Math.max(0, accDays - usedDays);
        const remHours     = Math.round(remDays * HOURS_PER_DAY * 10) / 10;
        const pct          = Math.min(100, (remDays / ANNUAL_LEAVE_DAYS) * 100);
        const color        = remDays < 4 ? "#f77" : remDays < 10 ? "#ffc347" : "#34c98b";
        const rateHistory  = Array.isArray(lv.rateHistory) ? lv.rateHistory : [];
        const accruedByPeriod = isAdmin ? getAccruedByPeriod(lv.leaveStartDate, rateHistory) : [];
        const hasRateSplit    = accruedByPeriod.length >= 2;
        const yearDays        = yr ? Math.round((yr.end - yr.start) / (1000*60*60*24)) : 365;
        const elapsedInYear   = yr ? Math.max(0, Math.min((new Date() - yr.start) / (1000*60*60*24), yearDays)) : 0;

        // Carryover: unused days from completed previous years
        const completedYears   = isAdmin ? getCompletedYears(lv.leaveStartDate) : 0;
        const prevYearsAccrued = completedYears * ANNUAL_LEAVE_DAYS;
        const carriedOverDays  = Math.max(0, Math.round((prevYearsAccrued - usedDays) * 10) / 10);
        const carriedOverHours = Math.round(carriedOverDays * HOURS_PER_DAY * 10) / 10;

        return (
          <div key={u.id} style={styles.leaveCard}>
            {/* Header */}
            <div style={styles.leaveCardTop}>
              <div style={styles.leaveCardLeft}>
                <div style={{ ...styles.logAvatar, width: 40, height: 40, fontSize: 16 }}>{u.name[0]}</div>
                <div>
                  <p style={styles.logName}>{u.name} <span style={styles.deptBadge}>{u.dept}</span></p>
                  <p style={styles.logContent}>{yr ? `${yr.start.toISOString().slice(0,10)} ~ ${yr.end.toISOString().slice(0,10)}` : lv.leaveStartDate}</p>
                </div>
              </div>
              {isAdmin && (
                <button style={styles.iconBtn} onClick={() => { setEditTarget(u.id); setShowForm(true); }}>{Icon.edit}</button>
              )}
            </div>

            {/* -- ADMIN: per-rate accrual breakdown -- */}
            {isAdmin && hasRateSplit ? (
              <div style={styles.rateAccrualBox}>
                <p style={styles.rateAccrualTitle}>📅 오늘 기준 일급별 적립 현황</p>
                {accruedByPeriod.map((p, i) => (
                  <div key={i} style={{ ...styles.rateAccrualRow, ...(p.isActive ? styles.rateAccrualActive : {}) }}>
                    <div style={styles.rateAccrualLeft}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{ ...styles.periodIdx, background: p.isActive ? "#3b7ff5" : p.isComplete ? "#34c98b" : "#ccc" }}>
                          {p.isActive ? "▶" : p.isComplete ? "✓" : i+1}
                        </span>
                        <div>
                          <p style={styles.rateAccrualDates}>{p.from} ~ {p.to}</p>
                          <p style={styles.rateAccrualCalDays}>
                            {p.isComplete ? `${p.calDaysTotal}일 완료` : p.isActive ? `${p.calDaysElapsed}/${p.calDaysTotal}일 경과` : "미시작"}
                          </p>
                        </div>
                      </div>
                      <div style={styles.rateAccrualNums}>
                        <span style={styles.rateAccrualDays}>{p.accruedDays.toFixed(2)}일</span>
                        <span style={styles.rateAccrualHoursText}>{p.accruedHours.toFixed(1)}h</span>
                        {!p.isComplete && <span style={styles.rateAccrualOf}>/ {p.totalDays.toFixed(2)}일</span>}
                      </div>
                    </div>
                    <div style={styles.rateAccrualRateCol}>
                      <span style={styles.rateAccrualRate}>${p.dailyRate}</span>
                      <span style={styles.rateAccrualRateSub}>/일</span>
                    </div>
                  </div>
                ))}
                <div style={styles.rateAccrualTotal}>
                  합계 <strong>{accDays.toFixed(2)}일 ({accHours.toFixed(1)}h)</strong> 적립
                </div>
              </div>
            ) : (
              /* -- Employee / no rate split: simple accrual box -- */
              <div style={styles.todayAccrualBox}>
                <div style={styles.todayAccrualMain}>
                  <span style={styles.todayAccrualLabel}>오늘까지 적립</span>
                  <span style={styles.todayAccrualValue}>{accDays.toFixed(2)}일</span>
                  <span style={styles.todayAccrualHours}>{accHours.toFixed(1)}h</span>
                </div>
                <div style={styles.todayAccrualSub}>
                  <span>연차연도 {Math.floor(elapsedInYear)}일 경과</span>
                  <span style={{ color: "#7b5ea7" }}>잔여 {Math.ceil(yearDays - elapsedInYear)}일</span>
                </div>
              </div>
            )}

            {/* Progress bar */}
            <div style={styles.leaveBarWrap}>
              <div style={styles.leaveBar}>
                <div style={{ ...styles.leaveBarFill, width: pct + "%", background: color }} />
              </div>
              <div style={styles.leaveNums}>
                <span style={{ color }}>잔여 <strong>{remDays.toFixed(1)}일 ({remHours}h)</strong></span>
                <span>사용 <strong>{usedDays.toFixed(1)}일</strong></span>
              </div>
            </div>

            {/* Chips */}
            <div style={styles.leaveChips}>
              <LeaveChip label="적립"  val={`${accDays.toFixed(1)}일`}  color="#4f8ef7" />
              <LeaveChip label="사용"  val={`${usedDays.toFixed(1)}일`} color="#f7a440" />
              <LeaveChip label="잔여"  val={`${remDays.toFixed(1)}일`}  color={color} />
              <LeaveChip label="잔여h" val={`${remHours}h`}             color="#888" />
            </div>

            {/* Admin: carryover from previous years */}
            {isAdmin && completedYears > 0 && (
              <div style={{ ...styles.carryoverBox, ...(carriedOverDays > 0 ? {} : styles.carryoverBoxZero) }}>
                <div style={styles.carryoverLeft}>
                  <span style={styles.carryoverIcon}>{carriedOverDays > 0 ? "⏳" : "✅"}</span>
                  <div>
                    <p style={styles.carryoverLabel}>이전 연도 미사용 연차 ({completedYears}년차 완료)</p>
                    <p style={styles.carryoverSub}>과거 누적 {prevYearsAccrued}일 중 사용 {Math.min(usedDays, prevYearsAccrued).toFixed(1)}일</p>
                  </div>
                </div>
                <div style={styles.carryoverRight}>
                  {carriedOverDays > 0 ? (
                    <>
                      <span style={styles.carryoverDays}>{carriedOverDays.toFixed(1)}일</span>
                      <span style={styles.carryoverHours}>{carriedOverHours}h</span>
                    </>
                  ) : (
                    <span style={styles.carryoverNone}>없음</span>
                  )}
                </div>
              </div>
            )}

            {/* Usage records - all users see, admin can edit */}
            <LeaveUsageSection
              records={lv.usageRecords || []}
              isAdmin={isAdmin}
              onUpdate={isAdmin ? (records) => updateLeaveUsage(u.id, u.joinDate, records) : null}
            />
          </div>
        );
      })}

      {showForm && isAdmin && (
        <LeaveEditForm
          targetId={editTarget}
          users={users}
          leaves={leaves}
          onSave={(id, lv) => { persist(null, null, { ...leaves, [id]: lv }); setShowForm(false); }}
          onClose={() => setShowForm(false)}
        />
      )}
    </div>
  );
}

function LeaveChip({ label, val, color }) {

    <div style={{ ...styles.chip, borderColor: color + "44", background: color + "11" }}>
      <span style={{ color, fontSize: 13, fontWeight: 600 }}>{val}</span>

function LeaveUsageSection({ records, isAdmin, onUpdate }) {
  const [expanded, setExpanded] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const [editId, setEditId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [form, setForm] = useState({ date: today, days: 1, note: "" });

  const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date));

  const openAdd = () => { setForm({ date: today, days: 1, note: "" }); setEditId(null); setShowAdd(true); };
  const openEdit = (r) => { setForm({ date: r.date, days: r.days, note: r.note || "" }); setEditId(r.id); setShowAdd(true); };

  const save = () => {
    if (!form.date || !form.days) return;
    const next = editId
      ? records.map(r => r.id === editId ? { ...r, ...form, days: +(form.days) } : r)
      : [...records, { id: uid(), date: form.date, days: +(form.days), note: form.note }];
    onUpdate(next);
    setShowAdd(false);
  };

  const del = (id) => {
    onUpdate(records.filter(r => r.id !== id));
    setConfirmDeleteId(null);
  };

  const totalUsed = Math.round(records.reduce((s, r) => s + (+(r.days) || 0), 0) * 100) / 100;

  return (
    <div style={styles.usageSection}>
      <div style={styles.usageSectionHeader} onClick={() => setExpanded(p => !p)}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={styles.usageSectionTitle}>📋 연차 사용 기록</span>
          <span style={styles.usageBadge}>{records.length}건 · {totalUsed}일</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {isAdmin && (
            <button style={styles.usageAddBtn} onClick={e => { e.stopPropagation(); openAdd(); }}>+ 추가</button>
          )}
          <span style={{ fontSize: 12, color: "#888" }}>{expanded ? "▲" : "▼"}</span>
        </div>
      </div>

      {expanded && (
        <div style={styles.usageList}>
          {sorted.length === 0
            ? <p style={{ margin: "8px 0", fontSize: 12, color: "#aaa", textAlign: "center" }}>사용 기록이 없습니다.</p>
            : sorted.map(r => (
              <div key={r.id} style={styles.usageRow}>
                <div style={styles.usageLeft}>
                  <div style={styles.usageDateBadge}>{r.date.slice(5)}</div>
                  <div>
                    <p style={styles.usageDays}>{+(r.days)}일 <span style={styles.usageHours}>({((+(r.days)) * HOURS_PER_DAY).toFixed(1)}h)</span></p>
                    {r.note && <p style={styles.usageNote}>{r.note}</p>}
                  </div>
                </div>
                {isAdmin && (
                  confirmDeleteId === r.id ? (
                    <div style={styles.confirmInline}>
                      <span style={{ fontSize: 11, color: "#f77" }}>삭제?</span>
                      <button style={styles.confirmYes} onClick={() => del(r.id)}>예</button>
                      <button style={styles.confirmNo} onClick={() => setConfirmDeleteId(null)}>아니오</button>
                    </div>
                  ) : (
                    <div style={{ display: "flex", gap: 2 }}>
                      <button style={styles.iconBtn} onClick={() => openEdit(r)}>{Icon.edit}</button>
                      <button style={{ ...styles.iconBtn, color: "#f77" }} onClick={() => setConfirmDeleteId(r.id)}>{Icon.trash}</button>
                    </div>
                  )
                )}
              </div>
            ))
          }
        </div>
      )}

      {showAdd && isAdmin && (
        <div style={styles.modal}>
          <div style={styles.modalBox}>
            <div style={styles.modalHeader}>
              <h3 style={styles.modalTitle}>{editId ? "사용 기록 수정" : "연차 사용 추가"}</h3>
              <button style={styles.iconBtn} onClick={() => setShowAdd(false)}>{Icon.x}</button>
            </div>
            <div style={styles.row2}>
              <div style={{ ...styles.field, flex: 1 }}>
                <label style={styles.label}>날짜</label>
                <input type="date" style={styles.input} value={form.date}
                  onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
              </div>
              <div style={{ ...styles.field, width: 90 }}>
                <label style={styles.label}>일수</label>
                <input type="number" style={styles.input} value={form.days} min={0.5} max={ANNUAL_LEAVE_DAYS} step={0.5}
                  onChange={e => setForm(f => ({ ...f, days: e.target.value }))} />
              </div>
            </div>
            <div style={styles.hoursDisplay}>
              {+(form.days) || 0}일 = {((+(form.days) || 0) * HOURS_PER_DAY).toFixed(1)}h
            </div>
            <div style={styles.field}>
              <label style={styles.label}>사유 (선택)</label>
              <input style={styles.input} value={form.note}
                onChange={e => setForm(f => ({ ...f, note: e.target.value }))}
                placeholder="예: 여름 휴가, 개인 사유..." />
            </div>
            <div style={styles.modalFooter}>
              <button style={styles.btnSecondary} onClick={() => setShowAdd(false)}>취소</button>
              <button style={styles.btnPrimary} onClick={save}>{editId ? "수정" : "추가"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function LeaveEditForm({ targetId, users, leaves, onSave, onClose }) {
  const emps = users.filter(u => u.role !== "admin");
  const firstId = targetId || (emps[0] && emps[0].id) || "";

  const buildState = (id) => {
    const u  = users.find(u => u.id === id);
    const lv = normLeave(leaves[id], (u && u.joinDate));
    return {
      selId: id,
      leaveStartDate: lv.leaveStartDate || (u && u.joinDate) || today,
      usedDays: +(lv.usedDays) || 0,
      rateHistory: lv.(rateHistory && rateHistory.length) ? lv.rateHistory : [{ from: lv.leaveStartDate || (u && u.joinDate) || today, dailyRate: 0 }],
    };
  };

  const [state, setState] = useState(() => buildState(firstId));
  const set = (k, v) => setState(s => ({ ...s, [k]: v }));

  const changeEmp = (id) => setState(buildState(id));

  const setRate = (i, field, val) =>
    setState(s => { const rh = [...s.rateHistory]; rh[i] = { ...rh[i], [field]: val }; return { ...s, rateHistory: rh }; });
  const addRate = () =>
    setState(s => ({ ...s, rateHistory: [...s.rateHistory, { from: today, dailyRate: (s.rateHistory[s.rateHistory.length - 1] && s.rateHistory[s.rateHistory.length - 1].dailyRate) || 0 }] }));
  const removeRate = (i) =>
    setState(s => ({ ...s, rateHistory: s.rateHistory.filter((_, j) => j !== i) }));

  const accDays = calcAccruedDays(state.leaveStartDate);
  const remDays = Math.max(0, accDays - state.usedDays);
  const periods = getLeavePeriods(state.leaveStartDate, state.rateHistory);

  const save = () => {
    if (!state.leaveStartDate) { return; }
    onSave(state.selId, { leaveStartDate: state.leaveStartDate, usedDays: +(state.usedDays) || 0, rateHistory: state.rateHistory });
  };

  return (
    <div style={styles.modal}>
      <div style={styles.modalBox}>
        <div style={styles.modalHeader}>
          <h3 style={styles.modalTitle}>연차 수정 (관리자)</h3>
          <button style={styles.iconBtn} onClick={onClose}>{Icon.x}</button>
        </div>

        <div style={styles.field}>
          <label style={styles.label}>직원</label>
          <select style={styles.input} value={state.selId} onChange={e => changeEmp(e.target.value)}>
            {emps.map(u => <option key={u.id} value={u.id}>{u.name} ({u.dept})</option>)}
          </select>
        </div>

        <div style={styles.row2}>
          <div style={{ ...styles.field, flex: 1 }}>
            <label style={styles.label}>적립 시작일</label>
            <input type="date" style={styles.input} value={state.leaveStartDate}
              onChange={e => set("leaveStartDate", e.target.value)} />
          </div>
          <div style={{ ...styles.field, flex: 1 }}>
            <label style={styles.label}>사용 일수</label>
            <input type="number" style={styles.input} value={state.usedDays} min={0} max={ANNUAL_LEAVE_DAYS} step={0.5}
              onChange={e => set("usedDays", parseFloat(e.target.value) || 0)} />
          </div>
        </div>

        <div style={styles.hoursDisplay}>
          적립 <strong>{accDays.toFixed(1)}일</strong> ({(accDays*HOURS_PER_DAY).toFixed(1)}h)
          &nbsp;·&nbsp; 사용 <strong>{state.usedDays.toFixed(1)}일</strong>
          &nbsp;·&nbsp; 잔여 <strong style={{ color: "#34c98b" }}>{remDays.toFixed(1)}일</strong> ({(remDays*HOURS_PER_DAY).toFixed(1)}h)
        </div>

        {/* Rate history */}
        <div style={styles.field}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <label style={{ ...styles.label, margin: 0 }}>일당 변경 이력</label>
            <button style={styles.addViaBtn2} onClick={addRate}>+ 추가</button>
          </div>
          {state.rateHistory.map((r, i) => (
            <div key={i} style={styles.rateRow}>
              <div style={{ flex: 1 }}>
                <label style={{ ...styles.label, fontSize: 10 }}>적용 시작일</label>
                <input type="date" style={styles.input} value={r.from}
                  onChange={e => setRate(i, "from", e.target.value)} />
              </div>
              <div style={{ width: 90 }}>
                <label style={{ ...styles.label, fontSize: 10 }}>일당 ($)</label>
                <input type="number" style={styles.input} value={r.dailyRate} min={0}
                  onChange={e => setRate(i, "dailyRate", parseFloat(e.target.value) || 0)} />
              </div>
              {state.rateHistory.length > 1 && (
                <button style={{ ...styles.iconBtn, color: "#f77", alignSelf: "flex-end", marginBottom: 2 }}
                  onClick={() => removeRate(i)}>{Icon.trash}</button>
              )}
            </div>
          ))}
        </div>

        {periods.length > 0 && (
          <div style={{ ...styles.periodBox, marginBottom: 14 }}>
            <p style={styles.periodTitle}>📋 일급 변동 기간별 연차 배분 미리보기</p>
            <p style={{ margin: "-4px 0 10px", fontSize: 11, color: "#7b5ea7" }}>현재 연차 연도: {leaveYearLabel(state.leaveStartDate)}</p>
            {periods.map((p, i) => (
              <div key={i} style={styles.periodRow}>
                <div style={styles.periodLeft}>
                  <span style={styles.periodIdx}>{i + 1}</span>
                  <div>
                    <p style={styles.periodDates}>{p.from} ~ {p.to}</p>
                    <p style={styles.periodDays}>{p.calDays}일간 · 연차 {p.leaveDays.toFixed(2)}일 ({p.leaveHours.toFixed(1)}h)</p>
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <span style={styles.periodRate}>${p.dailyRate}/일</span>
                  <p style={{ margin: "2px 0 0", fontSize: 11, color: "#5a3e9b" }}>≈ ${(p.leaveDays * p.dailyRate).toFixed(2)}</p>
                </div>
              </div>
            ))}
            <div style={styles.periodTotal}>
              총 연차가치 ${periods.reduce((s,p) => s + p.leaveDays * p.dailyRate, 0).toFixed(2)}
            </div>
          </div>
        )}

        <div style={styles.modalFooter}>
          <button style={styles.btnSecondary} onClick={onClose}>취소</button>
          <button style={styles.btnPrimary} onClick={save}>저장</button>
        </div>
      </div>
    </div>
  );
}


function TeamTab({ users, leaves, logs, persist }) {

  const [editEmp, setEditEmp]     = useState(null);
  const [confirmId, setConfirmId] = useState(null);

        return (

function DataBackup({ users, leaves, logs, persist }) {
  const [expanded, setExpanded]         = useState(false);
  const [importText, setImportText]     = useState("");
  const [importStatus, setImportStatus] = useState("");
  const [copied, setCopied]             = useState(false);

  const exportData = () => {
    const data = JSON.stringify({ users, leaves, logs, exportedAt: new Date().toISOString() }, null, 2);
    const ta = document.createElement("textarea");
    ta.value = data; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    setCopied(true); setTimeout(() => setCopied(false), 2000);
  };

  const importData = () => {
    try {
      const parsed = JSON.parse(importText.trim());
      if (!parsed.users || !parsed.leaves) { setImportStatus("❌ 올바른 백업 데이터가 아닙니다."); return; }
      persist(parsed.users, parsed.logs || [], parsed.leaves);
      setImportStatus("✅ 복원 완료!"); setImportText("");
      setTimeout(() => setImportStatus(""), 2000);
    } catch { setImportStatus("❌ JSON 형식이 올바르지 않습니다."); }
  };

  const fbUrl = getFbUrl();

  return (
    <div style={styles.backupBox}>
      <div style={styles.backupHeader} onClick={() => setExpanded(p => !p)}>
        <span style={styles.backupTitle}>💾 데이터 백업 / 복원</span>
        <span style={{ fontSize: 12, color: "#888" }}>{expanded ? "▲" : "▼"}</span>
      </div>
      {expanded && (
        <div style={{ paddingTop: 12 }}>
          {fbUrl && (
            <div style={{ background: "#f0f9f4", border: "1.5px solid #34c98b", borderRadius: 10, padding: "10px 14px", marginBottom: 14 }}>
              <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: "#1a6644" }}>🔥 Firebase 연결됨 - 실시간 동기화 중</p>
              <p style={{ margin: "2px 0 0", fontSize: 10, color: "#888", wordBreak: "break-all" }}>{fbUrl}</p>
              <button style={{ marginTop: 8, fontSize: 11, color: "#f77", background: "none", border: "1px solid #f77", borderRadius: 6, padding: "3px 8px", cursor: "pointer", fontFamily: "inherit" }}
                onClick={() => { try { localStorage.removeItem("wm_fb_url"); } catch {} window.location.reload(); }}>
                Firebase 재설정
              </button>
            </div>
          )}
          <p style={styles.backupDesc}>코드 업데이트 후 데이터 복원용 백업이에요.</p>
          <button style={{ ...styles.btnPrimary, marginBottom: 12 }} onClick={exportData}>
            {copied ? "✅ 클립보드에 복사됨!" : "📋 현재 데이터 복사 (백업)"}
          </button>
          <label style={styles.label}>백업 데이터 붙여넣기 (복원)</label>
          <textarea style={{ ...styles.input, height: 80, fontSize: 11, resize: "vertical", marginBottom: 8 }}
            value={importText} onChange={e => setImportText(e.target.value)}
            placeholder='{"users":[...],"leaves":{...},...} 형식으로 붙여넣으세요' />
          {importStatus && <p style={{ margin: "0 0 8px", fontSize: 12, fontWeight: 600 }}>{importStatus}</p>}
          <button style={{ ...styles.btnSecondary, width: "100%" }} onClick={importData}>복원하기</button>
        </div>
      )}
    </div>
  );
}



async function fetchDrivingKm(coord1, coord2) {
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${coord1[1]},${coord1[0]};${coord2[1]},${coord2[0]}?overview=false`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data.code === "Ok") return Math.round(data.routes[0].distance / 1000);
    return null;
  } catch { return null; }
}

async function geocodePlace(query) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + ", NSW, Australia")}&format=json&limit=1`;
    const res  = await fetch(url, { headers: { "Accept-Language": "en" } });
    const data = await res.json();
    if (data.length > 0) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
    return null;
  } catch { return null; }
}

const DAY_KO = ["일","월","화","수","목","금","토"];
function dayStr(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return dateStr.slice(5) + "(" + DAY_KO[d.getDay()] + ")";
}
// Returns YYYY-MM-DD in LOCAL time (avoids UTC timezone shift)
function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + dd;
}
function PayrollTab({ user, users, logs, leaves, isAdmin, persist }) {
  const [startDate, setStartDate] = useState(() => {
    // Default to most recent April 13 or similar
    return "2026-04-13";
  });
  const PERIOD_DAYS = 14;

  const endDate = (() => {
    const d = new Date(startDate + "T00:00:00");
    d.setDate(d.getDate() + PERIOD_DAYS - 1);
    return localDateStr(d);
  })();

  // Admin sees all; employee sees only self
  const emps = isAdmin
    ? users.filter(u => u.role !== "admin")
    : users.filter(u => u.id === user.id);

  const getPeriodLogs = (userId) =>
    logs.filter(l => l.userId === userId && l.date >= startDate && l.date <= endDate)
        .sort((a, b) => a.date.localeCompare(b.date));

  const calcStats = (periodLogs) => {
    let fulltimeDays = 0, overtimeHours = 0, parttimeHours = 0, travelTotal = 0, dayoffDays = 0, holidayDays = 0;
    periodLogs.forEach(l => {
      if (l.workType === "fulltime")           fulltimeDays += 1;
      else if (l.workType === "overtime")      { fulltimeDays += 1; overtimeHours += calcHours(l.otStart || "16:30", l.otEnd || "16:30"); }
      else if (l.workType === "parttime")      parttimeHours += (l.hours || 0);
      else if (l.workType === "dayoff")        dayoffDays += 1;
      else if (l.workType === "publicholiday") holidayDays += 1;
      else if (!l.workType)                    fulltimeDays += 1;
      if ((l.travel && l.travel.allowance)) travelTotal += l.travel.allowance;
      if ((l.travel && l.travel.hasDinner)) travelTotal += 25;
    });
    return { fulltimeDays, overtimeHours, parttimeHours, travelTotal, dayoffDays, holidayDays };
  };

  return (
    <div style={styles.page}>
      <div style={styles.pageHeader}>
        <h2 style={styles.pageTitle}>💰 {isAdmin ? "급여 요약" : "내 급여 내역"}</h2>
      </div>

      <div style={styles.payPeriodBox}>
        <div style={styles.payPeriodRow}>
          <div style={{ flex: 1 }}>
            <label style={styles.label}>시작일</label>
            <input type="date" style={styles.input} value={startDate}
              onChange={e => setStartDate(e.target.value)} />
          </div>
          <div style={styles.payPeriodArrow}>→</div>
          <div style={{ flex: 1 }}>
            <label style={styles.label}>종료일 (2주)</label>
            <div style={{ ...styles.input, background: "#f0f5ff", color: "#3b5fc0", fontWeight: 600, display: "flex", alignItems: "center" }}>
              {endDate}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "center", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
          <button style={styles.todayBtn} onClick={() => setStartDate(today)}>오늘 시작</button>
          <button style={styles.todayBtn} onClick={() => {
            const BASE = new Date("2026-04-13T00:00:00");
            const diff = Math.floor((Date.now() - BASE.getTime()) / (1000*60*60*24*14));
            const d = new Date(BASE); d.setDate(d.getDate() + diff * 14);
            setStartDate(localDateStr(d));
          }}>현재 기간</button>
          <button style={styles.todayBtn} onClick={() => {
            const BASE = new Date("2026-04-13T00:00:00");
            const diff = Math.floor((Date.now() - BASE.getTime()) / (1000*60*60*24*14));
            const d = new Date(BASE); d.setDate(d.getDate() + (diff - 1) * 14);
            setStartDate(localDateStr(d));
          }}>이전 기간</button>
        </div>
        <p style={{ margin: "6px 0 0", fontSize: 11, color: C.sub, textAlign: "center" }}>
          {dayStr(startDate)} ~ {dayStr(endDate)} · {PERIOD_DAYS}일
        </p>
      </div>

      {emps.map(u => {
        const periodLogs = getPeriodLogs(u.id);
        const lv = normLeave(leaves[u.id], u.joinDate);
        const isInvoiceEmp = lv.noLeave; // contractor = no leave accrual

        if (periodLogs.length === 0) return (
          <div key={u.id} style={{ ...styles.payCard, opacity: 0.5 }}>
            <div style={styles.payCardHeader}>
              <div style={styles.logAvatar}>{u.name[0]}</div>
              <div>
                <p style={styles.logName}>{u.name} <span style={styles.deptBadge}>{u.dept}</span></p>
                <p style={styles.logContent}>이 기간 근무일지 없음</p>
              </div>
            </div>
          </div>
        );

        const s = calcStats(periodLogs);
        const fulltimeLogs = periodLogs.filter(l => l.workType === "fulltime" || l.workType === "overtime" || (!l.workType));
        const travelLogs   = periodLogs.filter(l => (l.travel && l.travel.allowance) || (l.travel && l.travel.hasDinner));
        const parttimeLogs = periodLogs.filter(l => l.workType === "parttime");
        const dayoffLogs   = periodLogs.filter(l => l.workType === "dayoff");
        const holidayLogs  = periodLogs.filter(l => l.workType === "publicholiday");

        return (
          <div key={u.id} style={styles.payCard}>
            <div style={styles.payCardHeader}>
              <div style={styles.logAvatar}>{u.name[0]}</div>
              <div style={{ flex: 1 }}>
                <p style={styles.logName}>{u.name} <span style={styles.deptBadge}>{u.dept}</span></p>
                <p style={styles.logContent}>총 {periodLogs.length}일 기록</p>
              </div>
              {isInvoiceEmp && (
                <InvoiceButton u={u} s={s} periodLogs={periodLogs} startDate={startDate} endDate={endDate} leaveData={lv}
                  onInvoiceSent={() => {
                    const ci = lv.contractorInfo || {};
                    const nextNum = (parseInt(ci.invoiceNum) || 10000) + 1;
                    const nextLv = { ...lv, contractorInfo: { ...ci, invoiceNum: nextNum } };
                    persist(null, null, { ...leaves, [u.id]: nextLv });
                  }}
                />
              )}
            </div>
            <div style={styles.payGrid}>
              <PayStat emoji="✅" label="풀타임" val={`${s.fulltimeDays}일`} color="#4f8ef7"
                logs={fulltimeLogs} renderDetail={l => `${dayStr(l.date)} ${l.workType === "overtime" ? `(+OT ${fmt(calcHours(l.otStart,l.otEnd))}h)` : ""}`} />
              <PayStat emoji="⏰" label="오버타임" val={`${fmt(s.overtimeHours)}h`} color="#f7a440"
                logs={periodLogs.filter(l => l.workType === "overtime")}
                renderDetail={l => `${dayStr(l.date)} ${l.otStart}~${l.otEnd} (+${fmt(calcHours(l.otStart,l.otEnd))}h)`} />
              <PayStat emoji="🕐" label="파트타임" val={`${fmt(s.parttimeHours)}h`} color="#7b5ea7"
                logs={parttimeLogs} renderDetail={l => `${dayStr(l.date)} ${l.startTime}~${l.endTime} (${fmt(l.hours)}h)`} />
              <PayStat emoji="🚗" label="트래블" val={s.travelTotal > 0 ? `$${s.travelTotal.toFixed(2)}` : "-"} color="#34c98b"
                logs={travelLogs} renderDetail={l => {
                  const stops = ((l.travel && l.travel.stops) || []).filter(Boolean).join("→");
                  const amt   = ((l.travel && l.travel.allowance) || 0) + ((l.travel && l.travel.hasDinner) ? 25 : 0);
                  return `${dayStr(l.date)} ${stops} $${amt.toFixed(2)}`;
                }} />
              {s.dayoffDays > 0 && <PayStat emoji="🌴" label="휴무" val={`${s.dayoffDays}일`} color="#888"
                logs={dayoffLogs} renderDetail={l => dayStr(l.date)} />}
              {s.holidayDays > 0 && <PayStat emoji="🎉" label="퍼블릭홀리데이" val={`${s.holidayDays}일`} color="#e07000"
                logs={holidayLogs} renderDetail={l => dayStr(l.date)} />}
            </div>
          </div>
        );
      })}
    </div>
  );
}


const inv = {
  info:       { fontSize: 11, color: "#444", lineHeight: 1.6, margin: 0 },
