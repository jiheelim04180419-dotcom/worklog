function DataBackup({users,leaves,logs,persist}){const[expanded,setExpanded]=useState(false);const[importText,setImportText]=useState("");const[importStatus,setImportStatus]=useState("");const[copied,setCopied]=useState(false);const exportData=()=>{const data=JSON.stringify({users,leaves,logs,exportedAt:new Date().toISOString()},null,2);const ta=document.createElement("textarea");ta.value=data;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);setCopied(true);setTimeout(()=>setCopied(false),2000);};const importData=()=>{try{const parsed=JSON.parse(importText.trim());if(!parsed.users||!parsed.leaves){setImportStatus("❌ 올바른 백업 데이터가 아닙니다.");return;}persist(parsed.users,parsed.logs||[],parsed.leaves);setImportStatus("✅ 복원 완료!");setImportText("");setTimeout(()=>setImportStatus(""),2000);}catch{setImportStatus("❌ JSON 형식이 올바르지 않습니다.");}};const fbUrl=getFbUrl();return(<div style={styles.backupBox}><div style={styles.backupHeader} onClick={()=>setExpanded(p=>!p)}><span style={styles.backupTitle}>💾 데이터 백업 / 복원</span><span style={{ fontSize:12,color:"#888" }}>{expanded?"▲":"▼"}</span></div>{expanded&&(<div style={{ paddingTop:12 }}>{fbUrl&&<div style={{ background:"#f0f9f4",border:"1.5px solid #34c98b",borderRadius:10,padding:"10px 14px",marginBottom:14 }}><p style={{ margin:0,fontSize:12,fontWeight:700,color:"#1a6644" }}>🔥 Firebase 연결됨 — 실시간 동기화 중</p><p style={{ margin:"2px 0 0",fontSize:10,color:"#888",wordBreak:"break-all" }}>{fbUrl}</p><button style={{ marginTop:8,fontSize:11,color:"#f77",background:"none",border:"1px solid #f77",borderRadius:6,padding:"3px 8px",cursor:"pointer",fontFamily:"inherit" }} onClick={()=>{try{localStorage.removeItem("wm_fb_url");}catch{}window.location.reload();}}>Firebase 재설정</button></div>}<p style={styles.backupDesc}>코드 업데이트 후 데이터 복원용 백업이에요.</p><button style={{ ...styles.btnPrimary,marginBottom:12 }} onClick={exportData}>{copied?"✅ 클립보드에 복사됨!":"📋 현재 데이터 복사 (백업)"}</button><label style={styles.label}>백업 데이터 붙여넣기 (복원)</label><textarea style={{ ...styles.input,height:80,fontSize:11,resize:"vertical",marginBottom:8 }} value={importText} onChange={e=>setImportText(e.target.value)} placeholder='{"users":[...],"leaves":{...},...} 형식으로 붙여넣으세요'/>{importStatus&&<p style={{ margin:"0 0 8px",fontSize:12,fontWeight:600 }}>{importStatus}</p>}<button style={{ ...styles.btnSecondary,width:"100%" }} onClick={importData}>복원하기</button></div>)}</div>);}

function TeamTab({users,leaves,logs,persist,isSuperAdmin,companies,jumpEmpName,onJumpConsumed}){const[showAdd,setShowAdd]=useState(false);const[editEmp,setEditEmp]=useState(null);const[confirmId,setConfirmId]=useState(null);const[reordering,setReordering]=useState(false);const[showResigned,setShowResigned]=useState(false);const[search,setSearch]=useState(jumpEmpName||"");React.useEffect(()=>{if(jumpEmpName){setSearch(jumpEmpName);if(onJumpConsumed)onJumpConsumed();}},[jumpEmpName]);const emps=users.filter(u=>u.id!=="admin");const activeEmps=emps.filter(u=>!u.resignedDate);const resignedEmps=emps.filter(u=>u.resignedDate);const searchMatch=u=>!search||u.name.includes(search)||u.dept.includes(search);const adminEmps=activeEmps.filter(u=>(u.role==="superadmin"||u.role==="viewadmin")&&searchMatch(u));const staffEmps=activeEmps.filter(u=>u.role==="employee"&&searchMatch(u));const deleteEmp=(id)=>{persist(users.filter(u=>u.id!==id),null,null);setConfirmId(null);};const saveEmp=(updated,leaveData)=>{
    const oldId=editEmp.id;
    const newId=updated.id;
    // 아이디 변경 시 logs, leaves도 같이 이전
    let newLogs=logs;

      if(newLeaves[oldId]){newLeaves[newId]=newLeaves[oldId];delete newLeaves[oldId];}
    }

  };const moveEmp=(id,dir)=>{const idx=users.findIndex(u=>u.id===id);if(idx<0)return;const newIdx=idx+dir;if(newIdx<0||newIdx>=users.length)return;const newUsers=[...users];[newUsers[idx],newUsers[newIdx]]=[newUsers[newIdx],newUsers[idx]];persist(newUsers,null,null);};const resignEmp=(id)=>{const updated=users.map(u=>u.id===id?{...u,resignedDate:today}:u);persist(updated,null,null);setConfirmId(null);};const reinstateEmp=(id)=>{const updated=users.map(u=>u.id===id?{...u,resignedDate:null}:u);persist(updated,null,null);};return(<div style={styles.page}><div style={styles.pageHeader}><h2 style={styles.pageTitle}>직원 관리</h2><div style={{ display:"flex",gap:6 }}>{isSuperAdmin&&<button style={{ ...styles.btnSecondary,fontSize:12,padding:"6px 10px" }} onClick={()=>setReordering(r=>!r)}>{reordering?"✅ 완료":"↕️ 순서변경"}</button>}{isSuperAdmin&&!reordering&&<button style={styles.btnAdd} onClick={()=>setShowAdd(true)}>{Icon.plus} 추가</button>}</div></div><div style={{ marginBottom:12 }}><input style={{ ...styles.input,width:"100%",boxSizing:"border-box" }} placeholder="🔍 이름 또는 부서로 검색..." value={search} onChange={e=>setSearch(e.target.value)}/></div>{[...adminEmps,...staffEmps].map(u=>{const lv=normLeave(leaves[u.id],u.joinDate);const roleLabel=u.role==="superadmin"?"🔑 슈퍼관리자":u.role==="viewadmin"?"👁️ 관리자":null;return(<div key={u.id} style={{ ...styles.empCard,...(roleLabel?{borderLeft:"3px solid #3b7ff5"}:{}) }}><div style={styles.empCardLeft}><div style={{ ...styles.logAvatar,width:44,height:44,fontSize:18,opacity:u.resignedDate?0.5:1 }}>{u.name[0]}</div><div><p style={styles.logName}>{u.name}<span style={styles.deptBadge}>{u.dept}</span>{u.resignedDate&&<span style={{ marginLeft:5,fontSize:10,background:"#f77",color:"#fff",borderRadius:4,padding:"1px 5px" }}>퇴사</span>}</p><p style={styles.logContent}>ID: <strong>{u.id}</strong> &nbsp;|&nbsp; {u.resignedDate?`퇴사: ${auD(u.resignedDate)}`:`입사: ${auD(u.joinDate)}`}{roleLabel&&<span style={{ marginLeft:6,fontSize:10,color:"#3b7ff5",fontWeight:700 }}>{roleLabel}</span>}</p><div style={{ display:"flex",alignItems:"center",gap:6,marginTop:2 }}>{lv.noLeave&&<span style={styles.noLeaveBadge}>연차 미적용</span>}</div>{u.birthDate&&<p style={{ margin:"2px 0 0",fontSize:10,color:"#7c2d12",fontWeight:600 }}>🎂 생일 {auD(u.birthDate)}{isBirthdayToday(u.birthDate)&&<span style={{ marginLeft:4,background:"#FBBF24",color:"#fff",padding:"1px 5px",borderRadius:4,fontSize:9 }}>오늘!</span>}</p>}{u.visa&&u.visa.type&&(()=>{const days=calcVisaDays(u.visa.from,u.visa.to);const ongoing=!u.visa.to;return <p style={{ margin:"2px 0 0",fontSize:10,color:"#1a7a4a",fontWeight:600 }}>🛂 {u.visa.type} {u.visa.from&&`${auD(u.visa.from)} ~`} {auD(u.visa.to)||"현재"}{u.visa.to&&new Date(u.visa.to)<new Date()&&<span style={{ color:"#f77" }}> (만료)</span>}{u.visa.from&&<span style={{ marginLeft:6,color:"#0f766e" }}>📅 {days}일{ongoing?" (진행중)":""}</span>}</p>;})()}{(Array.isArray((leaves[u.id]||{}).workHistory)?(leaves[u.id]||{}).workHistory:Object.values((leaves[u.id]||{}).workHistory||{})).map((wh,wi)=>{const co=companies&&companies.find(c=>c.id===wh.companyId);const days=calcVisaDays(wh.from,wh.to);return <p key={wi} style={{margin:"1px 0",fontSize:10,color:"#555"}}>🏢 {co?co.name:"?"} {auD(wh.from)||""} ~ {auD(wh.to)||"현재"}{wh.from&&<span style={{ marginLeft:6,color:"#0f766e",fontWeight:600 }}>📅 {days}일</span>}</p>;})}</div>
            </div><div style={{ display:"flex",gap:4,flexShrink:0,alignItems:"center" }}>{reordering?<><button style={{ ...styles.iconBtn,fontSize:16 }} onClick={()=>moveEmp(u.id,-1)}>▲</button><button style={{ ...styles.iconBtn,fontSize:16 }} onClick={()=>moveEmp(u.id,1)}>▼</button></>:<>{isSuperAdmin&&!u.resignedDate&&<button style={styles.iconBtn} onClick={()=>{setConfirmId(null);setEditEmp(u);}}>{Icon.edit}</button>}{isSuperAdmin&&(confirmId===`resign_${u.id}`?<div style={styles.confirmInline}><span style={{ fontSize:11,color:"#e67e22" }}>퇴사?</span><button style={styles.confirmYes} onClick={()=>resignEmp(u.id)}>예</button><button style={styles.confirmNo} onClick={()=>setConfirmId(null)}>아니오</button></div>:confirmId===`delete_${u.id}`?<div style={styles.confirmInline}><span style={{ fontSize:11,color:"#f77" }}>삭제?</span><button style={styles.confirmYes} onClick={()=>deleteEmp(u.id)}>예</button><button style={styles.confirmNo} onClick={()=>setConfirmId(null)}>아니오</button></div>:u.resignedDate?<div style={{ display:"flex",gap:4 }}><button style={{ ...styles.btnSecondary,fontSize:11,padding:"4px 8px" }} onClick={()=>reinstateEmp(u.id)}>복직</button><button style={{ ...styles.iconBtn,color:"#f77" }} onClick={()=>{setEditEmp(null);setConfirmId(`delete_${u.id}`);}}>{Icon.trash}</button></div>:<div style={{ display:"flex",gap:4 }}><button style={{ ...styles.iconBtn,color:"#e67e22",fontSize:11,fontWeight:700 }} onClick={()=>{setEditEmp(null);setConfirmId(`resign_${u.id}`);}}>퇴사</button><button style={{ ...styles.iconBtn,color:"#f77" }} onClick={()=>{setEditEmp(null);setConfirmId(`delete_${u.id}`);}}>{Icon.trash}</button></div>)}</>}</div></div>);})} {resignedEmps.length>0&&<div style={{ marginTop:16 }}><button style={{ ...styles.btnSecondary,fontSize:12,width:"100%",marginBottom:showResigned?10:0,background:showResigned?"#fff0f0":undefined,borderColor:"#f77",color:"#c0392b" }} onClick={()=>setShowResigned(v=>!v)}>{showResigned?`▲ 퇴사 직원 숨기기`:`▼ 퇴사 직원 보기 (${resignedEmps.length}명)`}</button>{showResigned&&resignedEmps.map(u=>(<div key={u.id} style={{ ...styles.empCard,opacity:0.7,borderLeft:"3px solid #f77" }}><div style={styles.empCardLeft}><div style={{ ...styles.logAvatar,width:44,height:44,fontSize:18,background:"#eee",color:"#999" }}>{u.name[0]}</div><div><p style={styles.logName}>{u.name}<span style={styles.deptBadge}>{u.dept}</span><span style={{ fontSize:10,background:"#f77",color:"#fff",borderRadius:4,padding:"1px 5px",marginLeft:4 }}>퇴사</span></p><p style={styles.logContent}>퇴사일: {auD(u.resignedDate)} &nbsp;|&nbsp; 입사: {auD(u.joinDate)}</p></div></div><div style={{ display:"flex",gap:4 }}><button style={{ ...styles.btnSecondary,fontSize:11,padding:"4px 8px" }} onClick={()=>reinstateEmp(u.id)}>복직</button>{confirmId===`delete_${u.id}`?<div style={styles.confirmInline}><span style={{ fontSize:11,color:"#f77" }}>삭제?</span><button style={styles.confirmYes} onClick={()=>deleteEmp(u.id)}>예</button><button style={styles.confirmNo} onClick={()=>setConfirmId(null)}>아니오</button></div>:<button style={{ ...styles.iconBtn,color:"#f77" }} onClick={()=>setConfirmId(`delete_${u.id}`)}>{Icon.trash}</button>}</div></div>))}</div>}{showAdd&&<AddEmpForm companies={companies} onSave={(emp,leaveData)=>{persist([...users,emp],null,{...leaves,[emp.id]:leaveData});setShowAdd(false);}} onClose={()=>setShowAdd(false)}/>}{editEmp&&<EditEmpForm emp={editEmp} leaveData={normLeave(leaves[editEmp.id],editEmp.joinDate)} companies={companies} onSave={saveEmp} onClose={()=>setEditEmp(null)}/>}<DataBackup users={users} leaves={leaves} logs={logs} persist={persist}/></div>);}

// ─── App ───────────────────────────────────────────────────────────────────
function App() {
  const [isDesktop, setIsDesktop] = React.useState(window.innerWidth >= 768);
  React.useEffect(() => {
    const handler = () => setIsDesktop(window.innerWidth >= 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);
  const [ready,setReady]=useState(false);
  const [session,setSession]=useState(null);
  const [users,setUsers]=useState(SEED_USERS);
  const [logs,setLogs]=useState([]);
  const [leaves,setLeaves]=useState(SEED_LEAVES);
  const [companies,setCompanies]=useState(SEED_COMPANIES);
  const [tab,setTab]=useState("home");
  const [jumpInfo,setJumpInfo]=useState(null);
  const [showChangePw,setShowChangePw]=useState(false);
  const [pwForm,setPwForm]=useState({cur:"",next:"",confirm:""});
  const [pwErr,setPwErr]=useState("");
  const [fbConfigured,setFbConfigured]=useState(false);
  const pollRef=useRef(null);

  const loadFromFb=async()=>{
    const[u,l,lv,co]=await Promise.all([fbGet("users"),fbGet("logs"),fbGet("leaves"),fbGet("companies")]);
    if(u)setUsers(Array.isArray(u)?u:Object.values(u));
    if(l)setLogs(Array.isArray(l)?l:Object.values(l));
    if(lv)setLeaves(lv);
    if(co)setCompanies(Array.isArray(co)?co:Object.values(co));
    return!!(u||l||lv);
  };

  useEffect(()=>{
    (async()=>{
      const fbUrl=getFbUrl();
      if(fbUrl){_fbUrl=fbUrl;setFbConfigured(true);await loadFromFb();pollRef.current=setInterval(loadFromFb,30000);}
      else{const u=await legacyGet("wm_users")||SEED_USERS;const l=await legacyGet("wm_logs")||[];const lv=await legacyGet("wm_leaves")||SEED_LEAVES;setUsers(u);setLogs(l);setLeaves(lv);}
      setSession(await sessionGet());setReady(true);
    })();
    return()=>{if(pollRef.current)clearInterval(pollRef.current);};
  },[]);

  const saveFb=useCallback(async(u,l,lv,co)=>{const base=_fbUrl||getFbUrl();if(!base)return;if(u)fbSet("users",u);if(l)fbSet("logs",l);if(lv)fbSet("leaves",lv);if(co)fbSet("companies",co);},[]);

  const persist=useCallback(async(u,l,lv,co)=>{
    if(u){setUsers(u);saveFb(u,null,null,null);}
    if(l){setLogs(l);saveFb(null,l,null,null);}
    if(lv){setLeaves(lv);saveFb(null,null,lv,null);}
    if(co){setCompanies(co);saveFb(null,null,null,co);}
  },[saveFb]);

  const updateLeaveUsage=useCallback((userId,joinDate,records)=>{
    setLeaves(prev=>{const lv=normLeave(prev[userId]||{},joinDate);const usedDays=Math.round(records.reduce((s,r)=>s+(+(r.days)||0),0)*100)/100;const next={...prev,[userId]:{...lv,usageRecords:records,usedDays}};saveFb(null,null,next);return next;});
  },[saveFb]);

  const login=async(user)=>{await sessionSave(user);setSession(user);setTab("home");};
  const logout=async()=>{await sessionRemove();setSession(null);};

  if(!ready)return(<div style={{ minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f4f6fb" }}><div style={{ textAlign:"center" }}><div style={{ fontSize:40,marginBottom:12 }}>📋</div><p style={{ color:"#3b7ff5",fontWeight:700,fontSize:16 }}>WorkLog 로딩 중...</p></div></div>);
  if(!getFbUrl())return(<FirebaseSetup onDone={async(url)=>{setFbUrl(url);_fbUrl=url;const ok=await loadFromFb();if(!ok){await saveFb(SEED_USERS,[],SEED_LEAVES);}pollRef.current=setInterval(loadFromFb,30000);setFbConfigured(true);}}/>);
  if(!session)return<LoginScreen users={users} onLogin={login}/>;

  const currentUser=users.find(u=>u.id===session.id)||session;
  const isAdmin=currentUser.role==="admin"||currentUser.role==="superadmin"||currentUser.role==="viewadmin";
  const isSuperAdmin=currentUser.role==="admin"||currentUser.role==="superadmin";
  const isViewAdmin=currentUser.role==="viewadmin";

  return(
    <div id='wl-app-root' style={{...styles.app, maxWidth: isDesktop?'100%':480, flexDirection: isDesktop?'row':'column'}}>
      {/* ── 데스크탑 사이드바 ── */}
      {isDesktop && (
        <div className="dt-sidebar">
          <div className="dt-sidebar-logo">
            <div className="dt-sidebar-logo-title">📋 K&M WorkLog</div>
            <div className="dt-sidebar-logo-sub">Tiling Management</div>
          </div>
          <div style={{flex:1,padding:'12px 0',overflowY:'auto'}}>
            {[
              {key:'home',    label:'홈',      emoji:'🏠'},
              {key:'log',     label:'근무일지',  emoji:'📋'},
              ...(isAdmin||!normLeave(leaves[currentUser.id],currentUser.joinDate).noLeave?[{key:'leave',label:'연차',emoji:'🌴'}]:[]),
              {key:'payroll', label:'급여',     emoji:'💰'},
              ...(isAdmin?[{key:'rate',    label:'일급 관리',  emoji:'💵'}]:[]),
              ...(isAdmin?[{key:'team',    label:'직원 관리',  emoji:'👥'}]:[]),
              ...(isAdmin?[{key:'company', label:'회사',       emoji:'🏢'}]:[]),
              ...(isSuperAdmin?[{key:'mgmt',label:'운영진',    emoji:'⭐'}]:[]),
            ].map(item => (
              <button key={item.key} onClick={()=>setTab(item.key)}
                className={'dt-nav-item'+(tab===item.key?' active':'')}>
                <span className="nav-emoji">{item.emoji}</span>
                {item.label}
              </button>
            ))}
          </div>
          <div className="dt-sidebar-footer">
            <div style={{fontWeight:700,color:'rgba(255,255,255,0.8)',fontSize:13,marginBottom:2}}>{currentUser?.name}</div>
            <div style={{marginBottom:10,fontSize:11}}>{isAdmin?'관리자':'직원'}</div>
            <button onClick={logout}
              style={{width:'100%',background:'rgba(220,38,38,0.15)',color:'#FCA5A5',border:'1px solid rgba(220,38,38,0.3)',borderRadius:8,padding:'8px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
              로그아웃 →
            </button>
          </div>
        </div>
      )}

      {/* ── 메인 콘텐츠 ── */}
      <div style={{flex:1, marginLeft: isDesktop?240:0, maxWidth: isDesktop?'100%':480, width:'100%'}}>
      {isDesktop && (
        <div className="dt-topbar">
          <span className="dt-topbar-title">
            {{'home':'홈','log':'근무일지','leave':'연차','payroll':'급여','rate':'일급 관리','team':'직원 관리','company':'회사','mgmt':'⭐ 운영진'}[tab]||tab}
          </span>
          <div style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#888'}}>
            <button onClick={()=>setShowChangePw(true)}
              style={{background:'none',border:'none',cursor:'pointer',color:C.sub,padding:'4px 8px',fontSize:12,fontFamily:'inherit',borderRadius:6}}
              title="비밀번호 변경">🔑 비번변경</button>
            <span style={{background:'#EEF2FF',color:'#4F46E5',borderRadius:6,padding:'4px 10px',fontWeight:700}}>{currentUser?.name}</span>
            <span style={{color:C.sub}}>{isAdmin?'관리자':'직원'}</span>
            <button onClick={logout}
              style={{background:'#FEF2F2',color:'#DC2626',border:'1px solid #FECACA',borderRadius:8,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
              로그아웃 →
            </button>
          </div>
        </div>
      )}
      <div className={isDesktop?'dt-content-area':''}>
      <Header user={currentUser} onLogout={logout} onChangePw={()=>{setPwForm({cur:"",next:"",confirm:""});setPwErr("");setShowChangePw(true);}}/>
      <div style={styles.content}>
        {tab==="home"&&<HomeTab user={currentUser} users={users} logs={logs} leaves={leaves} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin} persist={persist}
          onJumpToLog={(date,userId,periodOffset)=>{setJumpInfo({date,userId,periodOffset});setTab("log");}}
          onJumpToEmp={(userId)=>{const u=users.find(x=>x.id===userId);setJumpInfo({jumpEmpName:u?u.name:""});setTab("team");}}
        /> }
        {tab==="log"&&<LogTab user={currentUser} users={users} logs={logs} leaves={leaves} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin} isViewAdmin={isViewAdmin} persist={persist} jumpInfo={jumpInfo} onJumpConsumed={()=>setJumpInfo(null)}/>}
        {tab==="leave"&&<LeaveTab user={currentUser} users={users} leaves={leaves} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin} isViewAdmin={isViewAdmin} persist={persist} updateLeaveUsage={updateLeaveUsage}/>}
        {isAdmin&&tab==="rate"&&<RateTab users={users} leaves={leaves} persist={persist} isSuperAdmin={isSuperAdmin}/>}
        {isAdmin&&tab==="team"&&<TeamTab users={users} leaves={leaves} logs={logs} persist={persist} isSuperAdmin={isSuperAdmin} companies={companies} jumpEmpName={jumpInfo?jumpInfo.jumpEmpName:null} onJumpConsumed={()=>setJumpInfo(null)}/>}
        {tab==="payroll"&&<PayrollTab user={currentUser} users={users} logs={logs} leaves={leaves} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin} persist={persist} companies={companies}/>}
        {isAdmin&&tab==="company"&&<CompanyTab companies={companies} persist={persist} isSuperAdmin={isSuperAdmin}/>}
        {isSuperAdmin&&tab==="mgmt"&&<MgmtTab fbUrl={getFbUrl()} fA={n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(n||0)}/>}
      </div>
      {showChangePw && (
        <div style={styles.modal}>
          <div style={styles.modalBox}>
            <div style={styles.modalHeader}>
              <h3 style={styles.modalTitle}>🔑 비밀번호 변경</h3>
              <button style={styles.iconBtn} onClick={()=>setShowChangePw(false)}>{Icon.x}</button>
            </div>
            <div style={styles.field}>
              <label style={styles.label}>현재 비밀번호</label>
              <input type="password" style={styles.input} value={pwForm.cur}
                onChange={e=>setPwForm(f=>({...f,cur:e.target.value}))} placeholder="현재 비밀번호"/>
            </div>
            <div style={styles.field}>
              <label style={styles.label}>새 비밀번호</label>
              <input type="password" style={styles.input} value={pwForm.next}
                onChange={e=>setPwForm(f=>({...f,next:e.target.value}))} placeholder="새 비밀번호 (4자 이상)"/>
            </div>
            <div style={styles.field}>
              <label style={styles.label}>새 비밀번호 확인</label>
              <input type="password" style={styles.input} value={pwForm.confirm}
                onChange={e=>setPwForm(f=>({...f,confirm:e.target.value}))} placeholder="다시 입력"/>
            </div>
            {pwErr && <p style={{ color:"#f77",fontSize:13,fontWeight:600,margin:"0 0 12px" }}>⚠️ {pwErr}</p>}
            <div style={styles.modalFooter}>
              <button style={styles.btnSecondary} onClick={()=>setShowChangePw(false)}>취소</button>
              <button style={styles.btnPrimary} onClick={()=>{
                if(pwForm.cur !== currentUser.pw){setPwErr("현재 비밀번호가 틀렸어요.");return;}
                if(pwForm.next.length < 4){setPwErr("새 비밀번호는 4자 이상이어야 해요.");return;}
                if(pwForm.next !== pwForm.confirm){setPwErr("새 비밀번호가 일치하지 않아요.");return;}
                persist(users.map(u=>u.id===currentUser.id?{...u,pw:pwForm.next}:u),null,null);
                sessionSave({...currentUser,pw:pwForm.next});
                setShowChangePw(false);
                alert("✅ 비밀번호가 변경됐어요!");
              }}>변경</button>
            </div>
          </div>
        </div>
      )}
      <BottomNav tab={tab} setTab={setTab} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin} userHasLeave={isAdmin||!normLeave(leaves[currentUser.id],currentUser.joinDate).noLeave} user={currentUser} logs={logs}/>
      </div>{/* dt-content-area */}
      </div>{/* dt-main */}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){if(this.state.err)return React.createElement("pre",{style:{color:"red",padding:"20px",fontSize:"11px",whiteSpace:"pre-wrap"}},"렌더 오류: "+this.state.err.message+"\n"+(this.state.err.stack||""));return this.props.children;}
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary,null,React.createElement(App)));

</script>
<script>
var attempts = 0;
function runApp() {
  attempts++;
  if (attempts > 30) { document.getElementById("loadmsg").style.color="red"; document.getElementById("loadmsg").textContent="로딩 실패"; return; }
  if (typeof Babel === "undefined") { setTimeout(runApp, 1000); return; }
  try {
    var src = document.getElementById("src").textContent;
    var out = Babel.transform(src, { presets: ["react"] });
    eval(out.code);
    document.getElementById("loading").style.display = "none";
    document.getElementById("root").style.display = "block";
  } catch(e) {
    document.getElementById("loadmsg").style.color = "red";
    document.getElementById("loadmsg").textContent = "오류: " + e.message;
    console.error(e);
  }
}
window.onload = function() { setTimeout(runApp, 500); };
</script></body></html>
