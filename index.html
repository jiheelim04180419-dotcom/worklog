                  <p style={{margin:'0 0 4px',fontSize:11,color:'#6B7280',fontWeight:600}}>27일 공제액</p>
                  <input type="number" value={ksConfig.d27} onChange={e=>setKsConfig(c=>({...c,d27:e.target.value}))}
                    style={{width:'100%',padding:'9px 12px',border:'1.5px solid #E5E8F5',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff',outline:'none'}} placeholder="0.00"/>
                </div>
              </div>
              <button onClick={saveKsConfig} disabled={ksSaving}
                style={{width:'100%',background:'#7C3AED',color:'#fff',border:'none',borderRadius:9,padding:'11px',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
                {ksSaving?'저장 중...':'💾 공제 설정 저장'}
              </button>
            </div>
          )}
        </div>
      )}

      {showForm && <MgmtMemberForm member={editMember} currentPeriodStart={todayPeriodStart} onSave={saveMember} onClose={()=>{setShowForm(false);setEditMember(null);}}/>}
    </div>
  );
}

function MgmtMemberForm({ member, currentPeriodStart, onSave, onClose }) {
  const today0 = localDateStr(new Date());
  const initHistory = () => {
    const existing = Array.isArray(member?.history) ? member.history
      : Object.values(member?.history||{});
    if (existing.length > 0) return existing;
    // 기존 멤버 데이터로 최초 이력 생성
    if (member) return [{
      from: '2026-04-13',
      salary: member.salary||'', tax: member.tax||'', super: member.super||'',
      invoiceAmount: member.invoiceAmount||'', invoiceGst: !!member.invoiceGst
    }];
    return [{ from: today0, salary:'', tax:'', super:'', invoiceAmount:'', invoiceGst:false }];
  };

  const [name, setName] = React.useState(member?.name||'');
  const [role, setRole] = React.useState(member?.role||'');
  const [type, setType] = React.useState(member?.type||'monthly');
  const [history, setHistory] = React.useState(initHistory);
  // 원본 이력 스냅샷 — 저장 시 "지난 기간 보호" 자동 분할에 사용
  const [origHistory] = React.useState(() => {
    const h = Array.isArray(member?.history) ? member.history : Object.values(member?.history||{});
    return h.map(x => ({...x}));
  });
  const sortedHist = [...history].sort((a,b)=>b.from.localeCompare(a.from));

  const setH = (i, k, v) => {
    const sorted = [...history].sort((a,b)=>b.from.localeCompare(a.from));
    const target = sorted[i];
    setHistory(h => h.map(x => x===target ? {...x,[k]:v} : x));
  };
  const addHistory = () => setHistory(h => [...h, {
    from: today0,
    type: type,    // 현재 선택된 급여 유형을 entry 에 박아둠 (월급→인보이스 전환 추적)
    salary: sortedHist[0]?.salary||'', tax: sortedHist[0]?.tax||'',
    super: sortedHist[0]?.super||'', invoiceAmount: sortedHist[0]?.invoiceAmount||'',
    invoiceGst: sortedHist[0]?.invoiceGst !== undefined
      ? !!sortedHist[0].invoiceGst
      : (type === 'invoice_gst')
  }]);
  const delHistory = (i) => {
    if (history.length <= 1) return alert('최소 1개 이력이 필요해요');
    const sorted = [...history].sort((a,b)=>b.from.localeCompare(a.from));
    const target = sorted[i];
    setHistory(h => h.filter(x => x!==target));
  };

  const IS = {width:'100%',padding:'10px 12px',border:'1.5px solid #E5E8F5',borderRadius:9,fontSize:14,fontFamily:'inherit',background:'#fff',color:'#111827',outline:'none'};
  const IS_SM = {width:'100%',padding:'8px 10px',border:'1.5px solid #E5E8F5',borderRadius:8,fontSize:13,fontFamily:'inherit',background:'#fff',color:'#111827',outline:'none'};
  const LB = {display:'block',fontSize:11,fontWeight:700,color:'#6B7280',marginBottom:4,textTransform:'uppercase',letterSpacing:0.5};

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:200,display:'flex',alignItems:'flex-end',justifyContent:'center',backdropFilter:'blur(2px)'}}>
      <div style={{background:'#fff',borderRadius:'20px 20px 0 0',width:'100%',maxWidth:600,maxHeight:'92vh',overflowY:'auto',padding:'22px 20px',boxShadow:'0 -4px 30px rgba(79,70,229,0.12)'}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:20}}>
          <h3 style={{fontSize:17,fontWeight:800,color:'#111827'}}>{member?'멤버 수정':'멤버 추가'}</h3>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#9CA3AF'}}>×</button>
        </div>

        {/* 기본 정보 */}
        <div style={{display:'flex',gap:10,marginBottom:14}}>
          <div style={{flex:1}}><label style={LB}>이름</label><input value={name} onChange={e=>setName(e.target.value)} style={IS} placeholder="이름"/></div>
          <div style={{flex:1}}><label style={LB}>역할</label><input value={role} onChange={e=>setRole(e.target.value)} style={IS} placeholder="CEO, CFO..."/></div>
        </div>
        <div style={{marginBottom:16}}>
          <label style={LB}>급여 유형</label>
          <select value={type} onChange={e=>setType(e.target.value)} style={IS}>
            <option value="monthly">월급 (Net Pay 직접 입력)</option>
            <option value="invoice">인보이스 (GST 없음)</option>
            <option value="invoice_gst">인보이스 + GST 10%</option>
          </select>
        </div>

        {/* 금액 이력 */}
        <div style={{marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <label style={{...LB,margin:0}}>💰 금액 이력 (기간별 보존)</label>
            <button onClick={addHistory}
              style={{background:'#EEF2FF',color:'#4F46E5',border:'1px solid #C7D2FE',borderRadius:7,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
              + 이력 추가
            </button>
          </div>
          <p style={{margin:'0 0 10px',fontSize:11,color:'#9CA3AF'}}>적용 시작일 이후 기간은 해당 금액으로 표시돼요</p>

          {sortedHist.map((h,i) => (
            <div key={i} style={{background:i===0?'#F0F4FF':'#F9FAFB',borderRadius:12,padding:'12px 14px',marginBottom:8,border:`1.5px solid ${i===0?'#C7D2FE':'#E5E8F5'}`}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:10,fontWeight:700,color:i===0?'#4F46E5':'#9CA3AF',textTransform:'uppercase'}}>
                    {i===0?'✅ 최신':'이전'} · 적용 시작일
                  </span>
                  <input type="date" value={h.from} onChange={e=>setH(i,'from',e.target.value)}
                    style={{...IS_SM,width:'auto',flex:'none'}}/>
                </div>
                {history.length>1&&<button onClick={()=>delHistory(i)}
                  style={{background:'none',border:'none',color:'#FCA5A5',fontSize:16,cursor:'pointer'}}>×</button>}
              </div>

              {type==='monthly' && (<>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <div style={{flex:1}}><p style={{margin:'0 0 3px',fontSize:10,color:'#6B7280',fontWeight:600}}>Net Pay (2주)</p><input type="number" value={h.salary} onChange={e=>setH(i,'salary',e.target.value)} style={IS_SM} placeholder="0.00"/></div>
                  <div style={{flex:1}}><p style={{margin:'0 0 3px',fontSize:10,color:'#6B7280',fontWeight:600}}>Tax (2주)</p><input type="number" value={h.tax||''} onChange={e=>setH(i,'tax',e.target.value)} style={IS_SM} placeholder="0.00"/></div>
                  <div style={{flex:1}}><p style={{margin:'0 0 3px',fontSize:10,color:'#6B7280',fontWeight:600}}>Super (2주)</p><input type="number" value={h.super||''} onChange={e=>setH(i,'super',e.target.value)} style={IS_SM} placeholder="0.00"/></div>
                </div>
                <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
                  <div style={{flex:1}}><p style={{margin:'0 0 3px',fontSize:10,color:'#6B7280',fontWeight:600}}>인보이스 별도 (선택)</p><input type="number" value={h.invoiceAmount||''} onChange={e=>setH(i,'invoiceAmount',e.target.value)} style={IS_SM} placeholder="0.00"/></div>
                  <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,cursor:'pointer',paddingBottom:2}}>
                    <input type="checkbox" checked={!!h.invoiceGst} onChange={e=>setH(i,'invoiceGst',e.target.checked)} style={{accentColor:'#D97706',width:14,height:14}}/>
                    GST +10%
                  </label>
                </div>
              </>)}
              {(type==='invoice'||type==='invoice_gst') && (
                <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
                  <div style={{flex:1}}><p style={{margin:'0 0 3px',fontSize:10,color:'#6B7280',fontWeight:600}}>인보이스 금액</p><input type="number" value={h.invoiceAmount||''} onChange={e=>setH(i,'invoiceAmount',e.target.value)} style={IS_SM} placeholder="0.00"/></div>
                  <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,cursor:'pointer',paddingBottom:8,whiteSpace:'nowrap'}}>
                    <input type="checkbox" checked={!!h.invoiceGst} onChange={e=>setH(i,'invoiceGst',e.target.checked)} style={{accentColor:'#D97706',width:14,height:14}}/>
                    GST +10%
                  </label>
                </div>
              )}
            </div>
          ))}
        </div>

        <div style={{display:'flex',gap:10}}>
          <button onClick={onClose} style={{flex:1,background:'#F3F4F6',color:'#374151',border:'none',borderRadius:10,padding:12,fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>취소</button>
          <button onClick={()=>{
            if(!name) return alert('이름을 입력하세요');
            if(history.length===0) return alert('금액 이력이 필요해요');
            const latest = [...history].sort((a,b)=>b.from.localeCompare(a.from))[0];

            // 🛡️ 지난 기간 보호 — latest 이력 값이 변경됐는데 from 이 현재 기간보다 이전이면
            // 원본 latest 는 그대로 두고, 변경된 값으로 새 이력(from=현재 기간 시작)을 추가.
            // → 단일 이력으로 모든 기간 다 커버하던 상황에서 과거가 함께 수정되는 버그 방지.
            // 이력이 2개 이상이면 사용자가 직접 기간을 관리 중인 거니까 자동 분할 안 함.
            let finalHistory = history;
            let didSplit = false;
            const origLatest = origHistory.find(o => o.from === latest.from);
            const valuesChanged = origLatest && (
              String(origLatest.salary||'') !== String(latest.salary||'') ||
              String(origLatest.tax||'') !== String(latest.tax||'') ||
              String(origLatest.super||'') !== String(latest.super||'') ||
              String(origLatest.invoiceAmount||'') !== String(latest.invoiceAmount||'') ||
              !!origLatest.invoiceGst !== !!latest.invoiceGst ||
              ((origLatest.type||member?.type||'') !== (latest.type||type||''))
            );
            const singleEntry = origHistory.length <= 1;
            if (singleEntry && origLatest && valuesChanged && currentPeriodStart && latest.from < currentPeriodStart) {
              // latest 를 원본 그대로 복구
              finalHistory = history.map(h => h === latest ? {...origLatest} : h);
              // 변경된 값으로 새 이력(from=현재 기간 시작) 추가
              finalHistory = [...finalHistory, {
                from: currentPeriodStart,
                type: latest.type || type,
                salary: latest.salary || '',
                tax: latest.tax || '',
                super: latest.super || '',
                invoiceAmount: latest.invoiceAmount || '',
                invoiceGst: !!latest.invoiceGst,
              }];
              didSplit = true;
            }

            const finalLatest = [...finalHistory].sort((a,b)=>b.from.localeCompare(a.from))[0];

            if (didSplit) {
              const ok = confirm(`💡 변경된 금액을 ${currentPeriodStart}부터 새 이력으로 저장할까요?\n→ 이전 기간 금액은 그대로 유지돼요.\n\n취소를 누르면 기존 이력을 그대로 덮어써서 과거 기간까지 함께 바뀝니다.`);
              if (!ok) {
                // 사용자가 "취소" 한 경우 — 원래 의도대로 덮어쓰기
                finalHistory = history;
              }
            }
            const finalLatest2 = [...finalHistory].sort((a,b)=>b.from.localeCompare(a.from))[0];

            onSave({
              ...(member||{}), name, role, type, history: finalHistory,
              // 하위 호환용 현재 값 (latest entry 기준)
              salary: finalLatest2.salary, tax: finalLatest2.tax, super: finalLatest2.super,
              invoiceAmount: finalLatest2.invoiceAmount, invoiceGst: finalLatest2.invoiceGst
            });
          }} style={{flex:2,background:'#4F46E5',color:'#fff',border:'none',borderRadius:10,padding:12,fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 2px 8px rgba(79,70,229,0.25)'}}>
            💾 저장
          </button>
        </div>
      </div>
    </div>
  );
}


function SummarySection({users, leaves, periodStart, calcWage, getSavedDeductions, getKeepBalance, getKeepBalanceAtPeriod, getPeriodDeposits, EMP_COLORS, fA, C, selId, setSelId, setSubView}) {
  const activeEmps = users.filter(u => !u.resignedDate && u.role === "employee");
  const fmtD = (ps) => { const d=new Date(ps+"T00:00:00"); d.setDate(d.getDate()+13); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
  // 이 기간이 입사일 이전, 또는 퇴사일 이후라면 "정산 미완료" 알림에서 제외
  const empWorkedInPeriod = (emp, ps) => {
    const pe = fmtD(ps);
    if (emp.joinDate && emp.joinDate > pe) return false; // 입사 전
    if (emp.resignedDate && emp.resignedDate < ps) return false; // 퇴사 후
    return true;
  };
  const fmt = (v, color) => <p style={{ margin:0,fontSize:12,fontWeight:700,color:v?color:"#ccc",textAlign:"center",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis" }}>{v?fA(v):"—"}</p>;

  // 카일+사라 공동 계산 설정 (Firebase에서 읽기)
  const [jConfig, setJConfig] = React.useState({total:'', d20:'', d27:'', showCalc:false});
  const [jResult, setJResult] = React.useState(null);
  const [editJConfig, setEditJConfig] = React.useState(false);



  const calcJoint = () => {
    const total = parseFloat(jConfig.total) || 0;
    const d20amt = periodHas20 ? (parseFloat(jConfig.d20) || 0) : 0;
    const d27amt = periodHas27 ? (parseFloat(jConfig.d27) || 0) : 0;
    const net = total - d20amt - d27amt;
    const kyle = net / 2;
    const sara = (net / 2) * 1.1;
    setJResult({ total, d20amt, d27amt, net, kyle, sara });
  };

  return (
    <div>

      <div style={{ background:"#EFF6FF",borderRadius:10,padding:"8px 14px",marginBottom:8,fontSize:12,color:"#1D4ED8",fontWeight:600 }}>
        📅 {auD(periodStart)} ~ {auD(fmtD(periodStart))} 정산 요약
      </div>
      <div style={{ display:"grid",gridTemplateColumns:"80px repeat(4, minmax(0,1fr))",gap:4,padding:"6px 10px",marginBottom:4 }}>
        {["이름","Net Pay","Tax","Super","정산후킵"].map(h=>(
          <p key={h} style={{ margin:0,fontSize:10,fontWeight:700,color:"#888",textAlign:"center" }}>{h}</p>
        ))}
      </div>
      {/* 정산 미완료 직원 표시 (입사 전/퇴사 후 직원 제외) */}
      {activeEmps.filter(emp => {
        if (!empWorkedInPeriod(emp, periodStart)) return false;
        const hist = (leaves[emp.id]||{}).keepBalanceHistory || [];
        const settled = Array.isArray(hist) ? hist : Object.values(hist);
        return !settled.find(h => h.periodStart === periodStart);
      }).length > 0 && (
        <div style={{ background:"#FEF9C3",border:"1px solid #FDE047",borderRadius:10,padding:"10px 12px",marginBottom:12 }}>
          <p style={{ margin:"0 0 6px",fontSize:12,fontWeight:700,color:"#854D0E" }}>⚠️ 정산 미완료</p>
          <div style={{ display:"flex",flexWrap:"wrap",gap:6 }}>
            {activeEmps.filter(emp => {
              if (!empWorkedInPeriod(emp, periodStart)) return false;
              const hist = (leaves[emp.id]||{}).keepBalanceHistory || [];
              const settled = Array.isArray(hist) ? hist : Object.values(hist);
              return !settled.find(h => h.periodStart === periodStart);
            }).map(emp => (
              <span key={emp.id} onClick={()=>{ setSelId(emp.id); setSubView("calc"); }}
                style={{ background:"#FEF08A",color:"#713F12",borderRadius:6,padding:"3px 8px",fontSize:12,fontWeight:600,cursor:"pointer" }}>
                {emp.name}
              </span>
            ))}
          </div>
        </div>
      )}

      {/* 정산 완료 직원만 표시 */}
      {activeEmps.filter(emp => {
        const hist = (leaves[emp.id]||{}).keepBalanceHistory || [];
        const settled = Array.isArray(hist) ? hist : Object.values(hist);
        return !!settled.find(h => h.periodStart === periodStart);
      }).length === 0 && (
        <div style={{ textAlign:"center",padding:"20px 0",color:"#aaa" }}>
          <p style={{ margin:0,fontSize:13 }}>정산 완료한 직원이 없어요</p>
          <p style={{ margin:"4px 0 0",fontSize:11 }}>각 직원 급여탭에서 정산 완료 버튼을 눌러주세요</p>
        </div>
      )}

      {activeEmps.map((emp,ei) => {
        const lv = leaves[emp.id] || {};
        const w = calcWage(emp.id);
        // 기간별 킵잔액 (정산 전 시작잔액 + 당기입금)
        const keep = getKeepBalanceAtPeriod(emp.id, periodStart) + getPeriodDeposits(emp.id, periodStart);
        // splitPay 여부 확인
        const ci0 = lv.contractorInfo || {};
        const splitPay0 = !!(ci0.splitPay);
        const gstReg0 = !!(ci0.gstRegistered);
        const sd2pre = getSavedDeductions(emp.id).reduce((s,d)=>s+(parseFloat(d.amount)||0),0);
        const netPay   = w ? (w.isContractor && !w.hasFlatPay ? Math.max(0, (parseFloat(w.gross)||0) - sd2pre) : (parseFloat(w.fixedNet)||0)) : 0;
        const taxAmt   = w ? (w.isContractor && !w.hasFlatPay ? 0 : (parseFloat(w.fixedTax)||0)) : 0;
        const superAmt = w ? (w.isContractor && !w.hasFlatPay ? 0 : (parseFloat(w.fixedSuper)||0)) : 0;
        const splitCash = (splitPay0 && w) ? (w.stats.fullDays * w.dailyRate / 2) : 0;
        const splitAbnBase = (splitPay0 && w) ? (w.stats.fullDays*w.dailyRate/2 + (w.stats.partHours||0)*w.partHourlyRate + (w.stats.otHours||0)*w.otHourlyRate + (w.travel||0)) : 0;
        const splitGst  = (splitPay0 && gstReg0) ? splitAbnBase * 0.1 : 0;
        const col = EMP_COLORS[ei % EMP_COLORS.length];
        const isContractor = !!(lv.noLeave);
        const hasFlatPay   = !!(lv.hasFlatPay);
        const typeLabel = isContractor ? (hasFlatPay ? "킵관리" : "인보이스") : "연차";
        const sd2 = getSavedDeductions(emp.id).reduce((s,d)=>s+(parseFloat(d.amount)||0),0);
        const v2 = !w ? 0
          : (w.isContractor && !w.hasFlatPay) ? 0
          : w.hasFlatPay ? w.gross-w.fixedTotal-sd2
          : w.excessPartH*w.partHourlyRate+w.excessOtH*w.otHourlyRate-w.deficitH*w.partHourlyRate+w.travel-sd2;
        const ka = keep + v2;  // 시작잔액 + 당기입금 + 변동분
        return (
          <div key={emp.id} onClick={()=>{ setSelId(emp.id); setSubView("calc"); }}
            style={{ display:"grid",gridTemplateColumns:"80px repeat(4, minmax(0,1fr))",gap:4,
              background:selId===emp.id?"#EFF6FF":"#fff",borderRadius:10,padding:"10px",
              marginBottom:6,boxShadow:"0 1px 3px #0000000a",
              border:`1.5px solid ${selId===emp.id?col:"#F0F0F0"}`,cursor:"pointer",
              borderLeft:`4px solid ${col}`,alignItems:"center" }}>
            <div style={{ display:"flex",alignItems:"center",gap:6 }}>
              <div style={{ width:24,height:24,borderRadius:"50%",background:col,color:"#fff",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>{emp.name[0]}</div>
              <div>
                <p style={{ margin:0,fontSize:12,fontWeight:700,lineHeight:1.2 }}>{emp.name}</p>
                <p style={{ margin:0,fontSize:9,color:"#aaa" }}>{typeLabel}</p>
              </div>
            </div>
            {splitPay0 ? (
              <div style={{ textAlign:"center" }}>
                <p style={{ margin:0,fontSize:11,fontWeight:700,color:"#10B981" }}>💵 {fA(splitCash)}</p>
                <p style={{ margin:0,fontSize:11,fontWeight:700,color:"#3B82F6" }}>🧾 {fA(splitAbnBase+splitGst)}</p>
              </div>
            ) : fmt(netPay,"#10B981")}
            {splitPay0 ? <p style={{ margin:0,fontSize:12,color:"#aaa",textAlign:"center" }}>—</p> : fmt(taxAmt,"#EF4444")}
            {splitPay0 ? <p style={{ margin:0,fontSize:12,color:"#aaa",textAlign:"center" }}>—</p> : fmt(superAmt,"#8B5CF6")}
            <p style={{ margin:0,fontSize:12,fontWeight:700,
                color:(w&&w.isContractor&&!w.hasFlatPay)
                  ? (parseFloat(lv.keepBalance)||0)<0?"#EF4444":(parseFloat(lv.keepBalance)||0)>0?"#10B981":"#ccc"
                  : ka>0?"#3B82F6":ka<0?"#EF4444":"#ccc",
                textAlign:"center",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis" }}>
              {(w&&w.isContractor&&!w.hasFlatPay)
                ? (parseFloat(lv.keepBalance)||0)!==0 ? fA(parseFloat(lv.keepBalance)) : "—"
                : ka!==0?fA(ka):"—"}
            </p>
          </div>
        );
      })}
      {/* 합계 행 */}
      {activeEmps.length > 0 && (() => {
        const settledEmps = activeEmps;
        const totNet   = settledEmps.reduce((s,u)=>{const w2=calcWage(u.id);return s+(w2&&w2.isContractor&&!w2.hasFlatPay?(parseFloat(w2.gross)||0):(parseFloat(w2?.fixedNet)||0));},0);
        const totTax   = settledEmps.reduce((s,u)=>{const w2=calcWage(u.id);return s+(w2&&w2.isContractor&&!w2.hasFlatPay?0:(parseFloat(w2?.fixedTax)||0));},0);
        const totSuper = settledEmps.reduce((s,u)=>{const w2=calcWage(u.id);return s+(parseFloat(w2?.fixedSuper)||0);},0);
        const totKeep  = settledEmps.reduce((s,u,ei) => {
          const lv = leaves[u.id]||{};
          const keep = getKeepBalanceAtPeriod(u.id, periodStart) + getPeriodDeposits(u.id, periodStart);
          const sd2 = getSavedDeductions(u.id).reduce((s,d)=>s+(parseFloat(d.amount)||0),0);
          const w2 = calcWage(u.id);
          const isContractor = !!(lv.noLeave);
          const hasFlatPay = !!(lv.hasFlatPay);
          const v2 = !w2 ? 0
            : (w2.isContractor && !w2.hasFlatPay) ? 0
            : w2.hasFlatPay ? w2.gross-w2.fixedTotal-sd2
            : w2.excessPartH*w2.partHourlyRate+w2.excessOtH*w2.otHourlyRate-w2.deficitH*w2.partHourlyRate+w2.travel-sd2;
          return s + keep + v2;
        }, 0);
        const cell = (v, color) => <p style={{ margin:0,fontSize:12,fontWeight:800,color:v?color:"#ccc",textAlign:"center",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis" }}>{v?fA(v):"—"}</p>;
        return (
          <div style={{ display:"grid",gridTemplateColumns:"80px repeat(4, minmax(0,1fr))",gap:4,
            background:"#F8FAFF",borderRadius:10,padding:"10px",marginTop:4,
            borderTop:"2px solid #E5E7EB",alignItems:"center" }}>
            <p style={{ margin:0,fontSize:11,fontWeight:700,color:"#555" }}>합계</p>
            {cell(totNet,"#10B981")}
            {cell(totTax,"#EF4444")}
            {cell(totSuper,"#8B5CF6")}
            <p style={{ margin:0,fontSize:12,fontWeight:800,color:totKeep>0?"#3B82F6":totKeep<0?"#EF4444":"#ccc",textAlign:"center",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis" }}>{totKeep!==0?fA(totKeep):"—"}</p>
          </div>
        );
      })()}
    </div>
  );
}


// 회계연도별 Gross Income 요약 — 호주 FY (7/1 ~ 다음해 6/30) 기준.
//
// 두 경로:
//  1) 고정지급 직원 (fixedNet/Tax/Super) → 정기마다 (Net + Tax) 합산
//     ATO PAYG 신고 그로스 = Net + Tax. Super 는 제외 (회사 부담분, 임금 아님).
//     로그가 1개라도 있는 fortnight 만 카운트 → 미근무 정기는 제외.
//     fixedPayHistory 가 있으면 그 정기 시점 값 사용.
//  2) 컨트랙터 (noLeave + !hasFlatPay + fixedPay 0) → 로그 기반 직접 계산
//     일당 × 풀타임일 + OT/Part 시급 + Travel.
function FYGrossSummary({ userId, lv, logs, users, isAdmin, getDailyRate, fA }) {
  const userLogs = (logs || []).filter(l => l && l.userId === userId && l.date);
  if (userLogs.length === 0) return null;

  const fyKeyFor = (dateStr) => {
    const [y, m] = dateStr.split('-').map(Number);
    return m >= 7 ? y : y - 1;
  };
  const fyLabel = (sy) => `FY ${String(sy).slice(-2)}/${String(sy+1).slice(-2)}`;
  const fyRange = (sy) => `01/07/${sy} ~ 30/06/${sy+1}`;

  // fixedPay 직원 여부 — 컨트랙터(noLeave)인데 hasFlatPay 도 아니고 고정값 0 이면 로그 기반.
  const isContractor = !!(lv && lv.noLeave);
  const fixedSum = ((parseFloat((lv||{}).fixedNet)||0) + (parseFloat((lv||{}).fixedTax)||0) + (parseFloat((lv||{}).fixedSuper)||0));
  const hasHist = !!(lv && Array.isArray(lv.fixedPayHistory) && lv.fixedPayHistory.length > 0);
  const useFixedPay = (!isContractor || (lv && lv.hasFlatPay) || hasHist) && (fixedSum > 0 || hasHist);

  // 어떤 날짜의 fortnight 정기 시작일 (월요일 격주, BASE = 2026-04-13)
  const FORT_BASE = new Date("2026-04-13T00:00:00");
  const periodStartOf = (dateStr) => {
    const d = new Date(dateStr + "T00:00:00");
    const idx = Math.floor((d - FORT_BASE) / (14*24*60*60*1000));
    const ps = new Date(FORT_BASE); ps.setDate(ps.getDate() + idx * 14);
    return `${ps.getFullYear()}-${String(ps.getMonth()+1).padStart(2,"0")}-${String(ps.getDate()).padStart(2,"0")}`;
  };

  // 정기 시점 fixedPay 조회
  const fixedPayAt = (ps) => {
    if (!lv) return { net: 0, tax: 0, sup: 0 };
    const hist = (lv.fixedPayHistory || []).slice().sort((a,b) => (b.from||"").localeCompare(a.from||""));
    if (hist.length === 0) {
      return { net: parseFloat(lv.fixedNet)||0, tax: parseFloat(lv.fixedTax)||0, sup: parseFloat(lv.fixedSuper)||0 };
    }
    const entry = hist.find(h => h.from <= ps) || hist[hist.length-1];
    return { net: parseFloat(entry.net)||0, tax: parseFloat(entry.tax)||0, sup: parseFloat(entry.sup)||0 };
  };

  const byFY = {};
  const ensureFY = (fy) => byFY[fy] = byFY[fy] || { gross: 0, net: 0, tax: 0, periods: 0, fullDays: 0, partHours: 0, otHours: 0, travel: 0, count: 0 };

  if (useFixedPay) {
    // 정기마다 (Net + Tax) 합산 — 로그가 있는 fortnight 만 인정 (미근무 정기 제외)
    const periodsWithLogs = new Set();
    userLogs.forEach(l => periodsWithLogs.add(periodStartOf(l.date)));
    Array.from(periodsWithLogs).forEach(ps => {
      const fy = fyKeyFor(ps);
      const fp = fixedPayAt(ps);
      const g = fp.net + fp.tax;
      const F = ensureFY(fy);
      F.gross += g; F.net += fp.net; F.tax += fp.tax; F.periods++;
    });
  } else {
    // 컨트랙터: 로그 기반 직접 계산 (이전 로직 유지)
    userLogs.forEach(l => {
      const fy = fyKeyFor(l.date);
      const F = ensureFY(fy);
      const dailyRate = getDailyRate(userId, l.date) || 0;
      let g = 0;
      if (l.workType === "fulltime" || l.workType === "publicholiday" || !l.workType) {
        g += dailyRate; F.fullDays++;
      } else if (l.workType === "overtime") {
        const otH = calcHours(l.otStart || FULLTIME_END, l.otEnd || FULLTIME_END);
        g += dailyRate + otH * (dailyRate / 8);
        F.fullDays++; F.otHours += otH;
      } else if (l.workType === "parttime") {
        const pH = l.hours || 0;
        g += pH * (dailyRate / 9);
        F.partHours += pH;
      }
      if (l.travel && l.travel.allowance) { g += l.travel.allowance; F.travel += l.travel.allowance; }
      if (l.travel && l.travel.hasDinner)  { g += 25; F.travel += 25; }
      F.gross += g; F.count++;
    });
  }

  const fys = Object.keys(byFY).map(Number).sort((a, b) => b - a);
  if (fys.length === 0) return null;
  const todayFy = fyKeyFor(today);

  return (
    <div style={{ marginTop:14, background:"#FEF3C7", border:"1px solid #FDE68A", borderRadius:10, padding:"12px 14px" }}>
      <p style={{ margin:"0 0 6px", fontSize:12, fontWeight:700, color:"#92400E" }}>📊 회계연도별 Gross Income</p>
      <p style={{ margin:"0 0 10px", fontSize:10, color:"#92400E", lineHeight:1.4 }}>
        호주 FY (7/1 ~ 다음해 6/30) {useFixedPay ? '· 정기 Net + Tax 합산 (Super 제외)' : '· 근무일지에서 직접 계산'}
      </p>

      {fys.map(fy => {
        const d = byFY[fy];
        const isCurrent = fy === todayFy;
        return (
          <div key={fy} style={{ background:"#fff", borderRadius:8, padding:"8px 10px", marginBottom:6, border: isCurrent ? "1.5px solid #F59E0B" : "1px solid #FDE68A" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:3 }}>
              <div style={{ minWidth:0 }}>
                <p style={{ margin:0, fontSize:13, fontWeight:700, color:"#111" }}>
                  {fyLabel(fy)} {isCurrent && <span style={{ fontSize:10, color:"#D97706", fontWeight:700 }}>(진행중)</span>}
                </p>
                <p style={{ margin:0, fontSize:10, color:"#888" }}>{fyRange(fy)}</p>
              </div>
              <p style={{ margin:0, fontSize:16, fontWeight:800, color:"#92400E" }}>{fA(d.gross)}</p>
            </div>
            {useFixedPay ? (
              <p style={{ margin:"4px 0 0", fontSize:10, color:"#888" }}>
                정기 {d.periods}회 · Net {fA(d.net)} · Tax {fA(d.tax)}
              </p>
            ) : (
              <p style={{ margin:"4px 0 0", fontSize:10, color:"#888" }}>
                풀타임 {d.fullDays}일 · OT {d.otHours.toFixed(1)}h · 파트 {d.partHours.toFixed(1)}h · Travel {fA(d.travel)} · 로그 {d.count}건
              </p>
            )}
          </div>
        );
      })}
    </div>
  );
}

// 한 직원의 Tax 부족 진단 — fixedPay 직원 (거주자/WHV).
// 현재 회계연도에 '실제로 지급된' 격주 정기들의 누적(Net+Tax) 기준 (연환산 ×26 예측 아님).
// 반환: null (부족 없음) 또는 { ... 진단 정보 }
function computeTaxShortfall(user, lv, logs) {
  if (!lv) return null;
  const isContractor = !!lv.noLeave;
  const fixedSum = (parseFloat(lv.fixedNet)||0) + (parseFloat(lv.fixedTax)||0) + (parseFloat(lv.fixedSuper)||0);
  const hasHist = Array.isArray(lv.fixedPayHistory) && lv.fixedPayHistory.length > 0;
  const useFixedPay = (!isContractor || lv.hasFlatPay || hasHist) && (fixedSum > 0 || hasHist);
  if (!useFixedPay) return null;

  // ── 현재 회계연도(7/1~다음해 6/30) 실제 누적 — 근무로그가 있는 격주 정기만, 정기 시점 고정값으로 Net+Tax 합산 ──
  const fyKeyFor = (s) => { const [y,m] = s.split('-').map(Number); return m >= 7 ? y : y - 1; };
  const FORT_BASE = new Date("2026-04-13T00:00:00");
  const periodStartOf = (s) => {
    const d = new Date(s + "T00:00:00");
    const idx = Math.floor((d - FORT_BASE) / (14*24*60*60*1000));
    const ps = new Date(FORT_BASE); ps.setDate(ps.getDate() + idx*14);
    return `${ps.getFullYear()}-${String(ps.getMonth()+1).padStart(2,"0")}-${String(ps.getDate()).padStart(2,"0")}`;
  };
  const fixedPayAt = (ps) => {
    const h = (lv.fixedPayHistory || []).slice().sort((a,b)=>(b.from||"").localeCompare(a.from||""));
    if (h.length === 0) return { net: parseFloat(lv.fixedNet)||0, tax: parseFloat(lv.fixedTax)||0 };
    const e = h.find(x => x.from <= ps) || h[h.length-1];
    return { net: parseFloat(e.net)||0, tax: parseFloat(e.tax)||0 };
  };
  const curFy = fyKeyFor(today);
  const periods = new Set();
  (logs || []).forEach(l => {
    if (l && l.userId === user.id && l.date) {
      const ps = periodStartOf(l.date);
      if (fyKeyFor(ps) === curFy) periods.add(ps);
    }
  });
  if (periods.size === 0) return null;
  let grossYTD = 0, taxYTD = 0;
  periods.forEach(ps => { const fp = fixedPayAt(ps); grossYTD += fp.net + fp.tax; taxYTD += fp.tax; });
  if (grossYTD <= 0) return null;

  const visaType = (user && user.visa) ? user.visa.type : null;
  const isWHV = visaType && (visaType.toUpperCase().includes('WHV') || visaType==='417' || visaType==='462' || visaType.toUpperCase().includes('WH1') || visaType.toUpperCase().includes('WH2') || visaType.toUpperCase().includes('WH3'));
  const reqTax = isWHV ? calcAnnualTaxWHV(grossYTD) : calcAnnualTaxResident(grossYTD);
  const shortfall = reqTax - taxYTD;
  if (shortfall <= 200) return null;  // 노이즈 컷 (충분히 떼고 있거나 과세 전)
  const periodCount = periods.size;
  return {
    grossYTD, reqTax, taxYTD, shortfall, periodCount,
    suggestFortnightlyTax: reqTax / periodCount,
    isWHV, crossedBracket: grossYTD > 45000,
  };
}

// 🧮 TSS 비자 최저 연봉 계산기 (fixedPay 비WHV 만 표시)
// 사용자의 스프레드시트 공식:
//   A (총 일당비) = daily × days/week × 52
//   B (Super)    = A × 12%
//   C (연차+공휴일) = daily × 31
//   Gross = A − B − C
// 역산: TSS 최저 ($76,515) 만족하는 최소 days/week =
//   (target/daily + 31) / (52 × 0.88)
// 페이슬립 시급 = Gross / (52 × 38) — 호주 표준 주 38시간 기준.
function TSSMinCalculator({ userId, lv, users, getDailyRate, fA }) {
  const LEAVE_PUB_DAYS = 31;        // 연차 20일 + 공휴일 11일 가정
  const WEEKS = 52;
  const SUPER_PCT = 0.12;
  const STD_HOURS_PER_YEAR = WEEKS * 38;  // 1976

  const empUser = (users || []).find(u => u.id === userId);
  const visaType = empUser && empUser.visa ? empUser.visa.type : null;
  const isWHV = visaType && (visaType.toUpperCase().includes('WHV') || visaType==='417' || visaType==='462' || visaType.toUpperCase().includes('WH1') || visaType.toUpperCase().includes('WH2') || visaType.toUpperCase().includes('WH3'));
  const isContractor = !!(lv && lv.noLeave);
  const hasHist = !!(lv && Array.isArray(lv.fixedPayHistory) && lv.fixedPayHistory.length > 0);
  const fixedSum = ((parseFloat((lv||{}).fixedNet)||0) + (parseFloat((lv||{}).fixedTax)||0));
  const useFixedPay = (!isContractor || (lv && lv.hasFlatPay) || hasHist) && (fixedSum > 0 || hasHist);

  // ⚠️ hook 은 early-return 보다 위에 (직원 전환 시 hook 순서 보장)
  const currentDaily = getDailyRate(userId, today) || 0;
  const [dailyStr, setDailyStr] = React.useState(String(currentDaily || ''));
  React.useEffect(() => { setDailyStr(String(currentDaily || '')); }, [currentDaily]);
  // 최저 연봉은 정책에 따라 바뀔 수 있어 관리자가 직접 수정 (기기에 저장)
  const [tssMinStr, setTssMinStr] = React.useState(() => localStorage.getItem('tss_min_salary') || "76515");

  if (isWHV || !useFixedPay) return null;

  const TSS_MIN = parseFloat(tssMinStr) || 0;
  const onTssMin = (val) => { setTssMinStr(val); const v = parseFloat(val); if (!isNaN(v) && v > 0) localStorage.setItem('tss_min_salary', String(v)); };
  const d = parseFloat(dailyStr) || 0;
  let r = null;
  if (d > 0 && TSS_MIN > 0) {
    const denom = WEEKS * (1 - SUPER_PCT);            // 45.76
    let dpw = (TSS_MIN / d + LEAVE_PUB_DAYS) / denom;
    dpw = Math.ceil(dpw * 100) / 100;                 // 0.01일 단위 올림
    const totalDays = dpw * WEEKS;
    const totalAtDaily = d * totalDays;
    const annualSuper = totalAtDaily * SUPER_PCT;
    const annualLeave = d * LEAVE_PUB_DAYS;
    const annualGross = totalAtDaily - annualSuper - annualLeave;
    const fortnightlyGross = annualGross / 26;
    const payslipHourly = annualGross / STD_HOURS_PER_YEAR;
    const payslipHourlyRounded = Math.round(payslipHourly * 100) / 100;   // 페이슬립에 실제 찍히는 시급 (소수 2자리)
    const payslipAnnualGross = payslipHourlyRounded * STD_HOURS_PER_YEAR;  // 그 시급 × 1976h 로 역산한 연 그로스 (검증용)
    const dpf = dpw * 2;
    const dpfWhole = Math.floor(dpf);
    const dpfHours = (dpf - dpfWhole) * FULLTIME_HOURS;                    // 1 근무일 = FULLTIME_HOURS(9h) 기준
    r = { dpw, dpf, dpfWhole, dpfHours, totalDays, totalAtDaily, annualSuper, annualLeave, annualGross, fortnightlyGross, payslipHourly, payslipHourlyRounded, payslipAnnualGross };
  }

  return (
    <div style={{ marginTop:14, background:"#F0F9FF", border:"1px solid #BAE6FD", borderRadius:10, padding:"12px 14px" }}>
      <p style={{ margin:"0 0 4px", fontSize:12, fontWeight:700, color:"#075985" }}>
        🧮 TSS 비자 최저 연봉 계산기
      </p>
      <p style={{ margin:"0 0 10px", fontSize:10, color:"#0369A1", lineHeight:1.45 }}>
        TSS (482 비자) 최저 ${TSS_MIN.toLocaleString()} 만족하는 <strong>최소 근무일수</strong> 계산.<br/>
        Super 12% + 연차/공휴일 {LEAVE_PUB_DAYS}일 제외한 그로스 기준.
      </p>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10, flexWrap:"wrap" }}>
        <label style={{ fontSize:11, fontWeight:600, color:"#075985" }}>일당:</label>
        <span style={{ fontSize:13, color:"#0369A1", fontWeight:700 }}>$</span>
        <input type="number" value={dailyStr} onChange={e => setDailyStr(e.target.value)}
          style={{ width:90, fontSize:13, fontWeight:700, padding:"5px 8px", border:"1.5px solid #BAE6FD", borderRadius:6, fontFamily:"inherit", outline:"none" }}/>
        <span style={{ fontSize:10, color:"#0369A1" }}>현재 일당: ${currentDaily}</span>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10, flexWrap:"wrap" }}>
        <label style={{ fontSize:11, fontWeight:600, color:"#075985" }}>최저 연봉:</label>
        <span style={{ fontSize:13, color:"#0369A1", fontWeight:700 }}>$</span>
        <input type="number" value={tssMinStr} onChange={e => onTssMin(e.target.value)}
          style={{ width:110, fontSize:13, fontWeight:700, padding:"5px 8px", border:"1.5px solid #BAE6FD", borderRadius:6, fontFamily:"inherit", outline:"none" }}/>
        <span style={{ fontSize:10, color:"#0369A1" }}>정책 바뀌면 직접 수정</span>
      </div>
      {r && (
        <div style={{ background:"#fff", borderRadius:8, padding:"10px 12px", fontSize:12 }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
            <div>
              <p style={{ margin:"0 0 2px", fontSize:10, color:"#888" }}>2주당 근무</p>
              <p style={{ margin:0, fontSize:16, fontWeight:800, color:"#0369A1" }}>{r.dpfWhole}일 {r.dpfHours.toFixed(1)}h</p>
              <p style={{ margin:"2px 0 0", fontSize:10, color:"#888" }}>주당 {r.dpw.toFixed(2)}일 · 연 {r.totalDays.toFixed(1)}일</p>
            </div>
            <div>
              <p style={{ margin:"0 0 2px", fontSize:10, color:"#888" }}>페이슬립 시급</p>
              <p style={{ margin:0, fontSize:16, fontWeight:800, color:"#0369A1" }}>${r.payslipHourlyRounded.toFixed(2)}<span style={{ fontSize:10, fontWeight:400 }}>/hr</span></p>
              <p style={{ margin:"2px 0 0", fontSize:10, color:"#0369A1", fontWeight:700 }}>= 연 그로스 {fA(r.payslipAnnualGross)}</p>
              <p style={{ margin:"1px 0 0", fontSize:9, color:"#888" }}>시급 × 1976h (52주×38h)</p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function FixedPayHistoryEditor({ lv, selId, persist, leaves, isSuperAdmin }) {
  const hist = (lv.fixedPayHistory || []).sort((a,b) => a.from.localeCompare(b.from));
  const fA = (n) => new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(n||0);
  const [newFrom, setNewFrom] = React.useState(today);
  const [newNet,  setNewNet]  = React.useState("");
  const [newTax,  setNewTax]  = React.useState("");
  const [newSup,  setNewSup]  = React.useState("");

  const save = () => {
    if (!newFrom) return;
    const lv2 = leaves[selId]||{};
    // 히스토리가 비어있는데 기존 고정값이 있으면, 옛 값을 초기 베이스라인('2000-01-01')으로 먼저 보존.
    // (안 하면 새 적용일 이전 기간이 fallback 로 새 값을 가져가 과거 정산이 틀어짐)
    let base = hist;
    if (hist.length === 0) {
      const oNet=parseFloat(lv2.fixedNet)||0, oTax=parseFloat(lv2.fixedTax)||0, oSup=parseFloat(lv2.fixedSuper)||0;
      if ((oNet||oTax||oSup) && newFrom > "2000-01-01") base = [{ from:"2000-01-01", net:oNet, tax:oTax, sup:oSup }];
    }
    const entry = { from: newFrom, net: parseFloat(newNet)||0, tax: parseFloat(newTax)||0, sup: parseFloat(newSup)||0 };
    const newHist = [...base.filter(h=>h.from!==newFrom), entry].sort((a,b)=>a.from.localeCompare(b.from));
    const latest = newHist[newHist.length-1];
    persist(null,null,{...leaves,[selId]:{...lv2,fixedPayHistory:newHist,fixedNet:latest.net,fixedTax:latest.tax,fixedSuper:latest.sup}});
    setNewNet(""); setNewTax(""); setNewSup("");
  };

  const remove = (from) => {
    const newHist = hist.filter(h=>h.from!==from);
    const latest = newHist.length>0 ? newHist[newHist.length-1] : {net:0,tax:0,sup:0};
    const lv2 = leaves[selId]||{};
    persist(null,null,{...leaves,[selId]:{...lv2,fixedPayHistory:newHist,fixedNet:latest.net,fixedTax:latest.tax,fixedSuper:latest.sup}});
  };

  return (
    <div>
      {/* 이력 목록 */}
      {hist.length > 0 && (
        <div style={{marginBottom:10}}>
          {hist.map((h,i) => (
            <div key={h.from} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",background:i===hist.length-1?"#F0FDF4":"#F9FAFB",borderRadius:8,marginBottom:6,border:"1px solid "+(i===hist.length-1?"#BBF7D0":"#E5E7EB")}}>
              <div style={{flex:1}}>
                <p style={{margin:0,fontSize:11,fontWeight:700,color:"#555"}}>{h.from} {i===hist.length-1?"(현재)":""}</p>
                <p style={{margin:0,fontSize:12}}>
                  <span style={{color:"#10B981"}}>Net {fA(h.net)}</span>
                  {" · "}<span style={{color:"#EF4444"}}>Tax {fA(h.tax)}</span>
                  {" · "}<span style={{color:"#F59E0B"}}>Super {fA(h.sup)}</span>
                </p>
              </div>
              {isSuperAdmin && <button onClick={()=>remove(h.from)} style={{background:"none",border:"none",color:"#f77",fontSize:16,cursor:"pointer",fontFamily:"inherit"}}>×</button>}
            </div>
          ))}
        </div>
      )}
      {/* 새 항목 추가 */}
      {isSuperAdmin && (
        <div style={{background:"#EFF6FF",borderRadius:10,padding:"10px 12px"}}>
          <p style={{margin:"0 0 8px",fontSize:11,fontWeight:700,color:"#1D4ED8"}}>+ 새 고정지급 기간 추가</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginBottom:8}}>
            <div><p style={{margin:"0 0 3px",fontSize:10,color:"#888"}}>시작일</p><input type="date" value={newFrom} onChange={e=>setNewFrom(e.target.value)} style={{width:"100%",border:"1px solid #BFDBFE",borderRadius:6,padding:"5px 6px",fontSize:12,fontFamily:"inherit",boxSizing:"border-box"}}/></div>
            <div><p style={{margin:"0 0 3px",fontSize:10,color:"#10B981"}}>Net Pay</p><input type="number" value={newNet} onChange={e=>setNewNet(e.target.value)} placeholder="0.00" style={{width:"100%",border:"1px solid #BBF7D0",borderRadius:6,padding:"5px 6px",fontSize:12,fontFamily:"inherit",boxSizing:"border-box"}}/></div>
            <div><p style={{margin:"0 0 3px",fontSize:10,color:"#EF4444"}}>Tax</p><input type="number" value={newTax} onChange={e=>setNewTax(e.target.value)} placeholder="0.00" style={{width:"100%",border:"1px solid #FECACA",borderRadius:6,padding:"5px 6px",fontSize:12,fontFamily:"inherit",boxSizing:"border-box"}}/></div>
            <div><p style={{margin:"0 0 3px",fontSize:10,color:"#F59E0B"}}>Super</p><input type="number" value={newSup} onChange={e=>setNewSup(e.target.value)} placeholder="0.00" style={{width:"100%",border:"1px solid #FDE68A",borderRadius:6,padding:"5px 6px",fontSize:12,fontFamily:"inherit",boxSizing:"border-box"}}/></div>
          </div>
          <button onClick={save} style={{width:"100%",background:"#3B82F6",color:"#fff",border:"none",borderRadius:8,padding:"8px 0",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>💾 저장</button>
        </div>
      )}
    </div>
  );
}


// 💵 정산과 무관하게, 누적된 킵 잔액을 즉시 캐시로 출금 (25% 공제 후 지급).
// keepDeposits 에 음수 항목 + keepBalance 차감 (기존 입금 로직과 대칭).
function KeepCashWithdraw({ selId, leaves, persist, balance, fA, isAdmin }) {
  const [amt, setAmt] = React.useState("");
  const lv = leaves[selId] || {};
  const raw = parseFloat(amt) || 0;
  const a = Math.min(Math.max(0, raw), Math.max(0, balance));
  const cash = a * 0.75;
  const withdraw = () => {
    if (!(a > 0)) return;
    const lockInfo = isLogLocked(selId, today, leaves);
    if (lockInfo && !isAdmin) { alert(`🔒 ${lockInfo.periodStart} 기간은 정산완료되어 출금할 수 없어요.`); return; }
    if (lockInfo && isAdmin && !confirm(`⚠️ ${lockInfo.periodStart} 기간은 정산완료된 기간이에요.\n그래도 출금할까요?`)) return;
    if (!confirm(`킵 잔액에서 ${fA(a)} 출금합니다.\n💵 캐시 지급: ${fA(cash)} (25% 공제 ${fA(a*0.25)})\n출금 후 킵 잔액: ${fA(balance - a)}\n\n진행할까요?`)) return;
    const entry = { id: Date.now()+Math.random(), date: today, amount: -a, desc: `캐시 출금 (지급 ${fA(cash)} · 25% 공제)`, cashPaid: cash, addedBy: 'admin' };
    const newDeposits = [...(lv.keepDeposits||[]), entry];
    const newKeep = (parseFloat(lv.keepBalance)||0) - a;
    persist(null, null, {...leaves, [selId]: {...lv, keepDeposits: newDeposits, keepBalance: newKeep}});
    setAmt("");
    alert(`✅ 캐시 출금 완료\n지급: ${fA(cash)}\n남은 킵 잔액: ${fA(newKeep)}`);
  };
  return (
    <div style={{ background:"#FFF7ED", border:"1px solid #FED7AA", borderRadius:10, padding:"10px 12px", marginBottom:10 }}>
      <p style={{ margin:"0 0 2px", fontSize:12, fontWeight:700, color:"#C2410C" }}>💵 킵 캐시 출금 (정산 전 가능)</p>
      <p style={{ margin:"0 0 8px", fontSize:10, color:"#9A3412" }}>지난 기간까지 정산된 킵 잔액을 지금 캐시로 출금해요. 25% 공제 후 지급.</p>
      <div style={{ display:"flex", gap:6, marginBottom:6 }}>
        <div style={{ flex:1, position:"relative" }}>
          <span style={{ position:"absolute", left:9, top:"50%", transform:"translateY(-50%)", color:"#888", fontSize:13, pointerEvents:"none" }}>$</span>
          <input type="number" placeholder="0.00" value={amt} min={0} step={0.01} onChange={e=>setAmt(e.target.value)}
            style={{ width:"100%", boxSizing:"border-box", padding:"7px 10px 7px 22px", border:"1.5px solid #FED7AA", borderRadius:8, fontSize:14, fontWeight:700, fontFamily:"inherit" }}/>
        </div>
        <button onClick={()=>setAmt(String(Math.max(0,balance).toFixed(2)))}
          style={{ padding:"0 12px", borderRadius:8, border:"1.5px solid #FED7AA", background:"#FFEDD5", color:"#9A3412", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>전액</button>
      </div>
      {a > 0 && (
        <div style={{ background:"#fff", borderRadius:8, padding:"8px 10px", fontSize:12, marginBottom:6 }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:2 }}><span style={{ color:"#555" }}>캐시 지급 ({fA(a)} × 75%)</span><span style={{ fontWeight:800, color:"#C2410C" }}>{fA(cash)}</span></div>
          <div style={{ display:"flex", justifyContent:"space-between", color:"#aaa" }}><span>25% 공제</span><span>−{fA(a*0.25)}</span></div>
          <div style={{ display:"flex", justifyContent:"space-between", borderTop:"1px solid #eee", paddingTop:4, marginTop:4 }}><span style={{ color:"#555" }}>출금 후 킵 잔액</span><span style={{ fontWeight:700 }}>{fA(balance - a)}</span></div>
        </div>
      )}
      <button onClick={withdraw} disabled={!(a>0)}
        style={{ width:"100%", background: a>0?"#C2410C":"#E5E7EB", color:"#fff", border:"none", borderRadius:10, padding:11, fontSize:13, fontWeight:700, cursor: a>0?"pointer":"default", fontFamily:"inherit" }}>
        💵 캐시 출금 {a>0?`→ ${fA(cash)} 지급`:""}
      </button>
    </div>
  );
}

function KeepDepositLog({ selId, leaves, persist, getKeepBalance, fA, wpStart, wpEnd, isAdmin }) {
  const [date, setDate] = React.useState(wpStart || today);
  const [amount, setAmount] = React.useState("");
  const [desc, setDesc] = React.useState("");

  const lv = leaves[selId] || {};
  // 현재 구간 입금 내역만 표시
  const deposits = (lv.keepDeposits || [])
    .filter(d => d.date >= wpStart && d.date <= wpEnd)
    .sort((a,b) => b.date.localeCompare(a.date));

  const save = () => {
    const amt = parseFloat(amount);
    if (!amt || !date) return;
    // 정산완료 잠금 체크
    const lockInfo = isLogLocked(selId, date, leaves);
    if (lockInfo && !isAdmin) {
      alert(`🔒 ${lockInfo.periodStart} 기간은 정산완료되어 킵 입금/출금을 추가할 수 없어요.`);
      return;
    }
    if (lockInfo && isAdmin && !confirm(`⚠️ ${lockInfo.periodStart} 기간은 정산완료된 기간이에요.\n그래도 킵 입금/출금을 추가할까요?`)) return;

    const entry = { id: Date.now()+Math.random(), date, amount: amt, desc: desc||"입금" };
    const newDeposits = [...(lv.keepDeposits||[]), entry];
    // keepBalance에도 반영
    const newKeep = (parseFloat(lv.keepBalance)||0) + amt;
    persist(null, null, {...leaves, [selId]: {...lv, keepDeposits: newDeposits, keepBalance: newKeep}});
    setAmount(""); setDesc("");
  };

  const remove = (id, amt) => {
    const dep = (lv.keepDeposits||[]).find(d => d.id === id);
    if (dep) {
      const lockInfo = isLogLocked(selId, dep.date, leaves);
      if (lockInfo && !isAdmin) {
        alert(`🔒 ${lockInfo.periodStart} 기간은 정산완료되어 삭제할 수 없어요.`);
        return;
      }
      if (lockInfo && isAdmin && !confirm(`⚠️ ${lockInfo.periodStart} 기간은 정산완료된 기간이에요.\n그래도 삭제할까요?`)) return;
    }
    const newDeposits = (lv.keepDeposits||[]).filter(d => d.id !== id);
    const newKeep = (parseFloat(lv.keepBalance)||0) - amt;
    persist(null, null, {...leaves, [selId]: {...lv, keepDeposits: newDeposits, keepBalance: newKeep}});
  };

  return (
    <div style={{ background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:12,padding:"14px 16px",marginBottom:10 }}>
      <p style={{ margin:"0 0 12px",fontSize:13,fontWeight:700,color:"#166534" }}>💰 킵 입금 기록</p>

      {/* 입력 폼 */}
      <div style={{ display:"grid",gridTemplateColumns:"1.2fr 1fr 1.5fr auto",gap:6,marginBottom:10,alignItems:"flex-end" }}>
        <div>
          <p style={{ margin:"0 0 3px",fontSize:10,color:"#888" }}>날짜</p>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)}
            style={{ width:"100%",border:"1px solid #BBF7D0",borderRadius:6,padding:"6px 8px",fontSize:12,fontFamily:"inherit",boxSizing:"border-box" }}/>
        </div>
        <div>
          <p style={{ margin:"0 0 3px",fontSize:10,color:"#888" }}>금액</p>
          <input type="number" placeholder="0.00" step="0.01" value={amount}
            onChange={e=>setAmount(e.target.value)}
            style={{ width:"100%",border:"1px solid #BBF7D0",borderRadius:6,padding:"6px 8px",fontSize:12,fontFamily:"inherit",boxSizing:"border-box" }}/>
        </div>
        <div>
          <p style={{ margin:"0 0 3px",fontSize:10,color:"#888" }}>메모</p>
          <input placeholder="메모 (선택)" value={desc} onChange={e=>setDesc(e.target.value)}
            style={{ width:"100%",border:"1px solid #BBF7D0",borderRadius:6,padding:"6px 8px",fontSize:12,fontFamily:"inherit",boxSizing:"border-box" }}/>
        </div>
        <button onClick={save}
          style={{ background:"#10B981",color:"#fff",border:"none",borderRadius:8,padding:"7px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap" }}>
          + 추가
        </button>
      </div>

      {/* 내역 목록 */}
      {deposits.length > 0 ? (
        <div>
          {deposits.map(d => {
            const depLock = isLogLocked(selId, d.date, leaves);
            return (
            <div key={d.id} style={{ display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderTop:"1px solid #D1FAE5" }}>
              <div style={{ flex:1 }}>
                <span style={{ fontSize:12,color:"#555" }}>{auD(d.date)}</span>
                {depLock && <span style={{ fontSize:9,fontWeight:700,background:"#FEF3C7",color:"#92400E",border:"1px solid #FDE68A",borderRadius:4,padding:"1px 5px",marginLeft:5 }} title={`정산완료: ${depLock.periodStart}`}>🔒</span>}
                {d.desc && <span style={{ fontSize:11,color:"#888",marginLeft:6 }}>· {d.desc}</span>}
              </div>
              <span style={{ fontSize:13,fontWeight:700,color:parseFloat(d.amount)>0?"#10B981":"#EF4444" }}>
                {parseFloat(d.amount)>0?"+":""}{fA(d.amount)}
              </span>
              <button onClick={()=>remove(d.id, parseFloat(d.amount))}
                style={{ background:"none",border:"none",color:"#f77",fontSize:15,cursor:"pointer",fontFamily:"inherit",padding:"0 4px" }}>×</button>
            </div>
            );
          })}
          <div style={{ display:"flex",justifyContent:"space-between",padding:"8px 0 0",borderTop:"2px solid #BBF7D0",marginTop:4 }}>
            <span style={{ fontSize:12,fontWeight:700,color:"#555" }}>총 입금액</span>
            <span style={{ fontSize:13,fontWeight:800,color:"#10B981" }}>
              {fA(deposits.reduce((s,d)=>s+(parseFloat(d.amount)||0),0))}
            </span>
          </div>
        </div>
      ) : (
        <p style={{ margin:0,fontSize:12,color:"#888",textAlign:"center" }}>입금 기록이 없어요</p>
      )}
    </div>
  );
}


function KeeepBalanceManualEditor({selId, persist, leaves, periodStart, fA, isAdmin, isSuperAdmin}) {
  const lv = leaves[selId] || {};
  const [editing, setEditing] = React.useState(false);
  const [manualAmt, setManualAmt] = React.useState("");
  const [manualPeriod, setManualPeriod] = React.useState(periodStart);

  if (!editing) return (
    <button onClick={()=>setEditing(true)}
      style={{fontSize:11,background:"#EFF6FF",color:"#1D4ED8",border:"1px solid #BFDBFE",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontFamily:"inherit",fontWeight:600,marginTop:6,display:"block",width:"100%"}}>
      🔧 킵 잔액 수동 설정
    </button>
  );

  const save = () => {
    const amt = parseFloat(manualAmt);
    if (isNaN(amt)) return alert("금액을 입력하세요");
    // 정산완료 잠금 체크: 기존 entry 덮어쓰기는 슈퍼관리자만, 그 외엔 차단
    const hist = lv.keepBalanceHistory || [];
    const existing = (Array.isArray(hist) ? hist : Object.values(hist)).find(h => h.periodStart === manualPeriod);
    if (existing && !isSuperAdmin) {
      alert(`🔒 ${manualPeriod} 기간은 이미 정산완료되어 슈퍼관리자만 덮어쓸 수 있어요.`);
      return;
    }
    if (existing && isSuperAdmin && !confirm(`⚠️ ${manualPeriod} 기간은 이미 정산완료된 기간이에요.\n덮어쓸까요?`)) return;
    const newEntry = {periodStart: manualPeriod, balance: amt, savedAt: new Date().toISOString(), manual: true};
    const newHist = [...(Array.isArray(hist)?hist:Object.values(hist)).filter(h=>h.periodStart!==manualPeriod), newEntry]
      .sort((a,b)=>a.periodStart.localeCompare(b.periodStart));
    const latestBal = newHist[newHist.length-1].balance;
    persist(null, null, {...leaves, [selId]: {...lv, keepBalance: latestBal, keepBalanceHistory: newHist}});
    alert(`✅ ${manualPeriod} 기간 킵 잔액을 ${fA(amt)}로 저장했어요`);
    setEditing(false);
  };

  return (
    <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:"10px 12px",marginTop:8}}>
      <p style={{margin:"0 0 8px",fontSize:12,fontWeight:700,color:"#1D4ED8"}}>🔧 킵 잔액 수동 설정</p>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <div style={{flex:1}}>
          <p style={{margin:"0 0 3px",fontSize:10,color:"#888"}}>기간 시작일</p>
          <input type="date" value={manualPeriod} onChange={e=>setManualPeriod(e.target.value)}
            style={{width:"100%",padding:"6px 8px",border:"1px solid #BFDBFE",borderRadius:6,fontSize:12,fontFamily:"inherit"}}/>
        </div>
        <div style={{flex:1}}>
          <p style={{margin:"0 0 3px",fontSize:10,color:"#888"}}>정산 후 킵 잔액</p>
          <input type="number" step="0.01" value={manualAmt} onChange={e=>setManualAmt(e.target.value)}
            placeholder="예: -1655.64"
            style={{width:"100%",padding:"6px 8px",border:"1px solid #BFDBFE",borderRadius:6,fontSize:12,fontFamily:"inherit"}}/>
        </div>
      </div>
      <p style={{margin:"0 0 8px",fontSize:10,color:"#888"}}>⚠️ 해당 기간 정산 완료 후 기록을 수동으로 추가해요 (keepBalanceHistory)</p>
      <div style={{display:"flex",gap:6}}>
        <button onClick={()=>setEditing(false)} style={{flex:1,background:"#fff",border:"1px solid #BFDBFE",borderRadius:6,padding:"6px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>취소</button>
        <button onClick={save} style={{flex:2,background:"#1D4ED8",color:"#fff",border:"none",borderRadius:6,padding:"6px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>💾 저장</button>
      </div>
    </div>
  );
}

function LoginScreen({ users, onLogin }) {
  const [id, setId] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const submit = () => {
    const user = users.find(u => u.id === id && u.pw === pw);
    if (!user) { setErr("아이디 또는 비밀번호가 올바르지 않습니다."); return; }
    onLogin(user);
  };
  return (
    <div style={styles.loginWrap}>
      <div style={styles.loginBox}>
        <div style={styles.loginLogo}>
          <div style={styles.logoIcon}>📋</div>
          <h1 style={styles.logoTitle}>WorkLog</h1>
          <p style={styles.logoSub}>근무일지 & 연차 관리 시스템</p>
        </div>
        <div style={styles.field}><label style={styles.label}>아이디</label><input style={styles.input} value={id} onChange={e=>setId(e.target.value)} placeholder="아이디 입력" onKeyDown={e=>e.key==="Enter"&&submit()} autoCapitalize="none"/></div>
        <div style={styles.field}><label style={styles.label}>비밀번호</label><input style={styles.input} type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="비밀번호 입력" onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        {err&&<p style={styles.errText}>{err}</p>}
        <button style={styles.btnPrimary} onClick={submit}>로그인</button>
      </div>
    </div>
  );
}

  return (
    <>

        {needsOverflow && (
          <div style={{ flex:1,position:"relative",display:"flex",justifyContent:"center" }}>
            <button onClick={()=>setMenuOpen(o=>!o)}
              style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 2px",position:"relative" }}>
              <div style={{
                width:40,height:40,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",
                background: (overflowActive||menuOpen) ? C.primary+"18" : "transparent", transition:"all .2s"

                <span style={{ fontSize:22, fontWeight:700, color: (overflowActive||menuOpen)?C.primary:"#aaa", lineHeight:1 }}>⋯</span>
              </div>
              <span style={{ fontSize:10,fontWeight:(overflowActive||menuOpen)?700:500,color:(overflowActive||menuOpen)?C.primary:"#aaa",transition:"all .2s" }}>더보기</span>

  // 헬퍼: 특정 날짜의 fortnight period offset 계산
  const _jumpToLogAt = (date, userId) => {
    if (!onJumpToLog) return;
    const BASE = new Date("2026-04-13T00:00:00");
    const dDate = new Date(date + "T00:00:00");
    const absIdx = Math.floor((dDate - BASE) / (14*24*60*60*1000));
    const curIdx = Math.floor((Date.now() - BASE) / (14*24*60*60*1000));
    onJumpToLog(date, userId, absIdx - curIdx);
  };
  const fA = (n) => new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",minimumFractionDigits:2}).format(n||0);
  const myLogs=isAdmin?logs:logs.filter(l=>l.userId===user.id);
  const myLv=normLeave(leaves[user.id],user.joinDate);
  const myAccDays=calcAccruedDays(myLv.leaveStartDate);
  const myRemDays=Math.round((myAccDays+(myLv.grantDays||0)-(myLv.usedDays||0))*10)/10;
  const thisMonth=new Date().toISOString().slice(0,7);
  const monthLogs=myLogs.filter(l=>l.date.startsWith(thisMonth));
  const monthHours=monthLogs.reduce((s,l)=>s+(l.hours||0),0);

  const staffUsers=isAdmin?users.filter(u=>u.role==="employee"):[];

  const _selDow=new Date(selectedDate+"T00:00:00").getDay();
  const _isWeekend=_selDow===0||_selDow===6;
  const missingStaff=_isWeekend?[]:staffUsers.filter(u=>!loggedIds.has(u.id));
  return (
    <div style={styles.page}>

        <h2 style={styles.greetingText}>안녕하세요, {user.name}님 👋</h2>

      {/* ── 🚨 Tax 부족 알림 (admin 전용) — fixedPay 비WHV 직원 중 원천징수 부족분 ── */}

        const items = (users||[])
          .filter(u => u && u.role === 'employee' && !u.resignedDate)

        if (items.length === 0) return null;
        return (
          <div style={{ background:"linear-gradient(135deg,#FEE2E2 0%,#FECACA 100%)", border:"2px solid #F87171", borderRadius:14, padding:"14px 16px", marginBottom:14 }}>
            <p style={{ margin:"0 0 6px", fontSize:14, fontWeight:800, color:"#991B1B" }}>
              🚨 Tax 조정 필요 {items.length}명
            </p>
            <p style={{ margin:"0 0 10px", fontSize:11, color:"#7F1D1D", lineHeight:1.5 }}>
현재 회계연도에 실제 지급된 격주 정기들의 누적 (Net + Tax) 기준, 원천징수가 ATO 세율보다 부족한 직원들. 정기 Tax 를 올리거나 Net 을 낮춰 조정 권장.
            </p>
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {items.map(({ user: u, sf }) => (
                <div key={u.id}
                  onClick={() => onJumpToEmp && onJumpToEmp(u.id)}
                  title="클릭해서 직원 관리 → 일급 탭에서 조정"
                  style={{ background:"#fff", borderRadius:10, padding:"10px 12px", cursor: onJumpToEmp?"pointer":"default", transition:"transform 0.15s" }}
                  onMouseOver={e => { if (onJumpToEmp) e.currentTarget.style.transform='translateY(-1px)'; }}
                  onMouseOut={e => { if (onJumpToEmp) e.currentTarget.style.transform='none'; }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, flexWrap:"wrap" }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <p style={{ margin:0, fontSize:13, fontWeight:800, color:"#111" }}>
                        {u.name}
                        {sf.crossedBracket && <span style={{ marginLeft:6, fontSize:9, background:"#DC2626", color:"#fff", padding:"1px 6px", borderRadius:4, fontWeight:700 }}>누적 $45k 초과</span>}

                        ATO 필요 세금 <strong>${sf.reqTax.toFixed(0)}</strong> · 현재 원천징수 <strong>${sf.taxYTD.toFixed(0)}</strong>

          persist(null, updated, null);

              <p style={{ margin:0, fontSize:14, fontWeight:800, color:"#991B1B" }}>

                style={{ background:"#10B981", color:"#fff", border:"none", borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>

            <p style={{ margin:"0 0 10px", fontSize:11, color:"#7F1D1D", lineHeight:1.5 }}>

            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>

                    style={{ background:"#fff", borderRadius:10, padding:"8px 10px", display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", cursor:"pointer", transition:"background 0.15s" }}
                    onMouseOver={e=>e.currentTarget.style.background='#FFF7ED'}

                    <div style={{ flex:1, minWidth:0 }}>
                      <p style={{ margin:0, fontSize:12, fontWeight:700, color:"#111" }}>

                      <p style={{ margin:"2px 0 0", fontSize:11, color:"#555" }}>

          </div>
        );
      })()}

      {/* ── 🎂 생일 알림 (오늘 생일인 직원 전체) ── */}

              <p style={{ margin:0,fontSize:14,fontWeight:800,color:"#92400E" }}>

              <span style={{ fontSize:16 }}>⚠️</span>
              <div>
                <p style={{ margin:0,fontSize:13,fontWeight:700,color:"#DC2626" }}>미제출 근무일지 {missDays.length}일</p>

            <div style={{ display:"flex",flexWrap:"wrap",gap:4 }}>

                return (
                  <span key={d} onClick={()=>{
                      const BASE=new Date("2026-04-13T00:00:00");
                      const absIdx=Math.floor((new Date(d+"T00:00:00")-BASE)/(14*24*60*60*1000));
                      const curIdx=Math.floor((Date.now()-BASE)/(14*24*60*60*1000));

          {isAdmin&&<input type="date" style={{ ...styles.input,width:"auto",fontSize:12,padding:"4px 8px" }} value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}/>}
        </div>
        {isAdmin&&missingStaff.length>0&&(
          <div style={{ background:"#fff8f0",border:"1px solid #ffd699",borderRadius:10,padding:"8px 12px",marginBottom:10 }}>
            <p style={{ margin:"0 0 6px",fontSize:11,fontWeight:700,color:"#a05c00" }}>⚠️ 미등록 ({missingStaff.length}명)</p>
            <div style={{ display:"flex",flexWrap:"wrap",gap:6 }}>
              {missingStaff.map(u=>(
                <span key={u.id}
                  onClick={()=>_jumpToLogAt(selectedDate, u.id)}
                  title="클릭해서 이 직원 근무일지 보기/등록"
                  style={{ fontSize:11,background:"#fff",border:"1px solid #ffd699",borderRadius:6,padding:"2px 8px",color:"#a05c00",cursor:"pointer",textDecoration:"underline" }}>
                  {u.name}
                </span>
              ))}
            </div>
          </div>
        )}
        {selectedLogs.length===0?<EmptyState msg={isAdmin?`${selectedDate===todayStr?"오늘":selectedDate} 등록된 근무일지가 없습니다.`:"근무일지가 없습니다."}/>:selectedLogs.map(l=>{
          const emp=users.find(u=>u.id===l.userId);
          return(<div key={l.id} style={styles.logCard}><div style={styles.logCardLeft}><div style={styles.logAvatar}>{((emp&&emp.name)||"?")[0]}</div><div><p style={styles.logName}>{isAdmin?((emp&&emp.name)||l.userId):korDate(l.date)}</p><p style={styles.logContent}>{l.content}</p></div></div><div style={styles.logHours}>{l.startTime}~{l.endTime}<br/><span style={styles.logHoursBig}>{fmt(l.hours)}h</span></div></div>);
        })}
      </div>
      {isAdmin && (() => {
        // 앱 시작일(4/13) ~ 오늘까지 전체 미제출 확인
        const ps = APP_START_DATE;
        const pe = today;
        const missing = getMissingLogs(users, logs, ps, pe);
        if (missing.length === 0) return null;
        const [open, setOpen] = React.useState(true);
        const totalDays = missing.reduce((s,r)=>s+r.missing.length,0);
        return (
          <div style={{ background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:14,padding:"12px 14px",marginBottom:14 }}>
            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",marginBottom:open?10:0 }}
              onClick={()=>setOpen(p=>!p)}>
              <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                <span style={{ fontSize:16 }}>⚠️</span>
                <div>
                  <p style={{ margin:0,fontSize:13,fontWeight:700,color:"#DC2626" }}>미제출 근무일지</p>
                  <p style={{ margin:0,fontSize:11,color:"#888" }}>{ps} ~ {pe} · {missing.length}명 · {totalDays}일</p>
                </div>
              </div>
              <span style={{ color:"#DC2626",fontSize:12 }}>{open?"▲":"▼"}</span>
            </div>
            {open && missing.map(({emp, missing:days}) => (
              <div key={emp.id} style={{ background:"#fff",borderRadius:10,padding:"8px 12px",marginBottom:6 }}>
                <p style={{ margin:"0 0 6px",fontSize:13,fontWeight:700,color:"#111" }}>{emp.name}</p>
                <div style={{ display:"flex",flexWrap:"wrap",gap:4 }}>
                  {days.map(d => {
                    const dt = new Date(d+"T00:00:00");
                    const label = `${dt.getMonth()+1}/${dt.getDate()}`;
                    return (
                      <span key={d} onClick={()=>{
                          if(!onJumpToLog) return;
                          const BASE=new Date("2026-04-13T00:00:00");
                          const dDate=new Date(d+"T00:00:00");
                          const absIdx=Math.floor((dDate-BASE)/(14*24*60*60*1000));
                          const curIdx=Math.floor((Date.now()-BASE)/(14*24*60*60*1000));
                          onJumpToLog(d, emp.id, absIdx-curIdx);
                        }}
                        style={{ fontSize:11,fontWeight:600,background:"#FEE2E2",color:"#DC2626",borderRadius:6,padding:"2px 8px",cursor:"pointer",textDecoration:"underline" }}>
                        {label}
                      </span>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        );
      })()}
      {isAdmin && (() => {
        // 최근 7일 이내 직원이 수정한 로그
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        const recentChanges = logs
          .filter(l => l.modifiedAt && l.modifiedBy !== "admin" && new Date(l.modifiedAt) >= sevenDaysAgo)
          .sort((a, b) => new Date(b.modifiedAt) - new Date(a.modifiedAt))
          .slice(0, 20);
        if(recentChanges.length === 0) return null;
        const [expanded, setExpanded] = React.useState(false);
        return (
          <div style={styles.section}>
            <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,cursor:"pointer" }}
              onClick={()=>setExpanded(p=>!p)}>
              <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                <h3 style={{ ...styles.sectionTitle,margin:0 }}>📝 직원 수정 내역</h3>

            {expanded && recentChanges.map(l => {
              const emp = users.find(u=>u.id===l.modifiedBy);
              const dt = new Date(l.modifiedAt);
              const dateStr = `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
              return (
                <div key={l.id} style={{ background:"#fff",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:10,boxShadow:"0 1px 4px #0000000a",borderLeft:"3px solid #F59E0B" }}>
                  <div style={{ ...styles.logAvatar,width:30,height:30,fontSize:12,background:"#F59E0B" }}>
                    {(l.modifiedByName||"?")[0]}
                  </div>
                  <div style={{ flex:1,minWidth:0 }}>
                    <p style={{ margin:0,fontSize:13,fontWeight:600,color:C.text }}>
                      {l.modifiedByName||l.modifiedBy} · <span style={{ color:C.sub,fontWeight:400 }}>{auD(l.date)}</span>
                    </p>
                    <p style={{ margin:"2px 0 0",fontSize:11,color:C.sub }}>
                      {(() => {
                        const wt = {fulltime:"풀타임",overtime:"오버타임",parttime:"파트타임",dayoff:"휴무",publicholiday:"퍼블릭홀리데이"}[l.workType]||l.workType||"(유형 없음)";
                        const extra = l.workType==="parttime"?` · ${l.startTime||""}~${l.endTime||""} (${(l.hours||0).toFixed(1)}h)`:
                                      l.workType==="overtime"?` · OT ${l.otStart||""}~${l.otEnd||""}`:
                                      l.workType==="dayoff"||l.workType==="publicholiday"?"":"";
                        const travel = l.travel&&l.travel.allowance?` 🚗$${l.travel.allowance}`:"";
                        return wt + extra + travel;
                      })()}
                    </p>
                  </div>
                  <span style={{ fontSize:11,color:C.sub,flexShrink:0 }}>{dateStr}</span>
                </div>
              );
            })}
          </div>
        );
      })()}
      {isAdmin&&(
        <div style={styles.section}>
          <h3 style={styles.sectionTitle}>연차 현황</h3>
          {users.filter(u=>u.role==="employee"&&!u.resignedDate&&!normLeave(leaves[u.id],u.joinDate).noLeave).map(u=>{
            const lv=normLeave(leaves[u.id],u.joinDate);
            const acc=calcAccruedDays(lv.leaveStartDate);
            const grant=+(lv.grantDays)||0;
            const used=+(lv.usedDays)||0;
            const rem=Math.round((acc+grant-used)*10)/10;
            const color=rem<0?"#c0392b":rem<4?"#f77":"#4f8ef7";
            const pct=acc>0?Math.min(100,Math.max(0,(rem/ANNUAL_LEAVE_DAYS)*100)):0;
            return(<div key={u.id} style={styles.leaveRow}><div style={styles.leaveRowLeft}><div style={styles.logAvatar}>{u.name[0]}</div><div><p style={styles.logName}>{u.name}<span style={styles.deptBadge}>{u.dept}</span></p><p style={styles.logContent}><span style={{ color,fontWeight:700 }}>{rem<0?"⚠️ ":""}{rem.toFixed(1)}일 가능</span>{" "}<span style={{ color:"#aaa" }}>/ 적립 {acc.toFixed(1)}일</span></p></div></div><div style={styles.miniBar}><div style={{ ...styles.miniBarFill,width:pct+"%",background:color }}/></div></div>);
          })}
        </div>
      )}
    </div>
  );
}
function StatCard({label,value,sub,color,emoji}){return(<div style={{ ...styles.statCard,borderTop:`3px solid ${color}` }}><span style={styles.statEmoji}>{emoji}</span><p style={styles.statValue}>{value}</p><p style={styles.statLabel}>{label}</p><p style={styles.statSub}>{sub}</p></div>);}

// ─── OSRM + Geocode helpers ────────────────────────────────────────────────
async function fetchDrivingKm(coord1,coord2){try{const url=`https://router.project-osrm.org/route/v1/driving/${coord1[1]},${coord1[0]};${coord2[1]},${coord2[0]}?overview=false`;const res=await fetch(url);const data=await res.json();if(data.code==="Ok")return Math.round(data.routes[0].distance/1000);return null;}catch{return null;}}
async function geocodePlace(query){try{const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query+", NSW, Australia")}&format=json&limit=1`;const res=await fetch(url,{headers:{"Accept-Language":"en"}});const data=await res.json();if(data.length>0)return[parseFloat(data[0].lat),parseFloat(data[0].lon)];return null;}catch{return null;}}

// ─── OsrmLegBox ───────────────────────────────────────────────────────────
function OsrmLegBox({from,to,autoKm,overrideVal,onOverride,onReset}){const[loading,setLoading]=useState(false);const fetchOsrm=async()=>{const c1=LOCATION_COORDS[from],c2=LOCATION_COORDS[to];if(!c1||!c2)return;setLoading(true);const km=await fetchDrivingKm(c1,c2);setLoading(false);if(km)onOverride(km);};const display=overrideVal!==undefined?overrideVal:(autoKm||"");return(<div style={styles.legKmBox}>{overrideVal===undefined&&autoKm!==null&&<span style={styles.legKmAuto}>📐 {autoKm}km</span>}<input type="number" style={styles.legKmInput} value={display} placeholder={autoKm!==null?`${autoKm}`:"km"} onChange={e=>onOverride(e.target.value)} min={0}/>{LOCATION_COORDS[from]&&LOCATION_COORDS[to]&&<button style={styles.osrmBtn} onClick={fetchOsrm} disabled={loading} title="실제 도로 거리">{loading?"…":"🗺️"}</button>}{overrideVal!==undefined&&<button style={styles.legKmReset} onClick={onReset}>↺</button>}</div>);}

function GeocodeLegBox({fromName,toName,overrideVal,onOverride,onReset}){const ref=useRef(null);const mapsUrl=fromName&&toName?`https://www.google.com/maps/dir/${encodeURIComponent(fromName+", NSW")}/${encodeURIComponent(toName+", NSW")}`:null;return(<div style={{ ...styles.legKmBox,borderColor:"#a0c4ff",background:"#f0f6ff",flexDirection:"column",alignItems:"stretch",gap:8,minWidth:190,padding:"10px 12px" }}>{mapsUrl&&<a href={mapsUrl} target="_blank" rel="noopener noreferrer" style={styles.geocodeBtn}>🗺️ Google Maps에서 거리 확인</a>}<div style={{ display:"flex",alignItems:"center",gap:6 }}><input ref={ref} type="text" inputMode="numeric" pattern="[0-9]*" style={{ ...styles.legKmInput,flex:1,textAlign:"left",fontSize:14,width:"auto",minWidth:60 }} defaultValue={overrideVal||""} placeholder="km 입력" onBlur={e=>{if(e.target.value)onOverride(e.target.value);}} onKeyDown={e=>{if(e.key==="Enter"&&ref.current&&ref.current.value)onOverride(ref.current.value);}}/><span style={{ fontSize:11,color:"#8891a8",whiteSpace:"nowrap" }}>km</span>{overrideVal!==undefined&&<button style={styles.legKmReset} onClick={()=>{if(ref.current)ref.current.value="";onReset();}}>↺</button>}</div>{overrideVal!==undefined&&<span style={{ fontSize:11,color:"#34c98b",fontWeight:600 }}>✅ {overrideVal}km 저장됨</span>}</div>);}

const WORK_TYPES_BASE=[{key:"fulltime",label:"풀타임",emoji:"✅"},{key:"overtime",label:"오버타임",emoji:"⏰"},{key:"parttime",label:"파트타임",emoji:"🕐"},{key:"dayoff",label:"휴무",emoji:"🌴"}];
function getWorkTypes(date,hasLeaveAccrual){const types=[...WORK_TYPES_BASE];if(hasLeaveAccrual){const day=new Date((date||today)+"T00:00:00").getDay();if(day>=1&&day<=5)types.push({key:"publicholiday",label:"퍼블릭홀리데이",emoji:"🎉"});}return types;}

function LogTab({user,users,logs,leaves,isAdmin,isSuperAdmin,isViewAdmin,persist,jumpInfo,onJumpConsumed}){
  const[showForm,setShowForm]=useState(false);

  const[filterUser,setFilterUser]=useState(jumpInfo?jumpInfo.userId:(isAdmin?"all":user.id));
  const getWagePeriod=(offset=0)=>{
    const BASE=new Date("2026-04-13T00:00:00");
    const cur=Math.floor((Date.now()-BASE)/(14*24*60*60*1000));
    const s=new Date(BASE); s.setDate(s.getDate()+(cur+offset)*14);
    const e=new Date(s); e.setDate(e.getDate()+13);
    const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return{start:fmt(s),end:fmt(e)};
  };

  const wpStart=wp.start; const wpEnd=wp.end;
  React.useEffect(()=>{
    if(jumpInfo){
      setFilterDate(jumpInfo.date);
      setViewMode("period");
      setWagePeriodOffset(jumpInfo.periodOffset||0);
      if(isAdmin) setFilterUser(jumpInfo.userId);
      if(onJumpConsumed) onJumpConsumed();

  },[]);
  const[editLog,setEditLog]=useState(null);const[confirmDeleteId,setConfirmDeleteId]=useState(null);const filtered=logs.filter(l=>(filterUser==="all"?true:l.userId===filterUser)).filter(l=>viewMode==="date"?l.date===filterDate:viewMode==="period"?(l.date>=wpStart&&l.date<=wpEnd):true);const deleteLog=(id)=>{persist(null,logs.filter(l=>l.id!==id),null);setConfirmDeleteId(null);};return(<div style={styles.page}><div style={styles.pageHeader}><h2 style={styles.pageTitle}>근무일지</h2><button style={styles.btnAdd} onClick={()=>{setEditLog(null);setShowForm(true);}}>{Icon.plus} 등록</button></div><div style={{ display:"flex",gap:6,marginBottom:10 }}><button onClick={()=>setViewMode("period")} style={{ ...styles.filterInput,cursor:"pointer",background:viewMode==="period"?C.primary:"#fff",color:viewMode==="period"?"#fff":C.text,border:`1.5px solid ${C.primary}`,fontWeight:600,flex:1 }}>📅 구간별</button><button onClick={()=>setViewMode("date")} style={{ ...styles.filterInput,cursor:"pointer",background:viewMode==="date"?C.primary:"#fff",color:viewMode==="date"?"#fff":C.text,border:`1.5px solid ${C.primary}`,fontWeight:600,flex:1 }}>📆 날짜별</button></div><div style={styles.filterRow}>{viewMode==="period"&&<div style={{ display:"flex",alignItems:"center",gap:8,padding:"4px 0" }}>
        <button style={styles.navArrow} onClick={()=>setWagePeriodOffset(o=>o-1)}>‹</button>
        <div style={{ flex:1,textAlign:"center" }}>
          <p style={{ margin:0,fontSize:12,fontWeight:700 }}>{auD(wpStart)} ~ {auD(wpEnd)}</p>
          {wagePeriodOffset===0&&<span style={{ fontSize:10,color:C.primary }}>현재 구간</span>}
        </div>
        <button style={styles.navArrow} onClick={()=>setWagePeriodOffset(o=>o+1)}>›</button>
      </div>}
      {viewMode==="date"&&<input type="date" style={styles.filterInput} value={filterDate} onChange={e=>setFilterDate(e.target.value)}/>}{isAdmin&&<select style={styles.filterInput} value={filterUser} onChange={e=>setFilterUser(e.target.value)}><option value="all">전체 직원</option>{users.filter(u=>u.role==="employee").map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select>}</div><div style={styles.logSummary}><span>총 {filtered.length}건 &nbsp;|&nbsp; {fmt(filtered.reduce((s,l)=>s+(l.hours||0),0))}시간</span></div>{filtered.length===0?<EmptyState msg="해당 기간 근무일지가 없습니다."/>:filtered.map(l=>{const emp=users.find(u=>u.id===l.userId);return(<div key={l.id} style={styles.logItem}><div style={styles.logItemDate}>{l.date.slice(5)} ({["일","월","화","수","목","금","토"][new Date(l.date+"T00:00:00").getDay()]})</div><div style={styles.logItemBody}>{isAdmin&&<span style={styles.empName}>{(emp&&emp.name)||l.userId}</span>}<p style={styles.logItemContent}>{l.content}</p><div style={styles.logItemMeta}>{(()=>{if(l.workType==="dayoff")return<span style={{ color:"#888" }}>🌴 휴무</span>;if(l.workType==="publicholiday")return<span style={{ color:"#e07000" }}>🎉 퍼블릭홀리데이 <strong>{fmt(FULLTIME_HOURS)}h</strong></span>;if(l.workType==="overtime"){const otH=calcHours(l.otStart,l.otEnd);return<><strong>{fmt(FULLTIME_HOURS)}h</strong><span style={{ color:"#f7a440",fontWeight:700 }}>+ {fmt(otH)}h OT</span></>;}return<strong>{fmt(l.hours)}h</strong>;})()}<span style={{ ...styles.statusBadge,background:l.workType==="overtime"?"#f7a44022":l.workType==="parttime"?"#7b5ea722":l.workType==="dayoff"?"#88888822":l.workType==="publicholiday"?"#e0700022":"#4f8ef722",color:l.workType==="overtime"?"#c87800":l.workType==="parttime"?"#7b5ea7":l.workType==="dayoff"?"#888":l.workType==="publicholiday"?"#e07000":"#3b7ff5" }}>{l.workType==="fulltime"?"풀타임":l.workType==="overtime"?"오버타임":l.workType==="parttime"?"파트타임":l.workType==="dayoff"?"휴무":l.workType==="publicholiday"?"퍼블릭홀리데이":l.status}</span></div>{l.needsRe
