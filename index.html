function InvoiceButton({ u, s, periodLogs, startDate, endDate, leaveData, onInvoiceSent }) {
  const [show, setShow]             = useState(false);
  const [deductDesc, setDeductDesc] = useState("Deduction");
  const [deductAmt, setDeductAmt]   = useState("");
  const ci         = (leaveData && leaveData.contractorInfo) || {};
  const dailyRate  = parseFloat(ci.dailyRate) || 0;
  const ptRate     = dailyRate > 0 ? dailyRate / 9 : 0;
  const otRate     = dailyRate > 0 ? dailyRate / 8 : 0;
  const workDesc   = ci.workDesc || "Work";
  const invoiceNum = ci.invoiceNum || "10001";
  const deductNum  = parseFloat(deductAmt) || 0;
  const fullAmt    = s.fulltimeDays * dailyRate;
  const travelLogs = periodLogs.filter(l => l.travel && (l.travel.allowance || l.travel.hasDinner));
  const trvlCnt    = travelLogs.length;
  const trvlUnit   = trvlCnt > 0 ? s.travelTotal / trvlCnt : 0;
  const bizLogs    = periodLogs.filter(l => l.travel && l.travel.hasDinner);
  const bizAmt     = bizLogs.length * 25;
  const ptAmt      = s.parttimeHours * ptRate;
  const otAmt      = s.overtimeHours * otRate;
  const subtotal   = fullAmt + s.travelTotal + ptAmt + otAmt - deductNum;

  const displayName  = ci.nameEn || (u.name || "").toUpperCase();
  const contactEmail = ci.email  || ci.billToEmail || "";

  // Build printable HTML for download
  const buildHTML = () => {
    const rows = [
      { desc: workDesc,                         qty: s.fulltimeDays  || "",  unit: s.fulltimeDays  ? dailyRate : "",  amt: fullAmt    || "" },
      { desc: "Travel allowance",               qty: trvlCnt         || "",  unit: trvlCnt         ? trvlUnit  : "",  amt: s.travelTotal || "" },
      { desc: "Business trip",                  qty: bizLogs.length  || "",  unit: bizLogs.length  ? 25        : "",  amt: bizAmt     || "" },
      { desc: "Half time " + workDesc,          qty: s.parttimeHours ? fmt(s.parttimeHours)+"h" : "", unit: ptAmt ? ptRate : "", amt: ptAmt || "" },
      { desc: "Over time " + workDesc,          qty: s.overtimeHours ? fmt(s.overtimeHours)+"h" : "", unit: otAmt ? otRate : "", amt: otAmt || "" },
      { desc: deductDesc || "Deduction",        qty: "",              unit: "",                         amt: deductNum ? -deductNum : "" },
    ];
    const fmtC = (v) => { if (v === "" || v === 0) return "-"; const n = parseFloat(v); return isNaN(n) ? String(v) : n.toFixed(2); };
    const addrLines = (a) => (a||"").split(",").map(l=>l.trim()).filter(Boolean).map(l=>`<p style="margin:0;font-size:11px;color:#444">${l}</p>`).join("");
    const emptyRows = Array(9).fill('<tr><td>&nbsp;</td><td></td><td></td><td style="text-align:right">-</td></tr>').join("");

    return `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Invoice ${invoiceNum}</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:12px;padding:20px}
.hdr{display:flex;justify-content:space-between;margin-bottom:16px}
.name{color:#1a4fa8;font-size:20px;font-weight:900;margin-bottom:4px}
.inv-title{color:#1a4fa8;font-size:26px;font-weight:900;text-align:right;margin-bottom:8px}
table{border-collapse:collapse}td,th{padding:4px 8px}
.ith{background:#1a4fa8;color:#fff;font-weight:700;text-align:center;border:1px solid #aaa}
.itd{border:1px solid #aaa;text-align:center}
.bhdr{background:#1a4fa8;color:#fff;font-weight:700;padding:4px 8px;font-size:11px;margin-bottom:6px}
.binfo{font-size:11px;color:#444;line-height:1.6}
.th2{background:#1a4fa8;color:#fff;padding:5px 8px;font-weight:700}
.tdr{border-bottom:1px solid #e0e6f0;padding:4px 8px;font-size:11px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px}
.ty{font-style:italic;color:#1a4fa8;font-size:11px}
.tttd{padding:3px 8px;color:#555;font-size:11px}
.ttot{background:#1a4fa8;color:#fff;font-weight:700;padding:6px 8px;font-size:12px}
</style></head><body>
<div class="hdr">
  <div><div class="name">${displayName}</div>${addrLines(ci.address)}
  ${ci.phone?`<p style="margin:0;font-size:11px;color:#444">Phone: ${ci.phone}</p>`:""}
  ${ci.abn?`<p style="margin:0;font-size:11px;color:#444">ABN: ${ci.abn}</p>`:""}</div>
  <div><div class="inv-title">INVOICE</div>
  <table><tr><td class="ith">INVOICE #</td><td class="ith">DATE</td></tr>
  <tr><td class="itd">${invoiceNum}</td><td class="itd">${today}</td></tr></table></div>
</div>
<div style="margin-bottom:12px"><div class="bhdr">BILL TO</div>
<div class="binfo">${ci.billToName||""}${addrLines(ci.billToAddress)}${ci.billToEmail?`<br/>${ci.billToEmail}`:""}</div></div>
<table style="width:100%">
<thead><tr>
<th class="th2" style="text-align:left;width:52%">DESCRIPTION</th>
<th class="th2" style="text-align:right;width:12%">QTY</th>
<th class="th2" style="text-align:right;width:18%">UNIT PRICE</th>
<th class="th2" style="text-align:right;width:18%">AMOUNT</th>
</tr></thead><tbody>
${rows.map(r=>`<tr><td class="tdr">${r.desc}</td><td class="tdr" style="text-align:right">${r.qty}</td><td class="tdr" style="text-align:right">${fmtC(r.unit)}</td><td class="tdr" style="text-align:right">${fmtC(r.amt)}</td></tr>`).join("")}
${emptyRows}
</tbody></table>
<div class="foot"><p class="ty">Thank you for your business!</p>
<table><tr><td class="tttd">SUBTOTAL</td><td class="tttd" style="text-align:right">${subtotal.toFixed(2)}</td></tr>
<tr><td class="tttd">TAX RATE</td><td class="tttd" style="text-align:right">0.000%</td></tr>
<tr><td class="tttd">TAX</td><td class="tttd" style="text-align:right">-</td></tr>
<tr><td class="ttot">TOTAL</td><td class="ttot" style="text-align:right">$ ${subtotal.toFixed(2)}</td></tr>
</table></div>
${contactEmail?`<p style="text-align:center;margin-top:20px;font-size:10px;color:#888">If you have any questions about this invoice, please contact<br/><span style="color:#1a4fa8">${contactEmail}</span></p>`:""}
</body></html>`;
  };

  const html    = buildHTML();
  const iframeRef = React.useRef(null);

  const splitAddr = (addr) => addr ? addr.split(",").map(l => l.trim()).filter(Boolean) : [];

  const fmtCell = (v) => {
    if (v === "" || v === 0) return "-";
    const n = parseFloat(v);
    return isNaN(n) ? String(v) : n.toFixed(2);
  };

  const buildPlainText = () => {
    const lines = [
      `INVOICE #${invoiceNum}  DATE: ${today}`,
      `FROM: ${displayName}`,
      ci.address ? ci.address : "",
      ci.phone ? `Phone: ${ci.phone}` : "",
      ci.abn ? `ABN: ${ci.abn}` : "",
      "",
      `BILL TO: ${ci.billToName || ""}`,
      ci.billToAddress || "",
      "",
      "DESCRIPTION                    QTY   UNIT     AMOUNT",
      "-----------------------------------------------------",
    ];
    const addRow = (desc, qty, unit, amt) => {
      if (!qty && !amt) return;
      lines.push(`${desc.padEnd(30)} ${String(qty||"").padStart(5)}  ${String(unit ? parseFloat(unit).toFixed(2) : "").padStart(7)}  ${String(amt ? parseFloat(amt).toFixed(2) : "-").padStart(8)}`);
    };
    if (s.fulltimeDays)    addRow(workDesc, s.fulltimeDays, dailyRate, fullAmt);
    if (s.travelTotal > 0) addRow("Travel allowance", trvlCnt, trvlUnit, s.travelTotal);
    if (bizLogs.length)    addRow("Business trip", bizLogs.length, 25, bizAmt);
    if (s.parttimeHours)   addRow("Half time " + workDesc, fmt(s.parttimeHours)+"h", ptRate, ptAmt);
    if (s.overtimeHours)   addRow("Over time " + workDesc, fmt(s.overtimeHours)+"h", otRate, otAmt);
    if (deductNum)         addRow(deductDesc || "Deduction", "", "", -deductNum);
    lines.push("-----------------------------------------------------");
    lines.push(`${"TOTAL".padEnd(40)} $${subtotal.toFixed(2)}`);
    if (contactEmail) lines.push(`\nQuestions? ${contactEmail}`);
    return lines.filter(l => l !== "").join("\n");
  };

  const sendEmail = () => {
    const subject = encodeURIComponent(`Invoice #${invoiceNum} - ${displayName} - ${startDate} to ${endDate}`);
    const body    = encodeURIComponent(buildPlainText());
    const to      = ci.billToEmail || "";
    window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    if (onInvoiceSent) onInvoiceSent();
  };

  const shareInvoice = async () => {
    const filename = "invoice_" + invoiceNum + "_" + (ci.nameEn || u.name || "") + ".html";
    try {
      const file = new File([html], filename, { type: "text/html" });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Invoice #" + invoiceNum });
        if (onInvoiceSent) onInvoiceSent();
        return;
      }
    } catch(e) { /* fall through */ }
    // Fallback: open email app
    sendEmail();
  };

  const IRow = ({ desc, qty, unit, amt }) => (
    <tr>
      <td style={inv.tdRow}>{desc}</td>
      <td style={{ ...inv.tdRow, textAlign: "right" }}>{qty !== undefined ? qty : ""}</td>
      <td style={{ ...inv.tdRow, textAlign: "right" }}>{fmtCell(unit !== undefined ? unit : "")}</td>
      <td style={{ ...inv.tdRow, textAlign: "right" }}>{fmtCell(amt !== undefined ? amt : "")}</td>
    </tr>
  );
  const ERow = () => <tr><td style={inv.tdRow}>&nbsp;</td><td style={inv.tdRow}></td><td style={inv.tdRow}></td><td style={{ ...inv.tdRow, textAlign: "right" }}>-</td></tr>;

  if (!show) return (
    <button style={styles.invoiceBtn} onClick={() => setShow(true)}>📄 PDF 인보이스</button>
  );

  return (
    <div style={{ position: "fixed", inset: 0, background: "#fff", zIndex: 500, display: "flex", flexDirection: "column" }}>
      {/* Toolbar */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 12px", borderBottom: "1px solid #eee", background: "#fff", flexShrink: 0, gap: 6 }}>
        <button style={styles.iconBtn} onClick={() => setShow(false)}>{Icon.x}</button>
        <span style={{ fontWeight: 700, fontSize: 14, flex: 1, textAlign: "center" }}>인보이스 #{ invoiceNum}</span>
        <button style={{ background: "#1a4fa8", color: "#fff", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}
          onClick={shareInvoice}>📤 공유 / 저장</button>
      </div>

      {/* Info banner */}
      <div style={{ padding: "7px 14px", background: "#f0f5ff", borderBottom: "1px solid #c5d8ff", fontSize: 11, color: "#3b5fc0", flexShrink: 0 }}>
        📤 공유/저장 → <strong>iOS:</strong> "파일에 저장" 또는 이메일 선택 &nbsp;·&nbsp; <strong>Android:</strong> 파일 저장 또는 이메일
      </div>

      {/* Deduction */}
      <div style={{ padding: "8px 14px", background: "#f8f4ff", borderBottom: "1px solid #e0d6ff", flexShrink: 0 }}>
        <p style={{ fontSize: 11, fontWeight: 600, color: "#5a3e9b", marginBottom: 4 }}>➖ Deduction</p>
        <div style={{ display: "flex", gap: 8 }}>
          <input style={{ ...styles.input, flex: 2, fontSize: 12 }} value={deductDesc}
            onChange={e => setDeductDesc(e.target.value)} placeholder="Deduction 내용" />
          <input type="number" style={{ ...styles.input, flex: 1, fontSize: 12 }} value={deductAmt}
            onChange={e => setDeductAmt(e.target.value)} placeholder="금액 $" min={0} />
        </div>
      </div>

      {/* Invoice preview via iframe */}
      <iframe
        ref={iframeRef}
        srcDoc={html}
        style={{ flex: 1, border: "none", width: "100%" }}
        title="invoice"
      />
    </div>
  );
}

function PayStat({ emoji, label, val, color, logs = [], renderDetail }) {
  const [open, setOpen] = useState(false);
  const hasDetail = logs.length > 0;
  return (
    <div style={{ ...styles.payStatCell, borderLeft: `3px solid ${color}`, cursor: hasDetail ? "pointer" : "default" }}
      onClick={() => hasDetail && setOpen(p => !p)}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <span style={{ fontSize: 16 }}>{emoji}</span>
        {hasDetail && <span style={{ fontSize: 10, color: color, opacity: 0.7 }}>{open ? "▲" : "▼"}</span>}
      </div>
      <span style={{ fontSize: 15, fontWeight: 700, color }}>{val}</span>
      <span style={{ fontSize: 11, color: C.sub }}>{label}</span>
      {open && hasDetail && (
        <div style={{ marginTop: 8, borderTop: `1px solid ${color}22`, paddingTop: 6 }}>
          {logs.map((l, i) => (
            <p key={i} style={{ margin: "3px 0", fontSize: 11, color: C.text, lineHeight: 1.4 }}>
              · {renderDetail(l)}
            </p>
          ))}
        </div>
      )}
    </div>
  );
}

function EmptyState({ msg }) {
  return <div style={styles.empty}><p style={{ margin: 0, color: "#aaa" }}>📭 {msg}</p></div>;
}

// Error boundary
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) {
      return React.createElement('div', {style:{padding:20,color:'red',fontFamily:'monospace',fontSize:12,whiteSpace:'pre-wrap'}},
        'ERROR: ' + (this.state.error.message || String(this.state.error)) + '\n\n' + (this.state.error.stack || '')
      );
    }
    return this.props.children;
  }
}

try {
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(ErrorBoundary, null, React.createElement(App))
  );
} catch(e) {
  document.getElementById('root').innerHTML = '<pre style="color:red;padding:20px;font-size:12px">' + e.message + '\n' + e.stack + '</pre>';
}
