<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WorkLog</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body style="margin:0;background:#f4f6fb;font-family:sans-serif">
<div id="status" style="padding:20px;color:#3b7ff5;font-size:14px">로딩 시작...</div>
<div id="root"></div>
<script id="src" type="text/plain">
const { useState } = React;

function App() {
  const [msg, setMsg] = useState("WorkLog 테스트 성공! 🎉");
  return (
    <div style={{padding:40, textAlign:"center"}}>
      <h1 style={{color:"#3b7ff5"}}>{msg}</h1>
      <button onClick={() => setMsg("버튼 클릭됨! ✅")}
        style={{padding:"10px 20px", background:"#3b7ff5", color:"#fff", border:"none", borderRadius:8, cursor:"pointer"}}>
        클릭 테스트
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script>
var statusEl = document.getElementById("status");
var attempts = 0;

function runApp() {
  attempts++;
  if (attempts > 30) {
    statusEl.style.color = "red";
    statusEl.textContent = "Babel 로드 실패 (30초 초과)";
    return;
  }
  if (typeof Babel === "undefined") {
    statusEl.textContent = "Babel 로딩 중... (" + attempts + ")";
    setTimeout(runApp, 1000);
    return;
  }
  statusEl.textContent = "Babel 로드됨! 변환 중...";
  try {
    var src = document.getElementById("src").textContent;
    var out = Babel.transform(src, { presets: ["react"] });
    eval(out.code);
    statusEl.style.display = "none";
  } catch(e) {
    statusEl.style.color = "red";
    statusEl.textContent = "오류: " + e.message;
  }
}
window.onload = function() { setTimeout(runApp, 500); };
</script>
</body>
</html>
