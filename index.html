// 세금 원천징수 계산 (기본 구간세율 - LITO/Medicare는 세금신고 때 처리)
function calcAnnualTaxResident(annual){
  // 일반 거주자: ATO 기본 구간세율만 적용
  if(annual<=18200) return 0;
  if(annual<=45000) return (annual-18200)*0.19;
  if(annual<=120000) return 5092+(annual-45000)*0.325;
  if(annual<=180000) return 29467+(annual-120000)*0.37;
  return 51667+(annual-180000)*0.45;
}
function calcAnnualTaxWHV(annual){
  // WHV (417/462/WHV1-3): 15% 고정율로 원천징수
  if(annual<=45000) return annual*0.15;
  if(annual<=120000) return 6750+(annual-45000)*0.325;
  if(annual<=180000) return 31125+(annual-120000)*0.37;
  return 53325+(annual-180000)*0.45;
}
function calcFortnightlyTax(gross, visaType){
  const isWHV = visaType && (visaType.startsWith('WHV') || visaType==='417' || visaType==='462');
  const annual = gross * 26;
  return (isWHV ? calcAnnualTaxWHV(annual) : calcAnnualTaxResident(annual)) / 26;
}

  const selEmp = emps.find(e => e.id === selId);
  const selIdx = emps.findIndex(e => e.id === selId);
  const selColor = EMP_COLORS[selIdx % EMP_COLORS.length] || C.primary;

  const getDailyRate = (userId) => {
    const lv = leaves[userId] || {};
    const ci = lv.contractorInfo;
    if (ci && parseFloat(ci.dailyRate) > 0) return parseFloat(ci.dailyRate);
    const rh = [...(lv.rateHistory || []), ...(lv.contractorRateHistory || [])];
    const valid = rh.filter(r => r.dailyRate && parseFloat(r.dailyRate) > 0)
                    .sort((a, b) => (b.from || "").localeCompare(a.from || ""));
    return valid.length > 0 ? parseFloat(valid[0].dailyRate) : 0;
  };

  const getReqDays = (userId) => (leaves[userId] || {}).reqDays || 8;
  const getReqExtraHours = (userId) => (leaves[userId] || {}).reqExtraHours || 0;
  const getCarryover = (userId) => (leaves[userId] || {}).wageCarryover || { fullDays: 0, partHours: 0, otHours: 0 };
  const getKeepBalance = (userId) => parseFloat((leaves[userId] || {}).keepBalance) || 0;

  // 급여기간별 기준 조회 (이력 기반 - 기간 변경해도 과거 기준 유지)
  const getReqForPeriod = (userId, pStart) => {
    const lv = leaves[userId] || {};
    const history = lv.reqHistory || [];
    if (history.length > 0) {
      const sorted = [...history].sort((a, b) => b.from.localeCompare(a.from));
      const match = sorted.find(h => h.from <= pStart);
      if (match) return { days: match.days || 0, hours: match.hours || 0 };
      const earliest = sorted[sorted.length - 1];
      return { days: earliest.days || 0, hours: earliest.hours || 0 };
    }
    // 이력 없으면 현재 설정값 사용
    return { days: lv.reqDays || 8, hours: lv.reqExtraHours || 0 };
  };

  const getPeriodLogs = (userId) =>
    logs.filter(l => l.userId === userId && l.date >= periodStart && l.date <= periodEnd)
        .sort((a, b) => a.date.localeCompare(b.date));

  const calcWorkStats = (periodLogs) => {
    let fullDays = 0, partHours = 0, otHours = 0, travelTotal = 0;
    periodLogs.forEach(l => {
      if (l.workType === "fulltime" || l.workType === "publicholiday" || !l.workType) fullDays++;
      else if (l.workType === "overtime") { fullDays++; otHours += calcHours(l.otStart || FULLTIME_END, l.otEnd || FULLTIME_END); }
      else if (l.workType === "parttime") partHours += (l.hours || 0);
      if (l.travel && l.travel.allowance) travelTotal += l.travel.allowance;
      if (l.travel && l.travel.hasDinner) travelTotal += 25;
    });
    return { fullDays, partHours, otHours, travelTotal };
  };

  const calcWage = (userId) => {
    const lv = leaves[userId] || {};
    const isContractor = !!lv.noLeave;
    const fixedNet   = (!isContractor && lv.fixedNet)   ? parseFloat(lv.fixedNet)   : 0;
    const fixedTax   = (!isContractor && lv.fixedTax)   ? parseFloat(lv.fixedTax)   : 0;
    const fixedSuper = (!isContractor && lv.fixedSuper) ? parseFloat(lv.fixedSuper) : 0;
    const fixedTotal = fixedNet + fixedTax + fixedSuper;
    const dailyRate = getDailyRate(userId);
    const { days: reqDays, hours: reqExtraHours } = getReqForPeriod(userId, periodStart);
    const carry = getCarryover(userId);
    if (!dailyRate) return null;
    const periodLogs = getPeriodLogs(userId);
    const stats = calcWorkStats(periodLogs);
    const partHourlyRate = dailyRate / 9;  // 파트타임: 일당 ÷ 9
    const otHourlyRate   = dailyRate / 8;  // 오버타임: 일당 ÷ 8
    // ── 기준 채우기 알고리즘 ────────────────────────────────────────────
    // 순서: 풀타임 → 파트타임 → 오버타임(파트시급으로 채움) → 초과분은 각 시급으로
    const reqH = reqDays * 9 + reqExtraHours;
    const fullH  = stats.fullDays * 9;   // 풀타임을 시간으로
    const partH  = stats.partHours;
    const otH    = stats.otHours;
    const allPartH = fullH + partH;       // 풀+파트 합산 (파트시급 적용)

    // 기준을 파트로 채우기
    const partForBase  = Math.min(allPartH, reqH);
    const excessPartH  = allPartH - partForBase;
    const remainBase   = reqH - partForBase;

    // 부족분을 OT로 채우기 (파트시급)
    const otForBase  = Math.min(otH, remainBase);
    const excessOtH  = otH - otForBase;
    const deficitH   = remainBase - otForBase;

    // 그로스 계산
    const basePay  = (partForBase + deficitH > 0 ? 0 : 0); // 기준분은 지급액으로 처리
    const partPay  = excessPartH * partHourlyRate;
    const otPay    = excessOtH   * otHourlyRate;
    const deficitPay = -deficitH * partHourlyRate;
    const travel   = stats.travelTotal;
    const gross    = stats.fullDays * dailyRate + partH * partHourlyRate + otH * otHourlyRate + travel;
    let tax = 0, superAmt = 0, net = gross;
    const empUser = (users||[]).find(u => u.id === userId);
    const visaType = empUser && empUser.visa ? empUser.visa.type : null;
    if (!isContractor) { tax = calcFortnightlyTax(gross, visaType); superAmt = gross * 0.12; net = gross - tax - superAmt; }
    const workedH = stats.fullDays * 9 + stats.partHours + stats.otHours;
    const diffH = workedH - reqH;
    const lvDays = Math.floor(diffH / 9);
    const lvPart = diffH - lvDays * 9;
    return { dailyRate, reqDays, reqH, reqExtraHours, partHourlyRate, otHourlyRate,
             stats, carry, basePay, partPay, otPay, travel, gross,
             tax, superAmt, net, cashOut: net * 0.75,
             excessPartH, excessOtH, deficitH,
             workedH, diffH, lvDays, lvPart,
             isContractor, periodLogs,
             fixedNet, fixedTax, fixedSuper, fixedTotal, visaType,
             keepBalance: getKeepBalance(userId) };
  };

  const saveCarryover = (userId) => {
    const w = calcWage(userId);
    if (!w) return;
    const lv = leaves[userId] || {};
    // 변동분 계산
    const variable = w.excessPartH * w.partHourlyRate
                   + w.excessOtH   * w.otHourlyRate
                   - w.deficitH    * w.partHourlyRate
                   + w.travel
                   - totalDeductions;
    const cashInput = parseFloat(partialCash) || 0;
    const cashAmt   = Math.min(cashInput, variable);
    const keepAmt   = variable - cashAmt;
    // 기존 킵잔액 + 이번 킵 금액
    const prevKeep  = getKeepBalance(userId);
    const newKeep   = prevKeep + keepAmt;
    persist(null, null, { ...leaves, [userId]: {
      ...lv,
      wageCarryover: { fullDays: w.lvDays, partHours: Math.max(0, w.lvPart), otHours: 0 },
      keepBalance: newKeep,
    }});
    alert(`정산 완료!
킵 잔액: $${newKeep.toFixed(2)}${cashAmt > 0 ? `
캐시 출금: $${(cashAmt * 0.75).toFixed(2)}` : ""}`);
  };

  const saveReqDays = (userId, val) => {
    const lv = leaves[userId] || {};
    persist(null, null, { ...leaves, [userId]: { ...lv, reqDays: parseInt(val) || 8 } });
  };
  const saveReqExtraHours = (userId, val) => {
    const lv = leaves[userId] || {};
    persist(null, null, { ...leaves, [userId]: { ...lv, reqExtraHours: parseFloat(val) || 0 } });
  };

  const fD = (s) => { const d = new Date(s+"T00:00:00"); return (d.getMonth()+1)+"/"+d.getDate(); };
  const fA = (n) => new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",minimumFractionDigits:2}).format(n);

  const wage = selId ? calcWage(selId) : null;
  const carry = selId ? getCarryover(selId) : null;

  const addDeduction = () => setDeductions(d => [...d, { id: Date.now(), desc: "", amount: "" }]);
  const updateDeduction = (id, field, val) => setDeductions(d => d.map(x => x.id === id ? { ...x, [field]: val } : x));
  const removeDeduction = (id) => setDeductions(d => d.filter(x => x.id !== id));
  const totalDeductions = deductions.reduce((s, d) => s + (parseFloat(d.amount) || 0), 0);

  const prevPeriod = () => { const d = new Date(periodStart+"T00:00:00"); d.setDate(d.getDate()-14); setPeriodStart(localDateStr(d)); };
  const nextPeriod = () => { const d = new Date(periodStart+"T00:00:00"); d.setDate(d.getDate()+14); setPeriodStart(localDateStr(d)); };

  const S = {
    chip: (active, color) => ({ display:"flex",alignItems:"center",gap:6, background:active?color:"#fff", color:active?"#fff":"#444", border:"1.5px solid "+(active?color:"#E5E7EB"), borderRadius:20,padding:"6px 12px",fontSize:13,fontWeight:600,cursor:"pointer",transition:"all .15s",fontFamily:"inherit" }),
    statBox: (color) => ({ background:color+"15",border:"1px solid "+color+"30",borderRadius:12,padding:"12px 14px" }),
    sectionTitle: { margin:"0 0 12px",fontSize:11,fontWeight:700,color:C.sub,textTransform:"uppercase",letterSpacing:1 },
    row: { display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8 },
    subTab: (active, color) => ({ flex:1,padding:"9px 0",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit", background:active?color:"transparent",color:active?"#fff":"#888",transition:"all .15s" }),
  };

  return (
    <div style={styles.page}>
      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16 }}>
        <h2 style={{ ...styles.pageTitle,margin:0 }}>💰 급여 관리</h2>
        <span style={{ fontSize:11,color:"#fff",background:C.primary,padding:"3px 10px",borderRadius:20,fontWeight:600 }}>격주 정산</span>
      </div>

      {/* Period picker */}
      <div style={{ background:"#fff",borderRadius:14,padding:"12px 14px",marginBottom:12,boxShadow:"0 1px 4px #0000000a" }}>
        <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10 }}>
          <button onClick={prevPeriod} style={{ background:"#F3F4F6",border:"none",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:18,color:"#555",fontFamily:"inherit" }}>‹</button>
          <div style={{ textAlign:"center" }}>
            <p style={{ margin:0,fontSize:14,fontWeight:800,color:C.text }}>{fD(periodStart)} ~ {fD(periodEnd)}</p>
            <p style={{ margin:"2px 0 0",fontSize:11,color:C.sub }}>2주 격주 급여 기간</p>
          </div>
          <button onClick={nextPeriod} style={{ background:"#F3F4F6",border:"none",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:18,color:"#555",fontFamily:"inherit" }}>›</button>
        </div>
        <input type="date" value={periodStart} onChange={e => setPeriodStart(e.target.value)}
          style={{ ...styles.input, fontSize:12,padding:"6px 10px" }} />
      </div>

      {/* Employee chips (admin) */}
      {isAdmin && (
        <div style={{ marginBottom:12 }}>
          <p style={{ fontSize:11,fontWeight:700,color:C.sub,margin:"0 0 8px",textTransform:"uppercase",letterSpacing:1 }}>직원 선택</p>
          <div style={{ display:"flex",gap:6,flexWrap:"wrap" }}>
            {emps.map((e, i) => {
              const color = EMP_COLORS[i % EMP_COLORS.length];
              const pLogs = getPeriodLogs(e.id);
              const cr = getCarryover(e.id);
              const hasCarry = cr.fullDays !== 0 || cr.partHours !== 0;
              return (
                <button key={e.id} onClick={() => { setSelId(e.id); setSubView("calc"); }} style={S.chip(selId === e.id, color)}>
                  <span style={{ width:20,height:20,borderRadius:"50%",background:selId===e.id?"rgba(255,255,255,.3)":color,color:"#fff",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700 }}>{e.name[0]}</span>
                  {e.name}
                  {pLogs.length > 0 && <span style={{ fontSize:10,background:"rgba(255,255,255,.25)",borderRadius:8,padding:"1px 5px" }}>{pLogs.length}일</span>}
                  {hasCarry && <span style={{ fontSize:10,background:"rgba(255,165,0,.3)",color:selId===e.id?"#fff":"#E07000",borderRadius:8,padding:"1px 5px" }}>이월</span>}
                  {getKeepBalance(e.id) > 0 && <span style={{ fontSize:10,background:"rgba(16,185,129,.25)",color:selId===e.id?"#fff":"#059669",borderRadius:8,padding:"1px 5px" }}>킵{getKeepBalance(e.id)>999?"+":""}</span>}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* No selection */}
      {!selEmp && (
        <div style={{ background:"#fff",borderRadius:16,padding:40,textAlign:"center",boxShadow:"0 1px 4px #0000000a" }}>
          <div style={{ fontSize:36,marginBottom:8 }}>👆</div>
          <p style={{ fontSize:14,margin:0,color:"#aaa",lineHeight:1.6 }}>직원을 선택하면<br/>급여를 계산할 수 있어요</p>
        </div>
      )}

      {/* Selected employee */}
      {selEmp && (<>

        {/* Employee card */}
        <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,borderLeft:"4px solid "+selColor,boxShadow:"0 1px 4px #0000000a" }}>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center" }}>
            <div style={{ display:"flex",alignItems:"center",gap:10 }}>
              <div style={{ ...styles.logAvatar,background:selColor }}>{selEmp.name[0]}</div>
              <div>
                <p style={{ margin:0,fontSize:15,fontWeight:700,color:C.text }}>{selEmp.name}</p>
                <p style={{ margin:"2px 0 0",fontSize:12,color:C.sub }}>{selEmp.dept}</p>
              </div>
            </div>
            <div style={{ textAlign:"right" }}>
              {wage && wage.dailyRate > 0 ? (<>
                <p style={{ margin:0,fontSize:14,fontWeight:700,color:C.text }}>{fA(wage.dailyRate)}<span style={{ fontSize:11,color:C.sub,fontWeight:400 }}>/일</span></p>
                {!wage.isContractor && <p style={{ margin:"2px 0 0",fontSize:11,color:C.sub }}>기준 {wage.reqDays}일 {wage.reqExtraHours>0?`${wage.reqExtraHours}h`:""}</p>}
                {wage.isContractor && <p style={{ margin:"2px 0 0",fontSize:11,color:C.sub }}>인보이스</p>}
              </>) : <p style={{ margin:0,fontSize:12,color:"#f77" }}>일급 미설정</p>}
            </div>
          </div>
          {carry && (carry.fullDays !== 0 || carry.partHours !== 0) && (
            <div style={{ marginTop:10,background:"#FEF3C7",borderRadius:8,padding:"6px 10px",fontSize:12,color:"#92400E" }}>
              ⚡ 이월 적용중: Full {carry.fullDays >= 0 ? "+" : ""}{carry.fullDays}일 · Part {(carry.partHours||0).toFixed(1)}h
            </div>
          )}
        </div>

        {/* Sub-tabs */}
        <div style={{ display:"flex",background:"#fff",borderRadius:12,padding:4,gap:2,marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
          {[["calc","📊 급여 계산"],["log","📋 근무 내역"],...(isAdmin ? [["settings","⚙️ 설정"]] : [])].map(([v, label]) => (
            <button key={v} onClick={() => setSubView(v)} style={S.subTab(subView===v, selColor)}>{label}</button>
          ))}
        </div>

        {/* ── CALC VIEW ── */}
        {subView === "calc" && (<>
          {(!wage || wage.dailyRate === 0) ? (
            <div style={{ background:"#fff",borderRadius:14,padding:24,textAlign:"center",boxShadow:"0 1px 4px #0000000a" }}>
              <p style={{ fontSize:14,color:"#f77",margin:"0 0 12px" }}>⚠️ 일급이 설정되지 않았어요</p>
              {isAdmin && <button onClick={() => setSubView("settings")} style={{ ...styles.btnAdd,margin:"0 auto" }}>⚙️ 설정하기</button>}
            </div>
          ) : (<>

            {/* Work summary grid */}
            <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
              <p style={S.sectionTitle}>📋 근무 요약 ({periodStart} ~ {periodEnd})</p>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12 }}>
                {[
                  ["✅","Full Days", wage.stats.fullDays+"일","#10B981"],
                  ["⏰","Overtime", fmt(wage.stats.otHours)+"h","#F59E0B"],
                  ["🕐","Part Time", fmt(wage.stats.partHours)+"h","#8B5CF6"],
                  ["🚗","Travel", fA(wage.stats.travelTotal),"#3B82F6"],
                ].map(([emoji, label, val, color]) => (
                  <div key={label} style={S.statBox(color)}>
                    <div style={{ display:"flex",alignItems:"center",gap:5,marginBottom:6 }}>
                      <span style={{ fontSize:14 }}>{emoji}</span>
                      <span style={{ fontSize:11,color:C.sub,fontWeight:600 }}>{label}</span>
                    </div>
                    <span style={{ fontSize:17,fontWeight:800,color }}>{val}</span>
                  </div>
                ))}
              </div>
              {/* Hours progress */}
              <div style={{ background:"#F9FAFB",borderRadius:10,padding:"10px 12px" }}>
                {!wage.isContractor && (<>
                <div style={S.row}>
                  <span style={{ fontSize:12,color:C.sub }}>실제 근무시간</span>
                  <span style={{ fontSize:13,fontWeight:700 }}>{wage.workedH.toFixed(1)}h</span>
                </div>
                <div style={S.row}>
                  <span style={{ fontSize:12,color:C.sub }}>기준 ({wage.reqDays}일{wage.reqExtraHours>0?` ${wage.reqExtraHours}h`:""})</span>
                  <span style={{ fontSize:13,fontWeight:700 }}>{wage.reqH}h</span>
                </div>
                <div style={{ height:1,background:"#E5E7EB",margin:"6px 0" }} />
                <div style={S.row}>
                  <span style={{ fontSize:12,color:C.sub }}>차이</span>
                  <span style={{ fontSize:14,fontWeight:800,color:wage.diffH>=0?"#10B981":"#EF4444" }}>
                    {wage.diffH>=0?"+":""}{wage.diffH.toFixed(1)}h
                  </span>
                </div>
                {(() => {
                  const baselinePay = wage.reqDays * wage.dailyRate + wage.reqExtraHours * wage.partHourlyRate;
                  const variableMoney = wage.excessPartH * wage.partHourlyRate
                                     + wage.excessOtH   * wage.otHourlyRate
                                     - wage.deficitH    * wage.partHourlyRate
                                     + wage.travel;
                  return (<div style={{ marginTop:6,borderTop:"1px solid #E5E7EB",paddingTop:6 }}>
                    <div style={S.row}><span style={{ fontSize:12,color:C.sub }}>기준 금액</span><span style={{ fontSize:12,color:"#555" }}>{fA(baselinePay)}</span></div>
                    {wage.excessPartH > 0 && <div style={S.row}><span style={{ fontSize:11,color:C.sub }}>초과 파트 {wage.excessPartH.toFixed(1)}h</span><span style={{ fontSize:11,color:"#10B981" }}>+{fA(wage.excessPartH*wage.partHourlyRate)}</span></div>}
                    {wage.excessOtH > 0 && <div style={S.row}><span style={{ fontSize:11,color:C.sub }}>초과 OT {wage.excessOtH.toFixed(1)}h</span><span style={{ fontSize:11,color:"#10B981" }}>+{fA(wage.excessOtH*wage.otHourlyRate)}</span></div>}
                    {wage.deficitH > 0 && <div style={S.row}><span style={{ fontSize:11,color:C.sub }}>부족 {wage.deficitH.toFixed(1)}h</span><span style={{ fontSize:11,color:"#EF4444" }}>-{fA(wage.deficitH*wage.partHourlyRate)}</span></div>}
                    <div style={S.row}><span style={{ fontSize:12,color:C.sub,fontWeight:600 }}>차이 금액</span><span style={{ fontSize:13,fontWeight:700,color:variableMoney>=0?"#10B981":"#EF4444" }}>{variableMoney>=0?"+":""}{fA(variableMoney)}</span></div>
                  </div>);
                })()}
                </>)}
              </div>
            </div>

            {/* Gross breakdown */}

            {/* ── 디덕션 섹션 ── */}
            <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:deductions.length>0?12:0 }}>
                <p style={{ margin:0,fontSize:11,fontWeight:700,color:"#EF4444",textTransform:"uppercase",letterSpacing:1 }}>➖ 공제 항목 (Deductions)</p>
                <button onClick={addDeduction}
                  style={{ fontSize:12,fontWeight:700,background:"#FEF2F2",color:"#EF4444",border:"1.5px solid #FECACA",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontFamily:"inherit" }}>
                  + 추가
                </button>
              </div>
              {deductions.length === 0 && (
                <p style={{ fontSize:12,color:"#ccc",textAlign:"center",margin:"8px 0 0",fontStyle:"italic" }}>회사카드 개인결제 등 공제할 항목을 추가하세요</p>
              )}
              {deductions.map(d => (
                <div key={d.id} style={{ display:"flex",gap:6,alignItems:"center",marginBottom:8 }}>
                  <input placeholder="항목명 (예: 회사카드 개인결제)" value={d.desc}
                    onChange={e => updateDeduction(d.id, "desc", e.target.value)}
                    style={{ ...styles.input,flex:2,fontSize:12,padding:"8px 10px" }} />
                  <div style={{ flex:1,position:"relative" }}>
                    <span style={{ position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",fontSize:12,color:"#888",pointerEvents:"none" }}>$</span>
                    <input type="number" placeholder="0.00" value={d.amount} min={0} step={0.01}
                      onChange={e => updateDeduction(d.id, "amount", e.target.value)}
                      style={{ ...styles.input,fontSize:12,padding:"8px 10px 8px 22px",width:"100%",boxSizing:"border-box" }} />
                  </div>
                  <button onClick={() => removeDeduction(d.id)}
                    style={{ background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,cursor:"pointer",color:"#EF4444",fontSize:16,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontFamily:"inherit" }}>×</button>
                </div>
              ))}
              {totalDeductions > 0 && (
                <div style={{ borderTop:"1.5px dashed #FECACA",paddingTop:10,marginTop:4 }}>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6 }}>
                    <span style={{ fontSize:13,fontWeight:600,color:"#EF4444" }}>총 공제액</span>
                    <span style={{ fontSize:14,fontWeight:800,color:"#EF4444" }}>− {fA(totalDeductions)}</span>
                  </div>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",background:"#F9FAFB",borderRadius:10,padding:"10px 12px" }}>
                    <span style={{ fontSize:14,fontWeight:700,color:C.text }}>공제 후 금액</span>
                    <span style={{ fontSize:18,fontWeight:900,color:C.text }}>{fA(Math.max(0, wage.gross - totalDeductions))}</span>
                  </div>
                </div>
              )}
            </div>

            {/* Tax + Super (non-contractor) */}
            {!wage.isContractor && (
              <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
                <>
                  <p style={S.sectionTitle}>📌 지급액</p>
                  {wage.fixedNet > 0 && <div style={S.row}><span style={{ fontSize:13,color:C.text }}>Net Pay</span><span style={{ fontSize:13,fontWeight:700,color:"#10B981" }}>{fA(wage.fixedNet)}</span></div>}
                  {wage.fixedTax > 0 && <div style={S.row}><span style={{ fontSize:13,color:C.text }}>Tax</span><span style={{ fontSize:13,fontWeight:700,color:"#EF4444" }}>{fA(wage.fixedTax)}</span></div>}
                  {wage.fixedSuper > 0 && <div style={S.row}><span style={{ fontSize:13,color:C.text }}>Super</span><span style={{ fontSize:13,fontWeight:700,color:"#F59E0B" }}>{fA(wage.fixedSuper)}</span></div>}
                  {!wage.fixedNet && !wage.fixedTax && !wage.fixedSuper && (
                    <p style={{ fontSize:12,color:"#aaa",textAlign:"center",margin:"4px 0" }}>⚙️ 설정 탭에서 지급액을 입력하세요</p>
                  )}
                </>
              </div>
            )}

            {/* Cash / Keep (non-contractor) */}
            {!wage.isContractor && (<>
              {/* Keep / Cash - 변동분 관리 */}
              {(() => {
                // 변동분 = 파트초과 × 파트시급 + OT초과 × OT시급 - 부족분 × 파트시급 - 공제
                const variable = wage.excessPartH * wage.partHourlyRate
                               + wage.excessOtH   * wage.otHourlyRate
                               - wage.deficitH    * wage.partHourlyRate
                               + wage.travel
                               - totalDeductions;
                const rawCash = parseFloat(partialCash);
                const cashAmt = isNaN(rawCash) ? 0 : Math.min(rawCash, Math.max(0, variable));
                const cashOut = cashAmt * 0.75;
                const keepAmt = Math.max(0, variable) - cashAmt;
                return (
                  <div style={{ background:"#fff",borderRadius:14,padding:"16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
                    {/* 변동분 */}
                    <p style={{ ...S.sectionTitle,marginBottom:4 }}>변동분</p>
                    <p style={{ margin:"0 0 14px",fontSize:30,fontWeight:900,color:variable>=0?"#3B82F6":"#EF4444" }}>{fA(variable)}</p>
                    {variable < 0 && <p style={{ margin:"-10px 0 14px",fontSize:11,color:"#EF4444" }}>⚠️ 고정 지급액이 Gross를 초과해요</p>}

                    {/* 출금 금액 입력 */}
                    {variable > 0 && <p style={{ margin:"0 0 8px",fontSize:12,fontWeight:600,color:"#555" }}>💵 캐시 출금 금액 (0이면 전액 킵)</p>}
                    <div style={{ display:"flex",gap:6,marginBottom:12 }}>
                      <div style={{ flex:1,position:"relative" }}>
                        <span style={{ position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"#888",fontSize:13,pointerEvents:"none" }}>$</span>
                        <input type="number" placeholder="0.00 (전액 킵)" value={partialCash} min={0} step={0.01}
                          onChange={e => setPartialCash(e.target.value)}
                          style={{ ...styles.input,paddingLeft:22,fontSize:14,fontWeight:700 }}/>
                      </div>
                      <button onClick={() => setPartialCash(String(variable.toFixed(2)))}
                        style={{ padding:"0 12px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"#F3F4F6",color:"#555",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>
                        전액
                      </button>
                      <button onClick={() => setPartialCash("")}
                        style={{ padding:"0 12px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"#F3F4F6",color:"#555",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>
                        전액킵
                      </button>
                    </div>

                    {/* 결과 */}
                    <div style={{ background:"#F9FAFB",borderRadius:10,padding:"12px 14px" }}>
                      {cashAmt > 0 && (<>
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5 }}>
                          <span style={{ color:"#555" }}>캐시 출금 ({fA(cashAmt)} × 75%)</span>
                          <span style={{ fontWeight:800,color:"#EF4444" }}>{fA(cashOut)}</span>
                        </div>
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:cashAmt < variable ? 8 : 0,color:"#aaa" }}>
                          <span>25% 공제</span>
                          <span>- {fA(cashAmt * 0.25)}</span>
                        </div>
                      </>)}
                      {keepAmt > 0 && (
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:13,borderTop:cashAmt>0?"1px solid #E5E7EB":"none",paddingTop:cashAmt>0?8:0 }}>
                          <span style={{ color:"#555" }}>🏦 킵 잔액</span>
                          <span style={{ fontWeight:800,color:"#10B981" }}>{fA(keepAmt)}</span>
                        </div>
                      )}
                      {cashAmt === 0 && keepAmt === 0 && (
                        <p style={{ margin:0,fontSize:12,color:"#aaa",textAlign:"center" }}>변동분이 없어요</p>
                      )}
                    </div>
                    {/* 정산완료 */}
                    {isSuperAdmin && (
                      <button onClick={() => saveCarryover(selId)}
                        style={{ width:"100%",background:"#111",color:"#fff",border:"none",borderRadius:12,padding:13,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginTop:12 }}>
                        💾 정산 완료 {keepAmt > 0 ? `(킵 +${fA(keepAmt)})` : ""}{cashAmt > 0 ? ` (캐시 ${fA(cashOut)})` : ""}
                      </button>
                    )}
                  </div>
                );
              })()}
        </>)}
      </>)}
    </>)}

        {/* ── LOG VIEW ── */}
        {subView === "log" && (
          <div>
            {wage && wage.periodLogs.length === 0 ? (
              <EmptyState msg="이 기간 근무일지가 없습니다." />
            ) : wage && wage.periodLogs.map(l => {
              const wt = l.workType || "fulltime";
              const wtColor = wt==="overtime"?"#F59E0B":wt==="parttime"?"#8B5CF6":wt==="dayoff"?"#9CA3AF":wt==="publicholiday"?"#F97316":"#10B981";
              const wtLabel = wt==="fulltime"?"풀타임":wt==="overtime"?"오버타임":wt==="parttime"?"파트타임":wt==="dayoff"?"휴무":wt==="publicholiday"?"공휴일":wt;
              return (
                <div key={l.id} style={{ background:"#fff",borderRadius:12,padding:"12px 14px",marginBottom:8,borderLeft:"3px solid "+selColor,boxShadow:"0 1px 4px #0000000a" }}>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start" }}>
                    <div style={{ flex:1,minWidth:0 }}>
                      <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:4 }}>
                        <span style={{ fontSize:13,fontWeight:700,color:C.text }}>{dayStr(l.date)}</span>
                        <span style={{ fontSize:10,fontWeight:700,color:"#fff",background:wtColor,borderRadius:6,padding:"2px 7px" }}>{wtLabel}</span>
                      </div>
                      {l.content && <p style={{ margin:"0 0 4px",fontSize:12,color:C.sub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{l.content}</p>}
                      {l.travel && (l.travel.allowance > 0 || l.travel.hasDinner) && (
                        <p style={{ margin:0,fontSize:11,color:"#3B82F6",fontWeight:600 }}>
                          🚗 {fA((l.travel.allowance||0)+(l.travel.hasDinner?25:0))}
                          {(l.travel.stops||[]).filter(Boolean).length > 0 && " · "+(l.travel.stops||[]).filter(Boolean).join(" → ")}
                        </p>
                      )}
                    </div>
                    <div style={{ textAlign:"right",flexShrink:0,marginLeft:10 }}>
                      <p style={{ margin:0,fontSize:16,fontWeight:800,color:selColor }}>{fmt(l.hours)}h</p>
                      {wt==="overtime" && <p style={{ margin:"2px 0 0",fontSize:11,color:"#F59E0B",fontWeight:600 }}>+OT {fmt(calcHours(l.otStart||"16:30",l.otEnd||"16:30"))}h</p>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── SETTINGS VIEW ── */}
        {subView === "settings" && isSuperAdmin && (
          <div style={{ background:"#fff",borderRadius:14,padding:"16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
            <p style={{ margin:"0 0 16px",fontSize:15,fontWeight:700,color:C.text }}>⚙️ {selEmp.name} 급여 설정</p>
            {!(leaves[selId] || {}).noLeave && (
              <ReqHistoryEditor selId={selId} leaves={leaves} persist={persist} periodStart={periodStart} isSuperAdmin={isSuperAdmin} />
            )}
            {(leaves[selId] || {}).noLeave && (
              <div style={{ background:"#FEF3C7",borderRadius:10,padding:"10px 12px",marginBottom:14 }}>
                <p style={{ margin:0,fontSize:12,color:"#92400E" }}>📄 인보이스 직원 — 기준일 설정 없음</p>
              </div>
            )}
            {!(leaves[selId] || {}).noLeave && (
              <div>
                <label style={styles.label}>고정 지급액 (매 격주 고정)</label>
                <p style={{ margin:"-8px 0 10px",fontSize:11,color:C.sub,lineHeight:1.5 }}>
                  며칠을 일하든 고정으로 지급되는 금액이에요.<br/>
                  Gross - 고정(Net+Tax+Super) - 공제 = Keep/Cash 변동분
                </p>
                {[["fixedNet","Net Pay","#10B981"],["fixedTax","Tax","#EF4444"],["fixedSuper","Super","#F59E0B"]].map(([key,label,color]) => (
                  <div key={key} style={{ display:"flex",alignItems:"center",gap:8,marginBottom:10 }}>
                    <div style={{ width:48,fontSize:12,fontWeight:700,color }}>{label}</div>
                    <div style={{ flex:1,position:"relative" }}>
                      <span style={{ position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"#888",fontSize:12,pointerEvents:"none" }}>$</span>
                      <input type="number" style={{ ...styles.input,paddingLeft:22,fontSize:13 }} min={0} step={0.01}
                        defaultValue={(leaves[selId]||{})[key]||""}
                        placeholder="0.00"
                        onBlur={e => {
                          const lv = leaves[selId]||{};
                          persist(null,null,{...leaves,[selId]:{...lv,[key]:parseFloat(e.target.value)||0}});
                        }} />
                    </div>
                    <button onClick={() => {
                      const lv = leaves[selId]||{};
                      persist(null,null,{...leaves,[selId]:{...lv,[key]:0}});
                    }} style={{ width:28,height:28,borderRadius:8,border:"1px solid #FECACA",background:"#FEF2F2",color:"#EF4444",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontFamily:"inherit" }}>×</button>
                  </div>
                ))}
                {(() => {
                  const lv = leaves[selId]||{};
                  const total = (lv.fixedNet||0) + (lv.fixedTax||0) + (lv.fixedSuper||0);
                  return total > 0 ? (
                    <div style={{ background:"#F9FAFB",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#555" }}>
                      합계: Net {new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(lv.fixedNet||0)} + Tax {new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(lv.fixedTax||0)} + Super {new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(lv.fixedSuper||0)} = <strong>{new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(total)}</strong>
                    </div>
                  ) : null;
                })()}
              </div>
            )}
            {carry && (carry.fullDays !== 0 || carry.partHours !== 0) && (
              <div>
                <label style={styles.label}>현재 이월 초기화</label>
                <button onClick={() => {
                  const lv = leaves[selId]||{};
                  persist(null,null,{...leaves,[selId]:{...lv,wageCarryover:{fullDays:0,partHours:0,otHours:0}}});
                }} style={{ ...styles.btnSecondary,display:"block",width:"100%",marginTop:4,color:"#f77",borderColor:"#f77" }}>
                  🗑 이월 초기화
                </button>
              </div>
            )}
            <div style={{ background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:"10px 12px",marginTop:14 }}>
              <p style={{ margin:0,fontSize:12,color:"#1D4ED8" }}>💡 일당은 <strong>일급 탭</strong>에서 변경하세요</p>
            </div>
            {getKeepBalance(selId) > 0 && (
              <div style={{ background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10,padding:"10px 12px",marginTop:10 }}>
                <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center" }}>
                  <div>
                    <p style={{ margin:0,fontSize:12,fontWeight:700,color:"#166534" }}>🏦 현재 킵 잔액</p>
                    <p style={{ margin:"2px 0 0",fontSize:18,fontWeight:800,color:"#10B981" }}>{fA(getKeepBalance(selId))}</p>
                  </div>
                  <button onClick={() => {
                    const lv = leaves[selId]||{};
                    persist(null,null,{...leaves,[selId]:{...lv,keepBalance:0}});
                  }} style={{ fontSize:11,background:"#FEF2F2",color:"#EF4444",border:"1px solid #FECACA",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontFamily:"inherit",fontWeight:600 }}>
                    초기화
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

      </>)}
    </div>
  );
}

// ─── Invoice Button + In-App PDF Preview ─────────────────────────────────
const inv = {
  info:       { fontSize: 11, color: "#444", lineHeight: 1.6, margin: 0 },
  sectionHdr: { background: "#1a4fa8", color: "#fff", fontWeight: 700, padding: "4px 8px", fontSize: 11, marginBottom: 6 },
  smallTable: { borderCollapse: "collapse", fontSize: 11 },
  th:         { border: "1px solid #aaa", padding: "4px 12px", background: "#1a4fa8", color: "#fff", fontWeight: 700, textAlign: "center" },
  td:         { border: "1px solid #aaa", padding: "4px 12px", textAlign: "center" },
  th2:        { background: "#1a4fa8", color: "#fff", padding: "5px 8px", fontWeight: 700 },
  tdRow:      { borderBottom: "1px solid #e0e6f0", padding: "4px 8px" },
};
function InvoiceButton({ u, s, periodLogs, startDate, endDate, leaveData, onInvoiceSent }) {
  const [show, setShow]             = useState(false);
  const [deductDesc, setDeductDesc] = useState("Deduction");
  const [deductAmt, setDeductAmt]   = useState("");
  const ci         = (leaveData && leaveData.contractorInfo) || {};
  const dailyRate  = parseFloat(ci.dailyRate) || 0;
  const ptRate     = dailyRate > 0 ? dailyRate / 9 : 0;
  const otRate     = dailyRate > 0 ? dailyRate / 8 : 0;
  const workDesc   = ci.workDesc || "Work";
  const invoiceNum = ci.invoiceNum || "10001";
  const deductNum  = parseFloat(deductAmt) || 0;
  const fullAmt    = s.fulltimeDays * dailyRate;
  const travelLogs = periodLogs.filter(l => l.travel && (l.travel.allowance || l.travel.hasDinner));
  const trvlCnt    = travelLogs.length;
  const trvlUnit   = trvlCnt > 0 ? s.travelTotal / trvlCnt : 0;
  const bizLogs    = periodLogs.filter(l => l.travel && l.travel.hasDinner);
  const bizAmt     = bizLogs.length * 25;
  const ptAmt      = s.parttimeHours * ptRate;
  const otAmt      = s.overtimeHours * otRate;
  const subtotal   = fullAmt + s.travelTotal + ptAmt + otAmt - deductNum;
  const displayName  = ci.nameEn || (u.name || "").toUpperCase();
  const contactEmail = ci.email  || ci.billToEmail || "";

  const buildHTML = () => {
    const rows = [
      { desc: workDesc,                         qty: s.fulltimeDays  || "",  unit: s.fulltimeDays  ? dailyRate : "",  amt: fullAmt    || "" },
      { desc: "Travel allowance",               qty: trvlCnt         || "",  unit: trvlCnt         ? trvlUnit  : "",  amt: s.travelTotal || "" },
      { desc: "Business trip",                  qty: bizLogs.length  || "",  unit: bizLogs.length  ? 25        : "",  amt: bizAmt     || "" },
      { desc: "Half time " + workDesc,          qty: s.parttimeHours ? fmt(s.parttimeHours)+"h" : "", unit: ptAmt ? ptRate : "", amt: ptAmt || "" },
      { desc: "Over time " + workDesc,          qty: s.overtimeHours ? fmt(s.overtimeHours)+"h" : "", unit: otAmt ? otRate : "", amt: otAmt || "" },
      { desc: deductDesc || "Deduction",        qty: "",              unit: "",                         amt: deductNum ? -deductNum : "" },
    ];
    const fmtC = (v) => { if (v === "" || v === 0) return "–"; const n = parseFloat(v); return isNaN(n) ? String(v) : n.toFixed(2); };
    const addrLines = (a) => (a||"").split(",").map(l=>l.trim()).filter(Boolean).map(l=>`<p style="margin:0;font-size:11px;color:#444">${l}</p>`).join("");
    const emptyRows = Array(9).fill('<tr><td>&nbsp;</td><td></td><td></td><td style="text-align:right">–</td></tr>').join("");
    return `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Invoice ${invoiceNum}</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:12px;padding:20px}
.hdr{display:flex;justify-content:space-between;margin-bottom:16px}
.name{color:#1a4fa8;font-size:20px;font-weight:900;margin-bottom:4px}
.inv-title{color:#1a4fa8;font-size:26px;font-weight:900;text-align:right;margin-bottom:8px}
table{border-collapse:collapse}td,th{padding:4px 8px}
.ith{background:#1a4fa8;color:#fff;font-weight:700;text-align:center;border:1px solid #aaa}
.itd{border:1px solid #aaa;text-align:center}
.bhdr{background:#1a4fa8;color:#fff;font-weight:700;padding:4px 8px;font-size:11px;margin-bottom:6px}
.binfo{font-size:11px;color:#444;line-height:1.6}
.th2{background:#1a4fa8;color:#fff;padding:5px 8px;font-weight:700}
.tdr{border-bottom:1px solid #e0e6f0;padding:4px 8px;font-size:11px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px}
.ty{font-style:italic;color:#1a4fa8;font-size:11px}
.tttd{padding:3px 8px;color:#555;font-size:11px}
.ttot{background:#1a4fa8;color:#fff;font-weight:700;padding:6px 8px;font-size:12px}
</style></head><body>
<div class="hdr">
  <div><div class="name">${displayName}</div>${addrLines(ci.address)}
  ${ci.phone?`<p style="margin:0;font-size:11px;color:#444">Phone: ${ci.phone}</p>`:""}
  ${ci.abn?`<p style="margin:0;font-size:11px;color:#444">ABN: ${ci.abn}</p>`:""}</div>
  <div><div class="inv-title">INVOICE</div>
  <table><tr><td class="ith">INVOICE #</td><td class="ith">DATE</td></tr>
  <tr><td class="itd">${invoiceNum}</td><td class="itd">${today}</td></tr></table></div>
</div>
<div style="margin-bottom:12px"><div class="bhdr">BILL TO</div>
<div class="binfo">${ci.billToName||""}${addrLines(ci.billToAddress)}${ci.billToEmail?`<br/>${ci.billToEmail}`:""}</div></div>
<table style="width:100%">
<thead><tr>
<th class="th2" style="text-align:left;width:52%">DESCRIPTION</th>
<th class="th2" style="text-align:right;width:12%">QTY</th>
<th class="th2" style="text-align:right;width:18%">UNIT PRICE</th>
<th class="th2" style="text-align:right;width:18%">AMOUNT</th>
</tr></thead><tbody>
${rows.map(r=>`<tr><td class="tdr">${r.desc}</td><td class="tdr" style="text-align:right">${r.qty}</td><td class="tdr" style="text-align:right">${fmtC(r.unit)}</td><td class="tdr" style="text-align:right">${fmtC(r.amt)}</td></tr>`).join("")}
${emptyRows}
</tbody></table>
<div class="foot"><p class="ty">Thank you for your business!</p>
<table><tr><td class="tttd">SUBTOTAL</td><td class="tttd" style="text-align:right">${subtotal.toFixed(2)}</td></tr>
<tr><td class="tttd">TAX RATE</td><td class="tttd" style="text-align:right">0.000%</td></tr>
<tr><td class="tttd">TAX</td><td class="tttd" style="text-align:right">–</td></tr>
<tr><td class="ttot">TOTAL</td><td class="ttot" style="text-align:right">$ ${subtotal.toFixed(2)}</td></tr>
</table></div>
${contactEmail?`<p style="text-align:center;margin-top:20px;font-size:10px;color:#888">If you have any questions about this invoice, please contact<br/><span style="color:#1a4fa8">${contactEmail}</span></p>`:""}
</body></html>`;
  };

  const html    = buildHTML();
  const iframeRef = useRef(null);

  const buildPlainText = () => {
    const lines = [`INVOICE #${invoiceNum}  DATE: ${today}`,`FROM: ${displayName}`,ci.address?ci.address:"",ci.phone?`Phone: ${ci.phone}`:"",ci.abn?`ABN: ${ci.abn}`:"","",`BILL TO: ${ci.billToName||""}`,ci.billToAddress||"","","DESCRIPTION                    QTY   UNIT     AMOUNT","─────────────────────────────────────────────────────"];
    const addRow = (desc,qty,unit,amt) => { if(!qty&&!amt)return; lines.push(`${desc.padEnd(30)} ${String(qty||"").padStart(5)}  ${String(unit?parseFloat(unit).toFixed(2):"").padStart(7)}  ${String(amt?parseFloat(amt).toFixed(2):"–").padStart(8)}`); };
    if(s.fulltimeDays)addRow(workDesc,s.fulltimeDays,dailyRate,fullAmt);
    if(s.travelTotal>0)addRow("Travel allowance",trvlCnt,trvlUnit,s.travelTotal);

  const fmtCell=(v)=>{if(v===""||v===0)return"–";const n=parseFloat(v);return isNaN(n)?String(v):n.toFixed(2);};

// ─── ReqHistoryEditor: 기준일/시간 이력 관리 ─────────────────────────────
function ReqHistoryEditor({ selId, leaves, persist, periodStart, isSuperAdmin }) {
  const lv = leaves[selId] || {};
  const history = lv.reqHistory || [];
  const [newFrom, setNewFrom] = useState(periodStart || today);
  const [newDays, setNewDays] = useState("");
  const [newHours, setNewHours] = useState("");
  const [confirmDel, setConfirmDel] = useState(null);

  const sorted = [...history].sort((a, b) => b.from.localeCompare(a.from));

  const addEntry = () => {
    if (!newFrom || (!newDays && !newHours)) return;
    const entry = { from: newFrom, days: parseInt(newDays) || 0, hours: parseFloat(newHours) || 0 };
    const updated = [...history.filter(h => h.from !== newFrom), entry];
    persist(null, null, { ...leaves, [selId]: { ...lv, reqHistory: updated } });
    setNewDays(""); setNewHours("");
  };

  const delEntry = (from) => {
    persist(null, null, { ...leaves, [selId]: { ...lv, reqHistory: history.filter(h => h.from !== from) } });
    setConfirmDel(null);
  };

  // 현재 기간에 해당하는 기준
  const current = sorted.find(h => h.from <= (periodStart || today)) || sorted[sorted.length - 1];

  return (
    <div>
      <div style={{ marginBottom:14 }}>
        <label style={styles.label}>기준일 이력 (급여기간별 고정)</label>
        {current && (
          <div style={{ background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:"10px 12px",marginBottom:10 }}>
            <p style={{ margin:0,fontSize:12,color:"#1D4ED8",fontWeight:600 }}>
              📌 현재 기간({periodStart}) 적용 기준: <strong>{current.days}일 {current.hours > 0 ? `${current.hours}h ` : ""}= {current.days * 9 + current.hours}h</strong>
            </p>
          </div>
        )}
        {sorted.length === 0 && (
          <p style={{ fontSize:12,color:"#aaa",textAlign:"center",margin:"8px 0" }}>등록된 기준 이력이 없어요</p>
        )}
        {sorted.map(h => (
          <div key={h.from} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 10px",background:h===current?"#F0FDF4":"#F9FAFB",borderRadius:8,marginBottom:6,border:h===current?"1px solid #BBF7D0":"1px solid #E5E7EB" }}>
            <div>
              <p style={{ margin:0,fontSize:12,fontWeight:600,color:"#111" }}>{h.from} ~</p>
              <p style={{ margin:"2px 0 0",fontSize:13,fontWeight:700,color:h===current?"#10B981":"#555" }}>
                {h.days}일 {h.hours > 0 ? `${h.hours}h ` : ""}= {h.days * 9 + h.hours}h
              </p>
            </div>
            {confirmDel === h.from ? (
              <div style={{ display:"flex",gap:6,alignItems:"center" }}>
                <span style={{ fontSize:11,color:"#f77" }}>삭제?</span>
                <button onClick={() => delEntry(h.from)} style={{ fontSize:11,background:"#f77",color:"#fff",border:"none",borderRadius:6,padding:"3px 8px",cursor:"pointer",fontFamily:"inherit" }}>예</button>
                <button onClick={() => setConfirmDel(null)} style={{ fontSize:11,background:"#eee",color:"#555",border:"none",borderRadius:6,padding:"3px 8px",cursor:"pointer",fontFamily:"inherit" }}>아니오</button>
              </div>
            ) : (
              <button onClick={() => setConfirmDel(h.from)} style={{ background:"none",border:"none",cursor:"pointer",color:"#f77",fontSize:16,padding:"4px" }}>×</button>
            )}
          </div>
        ))}
      </div>

      <div style={{ background:"#F9FAFB",borderRadius:10,padding:"12px 14px",border:"1px dashed #D1D5DB" }}>
        <p style={{ margin:"0 0 10px",fontSize:12,fontWeight:600,color:"#555" }}>+ 새 기준 추가</p>
        <div style={{ ...styles.field,marginBottom:10 }}>
          <label style={styles.label}>적용 시작일</label>
          <input type="date" style={styles.input} value={newFrom} onChange={e => setNewFrom(e.target.value)} />
        </div>
        <div style={{ display:"flex",gap:8,alignItems:"flex-end",marginBottom:10 }}>
          <div style={{ flex:1 }}>
            <label style={{ ...styles.label,fontSize:10 }}>일 (days)</label>
            <input type="number" style={styles.input} value={newDays} min={0} max={14} placeholder="0"
              onChange={e => setNewDays(e.target.value)} />
          </div>
          <span style={{ fontSize:18,color:"#aaa",paddingBottom:12 }}>+</span>
          <div style={{ flex:1 }}>
            <label style={{ ...styles.label,fontSize:10 }}>시간 (hours)</label>
            <input type="number" style={styles.input} value={newHours} min={0} max={8} step={0.5} placeholder="0"
              onChange={e => setNewHours(e.target.value)} />
          </div>
        </div>
        {(newDays || newHours) && (
          <p style={{ margin:"0 0 8px",fontSize:12,color:"#555" }}>
            → {parseInt(newDays)||0}일 {parseFloat(newHours)||0 > 0 ? `${parseFloat(newHours)}h ` : ""}= {(parseInt(newDays)||0)*9 + (parseFloat(newHours)||0)}h
          </p>
        )}
        <button onClick={addEntry}
          style={{ width:"100%",background:C.primary,color:"#fff",border:"none",borderRadius:10,padding:"11px 0",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>
          저장
        </button>
      </div>
    </div>
  );
}


// ── 미제출 근무일지 계산 ─────────────────────────────────────────────────
function getMissingLogs(users, logs, periodStart, periodEnd) {
  const results = [];
  const start = new Date(periodStart + "T00:00:00");
  const end   = new Date(periodEnd   + "T00:00:00");
  const today = new Date();
  today.setHours(0,0,0,0);

  // 활성 직원만
  const activeEmps = users.filter(u =>
    u.role === "employee" && !u.resignedDate &&
    new Date(u.joinDate + "T00:00:00") <= end
  );

  for (const emp of activeEmps) {
    const empStart = new Date(Math.max(start, new Date(emp.joinDate + "T00:00:00")));
    const missing = [];
    for (let d = new Date(empStart); d <= end && d <= today; d.setDate(d.getDate()+1)) {
      const dow = d.getDay();
      if (dow === 0 || dow === 6) continue; // 주말 제외
      const ds = d.toISOString().slice(0,10);
      const hasLog = logs.some(l => l.userId === emp.id && l.date === ds);
      if (!hasLog) missing.push(ds);
    }
    if (missing.length > 0) results.push({ emp, missing });
  }
  return results;
}

}

function BottomNav({ tab, setTab, isAdmin, userHasLeave, user, logs }) {
  const items = [
    { key:"home",    label:"홈",     emoji:"🏠" },
    { key:"log",     label:"근무일지", emoji:"📋", badge: !isAdmin && logs.filter(l=>l.userId===user.id&&l.needsReview&&!l.reviewedByEmp).length },
    ...(userHasLeave ? [{ key:"leave", label:"연차", emoji:"🌴" }] : []),
    { key:"payroll", label:"급여",   emoji:"💰" },
    ...(isAdmin ? [{ key:"rate",    label:"일급",   emoji:"💵" }] : []),
    ...(isAdmin ? [{ key:"team",    label:"직원관리", emoji:"👥" }] : []),

    <nav style={styles.nav}>
      {items.map(item => {
        const active = tab === item.key;
        return (
          <button key={item.key} onClick={() => setTab(item.key)}
            style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 2px",position:"relative" }}>
            <div style={{ position:"relative" }}>
              <div style={{
                width:40,height:40,borderRadius:12,
                display:"flex",alignItems:"center",justifyContent:"center",

                <span style={{ fontSize:20, filter: active ? "none" : "grayscale(30%)", opacity: active ? 1 : 0.6 }}>{item.emoji}</span>
              </div>
              {!!item.badge && <div style={{ position:"absolute",top:0,right:0,width:16,height:16,background:"#EF4444",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800,color:"#fff",border:"2px solid #fff" }}>{item.badge}</div>}

}

function HomeTab({ user, users, logs, leaves, isAdmin }) {
  const myLogs=isAdmin?logs:logs.filter(l=>l.userId===user.id);
  const myLv=normLeave(leaves[user.id],user.joinDate);
  const myAccDays=calcAccruedDays(myLv.leaveStartDate);
  const myRemDays=Math.round((myAccDays+(myLv.grantDays||0)-(myLv.usedDays||0))*10)/10;
  const thisMonth=new Date().toISOString().slice(0,7);
  const monthLogs=myLogs.filter(l=>l.date.startsWith(thisMonth));
  const monthHours=monthLogs.reduce((s,l)=>s+(l.hours||0),0);
  const todayStr=today;
  const [selectedDate,setSelectedDate]=useState(todayStr);
  const selectedLogs=isAdmin?logs.filter(l=>l.date===selectedDate):logs.filter(l=>l.userId===user.id&&l.date===selectedDate);
  const todayLogs=isAdmin?logs.filter(l=>l.date===todayStr):logs.filter(l=>l.userId===user.id&&l.date===todayStr);
  const staffUsers=isAdmin?users.filter(u=>u.role==="employee"):[];
  const loggedIds=new Set(selectedLogs.map(l=>l.userId));
  const missingStaff=staffUsers.filter(u=>!loggedIds.has(u.id));
  return (
    <div style={styles.page}>
      <div style={styles.greeting}>
        <h2 style={styles.greetingText}>안녕하세요, {user.name}님 👋</h2>
        <p style={styles.dateText}>{korDate(todayStr)}</p>
      </div>
      <div style={styles.statsGrid}>
        {!isAdmin&&<><StatCard label="연차 잔여" value={`${myRemDays.toFixed(1)}일`} sub={`적립 ${myAccDays.toFixed(1)}일 / 20일`} color="#4f8ef7" emoji="🏖️"/><StatCard label="이번 달 근무" value={`${fmt(monthHours)}h`} sub={`${monthLogs.length}일 출근`} color="#34c98b" emoji="💼"/></>}
      {!isAdmin && (() => {
        const reviewLogs = logs.filter(l => l.userId === user.id && l.needsReview && !l.reviewedByEmp);
        return reviewLogs.length > 0 ? (
          <div style={{ background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:12,padding:"12px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:10 }}>
            <span style={{ fontSize:22 }}>📢</span>
            <div>
              <p style={{ margin:0,fontSize:14,fontWeight:700,color:"#DC2626" }}>확인 요청 {reviewLogs.length}건</p>
              <p style={{ margin:"2px 0 0",fontSize:12,color:"#888" }}>근무일지 탭에서 확인해주세요</p>
            </div>
          </div>
        ) : null;
      })()}
        {isAdmin&&<><StatCard label="전체 직원" value={`${staffUsers.length}명`} sub="재직 중" color="#4f8ef7" emoji="👥"/><StatCard label="오늘 출근" value={`${todayLogs.length}명`} sub="근무일지 등록" color="#34c98b" emoji="✅"/></>}
      </div>
      <div style={styles.section}>
        <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10 }}>
          <h3 style={{ ...styles.sectionTitle,margin:0 }}>{isAdmin?"근무현황":"근무일지"}</h3>
          {isAdmin&&<input type="date" style={{ ...styles.input,width:"auto",fontSize:12,padding:"4px 8px" }} value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}/>}
        </div>
        {isAdmin&&missingStaff.length>0&&(
          <div style={{ background:"#fff8f0",border:"1px solid #ffd699",borderRadius:10,padding:"8px 12px",marginBottom:10 }}>
            <p style={{ margin:"0 0 6px",fontSize:11,fontWeight:700,color:"#a05c00" }}>⚠️ 미등록 ({missingStaff.length}명)</p>
            <div style={{ display:"flex",flexWrap:"wrap",gap:6 }}>
              {missingStaff.map(u=><span key={u.id} style={{ fontSize:11,background:"#fff",border:"1px solid #ffd699",borderRadius:6,padding:"2px 8px",color:"#a05c00" }}>{u.name}</span>)}
            </div>
          </div>
        )}
        {selectedLogs.length===0?<EmptyState msg={isAdmin?`${selectedDate===todayStr?"오늘":selectedDate} 등록된 근무일지가 없습니다.`:"근무일지가 없습니다."}/>:selectedLogs.map(l=>{
          const emp=users.find(u=>u.id===l.userId);
          return(<div key={l.id} style={styles.logCard}><div style={styles.logCardLeft}><div style={styles.logAvatar}>{((emp&&emp.name)||"?")[0]}</div><div><p style={styles.logName}>{isAdmin?((emp&&emp.name)||l.userId):korDate(l.date)}</p><p style={styles.logContent}>{l.content}</p></div></div><div style={styles.logHours}>{l.startTime}~{l.endTime}<br/><span style={styles.logHoursBig}>{fmt(l.hours)}h</span></div></div>);
        })}
      </div>
      {isAdmin && (() => {
        // 현재 웨이지 구간 계산
        const BASE = new Date("2026-04-13T00:00:00");
        const diff = Math.floor((Date.now() - BASE) / (14*24*60*60*1000));
        const pStart = new Date(BASE); pStart.setDate(pStart.getDate() + diff*14);
        const pEnd   = new Date(pStart); pEnd.setDate(pEnd.getDate() + 13);
        const ps = pStart.toISOString().slice(0,10);
        const pe = pEnd.toISOString().slice(0,10);
        const missing = getMissingLogs(users, logs, ps, pe);
        if (missing.length === 0) return null;
        const [open, setOpen] = React.useState(true);
        const totalDays = missing.reduce((s,r)=>s+r.missing.length,0);
        return (
          <div style={{ background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:14,padding:"12px 14px",marginBottom:14 }}>
            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",marginBottom:open?10:0 }}
              onClick={()=>setOpen(p=>!p)}>
              <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                <span style={{ fontSize:16 }}>⚠️</span>
                <div>
                  <p style={{ margin:0,fontSize:13,fontWeight:700,color:"#DC2626" }}>미제출 근무일지</p>
                  <p style={{ margin:0,fontSize:11,color:"#888" }}>{ps} ~ {pe} · {missing.length}명 · {totalDays}일</p>
                </div>
              </div>
              <span style={{ color:"#DC2626",fontSize:12 }}>{open?"▲":"▼"}</span>
            </div>
            {open && missing.map(({emp, missing:days}) => (
              <div key={emp.id} style={{ background:"#fff",borderRadius:10,padding:"8px 12px",marginBottom:6 }}>
                <p style={{ margin:"0 0 6px",fontSize:13,fontWeight:700,color:"#111" }}>{emp.name}</p>
                <div style={{ display:"flex",flexWrap:"wrap",gap:4 }}>
                  {days.map(d => {
                    const dt = new Date(d+"T00:00:00");
                    const label = `${dt.getMonth()+1}/${dt.getDate()}`;
                    return (
                      <span key={d} style={{ fontSize:11,fontWeight:600,background:"#FEE2E2",color:"#DC2626",borderRadius:6,padding:"2px 8px" }}>
                        {label}
                      </span>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        );
      })()}
      {isAdmin && (() => {
        // 최근 7일 이내 직원이 수정한 로그
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        const recentChanges = logs
          .filter(l => l.modifiedAt && l.modifiedBy !== "admin" && new Date(l.modifiedAt) >= sevenDaysAgo)
          .sort((a, b) => new Date(b.modifiedAt) - new Date(a.modifiedAt))
          .slice(0, 20);
        if(recentChanges.length === 0) return null;
        const [expanded, setExpanded] = React.useState(false);
        return (
          <div style={styles.section}>
            <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,cursor:"pointer" }}
              onClick={()=>setExpanded(p=>!p)}>
              <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                <h3 style={{ ...styles.sectionTitle,margin:0 }}>📝 직원 수정 내역</h3>
                <span style={{ fontSize:11,fontWeight:700,background:"#EF4444",color:"#fff",borderRadius:10,padding:"1px 8px" }}>{recentChanges.length}</span>
              </div>
              <span style={{ fontSize:12,color:C.sub }}>{expanded?"▲":"▼"}</span>
            </div>
            {expanded && recentChanges.map(l => {
              const emp = users.find(u=>u.id===l.modifiedBy);
              const dt = new Date(l.modifiedAt);
              const dateStr = `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
              return (
                <div key={l.id} style={{ background:"#fff",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:10,boxShadow:"0 1px 4px #0000000a",borderLeft:"3px solid #F59E0B" }}>
                  <div style={{ ...styles.logAvatar,width:30,height:30,fontSize:12,background:"#F59E0B" }}>
                    {(l.modifiedByName||"?")[0]}
                  </div>
                  <div style={{ flex:1,minWidth:0 }}>
                    <p style={{ margin:0,fontSize:13,fontWeight:600,color:C.text }}>
                      {l.modifiedByName||l.modifiedBy} · <span style={{ color:C.sub,fontWeight:400 }}>{l.date}</span>
                    </p>
                    <p style={{ margin:"2px 0 0",fontSize:11,color:C.sub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>
                      {l.content||"(내용 없음)"}
                    </p>
                  </div>
                  <span style={{ fontSize:11,color:C.sub,flexShrink:0 }}>{dateStr}</span>
                </div>
              );
            })}
          </div>
        );
      })()}
      {isAdmin&&(
        <div style={styles.section}>
          <h3 style={styles.sectionTitle}>연차 현황</h3>
          {users.filter(u=>u.role==="employee"&&!u.resignedDate&&!normLeave(leaves[u.id],u.joinDate).noLeave).map(u=>{
            const lv=normLeave(leaves[u.id],u.joinDate);
            const acc=calcAccruedDays(lv.leaveStartDate);
            const grant=+(lv.grantDays)||0;
            const used=+(lv.usedDays)||0;
            const rem=Math.round((acc+grant-used)*10)/10;
            const color=rem<0?"#c0392b":rem<4?"#f77":"#4f8ef7";
            const pct=acc>0?Math.min(100,Math.max(0,(rem/ANNUAL_LEAVE_DAYS)*100)):0;
            return(<div key={u.id} style={styles.leaveRow}><div style={styles.leaveRowLeft}><div style={styles.logAvatar}>{u.name[0]}</div><div><p style={styles.logName}>{u.name}<span style={styles.deptBadge}>{u.dept}</span></p><p style={styles.logContent}><span style={{ color,fontWeight:700 }}>{rem<0?"⚠️ ":""}{rem.toFixed(1)}일 가능</span>{" "}<span style={{ color:"#aaa" }}>/ 적립 {acc.toFixed(1)}일</span></p></div></div><div style={styles.miniBar}><div style={{ ...styles.miniBarFill,width:pct+"%",background:color }}/></div></div>);
          })}
        </div>
      )}
    </div>
  );
}
function StatCard({label,value,sub,color,emoji}){return(<div style={{ ...styles.statCard,borderTop:`3px solid ${color}` }}><span style={styles.statEmoji}>{emoji}</span><p style={styles.statValue}>{value}</p><p style={styles.statLabel}>{label}</p><p style={styles.statSub}>{sub}</p></div>);}

// ─── OSRM + Geocode helpers ────────────────────────────────────────────────
async function fetchDrivingKm(coord1,coord2){try{const url=`https://router.project-osrm.org/route/v1/driving/${coord1[1]},${coord1[0]};${coord2[1]},${coord2[0]}?overview=false`;const res=await fetch(url);const data=await res.json();if(data.code==="Ok")return Math.round(data.routes[0].distance/1000);return null;}catch{return null;}}
async function geocodePlace(query){try{const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query+", NSW, Australia")}&format=json&limit=1`;const res=await fetch(url,{headers:{"Accept-Language":"en"}});const data=await res.json();if(data.length>0)return[parseFloat(data[0].lat),parseFloat(data[0].lon)];return null;}catch{return null;}}

// ─── OsrmLegBox ───────────────────────────────────────────────────────────
function OsrmLegBox({from,to,autoKm,overrideVal,onOverride,onReset}){const[loading,setLoading]=useState(false);const fetchOsrm=async()=>{const c1=LOCATION_COORDS[from],c2=LOCATION_COORDS[to];if(!c1||!c2)return;setLoading(true);const km=await fetchDrivingKm(c1,c2);setLoading(false);if(km)onOverride(km);};const display=overrideVal!==undefined?overrideVal:(autoKm||"");return(<div style={styles.legKmBox}>{overrideVal===undefined&&autoKm!==null&&<span style={styles.legKmAuto}>📐 {autoKm}km</span>}<input type="number" style={styles.legKmInput} value={display} placeholder={autoKm!==null?`${autoKm}`:"km"} onChange={e=>onOverride(e.target.value)} min={0}/>{LOCATION_COORDS[from]&&LOCATION_COORDS[to]&&<button style={styles.osrmBtn} onClick={fetchOsrm} disabled={loading} title="실제 도로 거리">{loading?"…":"🗺️"}</button>}{overrideVal!==undefined&&<button style={styles.legKmReset} onClick={onReset}>↺</button>}</div>);}

function GeocodeLegBox({fromName,toName,overrideVal,onOverride,onReset}){const ref=useRef(null);const mapsUrl=fromName&&toName?`https://www.google.com/maps/dir/${encodeURIComponent(fromName+", NSW")}/${encodeURIComponent(toName+", NSW")}`:null;return(<div style={{ ...styles.legKmBox,borderColor:"#a0c4ff",background:"#f0f6ff",flexDirection:"column",alignItems:"stretch",gap:8,minWidth:190,padding:"10px 12px" }}>{mapsUrl&&<a href={mapsUrl} target="_blank" rel="noopener noreferrer" style={styles.geocodeBtn}>🗺️ Google Maps에서 거리 확인</a>}<div style={{ display:"flex",alignItems:"center",gap:6 }}><input ref={ref} type="text" inputMode="numeric" pattern="[0-9]*" style={{ ...styles.legKmInput,flex:1,textAlign:"left",fontSize:14,width:"auto",minWidth:60 }} defaultValue={overrideVal||""} placeholder="km 입력" onBlur={e=>{if(e.target.value)onOverride(e.target.value);}} onKeyDown={e=>{if(e.key==="Enter"&&ref.current&&ref.current.value)onOverride(ref.current.value);}}/><span style={{ fontSize:11,color:"#8891a8",whiteSpace:"nowrap" }}>km</span>{overrideVal!==undefined&&<button style={styles.legKmReset} onClick={()=>{if(ref.current)ref.current.value="";onReset();}}>↺</button>}</div>{overrideVal!==undefined&&<span style={{ fontSize:11,color:"#34c98b",fontWeight:600 }}>✅ {overrideVal}km 저장됨</span>}</div>);}

const WORK_TYPES_BASE=[{key:"fulltime",label:"풀타임",emoji:"✅"},{key:"overtime",label:"오버타임",emoji:"⏰"},{key:"parttime",label:"파트타임",emoji:"🕐"},{key:"dayoff",label:"휴무",emoji:"🌴"}];
function getWorkTypes(date,hasLeaveAccrual){const types=[...WORK_TYPES_BASE];if(hasLeaveAccrual){const day=new Date((date||today)+"T00:00:00").getDay();if(day>=1&&day<=5)types.push({key:"publicholiday",label:"퍼블릭홀리데이",emoji:"🎉"});}return types;}

// ─── LogTab ────────────────────────────────────────────────────────────────
function LogTab({user,users,logs,leaves,isAdmin,isSuperAdmin,isViewAdmin,persist}){
  const[showForm,setShowForm]=useState(false);
  const[filterUser,setFilterUser]=useState(isAdmin?"all":user.id);
  const[filterDate,setFilterDate]=useState(today);
  const[viewMode,setViewMode]=useState("period");
  const[wagePeriodOffset,setWagePeriodOffset]=useState(0);
  const getWagePeriod=(offset=0)=>{
    const BASE=new Date("2026-04-13T00:00:00");
    const cur=Math.floor((Date.now()-BASE)/(14*24*60*60*1000));
    const s=new Date(BASE); s.setDate(s.getDate()+(cur+offset)*14);
    const e=new Date(s); e.setDate(e.getDate()+13);
    return{start:s.toISOString().slice(0,10),end:e.toISOString().slice(0,10)};
  };
  const wp=getWagePeriod(wagePeriodOffset);
  const wpStart=wp.start; const wpEnd=wp.end;
  const[editLog,setEditLog]=useState(null);const[confirmDeleteId,setConfirmDeleteId]=useState(null);const filtered=logs.filter(l=>(filterUser==="all"?true:l.userId===filterUser)).filter(l=>viewMode==="date"?l.date===filterDate:viewMode==="period"?(l.date>=wpStart&&l.date<=wpEnd):true);const deleteLog=(id)=>{persist(null,logs.filter(l=>l.id!==id),null);setConfirmDeleteId(null);};return(<div style={styles.page}><div style={styles.pageHeader}><h2 style={styles.pageTitle}>근무일지</h2><button style={styles.btnAdd} onClick={()=>{setEditLog(null);setShowForm(true);}}>{Icon.plus} 등록</button></div><div style={{ display:"flex",gap:6,marginBottom:10 }}><button onClick={()=>setViewMode("period")} style={{ ...styles.filterInput,cursor:"pointer",background:viewMode==="period"?C.primary:"#fff",color:viewMode==="period"?"#fff":C.text,border:`1.5px solid ${C.primary}`,fontWeight:600,flex:1 }}>📅 구간별</button><button onClick={()=>setViewMode("date")} style={{ ...styles.filterInput,cursor:"pointer",background:viewMode==="date"?C.primary:"#fff",color:viewMode==="date"?"#fff":C.text,border:`1.5px solid ${C.primary}`,fontWeight:600,flex:1 }}>📆 날짜별</button></div><div style={styles.filterRow}>{viewMode==="period"&&<div style={{ display:"flex",alignItems:"center",gap:8,padding:"4px 0" }}>
        <button style={styles.navArrow} onClick={()=>setWagePeriodOffset(o=>o-1)}>‹</button>
        <div style={{ flex:1,textAlign:"center" }}>
          <p style={{ margin:0,fontSize:12,fontWeight:700 }}>{wpStart} ~ {wpEnd}</p>
          {wagePeriodOffset===0&&<span style={{ fontSize:10,color:C.primary }}>현재 구간</span>}
        </div>

={styles.legKmBox}>{travelCalc.returnAutoKm!==null&&travel.kmOverrides["return"]===undefined&&<span style={styles.legKmAuto}>📐 {travelCalc.returnAutoKm}km</span>}<input type="number" style={styles.legKmInput} value={travel.kmOverrides["return"]||""} placeholder={travelCalc.returnAutoKm!==null?`${travelCalc.returnAutoKm}`:"km"} onChange={e=>setTravelField({kmOverrides:{...travel.kmOverrides,return:e.target.value}})} min={0}/>{travel.kmOverrides["return"]!==undefined&&<button style={styles.legKmReset} onClick={()=>{const o={...travel.kmOverrides};delete o["return"];setTravelField({kmOverrides:o});}}>↺</button>}</div>}<div style={styles.legKmLine}/></div></div>}{travelCalc.outboundKm>0&&<div style={styles.allowanceResult}>{travelCalc.needsConfirm&&<div style={styles.confirmWarning}>⚠️ 수동 입력 km 포함 — 관리자 확인 필요</div>}<div style={styles.allowanceRow}><span style={styles.allowanceLabel}>편도 (경유 포함)</span><span style={styles.allowanceValue}>{travelCalc.outboundKm} km</span></div>{!travel.isBizTrip&&<div style={styles.allowanceRow}><span style={styles.allowanceLabel}>↩️ 귀환 (직통)</span><span style={styles.allowanceValue}>{travelCalc.returnKm} km</span></div>}<div style={{ ...styles.allowanceRow,borderTop:"1px solid #b3f5d4",paddingTop:8,marginTop:4 }}><span style={{ ...styles.allowanceLabel,fontWeight:700,color:"#1a6644" }}>{travel.isBizTrip?"편도 합계":"총 거리"}</span><span style={styles.allowanceValue}>{travelCalc.totalKm} km</span></div><div style={{ ...styles.allowanceRow,borderTop:"1px solid #b3f5d4",paddingTop:8,marginTop:4 }}><span style={{ ...styles.allowanceLabel,fontWeight:700,color:"#1a6644" }}>Travel Allowance</span><span style={styles.allowanceBig}>${travelCalc.allowance.toFixed(2)}</span></div>{travel.isBizTrip&&travel.hasDinner&&<div style={styles.dinnerRow}><span style={styles.allowanceLabel}>🍽️ 출장 저녁식비</span><span style={{ fontSize:15,fontWeight:700,color:"#e07000" }}>$25.00</span></div>}{travel.isBizTrip&&travel.hasDinner&&<div style={{ ...styles.allowanceRow,borderT // ─── FirebaseSetup ─────────────────────────────────────────────────────────
function FirebaseSetup({onDone}){const[url,setUrl]=useState("");const[testing,setTesting]=useState(false);const[err,setErr]=useState("");const test=async()=>{if(!url.trim()){setErr("URL을 입력하세요.");return;}const clean=url.trim().replace(/\/$/,"");setTesting(true);setErr("");try{const r=await fetch(clean+"/.json");if(!r.ok)throw new Error("연결 실패 (HTTP "+r.status+")");setTesting(false);onDone(clean);}catch(e){setTesting(false);setErr("❌ 연결 실패: "+e.message+"\nURL을 다시 확인해주세요.");}};return(<div style={{ minHeight:"100dvh",background:"#f4f6fb",display:"flex",alignItems:"center",justifyContent:"center",padding:20 }}><div style={{ background:"#fff",borderRadius:20,padding:"32px 24px",width:"100%",maxWidth:400,boxShadow:"0 8px 40px #3b7ff520" }}><div style={{ textAlign:"center",marginBottom:24 }}><div style={{ fontSize:44,marginBottom:8 }}>🔥</div><h2 style={{ margin:0,fontSize:22,fontWeight:800,color:"#3b7ff5" }}>Firebase 연결</h2><p style={{ margin:"8px 0 0",fontSize:13,color:"#888" }}>실시간 동기화를 위해 한 번만 설정해요</p></div><div style={{ background:"#f0f5ff",borderRadius:12,padding:14,marginBottom:20,fontSize:12,color:"#3b5fc0",lineHeight:1.7 }}><strong>설정 방법 (5분)</strong><br/>1. <a href="https://console.firebase.google.com" target="_blank" rel="noopener" style={{ color:"#3b7ff5" }}>console.firebase.google.com</a> 접속<br/>2. 프로젝트 만들기 (Google Analytics 비활성화)<br/>3. 왼쪽 "빌드" → "Realtime Database" → "데이터베이스 만들기"<br/>4. <strong>테스트 모드</strong>로 시작 → 완료<br/>5. 화면 상단 URL 복사 후 아래 붙여넣기<br/><span style={{ color:"#888" }}>예: https://myapp-default-rtdb.firebaseio.com</span></div><div style={{ marginBottom:14 }}><label style={{ display:"block",fontSize:11,fontWeight:600,color:"#888",marginBottom:6,textTransform:"uppercase" }}>Firebase Database URL</label><input style={{ width:"100%",boxSizing:"border-box",border:"1.5px solid #e0e6f0",borderRadius:10,padding:"10px 12px",fontSize:13,fontFamily:"inherit",outline:"none" }} value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://yourapp-default-rtdb.firebaseio.com" autoCapitalize="none"/></div>{err&&<p style={{ color:"#f77",fontSize:12,marginBottom:10,whiteSpace:"pre-line" }}>{err}</p>}<button style={{ width:"100%",background:"#3b7ff5",color:"#fff",border:"none",borderRadius:12,padding:"13px 0",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }} onClick={test} disabled={testing}>{testing?"연결 테스트 중...":"🔗 연결하기"}</button></div></div>);}

function LeaveUsageSection({records,leaveStartDate,isAdmin,onUpdate}){const[expanded,setExpanded]=useState(false);const[showAdd,setShowAdd]=useState(false);const[editId,setEditId]=useState(null);const[confirmDeleteId,setConfirmDeleteId]=useState(null);const[form,setForm]=useState({date:today,days:1,note:"",type:"use"});const yr=getCurrentLeaveYear(leaveStartDate);const yrStart=yr?(yr.start.getFullYear()+"-"+String(yr.start.getMonth()+1).padStart(2,"0")+"-"+String(yr.start.getDate()).padStart(2,"0")):"0000-01-01";const yrEnd=yr?(yr.end.getFullYear()+"-"+String(yr.end.getMonth()+1).padStart(2,"0")+"-"+String(yr.end.getDate()).padStart(2,"0")):"9999-12-31";const currYearRecords=records.filter(r=>r.date>=yrStart&&r.date<=yrEnd);const sorted=[...records].sort((a,b)=>b.date.localeCompare(a.date));const openAdd=()=>{setForm({date:today,days:1,note:"",type:"use"});setEditId(null);setShowAdd(true);};const openEdit=(r)=>{setForm({date:r.date,days:r.days,note:r.note||"",type:r.type||"use"});setEditId(r.id);setShowAdd(true);};const save=()=>{if(!form.date||!form.days)return;const next=editId?records.map(r=>r.id===editId?{...r,...form,days:+(form.days)}:r):[...records,{id:uid(),date:form.date,days:+(form.days),note:form.note,type:form.type||"use"}];onUpdate(next);setShowAdd(false);};const del=(id)=>{onUpdate(records.filter(r=>r.id!==id));setConfirmDeleteId(null);};const totalUsed=Math.round(currYearRecords.filter(r=>(r.type||"use")==="use").reduce((s,r)=>s+(+(r.days)||0),0)*100)/100;const totalGrant=Math.round(currYearRecords.filter(r=>r.type==="grant").reduce((s,r)=>s+(+(r.days)||0),0)*100)/100;return(<div style={styles.usageSection}><div style={styles.usageSectionHeader} onClick={()=>setExpanded(p=>!p)}><div style={{ display:"flex",alignItems:"center",gap:8 }}><span style={styles.usageSectionTitle}>📋 연차 사용/지급 기록</span><span style={styles.usageBadge}>사용 {totalUsed}일{totalGrant>0?` · 지급 +${totalGrant}일`:""}</span></div><div style={{ display:"flex",alignItems:"center",gap:8 }}>{i
