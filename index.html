b",color:form.type!=="grant"?"#fff":C.sub,border:"none" }}>➖ 사용</button><button onClick={()=>setForm(f=>({...f,type:"grant"}))} style={{ ...styles.btnSecondary,flex:1,background:form.type==="grant"?"#34c98b":"#f4f6fb",color:form.type==="grant"?"#fff":C.sub,border:"none" }}>➕ 지급</button></div></div><div style={styles.row2}><div style={{ ...styles.field,flex:1 }}><label style={styles.label}>날짜</label><input type="date" style={styles.input} value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div><div style={{ ...styles.field,width:90 }}><label style={styles.label}>일수</label><input type="number" style={styles.input} value={form.days} min={0.5} max={ANNUAL_LEAVE_DAYS} step={0.5} onChange={e=>setForm(f=>({...f,days:e.target.value}))}/></div></div><div style={styles.hoursDisplay}>{+(form.days)||0}일 = {((+(form.days)||0)*HOURS_PER_DAY).toFixed(1)}h</div><div style={styles.field}><label style={styles.label}>사유 (선택)</label><input style={styles.input} value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="예: 여름 휴가, 개인 사유..."/></div><div style={styles.modalFooter}><button style={styles.btnSecondary} onClick={()=>setShowAdd(false)}>취소</button><button style={styles.btnPrimary} onClick={save}>{editId?"수정":"추가"}</button></div></div></div>}</div>);}

function LeaveAccrualSettings({noLeave,setNoLeave,leaveStartDate,setLeaveStartDate,joinDate}){const[useCustom,setUseCustom]=useState(!!(leaveStartDate&&leaveStartDate!==joinDate));return(<div style={styles.leaveSettingBox}><p style={styles.leaveSettingTitle}>🏖️ 연차 적립 설정</p><label style={styles.dinnerCheck}><input type="checkbox" checked={noLeave} onChange={e=>setNoLeave(e.target.checked)} style={{ width:16,height:16,accentColor:"#f77" }}/><span style={{ color:noLeave?"#f77":C.text,fontWeight:noLeave?700:400 }}>연차 적립 없음</span></label>{!noLeave&&(<><label style={{ ...styles.dinnerCheck,marginTop:8 }}><input type="checkbox" checked={useCustom} onChange={e=>{setUseCustom(e.target.checked);if(!e.target.checked)setLeaveStartDate(joinDate);}} style={{ width:16,height:16,accentColor:C.primary }}/><span>입사일과 다른 날짜부터 적립</span></label>{useCustom?<div style={{ ...styles.field,marginTop:8,marginBottom:0 }}><label style={styles.label}>적립 시작일</label><input type="date" style={styles.input} value={leaveStartDate||""} onChange={e=>setLeaveStartDate(e.target.value)}/></div>:<p style={{ margin:"6px 0 0",fontSize:11,color:C.sub }}>입사일({joinDate})부터 자동 적립</p>}</>)}</div>);}

function LeaveTab({user,users,leaves,isAdmin,isSuperAdmin,isViewAdmin,persist,updateLeaveUsage}){const[showForm,setShowForm]=useState(false);const[editTarget,setEditTarget]=useState(null);const[filterUser,setFilterUser]=useState("all");const allEmps=isAdmin?users.filter(u=>u.role==="employee"&&!normLeave(leaves[u.id],u.joinDate).noLeave):(!normLeave(leaves[user.id],user.joinDate).noLeave?[user]:[]);const empList=(isAdmin&&filterUser!=="all")?allEmps.filter(u=>u.id===filterUser):allEmps;return(<div style={styles.page}><div style={styles.pageHeader}><h2 style={styles.pageTitle}>연차 관리</h2>{isAdmin&&!isViewAdmin&&<button style={styles.btnAdd} onClick={()=>{setEditTarget(null);setShowForm(true);}}>{Icon.edit} 수정</button>}</div>{isAdmin&&<div style={styles.filterRow}><select style={styles.filterInput} value={filterUser} onChange={e=>setFilterUser(e.target.value)}><option value="all">전체 직원</option>{allEmps.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></div>}{empList.map(u=>{const lv=normLeave(leaves[u.id],u.joinDate);const yr=getCurrentLeaveYear(lv.leaveStartDate);const yrStart=yr?(yr.start.getFullYear()+"-"+String(yr.start.getMonth()+1).padStart(2,"0")+"-"+String(yr.start.getDate()).padStart(2,"0")):"0000-01-01";const accDays=calcAccruedDays(lv.leaveStartDate);const usedDays=+(lv.usedDays)||0;const grantDays=+(lv.grantDays)||0;const remDays=Math.round((accDays+grantDays-usedDays)*10)/10;const pct=remDays>=0?Math.min(100,(remDays/ANNUAL_LEAVE_DAYS)*100):0;const color=remDays<0?"#c0392b":remDays<4?"#f77":remDays<10?"#ffc347":"#34c98b";return(<div key={u.id} style={styles.leaveCard}><div style={styles.leaveCardTop}><div style={styles.leaveCardLeft}><div style={{ ...styles.logAvatar,width:40,height:40,fontSize:16 }}>{u.name[0]}</div><div><p style={styles.logName}>{u.name}<span style={styles.deptBadge}>{u.dept}</span></p><p style={styles.logContent}>{yr?`${(yr.start.getFullYear()+"-"+String(yr.start.getMonth()+1).padStart(2,"0")+"-"+String(yr.start.getDat function TeamTab({users,leaves,logs,persist,isSuperAdmin,companies}){const[showAdd,setShowAdd]=useState(false);const[editEmp,setEditEmp]=useState(null);const[confirmId,setConfirmId]=useState(null);const[reordering,setReordering]=useState(false);const[showResigned,setShowResigned]=useState(false);const[search,setSearch]=useState("");const emps=users.filter(u=>u.id!=="admin");const activeEmps=emps.filter(u=>!u.resignedDate);const resignedEmps=emps.filter(u=>u.resignedDate);const searchMatch=u=>!search||u.name.includes(search)||u.dept.includes(search);const adminEmps=activeEmps.filter(u=>(u.role==="superadmin"||u.role==="viewadmin")&&searchMatch(u));const staffEmps=activeEmps.filter(u=>u.role==="employee"&&searchMatch(u));const deleteEmp=(id)=>{persist(users.filter(u=>u.id!==id),null,null);setConfirmId(null);};const saveEmp=(updated,leaveData)=>{

    setEditEmp(null);
  };const moveEmp=(id,dir)=>{const idx=users.findIndex(u=>u.id===id);if(idx<0)return;const newIdx=idx+dir;if(newIdx<0||newIdx>=users.length)return;const newUsers=[...users];[newUsers[idx],newUsers[newIdx]]=[newUsers[newIdx],newUsers[idx]];persist(newUsers,null,null);};const resignEmp=(id)=>{const updated=users.map(u=>u.id===id?{...u,resignedDate:today}:u);persist(updated,null,null);setConfirmId(null);};const reinstateEmp=(id)=>{const updated=users.map(u=>u.id===id?{...u,resignedDate:null}:u);persist(updated,null,null);};return(<div style={styles.page}><div style={styles.pageHeader}><h2 style={styles.pageTitle}>직원 관리</h2><div style={{ display:"flex",gap:6 }}>{isSuperAdmin&&<button style={{ ...styles.btnSecondary,fontSize:12,padding:"6px 10px" }} onClick={()=>setReordering(r=>!r)}>{reordering?"✅ 완료":"↕️ 순서변경"}</button>}{isSuperAdmin&&!reordering&&<button style={styles.btnAdd} onClick={()=>setShowAdd(true)}>{Icon.plus} 추가</button>}</div></div><div style={{ marginBottom:12 }}><input style={{ ...styles.input,width:"100%",boxSizing:"border-box" }} placeholder="🔍 이름 또는 부서로 검색..." value={search} onChange={e=>setSearch(e.target.value)}/></div>{[...adminEmps,...staffEmps].map(u=>{const lv=normLeave(leaves[u.id],u.joinDate);const roleLabel=u.role==="superadmin"?"🔑 슈퍼관리자":u.role==="viewadmin"?"👁️ 관리자":null;return(<div key={u.id} style={{ ...styles.empCard,...(roleLabel?{borderLeft:"3px solid #3b7ff5"}:{}) }}><div style={styles.empCardLeft}><div style={{ ...styles.logAvatar,width:44,height:44,fontSize:18,opacity:u.resignedDate?0.5:1 }}>{u.name[0]}</div><div><p style={styles.logName}>{u.name}<span style={styles.deptBadge}>{u.dept}</span>{u.resignedDate&&<span style={{ marginLeft:5,fontSize:10,background:"#f77",color:"#fff",borderRadius:4,padding:"1px 5px" }}>퇴사</span>}</p><p style={styles.logContent}>ID: <strong>{u.id}</strong> &nbsp;|&nbsp; {u.resignedDate?`퇴사: ${u.resignedDate}`:`입사: ${u.joinDate}`}{roleLabel&&<span style={{ marginLeft:6,fontSize:10,color:"#3b7ff5",fontWeight:700 }}>{roleLabel}</span>}</p><div style={{ display:"flex",alignItems:"center",gap:6,marginTop:2 }}>{lv.noLeave&&<span style={styles.noLeaveBadge}>연차 미적용</span>}</div>{u.visa&&u.visa.type&&<p style={{ margin:"2px 0 0",fontSize:10,color:"#1a7a4a",fontWeight:600 }}>🛂 {u.visa.type} {u.visa.from&&`${u.visa.from} ~`} {u.visa.to||""}{u.visa.to&&new Date(u.visa.to)<new Date()&&<span style={{ color:"#f77" }}> (만료)</span>}</p>}</div></div><div style={{ display:"flex",gap:4,flexShrink:0,alignItems:"center" }}>{reordering?<><button style={{ ...styles.iconBtn,fontSize:16 }} onClick={()=>moveEmp(u.id,-1)}>▲</button><button style={{ ...styles.iconBtn,fontSize:16 }} onClick={()=>moveEmp(u.id,1)}>▼</button></>:<>{isSuperAdmin&&!u.resignedDate&&<button style={styles.iconBtn} onClick={()=>{setConfirmId(null);setEditEmp(u);}}>{Icon.edit}</button>}{isSuperAdmin&&(confirmId===`resign_${u.id}`?<div style={styles.confirmInline}><span style={{ fontSize:11,color:"#e67e22" }}>퇴사?</span><button style={styles.confirmYes} onClick={()=>resignEmp(u.id)}>예</button><button style={styles.confirmNo} onClick={()=>setConfirmId(null)}>아니오</button></div>:confirmId===`delete_${u.id}`?<div style={styles.confirmInline}><span style={{ fontSize:11,color:"#f77" }}>삭제?</span><button style={styles.confirmYes} onClick={()=>deleteEmp(u.id)}>예</button><button style={styles.confirmNo} onClick={()=>setConfirmId(null)}>아니오</button></div>:u.resignedDate?<div style={{ display:"flex",gap:4 }}><button style={{ ...styles.btnSecondary,fontSize:11,padding:"4px 8px" }} onClick={()=>reinstateEmp(u.id)}>복직</button><button style={{ ...styles.iconBtn,color:"#f77" }} onClick={()=>{setEditEmp(null);setConfirmId(`delete_${u.id}`);}}>{Icon.trash}</button></div>:<div style={{ display:"flex",gap:4 }}><button style={{ ...styles.iconBtn,color:"#e67e22",fontSize:11,fontWeight:700 }} onClick={()=>{setEditEmp(null);setConfirmId(`resign_${u.id}`);}}>퇴사</button><button style={{ ...styles.iconBtn,color:"#f77" }} onClick={()=>{setEditEmp(null);setConfirmId(`delete_${u.id}`);}}>{Icon.trash}</button></div>)}</>}</div></div>);})} {resignedEmps.length>0&&<div style={{ marginTop:16 }}><button style={{ ...styles.btnSecondary,fontSize:12,width:"100%",marginBottom:showResigned?10:0,background:showResigned?"#fff0f0":undefined,borderColor:"#f77",color:"#c0392b" }} onClick={()=>setShowResigned(v=>!v)}>{showResigned?`▲ 퇴사 직원 숨기기`:`▼ 퇴사 직원 보기 (${resignedEmps.length}명)`}</button>{showResigned&&resignedEmps.map(u=>(<div key={u.id} style={{ ...styles.empCard,opacity:0.7,borderLeft:"3px solid #f77" }}><div style={styles.empCardLeft}><div style={{ ...styles.logAvatar,width:44,height:44,fontSize:18,background:"#eee",color:"#999" }}>{u.name[0]}</div><div><p style={styles.logName}>{u.name}<span style={styles.deptBadge}>{u.dept}</span><span style={{ fontSize:10,background:"#f77",color:"#fff",borderRadius:4,padding:"1px 5px",marginLeft:4 }}>퇴사</span></p><p style={styles.logContent}>퇴사일: {u.resignedDate} &nbsp;|&nbsp; 입사: {u.joinDate}</p></div></div><div style={{ display:"flex",gap:4 }}><button style={{ ...styles.btnSecondary,fontSize:11,padding:"4px 8px" }} onClick={()=>reinstateEmp(u.id)}>복직</button>{confirmId===`delete_${u.id}`?<div style={styles.confirmInline}><span style={{ fontSize:11,color:"#f77" }}>삭제?</span><button style={styles.confirmYes} onClick={()=>deleteEmp(u.id)}>예</button><button style={styles.confirmNo} onClick={()=>setConfirmId(null)}>아니오</button></div>:<button style={{ ...styles.iconBtn,color:"#f77" }} onClick={()=>setConfirmId(`delete_${u.id}`)}>{Icon.trash}</button>}</div></div>))}</div>}{showAdd&&<AddEmpForm onSave={(emp,leaveData)=>{persist([...users,emp],null,{...leaves,[emp.id]:leaveData});setShowAdd(false);}} onClose={()=>setShowAdd(false)}/>}{editEmp&&<EditEmpForm emp={editEmp} leaveData={normLeave(leaves[editEmp.id],editEmp.joinDate)} companies={companies} onSave={saveEmp} onClose={()=>setEditEmp(null)}/>}<DataBackup users={users} leaves={leaves} logs={logs} persist={persist}/></div>);}

// ─── App ───────────────────────────────────────────────────────────────────
function App() {
  const [ready,setReady]=useState(false);
  const [session,setSession]=useState(null);
  const [users,setUsers]=useState(SEED_USERS);
  const [logs,setLogs]=useState([]);
  const [leaves,setLeaves]=useState(SEED_LEAVES);
  const [companies,setCompanies]=useState(SEED_COMPANIES);
  const [tab,setTab]=useState("home");
  const [showChangePw,setShowChangePw]=useState(false);
  const [pwForm,setPwForm]=useState({cur:"",next:"",confirm:""});
  const [pwErr,setPwErr]=useState("");
  const [fbConfigured,setFbConfigured]=useState(false);
  const pollRef=useRef(null);

  const loadFromFb=async()=>{
    const[u,l,lv,co]=await Promise.all([fbGet("users"),fbGet("logs"),fbGet("leaves"),fbGet("companies")]);
    if(u)setUsers(Array.isArray(u)?u:Object.values(u));
    if(l)setLogs(Array.isArray(l)?l:Object.values(l));
    if(lv)setLeaves(lv);
    if(co)setCompanies(Array.isArray(co)?co:Object.values(co));
    return!!(u||l||lv);
  };

  useEffect(()=>{
    (async()=>{
      const fbUrl=getFbUrl();
      if(fbUrl){_fbUrl=fbUrl;setFbConfigured(true);await loadFromFb();pollRef.current=setInterval(loadFromFb,30000);}
      else{const u=await legacyGet("wm_users")||SEED_USERS;const l=await legacyGet("wm_logs")||[];const lv=await legacyGet("wm_leaves")||SEED_LEAVES;setUsers(u);setLogs(l);setLeaves(lv);}
      setSession(await sessionGet());setReady(true);
    })();
    return()=>{if(pollRef.current)clearInterval(pollRef.current);};
  },[]);

  const saveFb=useCallback(async(u,l,lv,co)=>{const base=_fbUrl||getFbUrl();if(!base)return;if(u)fbSet("users",u);if(l)fbSet("logs",l);if(lv)fbSet("leaves",lv);if(co)fbSet("companies",co);},[]);

  const persist=useCallback(async(u,l,lv,co)=>{
    if(u){setUsers(u);saveFb(u,null,null,null);}
    if(l){setLogs(l);saveFb(null,l,null,null);}
    if(lv){setLeaves(lv);saveFb(null,null,lv,null);}
    if(co){setCompanies(co);saveFb(null,null,null,co);}
  },[saveFb]);

  const updateLeaveUsage=useCallback((userId,joinDate,records)=>{
    setLeaves(prev=>{const lv=normLeave(prev[userId]||{},joinDate);const usedDays=Math.round(records.reduce((s,r)=>s+(+(r.days)||0),0)*100)/100;const next={...prev,[userId]:{...lv,usageRecords:records,usedDays}};saveFb(null,null,next);return next;});
  },[saveFb]);

  const login=async(user)=>{await sessionSave(user);setSession(user);setTab("home");};
  const logout=async()=>{await sessionRemove();setSession(null);};

  if(!ready)return(<div style={{ minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f4f6fb" }}><div style={{ textAlign:"center" }}><div style={{ fontSize:40,marginBottom:12 }}>📋</div><p style={{ color:"#3b7ff5",fontWeight:700,fontSize:16 }}>WorkLog 로딩 중...</p></div></div>);
  if(!getFbUrl())return(<FirebaseSetup onDone={async(url)=>{setFbUrl(url);_fbUrl=url;const ok=await loadFromFb();if(!ok){await saveFb(SEED_USERS,[],SEED_LEAVES);}pollRef.current=setInterval(loadFromFb,30000);setFbConfigured(true);}}/>);
  if(!session)return<LoginScreen users={users} onLogin={login}/>;

  const currentUser=users.find(u=>u.id===session.id)||session;
  const isAdmin=currentUser.role==="admin"||currentUser.role==="superadmin"||currentUser.role==="viewadmin";
  const isSuperAdmin=currentUser.role==="admin"||currentUser.role==="superadmin";
  const isViewAdmin=currentUser.role==="viewadmin";

  return(
    <div style={styles.app}>
      <Header user={currentUser} onLogout={logout} onChangePw={()=>{setPwForm({cur:"",next:"",confirm:""});setPwErr("");setShowChangePw(true);}}/>
      <div style={styles.content}>
        {tab==="home"&&<HomeTab user={currentUser} users={users} logs={logs} leaves={leaves} isAdmin={isAdmin}/>}
        {tab==="log"&&<LogTab user={currentUser} users={users} logs={logs} leaves={leaves} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin} isViewAdmin={isViewAdmin} persist={persist}/>}
        {tab==="leave"&&<LeaveTab user={currentUser} users={users} leaves={leaves} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin} isViewAdmin={isViewAdmin} persist={persist} updateLeaveUsage={updateLeaveUsage}/>}
        {isAdmin&&tab==="rate"&&<RateTab users={users} leaves={leaves} persist={persist} isSuperAdmin={isSuperAdmin}/>}
        {isAdmin&&tab==="team"&&<TeamTab users={users} leaves={leaves} logs={logs} persist={persist} isSuperAdmin={isSuperAdmin} companies={companies}/>}
        {tab==="payroll"&&<PayrollTab user={currentUser} users={users} logs={logs} leaves={leaves} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin} persist={persist} companies={companies}/>}
        {isSuperAdmin&&tab==="company"&&<CompanyTab companies={companies} persist={persist}/>}
      </div>
      {showChangePw && (
        <div style={styles.modal}>
          <div style={styles.modalBox}>
            <div style={styles.modalHeader}>
              <h3 style={styles.modalTitle}>🔑 비밀번호 변경</h3>
              <button style={styles.iconBtn} onClick={()=>setShowChangePw(false)}>{Icon.x}</button>
            </div>
            <div style={styles.field}>
              <label style={styles.label}>현재 비밀번호</label>
              <input type="password" style={styles.input} value={pwForm.cur}
                onChange={e=>setPwForm(f=>({...f,cur:e.target.value}))} placeholder="현재 비밀번호"/>
            </div>
            <div style={styles.field}>
              <label style={styles.label}>새 비밀번호</label>
              <input type="password" style={styles.input} value={pwForm.next}
                onChange={e=>setPwForm(f=>({...f,next:e.target.value}))} placeholder="새 비밀번호 (4자 이상)"/>
            </div>
            <div style={styles.field}>
              <label style={styles.label}>새 비밀번호 확인</label>
              <input type="password" style={styles.input} value={pwForm.confirm}
                onChange={e=>setPwForm(f=>({...f,confirm:e.target.value}))} placeholder="다시 입력"/>
            </div>
            {pwErr && <p style={{ color:"#f77",fontSize:13,fontWeight:600,margin:"0 0 12px" }}>⚠️ {pwErr}</p>}
            <div style={styles.modalFooter}>
              <button style={styles.btnSecondary} onClick={()=>setShowChangePw(false)}>취소</button>
              <button style={styles.btnPrimary} onClick={()=>{
                if(pwForm.cur !== currentUser.pw){setPwErr("현재 비밀번호가 틀렸어요.");return;}
                if(pwForm.next.length < 4){setPwErr("새 비밀번호는 4자 이상이어야 해요.");return;}
                if(pwForm.next !== pwForm.confirm){setPwErr("새 비밀번호가 일치하지 않아요.");return;}
                persist(users.map(u=>u.id===currentUser.id?{...u,pw:pwForm.next}:u),null,null);
                sessionSave({...currentUser,pw:pwForm.next});
                setShowChangePw(false);
                alert("✅ 비밀번호가 변경됐어요!");
              }}>변경</button>
            </div>
          </div>
        </div>
      )}
      <BottomNav tab={tab} setTab={setTab} isAdmin={isAdmin} userHasLeave={isAdmin||!normLeave(leaves[currentUser.id],currentUser.joinDate).noLeave} user={currentUser} logs={logs}/>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){if(this.state.err)return React.createElement("pre",{style:{color:"red",padding:"20px",fontSize:"11px",whiteSpace:"pre-wrap"}},"렌더 오류: "+this.state.err.message+"\n"+(this.state.err.stack||""));return this.props.children;}
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary,null,React.createElement(App)));

</script>
<script>
var attempts = 0;
function runApp() {
  attempts++;
  if (attempts > 30) { document.getElementById("loadmsg").style.color="red"; document.getElementById("loadmsg").textContent="로딩 실패"; return; }
  if (typeof Babel === "undefined") { setTimeout(runApp, 1000); return; }
  try {
    var src = document.getElementById("src").textContent;
    var out = Babel.transform(src, { presets: ["react"] });
    eval(out.code);
    document.getElementById("loading").style.display = "none";
    document.getElementById("root").style.display = "block";
  } catch(e) {
    document.getElementById("loadmsg").style.color = "red";
    document.getElementById("loadmsg").textContent = "오류: " + e.message;
    console.error(e);
  }
}
window.onload = function() { setTimeout(runApp, 500); };
</script></body></html>
