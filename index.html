function calcVisaDays(from, to) {
  if (!from) return 0;
  const fromD = new Date(from + "T00:00:00");
  let toStr = to || today;
  let toD = new Date(toStr + "T00:00:00");
  // 금요일 종료면 일요일까지 연장
  if (to && toD.getDay() === 5) { toD.setDate(toD.getDate() + 2); }
  const diffMs = toD - fromD;
  return Math.max(0, Math.floor(diffMs / (1000*60*60*24)) + 1);
}

function calcAnnualTaxResident(annual){
  // 일반 거주자: ATO 기본 구간세율만 적용
  if(annual<=18200) return 0;
  if(annual<=45000) return (annual-18200)*0.19;
  if(annual<=120000) return 5092+(annual-45000)*0.325;
  if(annual<=180000) return 29467+(annual-120000)*0.37;
  return 51667+(annual-180000)*0.45;
}
function calcAnnualTaxWHV(annual){
  // WHV (417/462/WHV1-3): 15% 고정율로 원천징수
  if(annual<=45000) return annual*0.15;
  if(annual<=120000) return 6750+(annual-45000)*0.325;
  if(annual<=180000) return 31125+(annual-120000)*0.37;
  return 53325+(annual-180000)*0.45;
}
function calcFortnightlyTax(gross, visaType){
  const isWHV = visaType && (visaType.startsWith('WHV') || visaType==='417' || visaType==='462');

}

    const allDeductionsTotal = totalDeductions + savedDedTotal;
    const variable = (w.isContractor && !w.hasFlatPay)
      ? 0
      : w.hasFlatPay
      ? w.gross - w.fixedTotal - allDeductionsTotal
      : w.excessPartH * w.partHourlyRate
      + w.excessOtH   * w.otHourlyRate
      - w.deficitH    * w.partHourlyRate
      + w.travel
      - allDeductionsTotal;
    const cashInput = parseFloat(partialCash) || 0;
    const directKeepInput = parseFloat(directKeep) || 0;
    // skipVariable=true면 변동분 무시하고 directKeep만 반영
    const cashAmt = (variable < 0 || skipVariable) ? 0 : Math.min(cashInput, Math.max(0, variable));
    const keepAmt = skipVariable
      ? directKeepInput              // 변동분 제외: 직접입력만
      : variable < 0
      ? variable + directKeepInput   // 변동분(음수) + 직접입력
      : Math.max(0, variable) - cashAmt;
    // 기존 킵잔액에 누적 추가 - 현재 조회 기간 기준 잔액 + 당기 입금
    const prevKeep = getKeepBalanceAtPeriod(userId, periodStart) + getPeriodDeposits(userId, periodStart);
    const newKeep  = prevKeep + keepAmt;
    // keepBalance 히스토리 저장 (기간별 잔액 추적)
    const histEntry = { periodStart, balance: newKeep, savedAt: new Date().toISOString() };
    const prevHist = lv.keepBalanceHistory || [];
    // 같은 기간 이미 있으면 덮어쓰기
    const filtered = prevHist.filter(h => h.periodStart !== periodStart);
    const newHist = [...filtered, histEntry].sort((a,b) => a.periodStart.localeCompare(b.periodStart));
    // 가장 마지막 기간의 balance가 전체 keepBalance
    const latestBalance = newHist.length > 0 ? newHist[newHist.length-1].balance : newKeep;
    persist(null, null, { ...leaves, [userId]: {
      ...lv,
      keepBalance: latestBalance,
      keepBalanceHistory: newHist,
    }});
    alert(`정산 완료!
킵 잔액: $${newKeep.toFixed(2)}${cashAmt > 0 ? `
캐시 출금: $${(cashAmt * 0.75).toFixed(2)}` : ""}`);
  };

  const saveReqDays = (userId, val) => {
    const lv = leaves[userId] || {};
    persist(null, null, { ...leaves, [userId]: { ...lv, reqDays: parseInt(val) || 8 } });
  };
  const saveReqExtraHours = (userId, val) => {
    const lv = leaves[userId] || {};
    persist(null, null, { ...leaves, [userId]: { ...lv, reqExtraHours: parseFloat(val) || 0 } });
  };

  const fD = (s) => { const d = new Date(s+"T00:00:00"); return (d.getMonth()+1)+"/"+d.getDate(); };
  const fA = (n) => new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",minimumFractionDigits:2}).format(n);

  const wage = selId ? calcWage(selId) : null;
  const carry = selId ? getCarryover(selId) : null;

  // 현재 급여 구간
  const getWP = (offset=0) => {
    const BASE = new Date("2026-04-13T00:00:00");
    const cur = Math.floor((Date.now()-BASE)/(14*24*60*60*1000));
    const s = new Date(BASE); s.setDate(s.getDate()+(cur+offset)*14);
    const e = new Date(s); e.setDate(e.getDate()+13);
    return {start:s.getFullYear()+"-"+String(s.getMonth()+1).padStart(2,"0")+"-"+String(s.getDate()).padStart(2,"0"), end:e.getFullYear()+"-"+String(e.getMonth()+1).padStart(2,"0")+"-"+String(e.getDate()).padStart(2,"0")};
  };
  // periodStart로부터 구간 종료일 계산 (로컬 날짜 기준)
  const wpStart = periodStart;
  const wpEnd = (() => {
    const d = new Date(periodStart+"T00:00:00"); d.setDate(d.getDate()+13);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  })();

  // 새 공제 항목의 기본 날짜 = 오늘 (단, 현재 보고있는 기간 밖이면 wpStart 로 폴백)
  const _defaultDedDate = () => (today >= wpStart && today <= wpEnd) ? today : wpStart;
  const addDeduction = () => setDeductions(d => [...d, { id: Date.now(), desc: "", amount: "", date: _defaultDedDate() }]);
  const updateDeduction = (id, field, val) => setDeductions(d => d.map(x => x.id === id ? { ...x, [field]: val } : x));
  const removeDeduction = (id) => setDeductions(d => d.filter(x => x.id !== id));
  const totalDeductions = deductions.reduce((s, d) => s + (parseFloat(d.amount) || 0), 0);

  // Firebase 저장 디덕션 (날짜 기반 필터)
  // 전체 savedDeductions (기간 무관) - 정산 계산용
  const getAllSavedDeductions = (userId) => {
    const all = (leaves[userId] || {}).savedDeductions || [];
    return Array.isArray(all) ? all : Object.values(all);
  };

  const getSavedDeductions = (userId) => {
    const all = (leaves[userId] || {}).savedDeductions || [];
    const arr = Array.isArray(all) ? all : Object.values(all);
    // 날짜 오름차순 정렬 (옛것 먼저). 같은 날짜면 입력 순.
    return arr.filter(d => d.date >= wpStart && d.date <= wpEnd)
              .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  };
  const savedTotal = (userId) => getSavedDeductions(userId).reduce((s,d) => s + (parseFloat(d.amount)||0), 0);
  const addSavedDeductions = (entries) => {
    // entries: [{userId, entry}] 배열을 한 번에 저장
    // 정산완료 잠금 체크 (각 entry의 date 기준)
    for (const {userId, entry} of entries) {
      const lockInfo = isLogLocked(userId, entry.date, leaves);
      if (lockInfo && !isAdmin) {
        alert(`🔒 ${lockInfo.periodStart} 기간은 정산완료되어 공제 항목을 추가할 수 없어요.`);
        return;
      }
      if (lockInfo && isAdmin && !confirm(`⚠️ ${lockInfo.periodStart} 기간은 정산완료된 기간이에요.\n공제 항목(${entry.date})을 추가할까요?`)) return;
    }
    const newLeaves = {...leaves};
    entries.forEach(({userId, entry}) => {
      const lv = newLeaves[userId] || {};
      newLeaves[userId] = {...lv, savedDeductions: [...(Array.isArray(lv.savedDeductions)?lv.savedDeductions:Object.values(lv.savedDeductions||{})), entry]};
    });
    persist(null, null, newLeaves);
  };
  const addSavedDeduction = (userId, entry) => addSavedDeductions([{userId, entry}]);
  const removeSavedDeduction = (userId, id) => {
    const lv = leaves[userId] || {};
    const allDeds = Array.isArray(lv.savedDeductions)?lv.savedDeductions:Object.values(lv.savedDeductions||{});
    const target = allDeds.find(d => d.id === id);
    if (target) {
      const lockInfo = isLogLocked(userId, target.date, leaves);
      if (lockInfo && !isAdmin) {
        alert(`🔒 ${lockInfo.periodStart} 기간은 정산완료되어 공제 항목을 삭제할 수 없어요.`);
        return;
      }
      if (lockInfo && isAdmin && !confirm(`⚠️ ${lockInfo.periodStart} 기간은 정산완료된 기간이에요.\n공제 항목을 삭제할까요?`)) return;
    }
    const all = allDeds.filter(d => d.id !== id);
    persist(null, null, {...leaves, [userId]: {...lv, savedDeductions: all}});
  };

  // 저장된 공제 항목 한 필드 수정 (수퍼관리자 전용 — 호출부에서 isSuperAdmin 체크)
  const updateSavedDeduction = (userId, id, field, newVal) => {
    const lv = leaves[userId] || {};
    const allDeds = Array.isArray(lv.savedDeductions)?lv.savedDeductions:Object.values(lv.savedDeductions||{});
    const target = allDeds.find(d => d.id === id);
    if (!target) return;
    const lockInfo = isLogLocked(userId, target.date, leaves);
    if (lockInfo && !isAdmin) {
      alert(`🔒 ${lockInfo.periodStart} 기간은 정산완료되어 공제 항목을 수정할 수 없어요.`);
      return;
    }
    if (lockInfo && isAdmin && !confirm(`⚠️ ${lockInfo.periodStart} 기간은 정산완료된 기간이에요.\n공제 항목을 수정할까요?`)) return;
    const updated = allDeds.map(d => d.id === id ? {...d, [field]: newVal} : d);
    persist(null, null, {...leaves, [userId]: {...lv, savedDeductions: updated}});
  };

  const prevPeriod = () => { const d = new Date(periodStart+"T00:00:00"); d.setDate(d.getDate()-14); setPeriodStart(localDateStr(d)); };
  const nextPeriod = () => { const d = new Date(periodStart+"T00:00:00"); d.setDate(d.getDate()+14); setPeriodStart(localDateStr(d)); };

  const S = {
    chip: (active, color) => ({ display:"flex",alignItems:"center",gap:6, background:active?color:"#fff", color:active?"#fff":"#444", border:"1.5px solid "+(active?color:"#E5E7EB"), borderRadius:20,padding:"6px 12px",fontSize:13,fontWeight:600,cursor:"pointer",transition:"all .15s",fontFamily:"inherit" }),
    statBox: (color) => ({ background:color+"15",border:"1px solid "+color+"30",borderRadius:12,padding:"12px 14px" }),
    sectionTitle: { margin:"0 0 10px",fontSize:11,fontWeight:700,color:C.sub,textTransform:"uppercase",letterSpacing:0.8 },
    row: { display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8 },
    subTab: (active, color) => ({ flex:1,padding:"9px 0",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit", background:active?color:"transparent",color:active?"#fff":"#888",transition:"all .15s" }),
  };

  return (
    <div style={styles.page}>
      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16 }}>
        <h2 style={{ ...styles.pageTitle,margin:0 }}>💰 급여 관리</h2>
        <span style={{ fontSize:11,color:"#fff",background:C.primary,padding:"3px 10px",borderRadius:20,fontWeight:600 }}>격주 정산</span>
      </div>

      {/* Period picker */}
      <div style={{ background:"#fff",borderRadius:14,padding:"12px 14px",marginBottom:12,boxShadow:"0 1px 4px #0000000a" }}>
        <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10 }}>
          <button onClick={prevPeriod} style={{ background:"#F3F4F6",border:"none",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:18,color:"#555",fontFamily:"inherit" }}>‹</button>
          <div style={{ textAlign:"center",cursor:"pointer" }} onClick={()=>{
            const BASE=new Date("2026-04-13T00:00:00");
            const diff=Math.floor((Date.now()-BASE)/(14*24*60*60*1000));
            const d=new Date(BASE); d.setDate(d.getDate()+diff*14);
            setPeriodStart(localDateStr(d));
          }}>
            <p style={{ margin:0,fontSize:14,fontWeight:800,color:C.text }}>{fD(periodStart)} ~ {fD(periodEnd)}</p>
            <p style={{ margin:"2px 0 0",fontSize:11,color:C.sub }}>
              {(() => {
                const BASE=new Date("2026-04-13T00:00:00");
                const diff=Math.floor((Date.now()-BASE)/(14*24*60*60*1000));
                const curS=new Date(BASE); curS.setDate(curS.getDate()+diff*14);
                return localDateStr(curS)===periodStart ? "✅ 현재 구간" : "현재 구간 보기";
              })()}
            </p>
          </div>
          <button onClick={nextPeriod} style={{ background:"#F3F4F6",border:"none",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:18,color:"#555",fontFamily:"inherit" }}>›</button>
        </div>
        <input type="date" value={periodStart} onChange={e => setPeriodStart(e.target.value)}
          style={{ ...styles.input, fontSize:12,padding:"6px 10px" }} />
      </div>

      {/* Employee chips (admin) */}
      {isAdmin && (
        <div style={{ marginBottom:12 }}>
          {isAdmin && (<>
          <div style={{ display:"flex",gap:8,marginBottom:12 }}>
            <button onClick={() => setSubView(subView==="summary" ? "calc" : "summary")}
              style={{ flex:1,padding:"11px 0",borderRadius:12,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700,
                background:subView==="summary"?"#111":"#F3F4F6",
                color:subView==="summary"?"#fff":"#555" }}>
              📋 정산 요약 {subView==="summary"?"▲":"▼"}
            </button>
            <button onClick={() => setSubView(subView==="deduct" ? "calc" : "deduct")}
              style={{ flex:1,padding:"11px 0",borderRadius:12,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700,
                background:subView==="deduct"?"#111":"#F3F4F6",
                color:subView==="deduct"?"#fff":"#555" }}>
              💳 공제 항목 관리 {subView==="deduct"?"▲":"▼"}
            </button>
          </div>
          {subView === "summary" && isAdmin && (
            <SummarySection users={users} leaves={leaves} periodStart={periodStart} calcWage={calcWage} getSavedDeductions={getSavedDeductions} getKeepBalance={getKeepBalance} getKeepBalanceAtPeriod={getKeepBalanceAtPeriod} getPeriodDeposits={getPeriodDeposits} EMP_COLORS={EMP_COLORS} fA={fA} C={C} selId={selId} setSelId={setSelId} setSubView={setSubView}/>
          )}
          {subView === "deduct" && (
            <DeductTab users={users.filter(u=>!u.resignedDate&&u.role==="employee")}
              leaves={leaves} wpStart={wpStart} wpEnd={wpEnd}
              persist={persist}
              removeSavedDeduction={removeSavedDeduction}
              getSavedDeductions={getSavedDeductions} />
          )}
        </>)}
        <p style={{ fontSize:11,fontWeight:700,color:C.sub,margin:"0 0 8px",textTransform:"uppercase",letterSpacing:1 }}>직원 선택</p>
          <div style={{ display:"flex",gap:6,flexWrap:"wrap" }}>
            {emps.map((e, i) => {
              const color = EMP_COLORS[i % EMP_COLORS.length];
              const pLogs = getPeriodLogs(e.id);

              return (
                <button key={e.id} onClick={() => { setSelId(e.id); setSubView("calc"); setDeductions([]); setPartialCash(""); setDirectKeep(""); setSkipVariable(false); }} style={S.chip(selId === e.id, color)}>
                  <span style={{ width:20,height:20,borderRadius:"50%",background:selId===e.id?"rgba(255,255,255,.3)":color,color:"#fff",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700 }}>{e.name[0]}</span>
                  {e.name}
                  {getKeepBalance(e.id) !== 0 && (!(leaves[e.id]||{}).noLeave || (leaves[e.id]||{}).hasFlatPay) && <span style={{ fontSize:10,background:"rgba(16,185,129,.25)",color:selId===e.id?"#fff":"#059669",borderRadius:8,padding:"1px 5px" }}>킵{getKeepBalance(e.id)>999?"+":""}</span>}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* No selection */}
      {!selEmp && (
        <div style={{ background:"#fff",borderRadius:16,padding:40,textAlign:"center",boxShadow:"0 1px 4px #0000000a" }}>
          <div style={{ fontSize:36,marginBottom:8 }}>👆</div>
          <p style={{ fontSize:14,margin:0,color:"#aaa",lineHeight:1.6 }}>직원을 선택하면<br/>급여를 계산할 수 있어요</p>
        </div>
      )}

      {/* Selected employee */}
      {selEmp && (<>

        {/* Employee card */}
        <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,borderLeft:"4px solid "+selColor,boxShadow:"0 1px 4px #0000000a" }}>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center" }}>
            <div style={{ display:"flex",alignItems:"center",gap:10 }}>
              <div style={{ ...styles.logAvatar,background:selColor }}>{selEmp.name[0]}</div>
              <div>
                <p style={{ margin:0,fontSize:15,fontWeight:700,color:C.text }}>{selEmp.name}</p>
                <p style={{ margin:"2px 0 0",fontSize:12,color:C.sub }}>{selEmp.dept}</p>
              </div>
            </div>
            <div style={{ textAlign:"right" }}>
              {wage && (wage.dailyRate > 0 || wage.hasFlatPay) ? (<>
                <p style={{ margin:0,fontSize:14,fontWeight:700,color:C.text }}>{fA(wage.dailyRate)}<span style={{ fontSize:11,color:C.sub,fontWeight:400 }}>/일</span></p>
                {!wage.isContractor && <p style={{ margin:"2px 0 0",fontSize:11,color:C.sub }}>기준 {wage.reqDays}일 {wage.reqExtraHours>0?`${wage.reqExtraHours}h`:""}</p>}
                {wage.isContractor && !wage.hasFlatPay && <p style={{ margin:"2px 0 0",fontSize:11,color:C.sub }}>인보이스</p>}
                {wage.hasFlatPay && <p style={{ margin:"2px 0 0",fontSize:11,color:C.sub }}>킵 관리</p>}
              </>) : <p style={{ margin:0,fontSize:12,color:"#f77" }}>일급 미설정</p>}
            </div>
          </div>

        </div>

        {/* Sub-tabs */}
        <div style={{ display:"flex",background:"#fff",borderRadius:12,padding:4,gap:2,marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
          {[["calc","📊 급여 계산"],["log","📋 근무 내역"],...(isAdmin ? [["settings","⚙️ 설정"]] : [])].map(([v, label]) => (
            <button key={v} onClick={() => setSubView(v)} style={S.subTab(subView===v, selColor)}>{label}</button>
          ))}
        </div>

        {/* ── CALC VIEW ── */}
        {subView === "calc" && (<>
          {(!wage || wage.dailyRate === 0) && (
            <div style={{ background:"#fff",borderRadius:14,padding:24,textAlign:"center",boxShadow:"0 1px 4px #0000000a" }}>
              <p style={{ fontSize:14,color:"#f77",margin:"0 0 12px" }}>⚠️ 일급이 설정되지 않았어요</p>
              {isAdmin && <button onClick={() => setSubView("settings")} style={{ ...styles.btnAdd,margin:"0 auto" }}>⚙️ 설정하기</button>}
            </div>
          )}
          {wage && (wage.dailyRate > 0 || wage.hasFlatPay) && (<>

            {/* Work summary grid */}
            <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
              <p style={S.sectionTitle}>📋 근무 요약 ({auD(periodStart)} ~ {auD(periodEnd)})</p>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12 }}>
                {[
                  ["✅","Full Days", wage.stats.fullDays+"일","#10B981"],
                  ["⏰","Overtime", fmt(wage.stats.otHours)+"h","#F59E0B"],
                  ["🕐","Part Time", fmt(wage.stats.partHours)+"h","#8B5CF6"],
                  ["🚗","Travel", fA(wage.stats.travelTotal),"#3B82F6"],
                  ...(wage.leaveHoursInPeriod > 0 ? [["🏖️","연차", (wage.leaveHoursInPeriod/9).toFixed(1)+"일","#F59E0B"]] : []),
                ].map(([emoji, label, val, color]) => (
                  <div key={label} style={S.statBox(color)}>
                    <div style={{ display:"flex",alignItems:"center",gap:5,marginBottom:6 }}>
                      <span style={{ fontSize:14 }}>{emoji}</span>
                      <span style={{ fontSize:11,color:C.sub,fontWeight:600 }}>{label}</span>
                    </div>
                    <span style={{ fontSize:17,fontWeight:800,color }}>{val}</span>
                  </div>
                ))}
              </div>
              {/* 연차 사용 내역 */}
              {!wage.isContractor && wage.leaveHoursInPeriod > 0 && (() => {
                const pE2s = new Date(periodStart+"T00:00:00"); pE2s.setDate(pE2s.getDate()+13);
                const pe2s = pE2s.getFullYear()+"-"+String(pE2s.getMonth()+1).padStart(2,"0")+"-"+String(pE2s.getDate()).padStart(2,"0");
                const recs2 = ((leaves[selId]||{}).usageRecords||[]).filter(r=>r.date>=periodStart&&r.date<=pe2s);
                if (!recs2.length) return null;
                return (
                  <div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,padding:"10px 14px",marginTop:10}}>
                    <p style={{margin:"0 0 8px",fontSize:11,fontWeight:700,color:"#92400E"}}>🏖️ 이번 구간 연차 내역</p>
                    {recs2.map(r=>(
                      <div key={r.id||r.date} style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                        <span style={{color:"#555"}}>{auD(r.date)}{r.note?" · "+r.note:""}</span>
                        <span style={{fontWeight:700,color:"#F59E0B"}}>{r.days}일 ({r.days*9}h) → 풀타임</span>
                      </div>
                    ))}
                  </div>
                );
              })()}
              {/* Hours progress */}
              <div style={{ background:"#F9FAFB",borderRadius:10,padding:"10px 12px" }}>
                {wage.isContractor && (
                <div style={S.card}>
                  <p style={S.sectionTitle}>💵 Gross</p>
                  {(() => {
                    const lv0 = leaves[selId]||{};
                    const splitPay = !!(lv0.contractorInfo?.splitPay);
                    const gstReg = !!(lv0.contractorInfo?.gstRegistered);
                    const fullAmt = wage.stats.fullDays * wage.dailyRate;
                    if (splitPay && wage.stats.fullDays > 0) {
                      const cash = fullAmt / 2;
                      // ABN = 풀타임 절반 + 파트 + OT + 트래블 전부
                      const abnBase = fullAmt / 2
                        + (wage.stats.partHours||0) * wage.partHourlyRate
                        + (wage.stats.otHours||0) * wage.otHourlyRate
                        + (wage.travel||0);
                      const gst = gstReg ? abnBase * 0.1 : 0;
                      const total = cash + abnBase + gst;
                      return (
                        <div style={{ background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8,padding:"10px 12px",marginBottom:6 }}>
                          <p style={{ margin:"0 0 8px",fontSize:11,fontWeight:700,color:"#166534" }}>분할 지급 내역</p>
                          <div style={S.row}><span style={{ fontSize:12,color:"#555" }}>💵 캐시 (풀타임 절반)</span><span style={{ fontSize:13,fontWeight:700,color:"#10B981" }}>{fA(cash)}</span></div>
                          <div style={{ borderTop:"1px dashed #BBF7D0",margin:"6px 0" }}/>
                          <p style={{ margin:"0 0 4px",fontSize:11,color:"#888" }}>🧾 ABN 합산</p>
                          <div style={S.row}><span style={{ fontSize:12,color:"#777" }}>풀타임 절반</span><span style={{ fontSize:12,color:"#3B82F6" }}>{fA(fullAmt/2)}</span></div>
                          {(wage.stats.partHours||0)>0&&<div style={S.row}><span style={{ fontSize:12,color:"#777" }}>파트 ({(wage.stats.partHours||0).toFixed(1)}h)</span><span style={{ fontSize:12,color:"#3B82F6" }}>{fA((wage.stats.partHours||0)*wage.partHourlyRate)}</span></div>}
                          {(wage.stats.otHours||0)>0&&<div style={S.row}><span style={{ fontSize:12,color:"#777" }}>OT ({(wage.stats.otHours||0).toFixed(1)}h)</span><span style={{ fontSize:12,color:"#3B82F6" }}>{fA((wage.stats.otHours||0)*wage.otHourlyRate)}</span></div>}
                          {(wage.travel||0)>0&&<div style={S.row}><span style={{ fontSize:12,color:"#777" }}>트래블</span><span style={{ fontSize:12,color:"#3B82F6" }}>{fA(wage.travel||0)}</span></div>}
                          {gstReg&&<div style={S.row}><span style={{ fontSize:12,color:"#777" }}>+ GST 10%</span><span style={{ fontSize:12,color:"#F59E0B" }}>+{fA(gst)}</span></div>}
                          <div style={{ borderTop:"1px solid #BBF7D0",marginTop:4,paddingTop:6,...S.row }}>
                            <span style={{ fontSize:12,fontWeight:700,color:"#166534" }}>ABN 합계</span>
                            <span style={{ fontSize:13,fontWeight:800,color:"#3B82F6" }}>{fA(abnBase+gst)}</span>
                          </div>
                          <div style={{ borderTop:"2px solid #166534",marginTop:8,paddingTop:8,...S.row }}>
                            <span style={{ fontSize:14,fontWeight:800,color:"#166534" }}>총 합계</span>
                            <span style={{ fontSize:16,fontWeight:900,color:"#166534" }}>{fA(total)}</span>
                          </div>
                        </div>
                      );
                    }
                    return <div style={S.row}><span style={{ fontSize:13,color:C.text }}>Full ({wage.stats.fullDays}일)</span><span style={{ fontSize:13,fontWeight:700,color:C.primary }}>{fA(fullAmt)}</span></div>;
                  })()}
                  {wage.stats.partHours>0&&<div style={S.row}><span style={{ fontSize:13,color:C.text }}>Part ({wage.stats.partHours.toFixed(1)}h)</span><span style={{ fontSize:13,fontWeight:700,color:C.primary }}>{fA(wage.stats.partHours*wage.partHourlyRate)}</span></div>}
                  {wage.stats.otHours>0&&<div style={S.row}><span style={{ fontSize:13,color:C.text }}>OT ({wage.stats.otHours.toFixed(1)}h)</span><span style={{ fontSize:13,fontWeight:700,color:C.primary }}>{fA(wage.stats.otHours*wage.otHourlyRate)}</span></div>}
                  {wage.travel>0&&<div style={S.row}><span style={{ fontSize:13,color:C.text }}>Travel</span><span style={{ fontSize:13,fontWeight:700,color:C.primary }}>{fA(wage.travel)}</span></div>}
                  <div style={{ height:1,background:"#F0F0F0",margin:"8px 0" }}/>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center" }}><span style={{ fontSize:15,fontWeight:700 }}>Gross</span>
                    <span style={{ fontSize:20,fontWeight:900 }}>
                      {(() => {
                        const lv0 = leaves[selId]||{};
                        const sp = !!(lv0.contractorInfo?.splitPay);
                        const gr = !!(lv0.contractorInfo?.gstRegistered);
                        if (sp && gr) {
                          const gst = (wage.stats.fullDays * wage.dailyRate / 2) * 0.1;
                          return fA(wage.gross + gst);
                        }
                        return fA(wage.gross);
                      })()}
                    </span></div>
                  {(savedTotal(selId) + totalDeductions) > 0 && (<>
                    <div style={{ height:1,background:"#F0F0F0",margin:"8px 0" }}/>
                    {getSavedDeductions(selId).map(d=>(
                      <div key={d.id} style={{ display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4 }}>
                        <span style={{ color:"#555" }}>공제 · {d.desc}</span>
                        <span style={{ fontWeight:700,color:"#EF4444" }}>-{fA(d.amount)}</span>
                      </div>
                    ))}
                    {deductions.filter(d=>d.desc&&parseFloat(d.amount)>0).map(d=>(
                      <div key={d.id} style={{ display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4,opacity:0.6 }}>
                        <span style={{ color:"#555" }}>공제 · {d.desc} <span style={{fontSize:10,color:"#f59e0b"}}>(미저장)</span></span>
                        <span style={{ fontWeight:700,color:"#EF4444" }}>-{fA(parseFloat(d.amount))}</span>
                      </div>
                    ))}
                    <div style={{ height:1,background:"#F0F0F0",margin:"8px 0" }}/>
                    <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center" }}>
                      <span style={{ fontSize:15,fontWeight:700 }}>실 청구금액</span>
                      <span style={{ fontSize:20,fontWeight:900,color:"#10B981" }}>{fA(wage.gross - savedTotal(selId) - totalDeductions)}</span>
                    </div>
                  </>)}
                </div>
              )}
              {!wage.isContractor && (<>
                {/* ── 근무 vs 기준 비교 ── */}
                <div style={{ display:"flex",gap:8,marginBottom:10 }}>
                  {/* 실제 */}
                  <div style={{ flex:1,background:"#F0FDF4",borderRadius:10,padding:"10px 12px",textAlign:"center" }}>
                    <p style={{ margin:"0 0 2px",fontSize:10,color:"#166534",fontWeight:600,textTransform:"uppercase",letterSpacing:.5 }}>실제 근무</p>
                    <p style={{ margin:0,fontSize:20,fontWeight:900,color:"#10B981" }}>{wage.workedH.toFixed(1)}<span style={{ fontSize:12,fontWeight:500 }}>h</span></p>
                  </div>
                  {/* 기준 */}
                  <div style={{ flex:1,background:"#EFF6FF",borderRadius:10,padding:"10px 12px",textAlign:"center" }}>
                    <p style={{ margin:"0 0 2px",fontSize:10,color:"#1D4ED8",fontWeight:600,textTransform:"uppercase",letterSpacing:.5 }}>기준 ({wage.reqDays}일{wage.reqExtraHours>0?` ${wage.reqExtraHours}h`:""})</p>
                    <p style={{ margin:0,fontSize:20,fontWeight:900,color:"#3B82F6" }}>{wage.reqH}<span style={{ fontSize:12,fontWeight:500 }}>h</span></p>
                  </div>
                  {/* 차이 */}
                  <div style={{ flex:1,background:wage.diffH>=0?"#F0FDF4":"#FEF2F2",borderRadius:10,padding:"10px 12px",textAlign:"center",border:`1.5px solid ${wage.diffH>=0?"#BBF7D0":"#FECACA"}` }}>
                    <p style={{ margin:"0 0 2px",fontSize:10,color:wage.diffH>=0?"#166534":"#DC2626",fontWeight:600,textTransform:"uppercase",letterSpacing:.5 }}>차이</p>
                    {(() => {
                    const absH = Math.abs(wage.diffH);
                    const sign = wage.diffH >= 0 ? "+" : "-";
                    const days = Math.floor(absH / 9);
                    const hrs  = Math.round((absH % 9) * 10) / 10;
                    return (<>
                      <p style={{ margin:0,fontSize:20,fontWeight:900,color:wage.diffH>=0?"#10B981":"#EF4444" }}>
                        {sign}{absH.toFixed(1)}<span style={{ fontSize:12,fontWeight:500 }}>h</span>
                      </p>
                      <p style={{ margin:0,fontSize:10,color:wage.diffH>=0?"#166534":"#DC2626",fontWeight:600 }}>
                        {sign}{days>0?`${days}일 `:""}{hrs>0?`${hrs}h`:""}{days===0&&hrs===0?"0h":""}
                      </p>
                    </>);
                  })()}
                  </div>
                </div>

                {/* 초과/부족 금액 내역 */}
                {(wage.excessPartH > 0 || wage.excessOtH > 0 || wage.deficitH > 0) && (
                  <div style={{ background:wage.diffH>=0?"#F0FDF4":"#FEF2F2",borderRadius:10,padding:"8px 12px" }}>
                    {wage.excessPartH > 0 && (
                      <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:2 }}>
                        <span style={{ color:"#555" }}>초과 파트 {wage.excessPartH.toFixed(1)}h</span>
                        <span style={{ fontWeight:700,color:"#10B981" }}>+{fA(wage.excessPartH*wage.partHourlyRate)}</span>
                      </div>
                    )}
                    {wage.excessOtH > 0 && (
                      <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:2 }}>
                        <span style={{ color:"#555" }}>초과 OT {wage.excessOtH.toFixed(1)}h</span>
                        <span style={{ fontWeight:700,color:"#10B981" }}>+{fA(wage.excessOtH*wage.otHourlyRate)}</span>
                      </div>
                    )}
                    {wage.deficitH > 0 && (
                      <div style={{ display:"flex",justifyContent:"space-between",fontSize:12 }}>
                        <span style={{ color:"#555" }}>부족 {wage.deficitH.toFixed(1)}h</span>
                        <span style={{ fontWeight:700,color:"#EF4444" }}>-{fA(wage.deficitH*wage.partHourlyRate)}</span>
                      </div>
                    )}
                    {getSavedDeductions(selId).map(d => (
                      <div key={d.id} style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginTop:2 }}>
                        <span style={{ color:"#555" }}>{auD(d.date)} · {d.desc}</span>
                        <span style={{ fontWeight:700,color:parseFloat(d.amount)<0?"#10B981":"#EF4444" }}>{parseFloat(d.amount)<0?"+":"-"}{fA(Math.abs(parseFloat(d.amount)))}</span>
                      </div>
                    ))}
                    {deductions.filter(d=>d.desc&&parseFloat(d.amount)>0).map(d => (
                      <div key={d.id} style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginTop:2,opacity:0.6 }}>
                        <span style={{ color:"#555" }}>{d.desc} <span style={{fontSize:10,color:"#f59e0b"}}>(미저장)</span></span>
                        <span style={{ fontWeight:700,color:"#EF4444" }}>-{fA(parseFloat(d.amount))}</span>
                      </div>
                    ))}
                  </div>
                )}
                </>)}
              </div>
            </div>

            {/* Gross breakdown */}
          </>)}

          {/* 인보이스 직원 정산 확인 버튼 - 블록 밖에서 별도 표시 */}
          {wage && wage.isContractor && !wage.hasFlatPay && (() => {
            const lv0 = leaves[selId]||{};
            const loanBal = parseFloat(lv0.keepBalance)||0;
            const periodDeps = getPeriodDeposits(selId, periodStart);
            // 선지급(가불) 잔액엔 '잔액 조정(가불/상환)' 항목만 반영. 일반 비용 공제(공구·회사카드 등)는 제외.
            const isLoanDed = (d) => d.isLoan === true || (d.desc||'').startsWith('잔액 조정');
            const savedDedTotal = getSavedDeductions(selId).reduce((s,d)=>s+(isLoanDed(d)?(parseFloat(d.amount)||0):0),0);
            const hist0 = Array.isArray(lv0.keepBalanceHistory)?lv0.keepBalanceHistory:Object.values(lv0.keepBalanceHistory||{});
            const isSettled0 = !!hist0.find(h=>h.periodStart===periodStart);
            const prevEntry = [...hist0].sort((a,b)=>b.periodStart.localeCompare(a.periodStart)).find(h=>h.periodStart<periodStart);
            // 이전 정산이 있으면 그 값을 사용. 없으면:
            //   ─ 미래 정산 기록도 없을 때만 keepBalance(전역 시드)를 사용.
            //   ─ 미래 정산 기록이 있다면 이 기간보다 더 과거 시점이라는 뜻 → 0으로 고정 (전역 keepBalance 변동의 영향을 받지 않도록).
            const hasFutureEntry = hist0.some(h => h.periodStart > periodStart);
            const startBal = prevEntry
              ? parseFloat(prevEntry.balance||0)
              : (hasFutureEntry ? 0 : loanBal);
            const afterBal = startBal + savedDedTotal; // 공제로 갚음 (savedDed가 음수면 빌린 것)
            return (<>
              {/* 선지급(가불) 잔액 섹션 */}
              <div style={{ background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:12,padding:"12px 14px",margin:"12px 0" }}>
                <p style={{ margin:"0 0 8px",fontSize:12,fontWeight:700,color:"#C2410C" }}>💳 선지급(가불) 잔액</p>
                <div style={{ display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4 }}>
                  <span style={{ color:"#555" }}>이전 정산 잔액</span>
                  <span style={{ fontWeight:700,color:startBal<0?"#DC2626":"#059669" }}>{fA(startBal)}</span>
                </div>
                {savedDedTotal>0 && <div style={{ display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4 }}>
                  <span style={{ color:"#555" }}>이번 기간 가불 상환</span>
                  <span style={{ fontWeight:700,color:"#059669" }}>+{fA(savedDedTotal)}</span>
                </div>}
                <div style={{ borderTop:"1px solid #FED7AA",marginTop:6,paddingTop:6,display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:800 }}>
                  <span style={{ color:"#C2410C" }}>누적 잔액</span>
                  <span style={{ color:afterBal<0?"#DC2626":afterBal>0?"#059669":"#9CA3AF" }}>{fA(afterBal)}</span>
                </div>

                {/* 대출 추가 (관리자만) */}
                {isSuperAdmin && (<>
                  <div style={{ marginTop:10,borderTop:"1px solid #FED7AA",paddingTop:10 }}>
                    <p style={{ margin:"0 0 6px",fontSize:11,fontWeight:700,color:"#C2410C" }}>잔액 조정 (선지급: -, 상환: +)</p>
                    <div style={{ display:"flex",gap:6 }}>
                      <input type="number" placeholder="금액 (예: -1000)" value={loanDeposit}
                        onChange={e=>setLoanDeposit(e.target.value)}
                        style={{ flex:1,padding:"7px 10px",border:"1px solid #FED7AA",borderRadius:7,fontSize:13,fontFamily:"inherit",background:"#fff" }}/>
                      <input placeholder="메모" value={loanMemo}
                        onChange={e=>setLoanMemo(e.target.value)}
                        style={{ flex:1,padding:"7px 10px",border:"1px solid #FED7AA",borderRadius:7,fontSize:13,fontFamily:"inherit",background:"#fff" }}/>
                      <button onClick={()=>{
                        const amt = parseFloat(loanDeposit);
                        if (!amt) return;
                        // 정산완료 잠금 체크 (현재 보고 있는 periodStart 기준)
                        const lockInfo = isLogLocked(selId, periodStart, leaves);
                        if (lockInfo && !isAdmin) {
                          alert(`🔒 ${lockInfo.periodStart} 기간은 정산완료되어 잔액을 조정할 수 없어요.`);
                          return;
                        }
                        if (lockInfo && isAdmin && !confirm(`⚠️ ${lockInfo.periodStart} 기간은 정산완료된 기간이에요.\n그래도 잔액을 조정할까요?`)) return;
                        // 잔액 조정 → 이번 기간의 savedDeductions 에 항목으로 기록.
                        // (전역 keepBalance를 건드리지 않음으로써 과거 기간 표시에 영향 없음)
                        // 오늘이 현재 기간 안이면 today, 아니면 periodStart 를 날짜로 사용.
                        const inRange = today >= wpStart && today <= wpEnd;
                        const entryDate = inRange ? today : periodStart;
                        const entry = {
                          id: Date.now() + Math.random(),
                          date: entryDate,
                          desc: (loanMemo || '').trim() || (amt>0?'잔액 조정 (상환)':'잔액 조정 (선지급)'),
                          amount: amt,
                          addedBy: user?.id || 'admin',
                          isLoan: true,  // 선지급(가불) 잔액에 반영되는 항목 표시
                        };
                        const existing = Array.isArray(lv0.savedDeductions)?lv0.savedDeductions:Object.values(lv0.savedDeductions||{});
                        persist(null,null,{...leaves,[selId]:{...lv0,savedDeductions:[...existing,entry]}});
                        setLoanDeposit(''); setLoanMemo('');
                        alert(`✅ 잔액 조정 기록: ${amt>0?'+':''}$${amt} (${entryDate})\n이 항목은 "공제 항목" 으로 등록됐어요.`);
                      }} style={{ background:"#C2410C",color:"#fff",border:"none",borderRadius:7,padding:"7px 12px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>추가</button>
                    </div>
                  </div>
                </>)}
              </div>

              {/* 정산 확인 완료 → 인보이스 직원에게 PDF 인보이스 발행 버튼
                  (admin·본인 모두 사용 가능 — 본인은 자기 selId 가 자동 세팅됨) */}
              {isSettled0 && wage.isContractor && (() => {
                const empUser = users.find(x => x.id === selId);
                return empUser ? (
                  <div style={{ marginBottom: 8 }}>
                    {!isAdmin && <p style={{ margin:"0 0 6px",fontSize:11,color:"#059669",fontWeight:600 }}>📄 이번 기간 정산이 완료됐어요 — 인보이스를 발행할 수 있어요</p>}
                    <InvoiceButton u={empUser} s={wage} periodLogs={wage.periodLogs||[]} startDate={wpStart} endDate={wpEnd} leaveData={lv0} companies={companies} />
                  </div>
                ) : null;
              })()}
              {/* 정산 미완료 안내 (contractor 본인이 자기 화면 봤을 때) */}
              {!isSettled0 && wage.isContractor && !isAdmin && (
                <div style={{ background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,padding:"10px 14px",margin:"10px 0",fontSize:12,color:"#92400E",lineHeight:1.5 }}>
                  ⏳ 이번 기간은 아직 <strong>정산 확인 전</strong>이에요. 관리자가 정산을 완료하면 여기서 인보이스 PDF를 받을 수 있어요.
                </div>
              )}

              {/* 정산 확인 버튼 */}
              {isSuperAdmin && (isSettled0 ? (
                <div style={{ textAlign:"center",color:"#10B981",fontSize:13,fontWeight:700,background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10,padding:"10px 12px",marginBottom:8 }}>
                  ✅ 이 기간 정산 확인 완료
                  <button onClick={()=>{
                    const newHist=[...hist0.filter(h=>h.periodStart!==periodStart)];
                    persist(null,null,{...leaves,[selId]:{...lv0,keepBalanceHistory:newHist}});
                  }} style={{ marginLeft:8,fontSize:11,color:"#888",background:"none",border:"none",cursor:"pointer",fontFamily:"inherit" }}>취소</button>
                </div>
              ) : (
                <button onClick={()=>{
                  const newHist=[...hist0,{periodStart,balance:afterBal,isContractor:true,savedAt:new Date().toISOString()}];
                  persist(null,null,{...leaves,[selId]:{...lv0,keepBalance:afterBal,keepBalanceHistory:newHist}});
                }} style={{ width:"100%",background:"#0F766E",color:"#fff",border:"none",borderRadius:12,padding:13,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:8,display:"block" }}>
                  ✅ 이 기간 정산 확인 → 잔액 {fA(afterBal)}
                </button>
              ))}
            </>);
          })()}

          {/* ── 디덕션 섹션 ── (인보이스 포함 항상 표시) */}
          {selId && (<>
            <div style={{ background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 4px #0000000a" }}>
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:deductions.length>0?12:0 }}>
                <p style={{ margin:0,fontSize:11,fontWeight:700,color:"#EF4444",textTransform:"uppercase",letterSpacing:1 }}>➖ 공제 항목 (Deductions)</p>
                {true && <button onClick={addDeduction}
                  style={{ fontSize:12,fontWeight:700,background:"#FEF2F2",color:"#EF4444",border:"1.5px solid #FECACA",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontFamily:"inherit" }}>
                  + 추가
                </button>}
              </div>
              {deductions.length === 0 && (
                <p style={{ fontSize:12,color:"#ccc",textAlign:"center",margin:"8px 0 0",fontStyle:"italic" }}>회사카드 개인결제 등 공제할 항목을 추가하세요</p>
              )}
              {deductions.map(d => (
                <div key={d.id} style={{ display:"flex",gap:6,alignItems:"center",marginBottom:8,flexWrap:"wrap" }}>
                  <input type="date" value={d.date||wpStart} onChange={e => updateDeduction(d.id, "date", e.target.value)}
                    style={{ ...styles.input,flex:"0 0 130px",fontSize:12,padding:"8px 10px" }} />
                  <input placeholder="항목명 (예: 회사카드 개인결제)" value={d.desc}
                    onChange={e => updateDeduction(d.id, "desc", e.target.value)}
                    style={{ ...styles.input,flex:2,fontSize:12,padding:"8px 10px" }} />
                  <div style={{ flex:1,position:"relative" }}>
                    <span style={{ position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",fontSize:12,color:"#888",pointerEvents:"none" }}>$</span>
                    <input type="number" placeholder="0.00" value={d.amount} min={0} step={0.01}
                      onChange={e => updateDeduction(d.id, "amount", e.target.value)}
