<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gmail에서 열기</title>
<style>
  :root { --bg:#fff; --fg:#1f1f1f; --btn:#1a73e8; --muted:#666; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --btn:#8ab4f8; --muted:#aaa; } }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px -apple-system, system-ui, sans-serif; }
  a.b { display:block; margin:12px 0; padding:16px; border-radius:12px; text-align:center; text-decoration:none;
        background:var(--btn); color:var(--bg); font-weight:600; }
  a.s { background:transparent; color:var(--btn); border:1px solid var(--btn); }
  p { color:var(--muted); font-size:14px; line-height:1.5; }
  code { word-break:break-all; }
</style>
</head>
<body>
<h3 id="h">메일 열기</h3>
<a class="b" id="go" href="googlegmail://">검색어 복사하고 Gmail 앱 열기</a>
<p>Gmail 앱이 열리면 위쪽 검색창을 길게 눌러 <b>붙여넣기</b> 하세요. 그 메일 하나만 나와요.</p>
<p>검색어: <code id="qv"></code></p>
<a class="b s" id="web" href="#">웹(Safari)에서 열기</a>
<script>
// 브리핑/메일 알림의 [메일 보기] 링크: ?a=<accounts|info>&t=<thread id 16진수>&m=<Message-ID>&s=<제목>
// Claude 앱 안 브라우저에서는 Gmail 앱이 특정 메일로 바로 안 열려서(2026-11 시험),
// 검색어(rfc822msgid:…)를 클립보드에 복사하고 Gmail 앱을 연다.
var q = new URLSearchParams(location.search);
var a = (q.get('a') || 'accounts').replace(/[^a-z]/gi, '');
var t = (q.get('t') || '').replace(/[^0-9a-f]/gi, '');
var m = (q.get('m') || '').replace(/^<|>$/g, '');
var s = q.get('s') || '';
var term = m ? 'rfc822msgid:' + m : s;
document.getElementById('h').textContent = s ? s : '메일 열기';
document.getElementById('qv').textContent = term + '  (' + a + '@)';
document.getElementById('web').href = 'https://mail.google.com/mail/?authuser=' + a + '%40knmtilingbathurst.com#all/' +
  (t ? 'thread-f:' + BigInt('0x' + t).toString() : '');
document.getElementById('go').addEventListener('click', function () {
  try { navigator.clipboard.writeText(term); } catch (e) {}
  var ta = document.createElement('textarea'); ta.value = term; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
});
</script>
</body>
</html>
