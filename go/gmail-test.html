<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gmail 링크 시험</title>
<style>
 :root{--bg:#fff;--fg:#1f1f1f;--btn:#1a73e8}
 @media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--btn:#8ab4f8}}
 body{margin:0;padding:20px 16px;background:var(--bg);color:var(--fg);font:16px -apple-system,system-ui,sans-serif}
 a{display:block;margin:10px 0;padding:12px;border-radius:10px;text-decoration:none;background:var(--btn);color:var(--bg);font-weight:600;word-break:break-all}
 small{display:block;font-weight:400;opacity:.8}
</style></head><body>
<h3>Gmail 앱 링크 시험</h3>
<div id="b"></div>
<script>
// 임시 시험 페이지: ?t=<thread id 16진수>&m=<Message-ID>&k=<검색어>  (어느 모양이 Gmail 앱에서 그 메일을 여는지 확인용)
var q=new URLSearchParams(location.search), t=q.get('t')||'', m=q.get('m')||'', k=q.get('k')||'';
var dec=t?BigInt('0x'+t).toString():'';
var v=[
 ['A','googlegmail:///cv='+t+'/accountId=1'],
 ['B','googlegmail:///search?q='+encodeURIComponent('rfc822msgid:'+m)],
 ['C','googlegmail://search?q='+encodeURIComponent('rfc822msgid:'+m)],
 ['D','googlegmail:///search?q='+encodeURIComponent(k)],
 ['E','googlegmail:///cv=thread-f:'+dec],
 ['F','googlegmail:///message?id='+t],
 ['G','googlegmail:///cv='+t+'/accountId=0&create-new-tab'],
 ['H','https://mail.google.com/mail/?authuser=accounts%40knmtilingbathurst.com#all/thread-f:'+dec],
 ['I','https://mail.google.com/mail/u/0/#inbox/'+t],
 ['J','https://mail.google.com/mail/mu/mp/?authuser=accounts%40knmtilingbathurst.com#cv/priority/'+t]];
v.forEach(function(x){var a=document.createElement('a');a.href=x[1];a.innerHTML=x[0]+'<small></small>';a.lastChild.textContent=x[1];document.getElementById('b').appendChild(a);});
</script></body></html>
