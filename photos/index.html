<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#6d5efc"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="현장사진"/>
<title>K&M 현장사진</title>
<style>
/* ⚠️ 배포 시 코드 바뀌면 APP_BUILD 올릴 것 */
:root{
  --pri:#6d5efc;--pri2:#9b8cff;--pri-d:#5546e8;
  --bg:#f3f4fb;--card:#ffffff;--text:#15162b;--sub:#747890;--line:#eceef6;
  --red:#ef4444;--amber:#f59e0b;--green:#10b981;
  --shadow:0 1px 2px #15162b0a,0 6px 20px #15162b0d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
.safe-top{height:env(safe-area-inset-top)}

/* Header */
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#6d5efc,#9b8cff);
  color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;box-shadow:0 6px 22px #6d5efc33}
.hdr .r1{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:19px;font-weight:800;margin:0;flex:1;letter-spacing:-0.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .sub{font-size:12px;opacity:.85;margin-top:3px;font-weight:500}
.hdr .icn{background:rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:12px;
  font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(4px)}
.hdr .icn:active{background:rgba(255,255,255,.33)}
.search{margin-top:14px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);
  border-radius:13px;padding:11px 13px;box-shadow:0 2px 10px #0001}
.search input{flex:1;border:none;outline:none;background:none;font-size:15px;color:#15162b;min-width:0}
.search .s-ic{color:var(--sub);font-size:16px}

/* filter chips */
.filters{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:20px;background:#fff;color:var(--sub);
  font-weight:700;font-size:12.5px;box-shadow:var(--shadow);border:1px solid transparent}
.chip.on{background:#15162b;color:#fff}

.wrap{padding:12px 14px calc(env(safe-area-inset-bottom) + 96px);max-width:820px;margin:0 auto}
.sec-label{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:6px 4px 10px}

/* project card */
.pcard{background:var(--card);border-radius:17px;box-shadow:var(--shadow);margin-bottom:11px;
  display:flex;overflow:hidden;position:relative}
.pcard:active{transform:scale(.992)}
.pcard .cover{width:92px;flex-shrink:0;object-fit:cover;background:linear-gradient(135deg,#eef0fb,#e3e6f7)}
.pcard .ph{width:92px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:#fff}
.pcard .body{flex:1;min-width:0;padding:13px 14px;display:flex;flex-direction:column;justify-content:center}
.pcard .bld{font-weight:800;font-size:15.5px;letter-spacing:-0.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .adr{font-size:12.5px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .foot{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:11.5px;color:var(--sub)}
.pcard .pill{background:#f0f1fa;color:#5a5e78;border-radius:7px;padding:2px 8px;font-weight:700}

/* category tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;position:sticky;z-index:10;
  top:calc(env(safe-area-inset-top) + 62px);background:linear-gradient(var(--bg),var(--bg) 70%,transparent);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 15px;border-radius:21px;background:#fff;color:var(--sub);
  font-weight:700;font-size:13.5px;box-shadow:var(--shadow)}
.tab.on{background:linear-gradient(135deg,#6d5efc,#9b8cff);color:#fff;box-shadow:0 4px 14px #6d5efc55}

/* entry */
.daygrp{margin-bottom:4px}
.dayhd{font-size:12.5px;font-weight:800;color:var(--sub);margin:14px 6px 8px;display:flex;align-items:center;gap:7px}
.dayhd::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pri)}
.ecard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;padding:13px 14px}
.ecard .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ava{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6d5efc,#9b8cff);
  color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ecard .who{font-weight:700;font-size:13.5px}
.ecard .dt{font-size:11.5px;color:var(--sub)}
.ecard .rd{margin-left:auto;font-size:11px;color:var(--sub);background:#f3f4fb;padding:3px 9px;border-radius:11px;font-weight:700}
.ecard .note{font-size:13.5px;margin:0 0 9px;white-space:pre-wrap;color:#2c2e45;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid .cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eef0f7}
.grid .cell img{width:100%;height:100%;object-fit:cover;display:block}
.grid .more{position:absolute;inset:0;background:#000a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:60px;height:60px;
  border-radius:20px;background:linear-gradient(135deg,#6d5efc,#9b8cff);color:#fff;font-size:30px;
  box-shadow:0 10px 26px #6d5efc66;z-index:30;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.94)}

.empty{text-align:center;color:var(--sub);padding:60px 24px;font-size:14px;line-height:1.6}
.empty .big{font-size:46px;margin-bottom:10px;opacity:.85}

/* modal / sheet */
.modal{position:fixed;inset:0;background:#15162b66;backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:820px;border-radius:22px 22px 0 0;max-height:93vh;overflow:auto;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px)}}
.grab{width:40px;height:5px;border-radius:3px;background:#dfe1ee;margin:8px auto 14px}
.sheet h2{margin:0 0 16px;font-size:18px;font-weight:800;letter-spacing:-0.3px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fafbff;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--pri);background:#fff}
.btn{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#6d5efc,#9b8cff);color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 14px #6d5efc44}
.btn:active{transform:scale(.98)}
.btn.sec{background:#eef0f8;color:#3a3d55;box-shadow:none}
.btn:disabled{opacity:.55}
.row{display:flex;gap:9px}
.thumbadd{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px}
.thumbadd .t{position:relative;aspect-ratio:1}
.thumbadd .t img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.thumbadd .t .x{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:2px solid #fff;border-radius:50%;width:23px;height:23px;font-size:14px;display:flex;align-items:center;justify-content:center}
.pick{border:2px dashed #c9cbe6;border-radius:11px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--pri);background:#fafbff}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatches .s{width:36px;height:36px;border-radius:11px;border:3px solid transparent;transition:transform .1s}
.swatches .s.on{border-color:#15162b;transform:scale(1.08)}
.prog-wrap{height:6px;background:#eceef6;border-radius:3px;overflow:hidden;margin:4px 0}
.prog{height:100%;background:linear-gradient(90deg,#6d5efc,#9b8cff);width:0;transition:width .2s}

/* viewer */
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.viewer .vh{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;color:#fff}
.viewer .vh button{color:#fff;font-size:15px;font-weight:700;padding:6px 4px}
.viewer .vimg{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pinch-zoom}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vnav{display:flex;justify-content:space-between;padding:12px 18px calc(env(safe-area-inset-bottom) + 14px)}
.viewer .vnav button{background:#ffffff22;color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center}

/* login */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;
  background:radial-gradient(130% 90% at 50% 0%,#efeafe,#f3f4fb)}
.login .box{background:#fff;border-radius:24px;padding:30px 24px;width:100%;max-width:350px;box-shadow:0 20px 50px #6d5efc1f;text-align:center}
.login .logo{width:72px;height:72px;border-radius:20px;margin:0 auto 14px;display:block}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(10px);
  background:#15162b;color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;z-index:80;opacity:0;transition:all .22s;pointer-events:none;box-shadow:0 8px 24px #0003}
.toast.on{opacity:.97;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#eef0f7,#f6f7fc,#eef0f7);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:16px;height:92px;margin-bottom:11px}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<datalist id="builder-list"></datalist>
<script>
const APP_BUILD='2026-10-01-04';
const RTDB='https://knmtilingptyltd-12520-default-rtdb.firebaseio.com';
const STORAGE_BUCKET='knmtilingptyltd-12520.firebasestorage.app';
const DEFAULT_CATS=['방수','베딩','타일','그라우트','실리콘'];
const COLORS=['#6d5efc','#ef4444','#f59e0b','#10b981','#0891b2','#8b5cf6','#ec4899','#334155'];

async function rtGet(p){const r=await fetch(`${RTDB}/${p}.json`);return r.ok?r.json():null;}
async function rtPost(p,v){const r=await fetch(`${RTDB}/${p}.json`,{method:'POST',body:JSON.stringify(v)});return r.json();}
async function rtPut(p,v){const r=await fetch(`${RTDB}/${p}.json`,{method:'PUT',body:JSON.stringify(v)});return r.json();}
async function rtPatch(p,v){const r=await fetch(`${RTDB}/${p}.json`,{method:'PATCH',body:JSON.stringify(v)});return r.json();}

async function stUpload(path,blob){
  const url=`https://firebasestorage.googleapis.com/v0/b/${STORAGE_BUCKET}/o?uploadType=media&name=${encodeURIComponent(path)}`;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':blob.type||'image/jpeg'},body:blob});
  if(!r.ok)throw new Error('업로드 실패 '+r.status);
  const j=await r.json();const tok=(j.downloadTokens||'').split(',')[0];
  return `https://firebasestorage.googleapis.com/v0/b/${STORAGE_BUCKET}/o/${encodeURIComponent(path)}?alt=media${tok?'&token='+tok:''}`;
}
function compress(file,maxDim=1600,q=0.72){
  return new Promise((res)=>{const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(u);let w=img.naturalWidth,h=img.naturalHeight;
      if(Math.max(w,h)>maxDim){const s=maxDim/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>res(b||file),'image/jpeg',q);};
    img.onerror=()=>res(file);img.src=u;});
}

let S={user:null,projects:[],builders:[],pid:null,cat:null,curProj:null,entries:{},q:'',bfilter:''};
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const fmtDT=d=>{const x=new Date(d);return `${pad2(x.getDate())}/${pad2(x.getMonth()+1)}/${x.getFullYear()} ${pad2(x.getHours())}:${pad2(x.getMinutes())}`;};
const fmtD=d=>{const x=new Date(d);return `${pad2(x.getDate())}/${pad2(x.getMonth()+1)}/${x.getFullYear()}`;};
const dayKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`;};
const title=p=>p.builder||p.name||'(이름없음)';
const initial=p=>(title(p).trim()[0]||'·');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}

async function tryLogin(id,pw){
  const users=await rtGet('users');const arr=Array.isArray(users)?users:Object.values(users||{});
  const u=arr.find(x=>x&&x.id===id.trim());
  if(!u)return{err:'아이디가 없어요'};
  if((u.pw||'')!==pw)return{err:'비밀번호가 틀렸어요'};
  return{user:{id:u.id,name:u.name||u.id}};
}
function saveSession(u){try{localStorage.setItem('photoapp_session',JSON.stringify(u));}catch(e){}}
function loadSession(){try{return JSON.parse(localStorage.getItem('photoapp_session')||'null');}catch(e){return null;}}

function renderLogin(){
  document.getElementById('app').innerHTML=`
  <div class="login"><div class="box">
    <img class="logo" src="icon-192.png" alt=""/>
    <h2 style="margin:4px 0 2px;font-size:20px;letter-spacing:-0.3px">K&M 현장사진</h2>
    <p style="color:var(--sub);font-size:13px;margin:0 0 20px">직원 계정으로 로그인</p>
    <div class="fld" style="text-align:left"><input id="lg-id" placeholder="아이디" autocapitalize="none" autocomplete="username"/></div>
    <div class="fld" style="text-align:left"><input id="lg-pw" type="password" placeholder="비밀번호" autocomplete="current-password"/></div>
    <div id="lg-err" style="color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px"></div>
    <button class="btn" id="lg-btn">로그인</button>
  </div></div>`;
  const go=async()=>{const id=$('#lg-id').value,pw=$('#lg-pw').value;
    if(!id||!pw){$('#lg-err').textContent='아이디·비밀번호를 입력하세요';return;}
    $('#lg-btn').innerHTML='<span class="spin"></span>';
    const r=await tryLogin(id,pw);
    if(r.err){$('#lg-err').textContent=r.err;$('#lg-btn').textContent='로그인';return;}
    S.user=r.user;saveSession(r.user);openProjects();};
  $('#lg-btn').onclick=go;$('#lg-pw').onkeydown=e=>{if(e.key==='Enter')go();};
}

// builders (인보이스 빌더 재사용 + 현장에서 쓰인 빌더)
async function loadBuilders(){
  let names=[];
  try{const b=await rtGet('invoiceBuilders');const arr=Array.isArray(b)?b:Object.values(b||{});
    names=arr.map(x=>x&&(x.name||x.builderName||x.company)).filter(Boolean);}catch(e){}
  S.projects.forEach(p=>{if(p.builder)names.push(p.builder);});
  S.builders=[...new Set(names)].sort((a,b)=>a.localeCompare(b));
  $('#builder-list').innerHTML=S.builders.map(n=>`<option value="${esc(n)}">`).join('');
}

async function openProjects(){
  S.pid=null;S.cat=null;S.curProj=null;
  document.getElementById('app').innerHTML=`
   <div class="hdr">
     <div class="r1"><div style="flex:1"><h1>현장 사진</h1><div class="sub" id="pcount">불러오는 중…</div></div>
       <button class="icn" id="h-out" title="로그아웃">⎋</button></div>
     <div class="search"><span class="s-ic">🔍</span><input id="q" placeholder="빌더·주소 검색" value="${esc(S.q)}"/></div>
   </div>
   <div class="filters" id="filters"></div>
   <div class="wrap" id="plist"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
   <button class="fab" id="addproj">＋</button>`;
  $('#h-out').onclick=()=>{if(confirm('로그아웃할까요?')){localStorage.removeItem('photoapp_session');S.user=null;renderLogin();}};
  $('#addproj').onclick=()=>projectForm();
  $('#q').oninput=e=>{S.q=e.target.value;renderProjectList();};
  const data=await rtGet('photoApp/projects')||{};
  S.projects=Object.entries(data).map(([id,v])=>({id,...v})).filter(p=>!p.archived);
  await loadBuilders();
  renderFilters();renderProjectList();
}
function renderFilters(){
  const builders=[...new Set(S.projects.map(p=>p.builder).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  $('#filters').innerHTML=`<div class="chip ${!S.bfilter?'on':''}" data-b="">전체</div>`+
    builders.map(b=>`<div class="chip ${S.bfilter===b?'on':''}" data-b="${esc(b)}">${esc(b)}</div>`).join('');
  $('#filters').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.bfilter=c.dataset.b;renderFilters();renderProjectList();});
}
function renderProjectList(){
  const q=S.q.trim().toLowerCase();
  let list=S.projects.slice();
  if(S.bfilter)list=list.filter(p=>p.builder===S.bfilter);
  if(q)list=list.filter(p=>(`${title(p)} ${p.address||''}`).toLowerCase().includes(q));
  list.sort((a,b)=>(b.lastActivity||b.updatedAt||b.createdAt||0)-(a.lastActivity||a.updatedAt||a.createdAt||0));
  const el=$('#plist');
  $('#pcount').textContent=`현장 ${S.projects.length}곳`;
  if(!list.length){el.innerHTML=`<div class="empty"><div class="big">📁</div>${S.projects.length?'검색 결과가 없어요':'아직 현장이 없어요.<br>오른쪽 아래 ＋ 로 현장을 추가하세요.'}</div>`;return;}
  el.innerHTML=list.map(p=>{
    const cov=`<div class="ph" style="background:linear-gradient(135deg,${p.color||'#6d5efc'},${shade(p.color||'#6d5efc')})">${esc(initial(p))}</div>`;
    const cnt=p.photoCount||0;const last=p.lastActivity?('· '+fmtD(p.lastActivity)):'';
    return `<div class="pcard" data-id="${p.id}">${cov}
      <div class="body"><div class="bld">${esc(title(p))}</div>
        ${p.address?`<div class="adr">📍 ${esc(p.address)}</div>`:''}
        <div class="foot"><span class="pill">사진 ${cnt}</span><span>${last}</span></div>
      </div></div>`;}).join('');
  el.querySelectorAll('.pcard').forEach(d=>d.onclick=()=>openProject(d.dataset.id));
}
function shade(hex){try{const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.min(255,r+40);g=Math.min(255,g+30);b=Math.min(255,b+50);return`#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}`;}catch(e){return hex;}}

function projectForm(edit){
  const p=edit||{};let color=p.color||COLORS[Math.floor(Math.random()*COLORS.length)];
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><div class="grab"></div>
    <h2>${edit?'현장 수정':'현장 추가'}</h2>
    <div class="fld"><label>빌더 (목록에서 선택 또는 입력)</label>
      <input id="p-bld" list="builder-list" placeholder="예: Qlinc" value="${esc(p.builder||'')}"/></div>
    <div class="fld"><label>주소 / 유닛</label><input id="p-ad" placeholder="예: unit 94, 10 Baillie St" value="${esc(p.address||'')}"/></div>
    <div class="fld"><label>색상</label><div class="swatches" id="p-cl">
      ${COLORS.map(c=>`<div class="s ${c===color?'on':''}" data-c="${c}" style="background:${c}"></div>`).join('')}</div></div>
    <div class="row" style="margin-top:4px">
      <button class="btn sec" id="p-cancel">취소</button>
      <button class="btn" id="p-save">${edit?'저장':'추가'}</button></div>
    ${edit?`<button class="btn sec" id="p-arch" style="margin-top:9px;color:var(--red)">현장 보관(숨기기)</button>`:''}
  </div>`;
  document.body.appendChild(m);
  m.onclick=e=>{if(e.target===m)m.remove();};
  m.querySelectorAll('#p-cl .s').forEach(s=>s.onclick=()=>{color=s.dataset.c;m.querySelectorAll('#p-cl .s').forEach(x=>x.classList.toggle('on',x===s));});
  $('#p-cancel',m).onclick=()=>m.remove();
  $('#p-save',m).onclick=async()=>{
    const bld=$('#p-bld',m).value.trim();if(!bld){toast('빌더를 입력하세요');return;}
    $('#p-save',m).innerHTML='<span class="spin"></span>';
    const payload={builder:bld,address:$('#p-ad',m).value.trim(),color,updatedAt:Date.now()};
    if(edit){await rtPatch('photoApp/projects/'+edit.id,payload);}
    else{payload.categories=DEFAULT_CATS.slice();payload.createdAt=Date.now();payload.archived=false;payload.photoCount=0;await rtPost('photoApp/projects',payload);}
    m.remove();if(edit&&S.pid===edit.id){S.curProj={...S.curProj,...payload};openProject(edit.id);}else openProjects();
  };
  if(edit)$('#p-arch',m).onclick=async()=>{if(!confirm('이 현장을 목록에서 숨길까요? (사진은 보존됩니다)'))return;await rtPatch('photoApp/projects/'+edit.id,{archived:true});m.remove();openProjects();};
}

async function openProject(pid){
  S.pid=pid;const p=S.projects.find(x=>x.id===pid)||await rtGet('photoApp/projects/'+pid);p.id=pid;
  S.curProj=p;const cats=(p.categories&&p.categories.length?p.categories:DEFAULT_CATS);S.cat=cats[0];
  document.getElementById('app').innerHTML=`
   <div class="hdr"><div class="r1">
     <button class="icn" id="h-back">‹</button>
     <div style="flex:1;min-width:0"><h1>${esc(title(p))}</h1>${p.address?`<div class="sub">📍 ${esc(p.address)}</div>`:''}</div>
     <button class="icn" id="h-edit" title="현장 수정">✎</button></div></div>
   <div class="tabs" id="cats"></div>
   <div class="wrap" id="entries"></div>
   <button class="fab" id="addentry">＋</button>`;
  $('#h-back').onclick=openProjects;
  $('#h-edit').onclick=()=>projectForm(S.curProj);
  $('#addentry').onclick=()=>entryForm(pid,S.cat);
  renderCats();loadEntries(pid);
}
function renderCats(){
  const p=S.curProj;const cats=(p.categories&&p.categories.length?p.categories:DEFAULT_CATS);
  $('#cats').innerHTML=cats.map(c=>`<div class="tab ${c===S.cat?'on':''}" data-c="${esc(c)}">${esc(c)}</div>`).join('')
    +`<div class="tab" id="catadd" style="color:var(--pri)">＋ 종류</div>`;
  $('#cats').querySelectorAll('.tab[data-c]').forEach(t=>t.onclick=()=>{S.cat=t.dataset.c;renderCats();renderEntries();});
  $('#catadd',$('#cats')).onclick=()=>addCategory(S.pid);
}
async function addCategory(pid){
  const nm=prompt('추가할 작업종류 이름');if(!nm||!nm.trim())return;
  const p=S.curProj;const cats=(p.categories&&p.categories.length?p.categories:DEFAULT_CATS).slice();
  if(cats.includes(nm.trim())){toast('이미 있어요');return;}
  cats.push(nm.trim());p.categories=cats;await rtPatch('photoApp/projects/'+pid,{categories:cats});
  S.cat=nm.trim();renderCats();renderEntries();
}
async function loadEntries(pid){
  $('#entries').innerHTML='<div class="skel"></div><div class="skel"></div>';
  const data=await rtGet('photoApp/entries/'+pid)||{};
  S.entries[pid]=Object.entries(data).map(([id,v])=>({id,...v}));
  renderEntries();
  // 사진수·커버·최근일 자동 보정 (옛 데이터/드리프트 교정)
  const all=S.entries[pid];
  const total=all.reduce((s,e)=>s+((e.photos||[]).length),0);
  const latest=all.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  const cur=S.curProj||{};const patch={};
  if((cur.photoCount||0)!==total)patch.photoCount=total;
  if(latest){const cov=(latest.photos||[])[0]&&latest.photos[0].url;if(cov&&cur.coverUrl!==cov)patch.coverUrl=cov;
    const la=latest.date||latest.createdAt;if(la&&cur.lastActivity!==la)patch.lastActivity=la;}
  if(Object.keys(patch).length){Object.assign(cur,patch);rtPatch('photoApp/projects/'+pid,patch);}
}
function renderEntries(){
  const list=(S.entries[S.pid]||[]).filter(e=>e.category===S.cat).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const el=$('#entries');
  if(!list.length){el.innerHTML=`<div class="empty"><div class="big">📷</div><b>${esc(S.cat)}</b> — 아직 사진이 없어요.<br>＋ 로 오늘 작업 사진을 올리세요.</div>`;return;}
  // group by day
  const groups={};list.forEach(e=>{const k=dayKey(e.date||e.createdAt);(groups[k]=groups[k]||[]).push(e);});
  const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  el.innerHTML=keys.map(k=>{
    const d=groups[k][0].date||groups[k][0].createdAt;
    return `<div class="daygrp"><div class="dayhd">${fmtD(d)}</div>`+groups[k].map(e=>{
      const reads=e.reads?Object.keys(e.reads).length:0;const ph=(e.photos||[]);
      const show=ph.slice(0,9);
      return `<div class="ecard">
        <div class="top"><div class="ava">${esc((e.authorName||'?')[0])}</div>
          <div><div class="who">${esc(e.authorName||'')}</div><div class="dt">${fmtDT(e.date||e.createdAt)}</div></div>
          <span class="rd">👁 ${reads}</span></div>
        ${e.note?`<div class="note">${esc(e.note)}</div>`:''}
        <div class="grid">${show.map((p,i)=>`<div class="cell"><img loading="lazy" src="${p.url}" data-e="${e.id}" data-i="${i}"/>${(i===8&&ph.length>9)?`<div class="more" data-e="${e.id}" data-i="8">+${ph.length-9}</div>`:''}</div>`).join('')}</div>
      </div>`;}).join('')+`</div>`;}).join('');
  el.querySelectorAll('.grid img,.grid .more').forEach(im=>im.onclick=()=>openViewer(im.dataset.e,+im.dataset.i));
}

function entryForm(pid,cat){
  let picks=[];
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><div class="grab"></div>
    <h2>${esc(cat)} · 사진 올리기</h2>
    <div class="fld"><label>날짜</label><input id="e-date" type="date"/></div>
    <div class="fld"><label>메모 (선택)</label><textarea id="e-note" rows="2" placeholder="예: 1차 방수 완료"></textarea></div>
    <div class="fld"><label>사진</label>
      <input id="e-file" type="file" accept="image/*" multiple style="display:none"/>
      <div class="thumbadd" id="e-thumbs"><div class="pick" id="e-pick">＋</div></div></div>
    <div class="prog-wrap" id="e-progwrap" style="display:none"><div class="prog" id="e-prog"></div></div>
    <div id="e-status" style="font-size:12.5px;color:var(--sub);min-height:16px;margin:4px 0 8px"></div>
    <div class="row"><button class="btn sec" id="e-cancel">취소</button><button class="btn" id="e-save">올리기</button></div>
  </div>`;
  document.body.appendChild(m);
  const t=new Date();$('#e-date',m).value=`${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`;
  m.onclick=e=>{if(e.target===m)m.remove();};
  $('#e-cancel',m).onclick=()=>m.remove();
  const fi=$('#e-file',m);$('#e-pick',m).onclick=()=>fi.click();
  fi.onchange=()=>{[...fi.files].forEach(f=>picks.push({file:f,u:URL.createObjectURL(f)}));fi.value='';draw();};
  function draw(){const box=$('#e-thumbs',m);
    box.innerHTML=picks.map((p,i)=>`<div class="t"><img src="${p.u}"/><div class="x" data-i="${i}">×</div></div>`).join('')+`<div class="pick" id="e-pick">＋</div>`;
    $('#e-pick',m).onclick=()=>fi.click();
    box.querySelectorAll('.x').forEach(x=>x.onclick=()=>{picks.splice(+x.dataset.i,1);draw();});}
  $('#e-save',m).onclick=async()=>{
    if(!picks.length){toast('사진을 선택하세요');return;}
    const btn=$('#e-save',m);btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
    $('#e-progwrap',m).style.display='block';
    const eid=(Date.now().toString(36)+Math.random().toString(36).slice(2,7));const photos=[];
    try{
      for(let i=0;i<picks.length;i++){
        $('#e-status',m).textContent=`업로드 중 ${i+1}/${picks.length}…`;
        $('#e-prog',m).style.width=Math.round(i/picks.length*100)+'%';
        const f=picks[i].file;const base=`photos/${pid}/${cat}/${eid}/${i}`;
        const view=await compress(f);
        const url=await stUpload(base+'_view.jpg',view);
        const origUrl=await stUpload(base+'_orig'+extOf(f),f);
        photos.push({url,origUrl,name:f.name||('photo'+i)});
      }
      $('#e-prog',m).style.width='100%';
      const dateMs=new Date($('#e-date',m).value+'T'+new Date().toTimeString().slice(0,8)).getTime();
      await rtPut(`photoApp/entries/${pid}/${eid}`,{category:cat,date:dateMs,authorId:S.user.id,authorName:S.user.name,
        note:$('#e-note',m).value.trim(),photos,reads:{[S.user.id]:Date.now()},createdAt:Date.now()});
      const cur=S.curProj||{};
      await rtPatch('photoApp/projects/'+pid,{updatedAt:Date.now(),lastActivity:dateMs,coverUrl:photos[0].url,photoCount:(cur.photoCount||0)+photos.length});
      m.remove();toast('✅ 올렸어요');loadEntries(pid);
    }catch(err){btn.disabled=false;btn.textContent='올리기';
      $('#e-status',m).innerHTML=`<span style="color:var(--red)">실패: ${esc(err.message)}</span>`;}
  };
}
function extOf(f){const n=(f.name||'').toLowerCase();const m=n.match(/\.(jpe?g|png|heic|heif|webp)$/);return m?('.'+m[1]):'.jpg';}

async function openViewer(entryId,idx){
  const e=(S.entries[S.pid]||[]).find(x=>x.id===entryId);if(!e)return;
  const ph=e.photos||[];let i=idx;
  if(!e.reads||!e.reads[S.user.id]){rtPatch(`photoApp/entries/${S.pid}/${entryId}/reads`,{[S.user.id]:Date.now()});e.reads=e.reads||{};e.reads[S.user.id]=Date.now();}
  const v=document.createElement('div');v.className='viewer';
  function draw(){v.innerHTML=`
    <div class="vh"><button id="v-close">✕ 닫기</button>
      <span style="flex:1;text-align:center;font-size:13px;opacity:.9">${i+1} / ${ph.length}</span>
      <button id="v-dl">원본 ⤓</button></div>
    <div class="vimg"><img src="${ph[i].url}"/></div>
    <div class="vnav"><button id="v-prev">‹</button><button id="v-next">›</button></div>`;
    $('#v-close',v).onclick=()=>v.remove();
    $('#v-prev',v).onclick=()=>{i=(i-1+ph.length)%ph.length;draw();};
    $('#v-next',v).onclick=()=>{i=(i+1)%ph.length;draw();};
    $('#v-dl',v).onclick=()=>{window.open(ph[i].origUrl||ph[i].url,'_blank');};}
  draw();document.body.appendChild(v);
}

(function(){const s=loadSession();if(s){S.user=s;openProjects();}else renderLogin();})();
</script>
</body>
