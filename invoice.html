<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>K&M Invoice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#F0F4FF;color:#111827;min-height:100vh}
.header{background:#1E1B4B;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.logo{font-size:17px;font-weight:800;letter-spacing:-0.3px}
.logo small{display:block;font-size:10px;color:rgba(255,255,255,0.4);font-weight:400;margin-top:1px}
.nav{display:flex;gap:4px}
.nav button{padding:7px 13px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .15s}
.nav button.active{background:#818CF8;color:#fff}
.nav button:not(.active){background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6)}
.content{max-width:600px;margin:0 auto;padding:16px 16px 90px}
.card{background:#fff;border-radius:14px;padding:15px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(79,70,229,0.08);border:1px solid #E5E8F5}
.input{width:100%;padding:10px 13px;border:1.5px solid #E5E8F5;border-radius:9px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:#111827}
.input:focus{border-color:#4F46E5}
.select{width:100%;padding:10px 13px;border:1.5px solid #E5E8F5;border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:#111827}
.label{display:block;font-size:10px;font-weight:700;color:#6B7280;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.btn-primary{background:#4F46E5;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(79,70,229,0.25)}
.btn-secondary{background:#F3F4F6;color:#374151;border:1px solid #E5E7EB;border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-gold{background:#7C3AED;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:22px 20px;box-shadow:0 -4px 30px rgba(79,70,229,0.12)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.mb{margin-bottom:12px}
.pill{display:inline-block;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
.pill-INVOICE{background:#EEF2FF;color:#4F46E5}
.pill-DEPOSIT,.pill-PAID{background:#ECFDF5;color:#059669}
.pill-CREDIT{background:#FFFBEB;color:#D97706}
.pill-SUSPEND{background:#FFF1F2;color:#BE123C}
.pill-OVERDUE{background:#FEE2E2;color:#DC2626}
.pill-ONGOING{background:#FEF3C7;color:#92400E}
.pill-RETENTION{background:#E0E7FF;color:#3730A3}
.pill-BOOKING{background:#F3E8FF;color:#6B21A8}
.pill-FINISH{background:#D1FAE5;color:#065F46}
.pill-NO_PAYMENT{background:#F1F5F9;color:#475569}
.co-badge{display:inline-block;background:#E0F2FE;color:#0369A1;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;margin-right:4px}
.co-badge.co2{background:#FCE7F3;color:#9D174D}
.bill-badge{display:inline-block;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600;margin-left:6px}
.bill-MONTHLY{background:#DCFCE7;color:#15803D}
.bill-PER_JOB{background:#FEF9C3;color:#854D0E}
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.fbtn{padding:6px 12px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;background:#fff;color:#6B7280;box-shadow:0 1px 4px rgba(0,0,0,0.08);font-family:inherit}
.fbtn.active{background:#4F46E5;color:#fff}
.bbar{position:fixed;bottom:0;left:0;right:0;background:rgba(30,27,75,0.97);backdrop-filter:blur(10px);padding:10px 20px;display:flex;justify-content:space-around;z-index:100}
.bstat{text-align:center}
.bstat-l{font-size:10px;color:rgba(255,255,255,0.4)}
.bstat-v{font-size:14px;font-weight:800}
.icard{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(79,70,229,0.07);overflow:hidden;border-left:4px solid #4F46E5;border:1px solid #E5E8F5;border-left-width:4px}
.icard.DEPOSIT,.icard.PAID{border-left-color:#059669}
.icard.OVERDUE{border-left-color:#DC2626}
.icard.CREDIT{border-left-color:#D97706}
.icard.SUSPEND{border-left-color:#94A3B8}
.icard.ONGOING{border-left-color:#F59E0B;background:#FFFBEB}
.icard.RETENTION{border-left-color:#6366F1}
.icard.BOOKING{border-left-color:#A855F7}
.icard-body{padding:14px 16px}
.iname{font-size:14px;font-weight:800;color:#111827;margin-bottom:3px}
.iaddr{font-size:12px;color:#6B7280}
.iamount{font-size:17px;font-weight:900;white-space:nowrap;color:#111827}
.idates{display:flex;gap:10px;font-size:11px;color:#9CA3AF;margin-top:8px;flex-wrap:wrap}
.iexpand{background:none;border:none;cursor:pointer;font-size:11px;color:#9CA3AF;width:100%;padding:6px;text-align:center;border-top:1px solid #F3F4F6;font-family:inherit}
.idetail{padding:0 16px 14px;border-top:1px solid #F3F4F6}
.empty{text-align:center;padding:48px 0;color:#9CA3AF}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-row input{flex:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(79,70,229,0.07);border:1px solid #E5E8F5}
.type-toggle{display:flex;gap:8px;margin-bottom:14px}
.ttp{flex:1;padding:10px;border-radius:10px;border:1.5px solid #E5E8F5;background:#fff;color:#6B7280;font-family:inherit;cursor:pointer;font-weight:600;font-size:13px;transition:all .15s}
.ttp.active{border-color:#4F46E5;background:#4F46E5;color:#fff}
.bar-wrap{height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden;margin:4px 0}
.bar-fill{height:100%;border-radius:3px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">K&M Tiling<small>Invoice Manager</small></div>
  <div class="nav">
    <button class="active" onclick="showTab('invoices')">📋 인보이스</button>
    <button onclick="showTab('builders')">🏗️ 빌더</button>
    <button onclick="showTab('stats')">📊 통계</button>
    <button onclick="openSet()" title="회사 설정">⚙️</button>
  </div>
</div>
<div class="content">
  <div id="tab-invoices"></div>
  <div id="tab-builders" style="display:none"></div>
  <div id="tab-stats" style="display:none"></div>
</div>
<div class="bbar">
  <div class="bstat"><div class="bstat-l">미수금</div><div class="bstat-v" id="bs-out" style="color:#818CF8">$0</div></div>
  <div class="bstat"><div class="bstat-l">연체</div><div class="bstat-v" id="bs-ov" style="color:#f87171">$0</div></div>
  <div class="bstat"><div class="bstat-l">이번달</div><div class="bstat-v" id="bs-mo" style="color:#34d399">$0</div></div>
</div>

<!-- Invoice Modal -->
<div class="modal" id="inv-modal">
<div class="mbox">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <h3 id="im-title" style="font-size:16px;font-weight:800;color:#111827">새 인보이스</h3>
    <button onclick="closeIM()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#9CA3AF">×</button>
  </div>
  <div class="type-toggle">
    <button class="ttp active" id="tt-normal" onclick="setType('NORMAL')">일반</button>
    <button class="ttp" id="tt-po" onclick="setType('PO')">PO 기반</button>
    <button class="ttp" id="tt-prog" onclick="setType('PROGRESS')">진행률(%)</button>
  </div>
  <div class="row2 mb">
    <div><label class="label">회사 *</label><select class="select" id="f-co" onchange="onCoChange()"></select></div>
    <div><label class="label">인보이스 번호</label><input class="input" id="f-n" placeholder="INV-1234"/></div>
  </div>
  <div class="mb"><label class="label">빌더명 *</label><input class="input" id="f-b" list="bdl" placeholder="빌더명" oninput="onBChange()"/><datalist id="bdl"></datalist></div>
  <div class="mb"><label class="label">현장 주소 (Job Address)</label><input class="input" id="f-a" placeholder="주소"/></div>
  <div class="row2 mb">
    <div><label class="label">상태</label><select class="select" id="f-st"><option>INVOICE</option><option>DEPOSIT</option><option>PAID</option><option>ONGOING</option><option>RETENTION</option><option>BOOKING</option><option>CREDIT</option><option>SUSPEND</option><option>FINISH</option><option>NO_PAYMENT</option><option>OVERDUE</option></select></div>
    <div id="f-po-row"><label class="label">PO 번호</label><input class="input" id="f-po" placeholder="PO Number"/></div>
  </div>
  <div id="f-proj-row" class="mb" style="display:none"><label class="label">프로젝트명 (Project)</label><input class="input" id="f-proj" placeholder="예: Orange Conservatorium&Planetarium"/></div>
  <div class="row2 mb">
    <div><label class="label">Start Date</label><input type="date" class="input" id="f-sd"/></div>
    <div><label class="label">인보이스 날짜</label><input type="date" class="input" id="f-id"/></div>
  </div>
  <div class="mb"><label class="label">만기일</label><input type="date" class="input" id="f-dd"/></div>
  <div id="f-amt-row" class="mb"><label class="label">금액 (inc. GST) *</label><input type="number" step="0.01" class="input" id="f-am" placeholder="0.00"/></div>
  <div id="f-items-row" class="mb" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <label class="label" style="margin:0">PO 항목</label>
      <button class="btn-gold" style="padding:5px 10px;font-size:12px" onclick="addItem()">+ 항목추가</button>
    </div>
    <div id="items-list"></div>
    <div id="items-total" style="text-align:right;font-size:14px;font-weight:700;padding:6px 0;color:#4F46E5"></div>
  </div>
  <div id="f-prog-row" class="mb" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <label class="label" style="margin:0">진행 항목 (이번 청구분만 금액 입력)</label>
      <button class="btn-gold" style="padding:5px 10px;font-size:12px" onclick="addProg()">+ 항목추가</button>
    </div>
    <div style="font-size:11px;color:#9CA3AF;margin-bottom:8px">💡 완료%는 누적, 이번 금액은 이번 회차에 청구할 금액</div>
    <div id="prog-list"></div>
    <div id="prog-total" style="text-align:right;font-size:14px;font-weight:700;padding:6px 0;color:#F59E0B"></div>
  </div>
  <div class="row2 mb">
    <div><label class="label">입금 날짜</label><input type="date" class="input" id="f-dd2"/></div>
    <div><label class="label">입금 금액</label><input type="number" step="0.01" class="input" id="f-da" placeholder="0.00"/></div>
  </div>
  <div class="mb"><label class="label">메모</label><textarea class="input" id="f-no" style="height:60px;resize:none" placeholder="메모"></textarea></div>
  <div class="row2" style="gap:10px"><button class="btn-secondary" style="flex:1" onclick="closeIM()">취소</button><button class="btn-primary" style="flex:2" onclick="saveInv()">💾 저장</button></div>
</div>
</div>

<!-- Builder Modal -->
<div class="modal" id="b-modal">
<div class="mbox">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <h3 id="bm-title" style="font-size:16px;font-weight:800;color:#111827">새 빌더</h3>
    <button onclick="closeBM()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#9CA3AF">×</button>
  </div>
  <div class="mb"><label class="label">빌더명 *</label><input class="input" id="bf-n" placeholder="빌더명"/></div>
  <div class="row2 mb">
    <div><label class="label">청구 주기</label><select class="select" id="bf-bt"><option value="PER_JOB">건별 청구</option><option value="MONTHLY">월별 청구</option></select></div>
    <div><label class="label">기본 회사</label><select class="select" id="bf-dc"></select></div>
  </div>
  <div class="mb"><label class="label">담당자 (Note)</label><input class="input" id="bf-cp" placeholder="담당자명"/></div>
  <div class="mb"><label class="label">연락처</label><input class="input" id="bf-c" placeholder="전화번호"/></div>
  <div class="mb"><label class="label">이메일</label><input class="input" id="bf-e" placeholder="contact@example.com"/></div>
  <div class="mb"><label class="label">📧 인보이스 이메일</label><input class="input" id="bf-ie" placeholder="invoice@example.com"/></div>
  <div class="mb"><label class="label">Business Address</label><input class="input" id="bf-ba" placeholder="사업장 주소"/></div>
  <div class="mb"><label class="label">Postal Address</label><input class="input" id="bf-pa" placeholder="우편 주소"/></div>
  <div class="mb"><label class="label">ABN</label><input class="input" id="bf-a" placeholder="ABN"/></div>
  <div class="row2" style="gap:10px"><button class="btn-secondary" style="flex:1" onclick="closeBM()">취소</button><button class="btn-primary" style="flex:2" onclick="saveBuilder()">💾 저장</button></div>
</div>
</div>

<!-- Settings Modal (Companies) -->
<div class="modal" id="s-modal">
<div class="mbox">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <h3 style="font-size:16px;font-weight:800;color:#111827">⚙️ 회사 설정</h3>
    <button onclick="closeSet()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#9CA3AF">×</button>
  </div>
  <div style="font-size:11px;color:#6B7280;margin-bottom:12px">두 회사 정보를 등록하면 인보이스 작성 시 번호가 자동 채워져요.</div>
  <div id="co-list"></div>
  
  <div style="border-top:1px solid #E5E7EB;margin:18px 0 14px;padding-top:14px">
    <div style="font-size:13px;font-weight:800;color:#111827;margin-bottom:6px">📊 데이터 마이그레이션</div>
    <div style="font-size:11px;color:#6B7280;margin-bottom:10px">구글 시트의 기존 인보이스 336개를 한 번에 가져옵니다. 이미 등록된 인보이스(번호+날짜+금액 일치)는 건너뛰니까 여러 번 눌러도 안전해요.</div>
    <button class="btn-secondary" style="width:100%;padding:11px;font-size:13px;font-weight:700;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A" onclick="importInvoices()">📥 기존 인보이스 일괄 가져오기 (1회용)</button>
  </div>
  
  <div class="row2" style="gap:10px;margin-top:14px"><button class="btn-secondary" style="flex:1" onclick="closeSet()">닫기</button><button class="btn-primary" style="flex:2" onclick="saveAllCo()">💾 회사정보 저장</button></div>
</div>
</div>

<script>
// ── Firebase REST API ─────────────────────────────────────────────────────────
const FB_BASE = 'https://knmtilingptyltd-12520-default-rtdb.firebaseio.com';

async function fbGet(path) {
  try {
    const r = await fetch(FB_BASE + '/' + path + '.json');
    return r.ok ? r.json() : null;
  } catch(e) { return null; }
}
async function fbSet(path, val) {
  try {
    await fetch(FB_BASE + '/' + path + '.json', {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(val)
    });
  } catch(e) {}
}
async function fbPush(path, val) {
  try {
    const r = await fetch(FB_BASE + '/' + path + '.json', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(val)
    });
    const d = await r.json();
    return d && d.name;
  } catch(e) { return null; }
}
async function fbDel(path) {
  try {
    await fetch(FB_BASE + '/' + path + '.json', { method: 'DELETE' });
  } catch(e) {}
}

// ── State ─────────────────────────────────────────────────────────────────────
let invoices = [], builders = [], companies = [], curFilter = 'ALL', curType = 'NORMAL', editId = null, editBId = null, invItems = [], progItems = [];
const today = new Date().toISOString().split('T')[0];
const fA = n => new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(n||0);
const fD = d => d ? new Date(d+'T00:00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let searchQ = '';

const DEFAULT_COMPANIES = [
  {id:'co1', name:'K&M Tiling Bathurst PTY LTD', prefix:'INV-', nextNumber:1541, address:'10/51 Hampden Park Rd, Kelso NSW 2795', abn:'51624778196', phone:'0402 595 744 / 0422 048 463', bsb:'032814', acc:'576638', contactEmail:'accounts@knmtilingbathurst.com', contactName:'Kathleen'},
  {id:'co2', name:'Bathurst Tiling', prefix:'BXBT-', nextNumber:236, address:'', abn:'', phone:'', bsb:'', acc:'', contactEmail:'', contactName:''}
];

// ── Init ──────────────────────────────────────────────────────────────────────
async function loadAll() {
  const [inv, bld, co] = await Promise.all([fbGet('invoices'), fbGet('invoiceBuilders'), fbGet('invoiceCompanies')]);
  invoices = inv ? Object.entries(inv).map(([id,v])=>({...v,id})) : [];
  builders = bld ? Object.entries(bld).map(([id,v])=>({...v,id})) : [];
  if (co) {
    companies = Object.entries(co).map(([id,v])=>({...v,id}));
  } else {
    // first run: seed defaults
    companies = DEFAULT_COMPANIES.map(c=>({...c}));
    for (const c of DEFAULT_COMPANIES) await fbSet('invoiceCompanies/'+c.id, c);
  }
  renderInv();
  renderBuilders();
  renderDL();
  renderCoSel();
  updateBar();
}

document.getElementById('f-id').value = today;
loadAll();

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(t) {
  ['invoices','builders','stats'].forEach(id => {
    document.getElementById('tab-'+id).style.display = id===t?'block':'none';
  });
  document.querySelectorAll('.nav button').forEach(b => {
    const oc = b.getAttribute('onclick')||'';
    const m = oc.match(/showTab\('(\w+)'\)/);
    b.classList.toggle('active', m && m[1]===t);
  });
  if (t==='stats') renderStats();
}

function renderCoSel() {
  // populate company selects in invoice form and builder form
  const opts = companies.map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.prefix)})</option>`).join('');
  const sel1 = document.getElementById('f-co');
  const sel2 = document.getElementById('bf-dc');
  if (sel1) sel1.innerHTML = opts;
  if (sel2) sel2.innerHTML = `<option value="">(자동)</option>` + opts;
}

// ── Bottom Bar ────────────────────────────────────────────────────────────────
function updateBar() {
  const out = invoices.filter(i=>i.status==='INVOICE'||i.status==='OVERDUE'||i.status==='ONGOING').reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const ov = invoices.filter(i=>i.status==='OVERDUE').reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const mo = invoices.filter(i=>(i.invoiceDate||'').startsWith(today.slice(0,7))).reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  document.getElementById('bs-out').textContent = fA(out);
  document.getElementById('bs-ov').textContent = fA(ov);
  document.getElementById('bs-mo').textContent = fA(mo);
}

// ── Invoice List ──────────────────────────────────────────────────────────────
function renderInv() {
  const sts = ['ALL','INVOICE','ONGOING','DEPOSIT','OVERDUE','RETENTION','BOOKING','CREDIT','SUSPEND','FINISH','NO_PAYMENT','PAID'];
  const filtered = invoices.filter(i => {
    if (curFilter!=='ALL' && i.status!==curFilter) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      return (i.builderName||'').toLowerCase().includes(q)||(i.address||'').toLowerCase().includes(q)||(i.invoiceNum||'').toLowerCase().includes(q)||(i.projectName||'').toLowerCase().includes(q);
    }

      h += `<div class="icard ${bc}">

              <div class="iname">${co?`<span class="co-badge ${coClass}">${esc(co.prefix.replace('-',''))}</span>`:''}${esc(inv.builderName||'—')} <span class="pill pill-${ss}">${ss}</span>${inv.type==='PO'?` <span style="background:#EDE9FE;color:#7C3AED;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700">PO</span>`:''}${inv.type==='PROGRESS'?` <span style="background:#FEF3C7;color:#92400E;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700">%</span>`:''}</div>
              <div class="iaddr">${esc(inv.address||'—')}</div>
              ${inv.projectName?`<div style="font-size:11px;color:#7C3AED;margin-top:2px">📁 ${esc(inv.projectName)}</div>`:''}
              ${inv.invoiceNum?`<div style="font-size:11px;color:#9CA3AF;margin-top:2px">#${esc(inv.invoiceNum)}${inv.poNumber?` · PO ${esc(inv.poNumber)}`:''}</div>`:''}
            </div>
            <div style="flex-shrink:0;text-align:right">
              <div class="iamount" style="color:${inv.status==='CREDIT'?'#DC2626':'#111827'}">${fA(inv.amount)}</div>
              ${inv.depositAmount&&parseFloat(inv.depositAmount)<parseFloat(inv.amount)?`<div style="font-size:11px;color:#059669;margin-top:2px">입금 ${fA(inv.depositAmount)}</div>`:''}
            </div>
          </div>
          <div class="idates">
            ${inv.startDate?`<span>🚀 ${fD(inv.startDate)}</span>`:''}
            <span>📅 ${fD(inv.invoiceDate)}</span>
            ${inv.dueDate?`<span>⏰ ${fD(inv.dueDate)}</span>`:''}
            ${inv.depositDate?`<span>✅ ${fD(inv.depositDate)}</span>`:''}

        </div>

            ${inv.note?`<div style="font-size:12px;color:#555;margin-bottom:8px">📝 ${esc(inv.note)}</div>`:''}
            ${inv.type==='PO'&&inv.items?(Array.isArray(inv.items)?inv.items:Object.values(inv.items)).map(it=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:#555"><span>${esc(it.desc)}</span><span style="font-weight:700">${fA(it.amount)}</span></div>`).join(''):''}
            ${inv.type==='PROGRESS'&&inv.progressItems?(Array.isArray(inv.progressItems)?inv.progressItems:Object.values(inv.progressItems)).map(it=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:#555;gap:8px"><span style="flex:1">${esc(it.desc)}${it.pct?` <span style="color:#92400E;font-weight:700">(${esc(String(it.pct))}%)</span>`:''}</span><span style="font-weight:700">${parseFloat(it.amount)>0?fA(it.amount):'—'}</span></div>`).join(''):''}

function toggleD(id) {
  const el = document.getElementById('d-'+id);
  const btn = el.previousElementSibling;
  const open = el.style.display === 'none';
  el.style.display = open ? 'block' : 'none';
  btn.textContent = open ? '▲ 접기' : '▼ 더보기';
}

// ── Invoice CRUD ──────────────────────────────────────────────────────────────
function openIM(id) {
  editId = id; invItems = []; progItems = [];
  const inv = id ? invoices.find(i=>i.id===id) : null;
  document.getElementById('im-title').textContent = inv ? '인보이스 수정' : '새 인보이스';
  document.getElementById('f-b').value = inv?.builderName||'';
  document.getElementById('f-a').value = inv?.address||'';
  document.getElementById('f-n').value = inv?.invoiceNum||'';
  document.getElementById('f-st').value = inv?.status||'INVOICE';
  document.getElementById('f-sd').value = inv?.startDate||'';
  document.getElementById('f-id').value = inv?.invoiceDate||today;
  document.getElementById('f-dd').value = inv?.dueDate||'';
  document.getElementById('f-am').value = inv?.amount||'';
  document.getElementById('f-po').value = inv?.poNumber||'';
  document.getElementById('f-proj').value = inv?.projectName||'';
  document.getElementById('f-dd2').value = inv?.depositDate||'';
  document.getElementById('f-da').value = inv?.depositAmount||'';
  document.getElementById('f-no').value = inv?.note||'';
  
  // company selection
  const coId = inv?.companyId || (companies[0] && companies[0].id) || '';
  document.getElementById('f-co').value = coId;
  
  setType(inv?.type||'NORMAL');
  if (inv?.type==='PO' && inv.items) {
    invItems = Array.isArray(inv.items) ? [...inv.items] : Object.values(inv.items);
    renderItems();
  }
  if (inv?.type==='PROGRESS' && inv.progressItems) {
    progItems = Array.isArray(inv.progressItems) ? [...inv.progressItems] : Object.values(inv.progressItems);
    renderProg();
  }
  // if new invoice, auto-suggest invoice number
  if (!inv) suggestInvNum();
  
  document.getElementById('inv-modal').classList.add('open');
}
function closeIM() { document.getElementById('inv-modal').classList.remove('open'); }

function onCoChange() {
  if (!editId) suggestInvNum();
}
function onBChange() {
  // when builder is picked, auto-pick their default company if set
  if (editId) return;
  const bn = document.getElementById('f-b').value.trim();
  const b = builders.find(bb=>bb.name===bn);
  if (b && b.defaultCompany) {
    document.getElementById('f-co').value = b.defaultCompany;
    suggestInvNum();
  }
}
function suggestInvNum() {
  const coId = document.getElementById('f-co').value;
  const c = companies.find(c=>c.id===coId);
  if (!c) return;
  // pad BXBT- to 4 digits, INV- as-is
  const n = c.nextNumber || 1;
  const padded = c.prefix.includes('BXBT') ? String(n).padStart(4,'0') : String(n);
  document.getElementById('f-n').value = c.prefix + padded;
}

function setType(t) {
  curType = t;
  document.getElementById('tt-normal').classList.toggle('active', t==='NORMAL');
  document.getElementById('tt-po').classList.toggle('active', t==='PO');
  document.getElementById('tt-prog').classList.toggle('active', t==='PROGRESS');
  document.getElementById('f-amt-row').style.display = (t==='NORMAL') ? 'block' : 'none';
  document.getElementById('f-items-row').style.display = (t==='PO') ? 'block' : 'none';
  document.getElementById('f-po-row').style.display = (t==='PO') ? 'block' : 'none';
  document.getElementById('f-prog-row').style.display = (t==='PROGRESS') ? 'block' : 'none';
  document.getElementById('f-proj-row').style.display = (t==='PROGRESS') ? 'block' : 'none';
}

function addItem() { invItems.push({desc:'',amount:''}); renderItems(); }
function renderItems() {
  let h = '';
  invItems.forEach((it,i) => {
    h += `<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
      <input class="input" style="flex:2" value="${esc(it.desc)}" placeholder="항목 설명" oninput="invItems[${i}].desc=this.value;calcTotal()"/>
      <input type="number" class="input" style="flex:1" value="${it.amount}" placeholder="금액" oninput="invItems[${i}].amount=this.value;calcTotal()"/>
      <button style="background:none;border:none;color:#FCA5A5;font-size:18px;cursor:pointer" onclick="invItems.splice(${i},1);renderItems()">×</button>
    </div>`;
  });
  document.getElementById('items-list').innerHTML = h;
  calcTotal();
}
function calcTotal() {
  const t = invItems.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  document.getElementById('items-total').textContent = t > 0 ? '합계: '+fA(t) : '';
}

// ── Progress Items (percentage-based) ────────────────────────────────────────
function addProg() { progItems.push({desc:'',pct:'',amount:''}); renderProg(); }
function renderProg() {
  let h = '';
  progItems.forEach((it,i) => {
    h += `<div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:8px;margin-bottom:8px">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
        <input class="input" style="flex:1" value="${esc(it.desc)}" placeholder="항목명 (예: Floor Tiling)" oninput="progItems[${i}].desc=this.value"/>
        <button style="background:none;border:none;color:#FCA5A5;font-size:18px;cursor:pointer" onclick="progItems.splice(${i},1);renderProg()">×</button>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="number" class="input" style="flex:1" value="${it.pct||''}" placeholder="완료 %" max="100" oninput="progItems[${i}].pct=this.value"/>
        <input type="number" step="0.01" class="input" style="flex:1" value="${it.amount||''}" placeholder="이번 금액" oninput="progItems[${i}].amount=this.value;calcProgTotal()"/>
      </div>
    </div>`;
  });
  document.getElementById('prog-list').innerHTML = h;
  calcProgTotal();
}
function calcProgTotal() {
  const t = progItems.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const allDone = progItems.length>0 && progItems.every(i=>parseFloat(i.pct)>=100);
  document.getElementById('prog-total').textContent = t > 0 ? `합계: ${fA(t)}${allDone?' ✓ 전체완료':' (진행중)'}` : '';
}

async function saveInv() {
  const b = document.getElementById('f-b').value.trim();
  if (!b) return alert('빌더명을 입력하세요');
  const isPO = curType === 'PO';
  const isProg = curType === 'PROGRESS';
  let amt;
  if (isPO) amt = invItems.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  else if (isProg) amt = progItems.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  else amt = parseFloat(document.getElementById('f-am').value)||0;
  if (!amt) return alert('금액을 입력하세요');
  
  const coId = document.getElementById('f-co').value;
  const invNum = document.getElementById('f-n').value.trim();
  
  // auto-set ONGOING status if progress invoice has unfinished items and user left it on INVOICE
  let status = document.getElementById('f-st').value;
  if (isProg && status === 'INVOICE') {
    const allDone = progItems.length>0 && progItems.every(i=>parseFloat(i.pct)>=100);
    if (!allDone) status = 'ONGOING';
  }
  
  const data = {
    type: curType,
    companyId: coId,
    builderName: b,
    address: document.getElementById('f-a').value,
    invoiceNum: invNum,
    status: status,
    startDate: document.getElementById('f-sd').value,
    invoiceDate: document.getElementById('f-id').value,
    dueDate: document.getElementById('f-dd').value,
    amount: amt,
    poNumber: isPO ? document.getElementById('f-po').value : '',
    projectName: isProg ? document.getElementById('f-proj').value : '',
    depositDate: document.getElementById('f-dd2').value,
    depositAmount: parseFloat(document.getElementById('f-da').value)||0,
    note: document.getElementById('f-no').value,
    items: isPO ? invItems : [],
    progressItems: isProg ? progItems : [],
    updatedAt: new Date().toISOString()
  };
  
  if (editId) {
    await fbSet('invoices/'+editId, data);
  } else {
    await fbPush('invoices', data);
    // bump company's nextNumber if the invoice number we saved matches the suggestion
    const co = companies.find(c=>c.id===coId);
    if (co) {
      const padded = co.prefix.includes('BXBT') ? String(co.nextNumber).padStart(4,'0') : String(co.nextNumber);
      if (invNum === co.prefix + padded) {
        const updated = {...co, nextNumber: (co.nextNumber||1)+1};
        delete updated.id;
        await fbSet('invoiceCompanies/'+co.id, updated);
      }
    }
  }
  closeIM();
  await loadAll();
}

async function delInv(id) {
  if (!confirm('삭제할까요?')) return;
  await fbDel('invoices/'+id);
  await loadAll();
}

// ── Invoice Bulk Import (from old Google Sheet data) ─────────────────────────
async function importInvoices() {
  if (isImporting) { alert('이미 진행 중이에요. 잠시만 기다려주세요.'); return; }
  if (!INVOICE_SEED || !INVOICE_SEED.length) { alert('가져올 데이터가 없어요.'); return; }
  
  // fetch fresh state
  const [exInv, exBld] = await Promise.all([fbGet('invoices'), fbGet('invoiceBuilders')]);
  const existingInv = exInv ? Object.values(exInv) : [];
  const existingBld = exBld ? Object.entries(exBld).map(([id,v])=>({...v,id})) : [];
  
  // Build fingerprints to detect already-imported invoices
  const fp = i => `${(i.invoiceNum||'').toLowerCase()}|${i.invoiceDate||''}|${Number(i.amount||0).toFixed(2)}`;
  const existingFp = new Set(existingInv.map(fp));
  const toAdd = INVOICE_SEED.filter(i => !existingFp.has(fp(i)));
  
  if (!toAdd.length) {
    alert('이미 모든 인보이스가 등록되어 있어요 ✓');
    return;
  }
  
  // Find builders in seed that don't exist yet — we'll auto-create them with name only
  const existingBldNames = new Set(existingBld.map(b=>(b.name||'').toLowerCase().trim()));
  const newBldNames = new Set();
  toAdd.forEach(i => {
    const n = (i.builderName||'').toLowerCase().trim();
    if (n && !existingBldNames.has(n)) newBldNames.add(i.builderName.trim());
  });
  
  const msg = `인보이스 ${toAdd.length}건을 가져올게요.\n` +
              (newBldNames.size ? `새 빌더 ${newBldNames.size}개도 자동 추가됩니다:\n${[...newBldNames].slice(0,8).join(', ')}${newBldNames.size>8?' …':''}\n\n` : '\n') +
              `이미 등록된 인보이스(번호+날짜+금액 일치)는 건너뜁니다.\n진행할까요?`;
  if (!confirm(msg)) return;
  
  isImporting = true;
  const btns = document.querySelectorAll('button[onclick*="importInvoices"]');
  btns.forEach(b => { b.disabled = true; b.dataset.orig = b.textContent; b.textContent = '⏳ 가져오는중 (0/'+toAdd.length+')'; });
  
  let added = 0, failed = 0, bldAdded = 0;
  try {
    // 1) Create missing builders first
    for (const name of newBldNames) {
      const data = { name, billingType:'PER_JOB', defaultCompany:'', contactPerson:'', contact:'', email:'', invoiceEmail:'', businessAddress:'', postalAddress:'', abn:'' };
      const id = await fbPush('invoiceBuilders', data);
      if (id) bldAdded++;
    }
    
    // 2) Push invoices in parallel batches of 8
    const BATCH = 8;
    for (let i = 0; i < toAdd.length; i += BATCH) {
      const batch = toAdd.slice(i, i + BATCH);
      const results = await Promise.all(batch.map(inv => {
        const data = {...inv, updatedAt: new Date().toISOString()};
        return fbPush('invoices', data);
      }));
      results.forEach(r => { if (r) added++; else failed++; });
      btns.forEach(b => { b.textContent = '⏳ 가져오는중 ('+(i+batch.length)+'/'+toAdd.length+')'; });
    }
  } finally {
    isImporting = false;
    btns.forEach(b => { b.disabled = false; if (b.dataset.orig) b.textContent = b.dataset.orig; });
  }
  
  closeSet();
  await loadAll();
  alert(`✅ 인보이스 ${added}개 가져옴${failed?` (실패 ${failed}건)`:''}${bldAdded?`\n👤 새 빌더 ${bldAdded}개 자동 추가`:''}`);
}


let isImporting = false;
async function importBuilders() {
  if (isImporting) { alert('이미 진행 중이에요. 잠시만 기다려주세요.'); return; }
  
  // re-fetch latest state from Firebase to avoid stale dedupe
  const fresh = await fbGet('invoiceBuilders');
  const freshBuilders = fresh ? Object.entries(fresh).map(([id,v])=>({...v,id})) : [];
  const existing = new Set(freshBuilders.map(b=>(b.name||'').toLowerCase().trim()));
  const toAdd = BUILDER_SEED.filter(b => !existing.has(b.name.toLowerCase().trim()));
  if (!toAdd.length) {
    alert('이미 모든 빌더가 등록되어 있어요 ✓');
    return;
  }
  if (!confirm(`${toAdd.length}개의 빌더를 추가할까요?\n(이미 등록된 빌더는 건너뛰어요)`)) return;
  
  isImporting = true;
  // show progress indicator
  const btns = document.querySelectorAll('button[onclick*="importBuilders"]');
  btns.forEach(b => { b.disabled = true; b.dataset.orig = b.textContent; b.textContent = '⏳ 가져오는중...'; });
  
  let added = 0, failed = 0;
  try {
    for (const b of toAdd) {
      const data = {
        name: b.name,
        billingType: b.billingType || 'PER_JOB',
        defaultCompany: b.defaultCompany || '',
        contactPerson: b.contactPerson || '',
        contact: '',
        email: b.email || '',
        invoiceEmail: b.invoiceEmail || '',
        businessAddress: b.businessAddress || '',
        postalAddress: b.postalAddress || '',
        abn: ''
      };
      const id = await fbPush('invoiceBuilders', data);
      if (id) added++; else failed++;
    }
  } finally {
    isImporting = false;
    btns.forEach(b => { b.disabled = false; if (b.dataset.orig) b.textContent = b.dataset.orig; });
  }
  await loadAll();
  alert(`✅ ${added}개 추가 완료${failed?` (실패 ${failed}개)`:''}`);
}

// ── Dedupe Builders ──────────────────────────────────────────────────────────
// Score by how much info is filled (non-empty fields), keep best, delete rest
function scoreBuilder(b) {
  const fields = ['contactPerson','contact','email','invoiceEmail','businessAddress','postalAddress','abn','billingType','defaultCompany'];
  return fields.reduce((s,f) => s + ((b[f]||'').toString().trim() ? 1 : 0), 0);
}

async function dedupeBuilders() {
  // re-fetch fresh from Firebase
  const fresh = await fbGet('invoiceBuilders');
  const all = fresh ? Object.entries(fresh).map(([id,v])=>({...v,id})) : [];
  
  // group by lowercase trimmed name
  const groups = {};
  all.forEach(b => {
    const key = (b.name||'').toLowerCase().trim();
    if (!key) return;
    if (!groups[key]) groups[key] = [];
    groups[key].push(b);
  });
  
  // find groups with duplicates
  const dupes = Object.entries(groups).filter(([k,g]) => g.length > 1);
  if (!dupes.length) {
    alert('✓ 중복된 빌더가 없어요');
    return;
  }
  
  const totalToDelete = dupes.reduce((s,[k,g])=>s+(g.length-1),0);
  const preview = dupes.slice(0,5).map(([k,g])=>`• ${g[0].name} (${g.length}개)`).join('\n');
  const more = dupes.length>5 ? `\n... 외 ${dupes.length-5}건` : '';
  if (!confirm(`중복된 빌더 ${dupes.length}종류, 총 ${totalToDelete}개를 삭제할게요.\n각 이름마다 정보가 가장 많이 채워진 1개만 남깁니다.\n\n${preview}${more}\n\n진행할까요?`)) return;
  
  let deleted = 0;
  for (const [key, group] of dupes) {
    // sort by score descending, keep [0]
    group.sort((a,b) => scoreBuilder(b) - scoreBuilder(a));
    const keep = group[0];
    const toDel = group.slice(1);
    for (const b of toDel) {
      await fbDel('invoiceBuilders/'+b.id);
      deleted++;
    }
  }
  await loadAll();
  alert(`✅ 중복 ${deleted}개 삭제 완료. 빌더 ${all.length-deleted}개 남음.`);
}

// ── Cleanup Duplicate Builders ───────────────────────────────────────────────
async function cleanupBuilders() {
  // re-fetch latest
  const fresh = await fbGet('invoiceBuilders');
  const freshBuilders = fresh ? Object.entries(fresh).map(([id,v])=>({...v,id})) : [];
  
  // group by lowercased trimmed name
  const groups = {};
  freshBuilders.forEach(b => {
    const key = (b.name||'').toLowerCase().trim();
    if (!key) return;
    if (!groups[key]) groups[key] = [];
    groups[key].push(b);
  });
  
  const dupes = Object.entries(groups).filter(([k,arr]) => arr.length > 1);
  if (!dupes.length) {
    alert('중복된 빌더가 없어요 ✓');
    return;
  }
  
  let toRemove = 0;
  dupes.forEach(([k,arr]) => toRemove += arr.length - 1);
  
  if (!confirm(`중복 빌더 ${toRemove}개를 제거할까요?\n(각 이름당 가장 정보가 많은 1개만 남깁니다)\n\n발견된 중복: ${dupes.length}개 이름`)) return;
  
  let removed = 0;
  for (const [key, arr] of dupes) {
    // sort by completeness (most non-empty fields first), tiebreak by id
    arr.sort((a,b) => {
      const scoreA = Object.values(a).filter(v => v && String(v).trim()).length;
      const scoreB = Object.values(b).filter(v => v && String(v).trim()).length;
      if (scoreA !== scoreB) return scoreB - scoreA;
      return (a.id||'').localeCompare(b.id||'');
    });
    // keep arr[0], delete the rest
    for (let i = 1; i < arr.length; i++) {
      await fbDel('invoiceBuilders/'+arr[i].id);
      removed++;
    }
  }
  await loadAll();
  alert(`✅ 중복 ${removed}개 제거 완료`);
}

  invoices.forEach(i => {
    const b = i.builderName||'기타';
    if (!bs[b]) bs[b] = {total:0,paid:0,outstanding:0,count:0};
    bs[b].count++; bs[b].total += parseFloat(i.amount)||0;
    if (i.status==='DEPOSIT'||i.status==='PAID') bs[b].paid += parseFloat(i.depositAmount||i.amount)||0;
    if (i.status==='INVOICE'||i.status==='OVERDUE'||i.status==='ONGOING') bs[b].outstanding += parseFloat(i.amount)||0;
  });

  const monthly = {};
  invoices.forEach(i => { const m=(i.invoiceDate||'').slice(0,7); if(m){monthly[m]=(monthly[m]||0)+(parseFloat(i.amount)||0);} });
  const sortedM = Object.entries(monthly).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);

  let h = `<div class="stat-grid">
    ${[['💰 미수금',out,'#818CF8'],['🔴 연체',ov,'#f87171'],['✅ 입금',pd,'#34d399'],['📅 이번달',mo,'#fbbf24']].map(([l,v,c])=>`
      <div class="stat-card" style="border-top:3px solid ${c}">
        <div style="font-size:11px;color:#6B7280;margin-bottom:4px">${l}</div>
        <div style="font-size:17px;font-weight:800;color:${c}">${fA(v)}</div>
      </div>`).join('')}
  </div>
  <div class="card" style="margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">빌더별 미수금</div>
    ${Object.entries(bs).sort((a,b)=>b[1].outstanding-a[1].outstanding).map(([name,s])=>`
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
          <span style="font-weight:700;color:#111827">${esc(name)}</span>
          <span style="color:${s.outstanding>0?'#DC2626':'#059669'};font-weight:700">${s.outstanding>0?fA(s.outstanding):'✅'}</span>
        </div>
        <div class="bar-wrap"><div class="bar-fill" style="background:${s.outstanding>0?'#DC2626':'#059669'};width:${s.total>0?Math.min(100,s.paid/s.total*100):0}%"></div></div>
        <div style="font-size:10px;color:#9CA3AF">${s.count}건 · ${fA(s.total)}</div>
      </div>`).join('')}
  </div>
  <div class="card">
    <div style="font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">월별 인보이스</div>
    ${sortedM.map(([m,v])=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid #F3F4F6"><span style="color:#555">${m}</span><span style="font-weight:700">${fA(v)}</span></div>`).join('')}
  </div>`;
  document.getElementById('tab-stats').innerHTML = h;
}
</script>
</body>
</html>
